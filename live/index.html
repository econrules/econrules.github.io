  {"id": "trpb2", "concept": "PROB", "level": "SL", "type": "mc", "q": "Protection shields domestic firms from foreign competition. What is a likely long-run effect?", "options": ["Firms have less incentive to cut costs and innovate", "Firms become more efficient", "Prices fall", "Quality improves"], "answer": 0, "exp": "Without competition, firms can survive while staying inefficient.", "rw": "Countries with heavily protected industries often find their firms struggle in export markets."},
  {"id": "trpb3", "concept": "PROB", "level": "SL", "type": "mc", "q": "A study found that US tariffs on washing machines in 2018 raised their prices by around 12%. Who bore much of the cost?", "options": ["US consumers", "Foreign governments", "US washing machine makers", "Nobody"], "answer": 0, "exp": "Tariffs are often passed on to domestic buyers in higher prices.", "rw": "Prices of dryers rose too, even though they were not taxed, because they are often bought together."},
  {"id": "trpb4", "concept": "PROB", "level": "SL", "type": "mc", "q": "How does protection lead to a misallocation of resources?", "options": ["Resources stay in industries where the country has no comparative advantage", "Resources move to efficient industries", "It removes opportunity costs", "It raises world output"], "answer": 0, "exp": "Protected industries keep labour and capital that could produce more value elsewhere.", "rw": "This is the core economic case against protection."},
  {"id": "trpb5", "concept": "PROB", "level": "SL", "type": "mc", "q": "Why can tariffs on imported components hurt a country’s own exporters?", "options": ["They raise the cost of inputs used to make exports", "They lower export prices", "They raise demand for exports", "They have no effect on exporters"], "answer": 0, "exp": "Modern products use parts from many countries, so tariffs on inputs raise exporters’ costs.", "rw": "US car makers said the 2018 steel and aluminium tariffs raised their costs significantly."},
  {"id": "trpb6", "concept": "PROB", "level": "SL", "type": "mc", "q": "Why might protection encourage corruption?", "options": ["Firms may lobby or bribe officials for import licences and special protection", "It reduces government power", "It removes regulations", "Licences are always auctioned fairly"], "answer": 0, "exp": "Valuable licences and exemptions create incentives for rent-seeking and bribery.", "rw": "Economists call this “rent-seeking”: spending resources to win protection rather than to produce."},
  {"id": "trpb7", "concept": "PROB", "level": "SL", "type": "mc", "q": "Which group is usually harmed by protection but has the weakest political voice?", "options": ["Consumers, who each lose a little", "Producers in the protected industry", "Trade unions in that industry", "The government"], "answer": 0, "exp": "The benefits are concentrated on a few firms, while the costs are spread thinly across millions of consumers.", "rw": "This helps explain why protection often survives even when it lowers overall welfare."},
  {"id": "trpb8", "concept": "PROB", "level": "SL", "type": "mc", "q": "Thailand’s car industry grew strongly behind high import duties on fully built cars. Which evaluation point does this support?", "options": ["Protection can help build an industry, but success also depended on foreign investment and access to export markets", "Protection never works", "Protection always fails", "Tariffs lower car prices"], "answer": 0, "exp": "Good evaluation recognises when protection has worked and what other conditions were needed.", "rw": "Foreign car makers built plants in Thailand to sell locally and export across Asia and beyond."},
  {"id": "trpb9", "concept": "PROB", "level": "SL", "type": "mc", "q": "When evaluating a tariff, which question matters most?", "options": ["Do the gains to producers and the government outweigh the losses to consumers and the welfare loss?", "Is the tariff popular?", "Is the tariff high?", "Does it raise prices at all?"], "answer": 0, "exp": "Evaluation means weighing all stakeholders’ gains and losses, plus the long-run effects.", "rw": "Strong IB answers consider short-run vs long-run effects and who wins and loses."},
  {"id": "trpb10", "concept": "PROB", "level": "SL", "type": "order", "q": "Put this balanced evaluation of a tariff on imported steel in order.", "items": ["Domestic steel firms and workers gain in the short run", "Steel users and consumers pay higher prices", "Trading partners may retaliate against the country’s exports", "Overall welfare is likely to fall unless there are strong strategic reasons"], "exp": "A balanced evaluation considers each stakeholder and reaches a justified conclusion.", "rw": "This is the structure examiners look for in Paper 1 part (b) answers.", "double": true},
  {"id": "trpb11", "concept": "PROB", "level": "SL", "type": "mc", "q": "Why do economists often prefer subsidies to tariffs when a government wants to support an industry?", "options": ["Subsidies don’t raise prices for consumers and their cost is more visible", "Subsidies are free", "Subsidies raise revenue", "Subsidies never distort trade"], "answer": 0, "exp": "A subsidy’s cost appears in the government budget, making it easier to judge whether it is worth it.", "rw": "Subsidies still have opportunity costs and can trigger disputes, as with Airbus and Boeing."},
  {"id": "trpb12", "concept": "PROB", "level": "SL", "type": "mc", "q": "Which statement about protection in developing countries is most accurate?", "options": ["Protection can help some new industries but often raises costs and reduces export competitiveness", "Protection always helps developing countries grow", "Developing countries never use protection", "Free trade always harms developing countries"], "answer": 0, "exp": "The evidence is mixed: outcomes depend on how protection is used and for how long.", "rw": "East Asian economies that combined protection with export targets generally did better than those that relied on protection alone."},
  {"id": "trpb13", "concept": "PROB", "level": "SL", "type": "mc", "q": "The WTO lets countries challenge unfair trade barriers. What is a weakness of this system?", "options": ["Disputes can take years, and its appeals body has been unable to work since 2019", "It acts instantly", "It bans all tariffs", "It has no members"], "answer": 0, "exp": "Slow cases and a blocked appeals process limit the WTO’s power to stop protection.", "rw": "The US blocked new appointments to the WTO’s Appellate Body, leaving it without enough judges."},
  {"id": "trpb14", "concept": "PROB", "level": "SL", "type": "mc", "q": "Why is protection hard to remove once it has been introduced?", "options": ["The protected industry lobbies to keep it, and its job losses would be concentrated and visible", "Consumers demand it", "Removing tariffs is illegal", "Protection costs nothing"], "answer": 0, "exp": "Those who benefit fight hard to keep protection, while those who lose are less organised.", "rw": "Many “temporary” tariffs and subsidies have lasted for decades."},
  {"id": "trpb15", "concept": "PROB", "level": "SL", "type": "order", "q": "A country protects an inefficient industry for many years. Put the long-run chain in order.", "items": ["Firms are shielded from foreign competition", "Incentives to cut costs and innovate weaken", "Prices stay high and quality may lag", "Consumers lose, and the industry stays uncompetitive internationally"], "exp": "Long-term protection can lock in inefficiency.", "rw": "This is a common counter-argument to the infant industry case."},
  {"id": "trc1", "concept": "TCTD", "level": "HL", "type": "diagram", "diagram": "tcDiv", "q": "Before joining a customs union, the country imports from the lowest-cost producer at Pw plus a tariff (Pw+t). After joining, it imports tariff-free from a member at Pm. What price do consumers pay after joining?", "options": ["Pm", "Pw", "Pw+t", "Zero"], "answer": 0, "exp": "Imports from the member now enter tariff-free at Pm, which is below Pw+t, so the price falls to Pm.", "rw": "Joining a bloc usually lowers prices for imports from partner countries.", "time": 1.25},
  {"id": "trc2", "concept": "TCTD", "level": "HL", "type": "diagram", "diagram": "tcDiv", "q": "How much does the country import after joining the customs union?", "options": ["Q₁ to Q₄", "Q₂ to Q₃", "None", "Q₁ to Q₂"], "answer": 0, "exp": "At Pm, domestic production falls to Q₁ and consumption rises to Q₄, so imports are Q₁ to Q₄.", "rw": "Trade between members typically rises sharply after a bloc forms.", "time": 1.25},
  {"id": "trc3", "concept": "TCTD", "level": "HL", "type": "diagram", "diagram": "tcDiv", "q": "Why is part of the new trade called trade diversion?", "options": ["Imports Q₂–Q₃ now come from a higher-cost member (Pm) instead of the lowest-cost producer (Pw)", "Total imports rise", "Domestic producers make more", "The tariff rises"], "answer": 0, "exp": "The same imports now come from a less efficient source, so world resources are used less efficiently.", "rw": "Trade diversion is the main economic cost of joining a trading bloc.", "time": 1.25, "double": true},
  {"id": "trc4", "concept": "TCTD", "level": "HL", "type": "diagram", "diagram": "tcDiv", "q": "Which of these shows trade creation?", "options": ["The extra imports from Q₁ to Q₂ and from Q₃ to Q₄", "The imports from Q₂ to Q₃", "Domestic production up to Q₁", "The tariff"], "answer": 0, "exp": "These new imports replace higher-cost domestic production (Q₁–Q₂) and allow more consumption (Q₃–Q₄).", "rw": "Trade creation is the main economic benefit of a trading bloc.", "time": 1.25},
  {"id": "trc5", "concept": "TCTD", "level": "HL", "type": "diagram", "diagram": "tcDiv", "q": "What happens to the government’s tariff revenue after joining?", "options": ["It falls, because imports now come tariff-free from the member", "It rises", "It stays the same", "It doubles"], "answer": 0, "exp": "Before joining, imports from the non-member paid the tariff; now all imports come duty-free from the member.", "rw": "Lost tariff revenue can matter for countries that rely heavily on trade taxes.", "time": 1.25},
  {"id": "trc6", "concept": "TCTD", "level": "HL", "type": "mc", "q": "Trade creation happens when…", "options": ["Lower-cost imports from a partner replace higher-cost domestic production", "Imports switch to a higher-cost partner", "Tariffs rise", "Exports fall"], "answer": 0, "exp": "Production moves to a more efficient producer inside the bloc, raising welfare.", "rw": "When AFTA cut tariffs, some higher-cost production in member countries was replaced by cheaper imports from partners."},
  {"id": "trc7", "concept": "TCTD", "level": "HL", "type": "mc", "q": "Trade diversion happens when…", "options": ["Imports switch from a low-cost non-member to a higher-cost member", "Domestic production rises", "Imports fall", "A country leaves a bloc"], "answer": 0, "exp": "The common external tariff makes the cheapest outside producer look more expensive than a member.", "rw": "Trade diversion lowers world efficiency, even if the importing country still pays less than before."},
  {"id": "trc8", "concept": "TCTD", "level": "HL", "type": "mc", "q": "When the UK joined the European Community in 1973, it bought more butter from European farmers and less from New Zealand. This is an example of…", "options": ["Trade diversion", "Trade creation", "Dumping", "An export subsidy"], "answer": 0, "exp": "New Zealand butter was cheaper to produce, but it now faced the EC’s external tariff.", "rw": "New Zealand responded by finding new export markets, especially in Asia."},
  {"id": "trc9", "concept": "TCTD", "level": "HL", "type": "mc", "q": "When NAFTA began in 1994, some US clothing imports switched from Asian suppliers to Mexican factories. If the Asian suppliers had lower costs, this was…", "options": ["Trade diversion", "Trade creation only", "Dumping", "A quota"], "answer": 0, "exp": "Tariff-free access gave Mexican producers an advantage over lower-cost suppliers outside the bloc.", "rw": "This is one of the most widely cited real-world examples of trade diversion."},
  {"id": "trc10", "concept": "TCTD", "level": "HL", "type": "mc", "q": "Why is a trading bloc more likely to raise welfare when trade creation outweighs trade diversion?", "options": ["More production moves to lower-cost producers overall", "Tariff revenue rises", "Imports fall", "Prices rise"], "answer": 0, "exp": "The net effect on efficiency depends on which of the two effects is larger.", "rw": "Economists generally find that blocs of countries that already trade a lot with each other create more than they divert."},
  {"id": "trc11", "concept": "TCTD", "level": "HL", "type": "mc", "q": "A trading bloc cuts its common external tariff. What happens to trade diversion?", "options": ["It falls, because non-members’ goods become more competitive", "It rises", "It is unaffected", "It turns into dumping"], "answer": 0, "exp": "A lower external tariff narrows the advantage members have over cheaper outside producers.", "rw": "Low external tariffs are one way blocs reduce the harm from trade diversion."},
  {"id": "trc12", "concept": "TCTD", "level": "HL", "type": "mc", "q": "Which country is most likely to gain from joining a trading bloc?", "options": ["One whose partners are already low-cost producers of the goods it imports", "One whose partners are high-cost producers", "One that does not trade", "One that imports only from non-members"], "answer": 0, "exp": "If partners are efficient producers, joining mostly creates trade rather than diverting it.", "rw": "This is why the choice of partners matters when countries sign trade agreements."},
  {"id": "trc13", "concept": "TCTD", "level": "HL", "type": "order", "q": "A country joins a customs union whose members produce at higher cost than the rest of the world. Put the effects in order.", "items": ["Tariffs on imports from members are removed", "Imports switch from low-cost non-members to members", "Consumers pay less than before, but more than the world price", "The government loses tariff revenue, and some trade is diverted"], "exp": "Joining can help consumers while still reducing efficiency through trade diversion.", "rw": "This mix of effects is why economists judge blocs case by case."},
  {"id": "trc14", "concept": "TCTD", "level": "HL", "type": "diagram", "diagram": "tcDiv", "q": "Before joining, the tariff was $3 per unit (Pw = $1, Pw+t = $4) and 2,000 units were imported (Q₂ to Q₃). How much tariff revenue does the government lose after joining?", "options": ["$6,000", "$3,000", "$8,000", "$2,000"], "answer": 0, "exp": "Lost revenue = $3 × 2,000 = $6,000, because imports now enter tariff-free.", "rw": "Governments joining a bloc often need to replace lost tariff revenue with other taxes.", "time": 1.5},
  {"id": "trc15", "concept": "TCTD", "level": "HL", "type": "mc", "q": "RCEP cut tariffs between its members, including China and the ASEAN countries. Why might Thailand’s imports of some goods from Europe fall?", "options": ["Imports from RCEP members became cheaper relative to non-members: possible trade diversion", "European goods became cheaper", "Europe joined RCEP", "Thailand banned European goods"], "answer": 0, "exp": "Tariff cuts for members, but not outsiders, can shift imports towards members even if outsiders are cheaper.", "rw": "The EU and Thailand have been negotiating a free trade agreement, which would reduce this effect."},
  // ---------- Market failure ----------
  {"id": "mfnp1", "concept": "NEXP", "level": "SL", "type": "mc", "q": "Every dry season, farmers in northern Thailand burn crop waste, and the smoke pushes PM2.5 pollution in Chiang Mai to dangerous levels. Why is this a negative production externality?", "options": ["Producing crops creates costs for third parties that farmers do not pay", "Farmers pay too much for land", "Consumers buy too much rice", "The smoke helps tourism"], "answer": 0, "exp": "An externality is a cost or benefit to third parties that is not reflected in the market price. Here it comes from production.", "rw": "Chiang Mai has at times ranked among the most polluted cities in the world during burning season."},
  {"id": "mfnp2", "concept": "NEXP", "level": "SL", "type": "diagram", "diagram": "nProd", "q": "The diagram shows a negative production externality. Which curve includes the external cost of production?", "options": ["MSC", "MPC", "MPB = MSB", "None of them"], "answer": 0, "exp": "MSC = MPC + external cost, so it lies above MPC.", "rw": "The vertical gap between MSC and MPC is the external cost per unit, such as pollution damage.", "time": 1.25},
  {"id": "mfnp3", "concept": "NEXP", "level": "SL", "type": "diagram", "diagram": "nProd", "q": "What is the socially optimal quantity in this market?", "options": ["Q*, where MSC = MSB", "Qm, where MPC = MPB", "Zero", "The quantity where MSC = MPC"], "answer": 0, "exp": "Society’s best output is where marginal social cost equals marginal social benefit.", "rw": "For pollution, the optimum is rarely zero: society trades some pollution for the goods produced.", "time": 1.25},
  {"id": "mfnp4", "concept": "NEXP", "level": "SL", "type": "diagram", "diagram": "nProd", "q": "Which area shows the welfare loss caused by this negative production externality?", "options": ["A", "B", "A + B", "There is no welfare loss"], "answer": 0, "exp": "Between Q* and Qm, each unit’s marginal social cost (MSC) is above its marginal social benefit (MSB). Triangle A is that loss.", "rw": "The welfare loss triangle always points towards the market output Qm.", "time": 1.25, "double": true},
  {"id": "mfnp5", "concept": "NEXP", "level": "SL", "type": "diagram", "diagram": "nProd", "q": "Compared with the social optimum, the free market…", "options": ["Overproduces (Qm > Q*) and charges too low a price (Pm < P*)", "Underproduces", "Produces the optimum", "Charges too high a price"], "answer": 0, "exp": "Firms ignore the external cost, so the good is too cheap and too much is made.", "rw": "This is why goods made with heavy pollution are “too cheap” from society’s point of view.", "time": 1.25},
  {"id": "mfnp6", "concept": "NEXP", "level": "SL", "type": "diagram-options", "q": "Which diagram shows a negative production externality?", "optionDiagrams": ["nProd", "nCons", "posProd", "posCons"], "answer": 0, "exp": "MSC lies above MPC, and the market produces more than the social optimum (Qm > Q*).", "rw": "Typical examples: factory pollution, crop burning, and chemical waste in rivers.", "time": 1.25},
  {"id": "mfnp7", "concept": "NEXP", "level": "SL", "type": "mc", "q": "The 2011 Map Ta Phut case in Rayong, Thailand involved residents taking legal action over pollution from the industrial estate. Who are the third parties?", "options": ["Local residents affected by pollution", "The factories", "The factories’ customers", "The factories’ shareholders"], "answer": 0, "exp": "Third parties are people outside the transaction who are affected by it.", "rw": "Map Ta Phut is one of Southeast Asia’s largest petrochemical hubs, and pollution there led to court action and project suspensions."},
  {"id": "mfnp8", "concept": "NEXP", "level": "SL", "type": "mc", "q": "Coal power stations release CO₂, which contributes to climate change. Why is the market price of coal electricity “too low” from society’s point of view?", "options": ["It does not include the cost of climate damage", "It includes too many taxes", "Coal is renewable", "Electricity is a public good"], "answer": 0, "exp": "Prices reflect private costs only; the external climate cost is left out.", "rw": "Economists call the damage from one extra tonne of CO₂ the “social cost of carbon”."},
  {"id": "mfnp9", "concept": "NEXP", "level": "SL", "type": "mc", "q": "Which of these is a negative production externality?", "options": ["Noise from a construction site keeping nearby residents awake", "A student studying hard", "A neighbour’s beautiful garden", "Getting vaccinated"], "answer": 0, "exp": "The construction firm’s production imposes costs (noise) on people who are not part of the deal.", "rw": "Bangkok has rules limiting the hours when construction work can make noise."},
  {"id": "mfnp10", "concept": "NEXP", "level": "HL", "type": "mc", "q": "In the diagram for a negative production externality, Q* = 3,000 units and Qm = 5,000 units. At Qm, MSC is $4 above MSB. What is the welfare loss?", "options": ["$4,000", "$8,000", "$20,000", "$2,000"], "answer": 0, "exp": "Welfare loss triangle = ½ × (5,000 − 3,000) × $4 = $4,000.", "rw": "Calculating welfare loss triangles is a common HL Paper 3 skill.", "time": 1.5, "double": true},
  {"id": "mfnp11", "concept": "NEXP", "level": "SL", "type": "mc", "q": "Fast fashion uses huge amounts of water and dyes, and textile factories in Bangladesh have polluted local rivers. Which market failure is this?", "options": ["A negative production externality", "A positive consumption externality", "A public good", "A merit good"], "answer": 0, "exp": "Pollution from making clothes is an external cost of production.", "rw": "The fashion industry is estimated to cause a large share of global industrial water pollution."},
  {"id": "mfnp12", "concept": "NEXP", "level": "SL", "type": "order", "q": "Put the logic of a negative production externality in order.", "items": ["Firms consider only their private costs (MPC)", "They ignore the external cost to third parties", "The market price is too low and output is too high", "Too many resources go to the good, causing a welfare loss"], "exp": "Ignoring external costs leads to overallocation of resources.", "rw": "This chain is the core of any Paper 1 externality answer."},
  {"id": "mfnp13", "concept": "NEXP", "level": "SL", "type": "mc", "q": "Why is the vertical distance between MSC and MPC important?", "options": ["It shows the external cost per unit", "It shows the firm’s profit", "It shows the tax revenue", "It shows consumer surplus"], "answer": 0, "exp": "MSC − MPC = marginal external cost.", "rw": "Governments sometimes try to set a tax equal to this gap."},
  {"id": "mfnp14", "concept": "NEXP", "level": "SL", "type": "mc", "q": "Mining in the Mekong region has caused river pollution that harms fishing communities downstream. Why might the market fail to fix this on its own?", "options": ["The polluters do not pay for the damage, and the victims are many and spread out", "Fishing is a public good", "Markets always fix pollution", "The fish are too expensive"], "answer": 0, "exp": "With many affected people and no clear way to charge polluters, the cost stays external.", "rw": "Pollution that crosses borders is especially hard to tackle without cooperation between governments."},
  {"id": "mfnp15", "concept": "NEXP", "level": "SL", "type": "order", "q": "Put the steps for drawing a negative production externality diagram in order.", "items": ["Draw MPB = MSB sloping down and MPC sloping up", "Draw MSC above MPC to show the external cost", "Mark Qm where MPC = MPB, and Q* where MSC = MSB", "Shade the welfare loss triangle between Q* and Qm"], "exp": "Clear labels and the correct welfare loss triangle earn the marks.", "rw": "Examiners look for MSC above MPC and the triangle pointing towards Qm."},
  {"id": "mfnc1", "concept": "NEXC", "level": "SL", "type": "mc", "q": "Smoking harms not just the smoker but also people breathing second-hand smoke. This is an example of…", "options": ["A negative consumption externality", "A positive consumption externality", "A negative production externality", "A public good"], "answer": 0, "exp": "Consuming the good creates external costs for third parties.", "rw": "Thailand bans smoking in many public places, including restaurants and beaches."},
  {"id": "mfnc2", "concept": "NEXC", "level": "SL", "type": "diagram", "diagram": "nCons", "q": "In this diagram, why is MSB below MPB?", "options": ["Consumption creates external costs, so society’s benefit is lower than the consumer’s", "Consumption creates external benefits", "Production creates pollution", "The good is a public good"], "answer": 0, "exp": "MSB = MPB − external cost.", "rw": "Second-hand smoke, drink driving and loud music are classic examples.", "time": 1.25},
  {"id": "mfnc3", "concept": "NEXC", "level": "SL", "type": "diagram", "diagram": "nCons", "q": "Which area shows the welfare loss?", "options": ["A", "B", "A + B", "There is no welfare loss"], "answer": 0, "exp": "Between Q* and Qm, MSB is below MSC, so each unit consumed reduces welfare. Triangle A shows the loss.", "rw": "The triangle points towards Qm, the market output.", "time": 1.25, "double": true},
  {"id": "mfnc4", "concept": "NEXC", "level": "SL", "type": "diagram", "diagram": "nCons", "q": "What does the free market do in this case?", "options": ["Overconsumes the good (Qm > Q*)", "Underconsumes the good", "Consumes the social optimum", "Stops consuming the good"], "answer": 0, "exp": "Consumers ignore the costs they impose on others, so they consume too much.", "rw": "This is why governments tax alcohol and tobacco.", "time": 1.25},
  {"id": "mfnc5", "concept": "NEXC", "level": "SL", "type": "diagram-options", "q": "Which diagram shows a negative consumption externality?", "optionDiagrams": ["nCons", "nProd", "posCons", "posProd"], "answer": 0, "exp": "MSB lies below MPB, and the market consumes more than the optimum.", "rw": "Examples include smoking, excessive drinking and driving in congested cities.", "time": 1.25},
  {"id": "mfnc6", "concept": "NEXC", "level": "SL", "type": "mc", "q": "Driving in rush-hour Bangkok adds to traffic jams for everyone else. Which externality is this?", "options": ["A negative consumption externality (congestion)", "A positive production externality", "A positive consumption externality", "A public good"], "answer": 0, "exp": "Each extra car slows down other drivers, a cost the driver does not pay.", "rw": "Bangkok regularly ranks among the most congested cities in the world."},
  {"id": "mfnc7", "concept": "NEXC", "level": "SL", "type": "mc", "q": "Thailand’s sugar tax on drinks is linked to sugar content. Which externality argument supports it?", "options": ["Excessive sugar consumption leads to health costs borne by society", "Sugar creates external benefits", "Sugar is a public good", "Drinks makers pollute rivers"], "answer": 0, "exp": "Diseases linked to sugar, such as diabetes, put costs on public healthcare.", "rw": "Thailand began phasing in its sugar-based drink tax in 2017, and many drinks makers cut sugar in their products."},
  {"id": "mfnc8", "concept": "NEXC", "level": "SL", "type": "mc", "q": "Why is alcohol often called a demerit good?", "options": ["People overconsume it, partly because they underestimate its harms", "It is always illegal", "It creates external benefits", "It is non-excludable"], "answer": 0, "exp": "Demerit goods are overconsumed because of external costs and imperfect information.", "rw": "Thailand restricts the hours when alcohol can be sold in shops."},
  {"id": "mfnc9", "concept": "NEXC", "level": "SL", "type": "mc", "q": "Single-use plastic bags were given away free in Thai shops for years. Why was this a negative consumption externality?", "options": ["Discarded bags polluted land, rivers and the sea, harming third parties", "Bags created external benefits", "Plastic is a public good", "Bags were too expensive"], "answer": 0, "exp": "Using and throwing away bags created pollution costs not reflected in their price (zero).", "rw": "Major Thai retailers stopped giving out free single-use bags from 1 January 2020."},
  {"id": "mfnc10", "concept": "NEXC", "level": "HL", "type": "mc", "q": "In a negative consumption externality, Q* = 3,000 and Qm = 5,000. At Qm, MSC is $4 above MSB. What is the welfare loss?", "options": ["$4,000", "$8,000", "$2,000", "$10,000"], "answer": 0, "exp": "Welfare loss = ½ × 2,000 × $4 = $4,000.", "rw": "The same triangle formula works for every externality diagram.", "time": 1.5},
  {"id": "mfnc11", "concept": "NEXC", "level": "SL", "type": "mc", "q": "Which of these is NOT a negative consumption externality?", "options": ["A factory dumping waste into a river", "Playing loud music late at night in a flat", "Smoking in a crowded bus stop", "Drink driving"], "answer": 0, "exp": "Factory waste comes from production, so it is a production externality.", "rw": "Sorting externalities by production vs consumption is a common exam task."},
  {"id": "mfnc12", "concept": "NEXC", "level": "SL", "type": "order", "q": "Put the logic of a negative consumption externality in order.", "items": ["Consumers consider only their private benefit (MPB)", "They ignore the cost their consumption imposes on others", "Quantity consumed is above the social optimum", "Resources are overallocated, causing a welfare loss"], "exp": "Ignoring external costs of consumption leads to overconsumption.", "rw": "Use this chain when explaining smoking, alcohol or congestion."},
  {"id": "mfnc13", "concept": "NEXC", "level": "SL", "type": "mc", "q": "Many people who vape underestimate the long-term health risks. Which concept, besides externalities, explains overconsumption?", "options": ["Imperfect information", "Economies of scale", "Public goods", "Comparative advantage"], "answer": 0, "exp": "Consumers may misjudge the private harm, so MPB is overstated as well.", "rw": "Thailand bans the sale and import of e-cigarettes, partly for this reason."},
  {"id": "mfnc14", "concept": "NEXC", "level": "SL", "type": "mc", "q": "A tourist’s jet-ski ride causes noise and damages coral near a Thai beach. Who bears the external cost?", "options": ["Other beach users and the local environment", "The jet-ski rental firm", "The tourist", "The government only"], "answer": 0, "exp": "People outside the transaction bear the cost.", "rw": "Some Thai beaches restrict jet-ski areas to protect swimmers and reefs."},
  {"id": "mfnc15", "concept": "NEXC", "level": "SL", "type": "diagram", "diagram": "nCons", "q": "A government campaign makes people more aware of the harms of this good. What is the aim?", "options": ["To shift MPB left towards MSB, reducing quantity towards Q*", "To shift MPC right", "To raise MSB", "To increase consumption"], "answer": 0, "exp": "Better information lowers demand (MPB) closer to the true social benefit.", "rw": "Graphic health warnings on cigarette packs are a well-known example.", "time": 1.25},
  {"id": "mfpp1", "concept": "PEXP", "level": "SL", "type": "mc", "q": "A bee farm next to an orchard pollinates the fruit trees for free. This is an example of…", "options": ["A positive production externality", "A negative production externality", "A negative consumption externality", "A public good"], "answer": 0, "exp": "The beekeeper’s production creates benefits for a third party (the orchard owner).", "rw": "Pollination by bees is worth billions of dollars to farmers worldwide."},
  {"id": "mfpp2", "concept": "PEXP", "level": "SL", "type": "diagram", "diagram": "posProd", "q": "Why is MSC below MPC in this diagram?", "options": ["Production creates external benefits, lowering the cost to society", "Production creates pollution", "Consumers benefit more", "The good is a demerit good"], "answer": 0, "exp": "MSC = MPC − external benefit.", "rw": "Firm training and research are common examples.", "time": 1.25},
  {"id": "mfpp3", "concept": "PEXP", "level": "SL", "type": "diagram", "diagram": "posProd", "q": "What does the free market do?", "options": ["Underproduces (Qm < Q*)", "Overproduces", "Produces the optimum", "Stops producing"], "answer": 0, "exp": "Firms ignore the benefits their production gives others, so they produce too little.", "rw": "This is why governments often subsidise research and training.", "time": 1.25},
  {"id": "mfpp4", "concept": "PEXP", "level": "SL", "type": "diagram", "diagram": "posProd", "q": "Which area shows the welfare loss?", "options": ["A", "B", "A + B", "There is no welfare loss"], "answer": 0, "exp": "Between Qm and Q*, MSB is above MSC, so welfare is lost by not producing these units: triangle A.", "rw": "For positive externalities, the welfare loss comes from what is not produced.", "time": 1.25, "double": true},
  {"id": "mfpp5", "concept": "PEXP", "level": "SL", "type": "diagram-options", "q": "Which diagram shows a positive production externality?", "optionDiagrams": ["posProd", "nProd", "posCons", "nCons"], "answer": 0, "exp": "MSC lies below MPC, and output is below the social optimum.", "rw": "Examples include training workers and research that other firms can use.", "time": 1.25},
  {"id": "mfpp6", "concept": "PEXP", "level": "SL", "type": "mc", "q": "A firm trains its workers in new skills. Some later leave and use those skills at other firms. Why is this a positive production externality?", "options": ["Other firms benefit from skills they did not pay for", "The firm pays too much tax", "Workers lose their skills", "Consumers pay more"], "answer": 0, "exp": "Part of the benefit of training goes to third parties, so firms train less than is socially optimal.", "rw": "Thailand offers tax deductions to firms that spend on approved skills training."},
  {"id": "mfpp7", "concept": "PEXP", "level": "SL", "type": "mc", "q": "When a pharmaceutical firm’s research leads to new knowledge, other firms can build on it. Why might firms do too little research?", "options": ["They cannot capture all the benefits of their research", "Research is a demerit good", "Research has no benefits", "Research is too cheap"], "answer": 0, "exp": "Spillovers mean the social benefit of research is greater than the private benefit.", "rw": "Patents give firms temporary rights to their inventions to encourage research."},
  {"id": "mfpp8", "concept": "PEXP", "level": "SL", "type": "mc", "q": "Large factories such as Toyota in Thailand often help local suppliers improve quality. Which concept is this?", "options": ["A positive production externality (knowledge spillover)", "A negative consumption externality", "A public good", "A demerit good"], "answer": 0, "exp": "Benefits from the firm’s production spread to other firms.", "rw": "Thai auto-parts suppliers became more productive by working with foreign car makers."},
  {"id": "mfpp9", "concept": "PEXP", "level": "SL", "type": "mc", "q": "A restaurant owner plants trees and maintains a garden that improves the whole street. What kind of externality is this?", "options": ["A positive production externality", "A negative production externality", "A negative consumption externality", "No externality"], "answer": 0, "exp": "The firm’s activity benefits third parties (neighbours and passers-by).", "rw": "Green spaces can raise nearby property values."},
  {"id": "mfpp10", "concept": "PEXP", "level": "HL", "type": "mc", "q": "In a positive production externality, Qm = 3,000 and Q* = 5,000. At Qm, MSB is $4 above MSC. What is the welfare loss?", "options": ["$4,000", "$8,000", "$12,000", "$2,000"], "answer": 0, "exp": "Welfare loss = ½ × 2,000 × $4 = $4,000.", "rw": "The triangle for positive externalities points towards Q*, the social optimum.", "time": 1.5},
  {"id": "mfpp11", "concept": "PEXP", "level": "SL", "type": "order", "q": "Put the logic of a positive production externality in order.", "items": ["Firms consider only their private costs and benefits", "They ignore the benefits their production gives others", "Output is below the social optimum", "Resources are underallocated, causing a welfare loss"], "exp": "Ignoring external benefits leads to underallocation of resources.", "rw": "This chain applies to training, research and innovation."},
  {"id": "mfpp12", "concept": "PEXP", "level": "SL", "type": "mc", "q": "Why is a solar farm sometimes said to create a positive externality compared with a coal plant?", "options": ["It reduces pollution that would otherwise harm third parties", "It creates more noise", "It is a demerit good", "It uses more coal"], "answer": 0, "exp": "Replacing polluting production with cleaner production gives benefits to society.", "rw": "Thailand has encouraged rooftop solar to cut emissions from electricity generation."},
  {"id": "mfpp13", "concept": "PEXP", "level": "SL", "type": "diagram", "diagram": "posProd", "q": "The government gives producers a subsidy equal to the external benefit. Which curve will MPC shift to?", "options": ["MSC", "MPB", "Further above MPC", "It will not move"], "answer": 0, "exp": "A subsidy equal to the external benefit lowers MPC to MSC, so the market reaches Q*.", "rw": "This is the theory behind research and development subsidies.", "time": 1.25},
  {"id": "mfpp14", "concept": "PEXP", "level": "SL", "type": "mc", "q": "Which is the best example of a positive production externality?", "options": ["A tech firm’s new software standard that other firms can build on", "A coal mine", "A cigarette factory", "A nightclub with loud music"], "answer": 0, "exp": "The tech firm’s production creates benefits for other firms.", "rw": "Open-source software is a modern example of knowledge spillovers."},
  {"id": "mfpp15", "concept": "PEXP", "level": "SL", "type": "mc", "q": "Thailand’s Board of Investment offers tax breaks for firms doing research and development. Which market failure does this target?", "options": ["Underproduction of research due to positive externalities", "Overconsumption of demerit goods", "Public goods", "Common pool resources"], "answer": 0, "exp": "Tax breaks lower the cost of research, encouraging more of it.", "rw": "Many countries give R&D tax incentives for the same reason."},
  {"id": "mfpc1", "concept": "PEXC", "level": "SL", "type": "mc", "q": "When you get vaccinated, you also protect people around you. This is an example of…", "options": ["A positive consumption externality", "A negative consumption externality", "A negative production externality", "A common pool resource"], "answer": 0, "exp": "Consuming the vaccine creates benefits for third parties.", "rw": "High vaccination rates create “herd immunity”, protecting people who cannot be vaccinated."},
  {"id": "mfpc2", "concept": "PEXC", "level": "SL", "type": "diagram", "diagram": "posCons", "q": "Why is MSB above MPB?", "options": ["Consumption creates external benefits for third parties", "Consumption creates external costs", "Production creates pollution", "The good is a demerit good"], "answer": 0, "exp": "MSB = MPB + external benefit.", "rw": "Education and vaccinations are the classic examples.", "time": 1.25},
  {"id": "mfpc3", "concept": "PEXC", "level": "SL", "type": "diagram", "diagram": "posCons", "q": "Which area shows the welfare loss?", "options": ["A", "B", "A + B", "There is no welfare loss"], "answer": 0, "exp": "Between Qm and Q*, MSB exceeds MSC, so welfare is lost by not consuming these units: triangle A.", "rw": "Underconsumption of merit goods means society misses out on these benefits.", "time": 1.25, "double": true},
  {"id": "mfpc4", "concept": "PEXC", "level": "SL", "type": "diagram", "diagram": "posCons", "q": "What does the free market do?", "options": ["Underconsumes the good (Qm < Q*)", "Overconsumes the good", "Consumes the optimum", "Stops consuming the good"], "answer": 0, "exp": "Consumers ignore the benefits their consumption gives others.", "rw": "This is the case for subsidising education and healthcare.", "time": 1.25},
  {"id": "mfpc5", "concept": "PEXC", "level": "SL", "type": "diagram-options", "q": "Which diagram shows a positive consumption externality?", "optionDiagrams": ["posCons", "nCons", "posProd", "nProd"], "answer": 0, "exp": "MSB lies above MPB, and consumption is below the social optimum.", "rw": "Examples include vaccines, education and public transport.", "time": 1.25},
  {"id": "mfpc6", "concept": "PEXC", "level": "SL", "type": "mc", "q": "Why does education create positive consumption externalities?", "options": ["Educated people raise productivity, pay more tax and contribute more to society", "Education only benefits the student", "Education causes pollution", "Education is a demerit good"], "answer": 0, "exp": "The benefits of education spread well beyond the student.", "rw": "This is why most governments provide free or subsidised schooling."},
  {"id": "mfpc7", "concept": "PEXC", "level": "SL", "type": "mc", "q": "Why is healthcare often called a merit good?", "options": ["It is underconsumed if left to the market, partly because people underestimate its benefits", "It is a public good", "It has no external benefits", "It is always overconsumed"], "answer": 0, "exp": "Merit goods are underconsumed because of external benefits and imperfect information.", "rw": "Thailand’s universal healthcare scheme, launched in 2002, gives most of the population access to care."},
  {"id": "mfpc8", "concept": "PEXC", "level": "SL", "type": "mc", "q": "Using the BTS Skytrain instead of driving reduces congestion and pollution for others. Which externality is this?", "options": ["A positive consumption externality", "A negative consumption externality", "A negative production externality", "A public good"], "answer": 0, "exp": "Choosing public transport benefits third parties.", "rw": "Bangkok has trialled flat 20-baht fares on some rail lines to encourage more riders."},
  {"id": "mfpc9", "concept": "PEXC", "level": "HL", "type": "mc", "q": "In a positive consumption externality, Qm = 3,000 and Q* = 5,000. At Qm, MSB is $4 above MSC. What is the welfare loss?", "options": ["$4,000", "$8,000", "$2,000", "$10,000"], "answer": 0, "exp": "Welfare loss = ½ × 2,000 × $4 = $4,000.", "rw": "The triangle points towards Q*, the output society is missing out on.", "time": 1.5},
  {"id": "mfpc10", "concept": "PEXC", "level": "SL", "type": "order", "q": "Put the logic of a positive consumption externality in order.", "items": ["Consumers consider only their private benefit (MPB)", "They ignore the benefits their consumption gives others", "Consumption is below the social optimum", "Resources are underallocated, causing a welfare loss"], "exp": "Ignoring external benefits leads to underconsumption.", "rw": "Use this chain for vaccines, education and healthcare."},
  {"id": "mfpc11", "concept": "PEXC", "level": "SL", "type": "mc", "q": "Which of these is NOT a positive consumption externality?", "options": ["A firm training its workers", "Getting a flu vaccine", "A homeowner repainting their run-down house", "Studying to become a nurse"], "answer": 0, "exp": "Training workers is a firm’s production decision, so it is a production externality.", "rw": "Sorting externality types correctly is a common exam task."},
  {"id": "mfpc12", "concept": "PEXC", "level": "SL", "type": "mc", "q": "People often skip regular health check-ups because they underestimate the benefits. Which concept explains this?", "options": ["Imperfect information leading to underconsumption of a merit good", "Overconsumption of a demerit good", "A public good", "A common pool resource"], "answer": 0, "exp": "Consumers undervalue the private benefit, so MPB is too low.", "rw": "Some health schemes offer free check-ups to encourage take-up."},
  {"id": "mfpc13", "concept": "PEXC", "level": "SL", "type": "diagram", "diagram": "posCons", "q": "The government runs advertising to encourage vaccination. What is the aim?", "options": ["To shift MPB right towards MSB", "To shift MPC left", "To lower MSB", "To reduce consumption"], "answer": 0, "exp": "Better information raises demand closer to the social optimum.", "rw": "Vaccination campaigns were widely used during the COVID-19 pandemic.", "time": 1.25},
  {"id": "mfpc14", "concept": "PEXC", "level": "SL", "type": "mc", "q": "A family planting trees around their house makes the whole street cooler and greener. What type of externality is this?", "options": ["A positive consumption externality", "A negative production externality", "A negative consumption externality", "No externality"], "answer": 0, "exp": "The household’s consumption choice benefits neighbours.", "rw": "Trees can make urban areas noticeably cooler."},
  {"id": "mfpc15", "concept": "PEXC", "level": "SL", "type": "mc", "q": "During the COVID-19 pandemic, many governments gave vaccines free of charge. Why?", "options": ["To raise consumption towards the social optimum, as vaccines have large external benefits", "Vaccines are demerit goods", "To reduce government spending", "Vaccines create external costs"], "answer": 0, "exp": "Making vaccines free removes the price barrier to consumption.", "rw": "Thailand provided COVID-19 vaccines free of charge to its population."},
  {"id": "mfng1", "concept": "NPOL", "level": "SL", "type": "mc", "q": "Singapore charges drivers electronically to use busy roads at peak times (Electronic Road Pricing). Which type of policy is this?", "options": ["A market-based policy that puts a price on congestion", "A ban on cars", "A subsidy for drivers", "A public good"], "answer": 0, "exp": "Charging drivers makes them pay for the congestion cost they create.", "rw": "Singapore introduced ERP in 1998, and London (2003) and New York (2025) adopted congestion charges."},
  {"id": "mfng2", "concept": "NPOL", "level": "SL", "type": "diagram", "diagram": "nProd", "q": "A government puts a tax on the polluting firm equal to the external cost. What happens?", "options": ["MPC shifts up to MSC, and output falls to Q*", "MPB shifts right", "Output rises above Qm", "Nothing changes"], "answer": 0, "exp": "A tax equal to the external cost “internalises” the externality.", "rw": "Carbon taxes in countries such as Sweden aim to do exactly this.", "time": 1.25},
  {"id": "mfng3", "concept": "NPOL", "level": "SL", "type": "mc", "q": "What is the main difficulty with setting a carbon tax equal to the external cost?", "options": ["The external cost of pollution is very hard to measure in money", "Taxes are always too low", "Firms never pass on taxes", "It raises no revenue"], "answer": 0, "exp": "Valuing damage to health and the climate involves a lot of uncertainty.", "rw": "Estimates of the social cost of carbon vary widely."},
  {"id": "mfng4", "concept": "NPOL", "level": "SL", "type": "diagram", "diagram": "permits", "q": "The government cuts the number of pollution permits from Q₁ to Q₂. What happens to the price of a permit?", "options": ["It rises from P₁ to P₂", "It falls", "It stays the same", "It falls to zero"], "answer": 0, "exp": "A fixed supply of permits is vertical; reducing it raises the price.", "rw": "The EU cuts the number of permits in its Emissions Trading System each year.", "time": 1.25},
  {"id": "mfng5", "concept": "NPOL", "level": "SL", "type": "diagram", "diagram": "permits", "q": "Why is the supply of permits shown as vertical?", "options": ["The government fixes the total number of permits (the cap)", "Firms can create permits", "Permits are free", "Demand is perfectly inelastic"], "answer": 0, "exp": "The cap is set by policy, regardless of price.", "rw": "This is why the system is called “cap and trade”.", "time": 1.25},
  {"id": "mfng6", "concept": "NPOL", "level": "SL", "type": "diagram", "diagram": "permits", "q": "Firms’ demand for permits rises as the economy grows. What happens if the cap stays at Q₁?", "options": ["The permit price rises, but total pollution stays capped at Q₁", "Pollution rises", "The permit price falls", "More permits are created automatically"], "answer": 0, "exp": "Demand shifts right; with fixed supply, only the price changes.", "rw": "A key strength of cap and trade: the total amount of pollution is certain.", "time": 1.25},
  {"id": "mfng7", "concept": "NPOL", "level": "SL", "type": "mc", "q": "What is an advantage of tradable permits over a carbon tax?", "options": ["The total amount of pollution is fixed by the cap", "The price of pollution is certain", "They raise more revenue", "They are easier to set up"], "answer": 0, "exp": "With permits, quantity is certain but price varies; with a tax, price is certain but quantity varies.", "rw": "The EU ETS, launched in 2005, is the world’s oldest major carbon market."},
  {"id": "mfng8", "concept": "NPOL", "level": "SL", "type": "mc", "q": "Why do economists say tradable permits cut pollution at the lowest cost?", "options": ["Firms that can cut pollution cheaply do so and sell spare permits to firms that cannot", "All firms cut pollution by the same amount", "Permits are free", "Governments choose which firms pollute"], "answer": 0, "exp": "Trading lets pollution cuts happen where they are cheapest.", "rw": "China launched its national emissions trading system in 2021, starting with power plants."},
  {"id": "mfng9", "concept": "NPOL", "level": "SL", "type": "mc", "q": "The Thai government bans burning of sugarcane fields before harvest, aiming to reduce PM2.5. What type of policy is this?", "options": ["Regulation (command and control)", "A market-based tax", "A subsidy", "Tradable permits"], "answer": 0, "exp": "Regulations set rules that firms must follow, with penalties for breaking them.", "rw": "Thailand has also offered incentives for farmers who harvest cane without burning."},
  {"id": "mfng10", "concept": "NPOL", "level": "SL", "type": "mc", "q": "What is a weakness of using regulations, such as banning a polluting activity?", "options": ["They need monitoring and enforcement, which can be costly and weak", "They always raise revenue", "They are too easy to enforce", "They encourage firms to innovate more than taxes"], "answer": 0, "exp": "If rules are not enforced, firms may keep polluting.", "rw": "Crop burning in Thailand continues partly because enforcement in rural areas is difficult."},
  {"id": "mfng11", "concept": "NPOL", "level": "SL", "type": "mc", "q": "Graphic warnings cover most of a cigarette pack in Thailand. Which policy is this?", "options": ["Information provision to reduce demand", "A tax", "A subsidy", "Tradable permits"], "answer": 0, "exp": "Better information shifts MPB left, closer to MSB.", "rw": "Australia introduced plain packaging for cigarettes in 2012, and Thailand followed with plain packs in 2019."},
  {"id": "mfng12", "concept": "NPOL", "level": "SL", "type": "mc", "q": "Why might an indirect tax on cigarettes not reduce smoking much?", "options": ["Demand for cigarettes is price inelastic because they are addictive", "Demand is highly elastic", "Smokers never pay taxes", "Taxes lower prices"], "answer": 0, "exp": "With inelastic demand, a higher price causes only a small fall in quantity.", "rw": "Taxes still raise revenue that can fund healthcare and anti-smoking campaigns."},
  {"id": "mfng13", "concept": "NPOL", "level": "SL", "type": "mc", "q": "Thai retailers stopped giving free plastic bags in 2020, and some charge a small fee. Which behavioural idea makes even a tiny charge effective?", "options": ["A nudge: people dislike paying for something that used to be free", "Comparative advantage", "Economies of scale", "Price inelastic demand"], "answer": 0, "exp": "Small charges or changes to the default can change behaviour a lot.", "rw": "England saw single-use bag use at big supermarkets fall by over 90% after it introduced a charge."},
  {"id": "mfng14", "concept": "NPOL", "level": "SL", "type": "order", "q": "Put this evaluation of a carbon tax in order.", "items": ["A carbon tax makes polluters pay for the external cost", "It encourages firms to cut emissions and invest in clean technology", "But setting the right rate is hard, and it can hit poorer households hardest", "Revenue can be used to compensate low-income households"], "exp": "Strong evaluation weighs effectiveness, problems and how to fix them.", "rw": "Canada returned carbon tax revenue to households as rebates, until the consumer carbon tax was scrapped in 2025.", "double": true},
  {"id": "mfng15", "concept": "NPOL", "level": "SL", "type": "mc", "q": "Why is international cooperation needed to tackle climate change?", "options": ["Greenhouse gases affect the whole world, so no single country can solve it alone", "Only one country pollutes", "Climate is a private good", "Markets solve it automatically"], "answer": 0, "exp": "Countries may “free ride” on others’ efforts, so agreements are needed.", "rw": "The Paris Agreement of 2015 asked every country to set targets for cutting emissions."},
  {"id": "mfpg1", "concept": "PPOL", "level": "SL", "type": "diagram", "diagram": "subPos", "q": "The government gives producers a subsidy, shifting supply from MPC = MSC to MPC₂. What happens to consumption?", "options": ["It rises from Q₁ to the social optimum Q*", "It falls", "It stays at Q₁", "It rises above Q*"], "answer": 0, "exp": "The subsidy lowers costs and price, raising consumption to where MSB = MSC.", "rw": "Subsidies for vaccines, education and public transport work this way.", "time": 1.25},
  {"id": "mfpg2", "concept": "PPOL", "level": "SL", "type": "diagram", "diagram": "subPos", "q": "What happens to the price consumers pay after the subsidy?", "options": ["It falls from P₁ to P₂", "It rises", "It stays the same", "It becomes zero"], "answer": 0, "exp": "A lower price encourages more consumption of the merit good.", "rw": "Free vaccines take this to the extreme: a price of zero.", "time": 1.25},
  {"id": "mfpg3", "concept": "PPOL", "level": "SL", "type": "diagram", "diagram": "subPos", "q": "What is a key drawback of this subsidy?", "options": ["It has an opportunity cost: the money could be spent elsewhere", "It reduces consumption", "It raises the price", "It creates external costs"], "answer": 0, "exp": "Government funds are limited, so subsidies mean less money for other things.", "rw": "Governments must decide which merit goods give the best value for money.", "time": 1.25},
  {"id": "mfpg4", "concept": "PPOL", "level": "SL", "type": "mc", "q": "Thailand provides 15 years of free education. Which policy is this?", "options": ["Direct government provision of a merit good", "A tax on education", "Tradable permits", "A ban"], "answer": 0, "exp": "Providing a good free at the point of use removes the price barrier completely.", "rw": "Free provision can raise consumption above what a subsidy alone would achieve."},
  {"id": "mfpg5", "concept": "PPOL", "level": "SL", "type": "mc", "q": "In many countries, children must be vaccinated before starting school. What type of policy is this?", "options": ["Legislation/regulation that makes consumption compulsory", "A subsidy", "A tax", "A tradable permit"], "answer": 0, "exp": "Laws can require people to consume merit goods.", "rw": "Compulsory schooling is another example of this kind of law."},
  {"id": "mfpg6", "concept": "PPOL", "level": "SL", "type": "mc", "q": "Health campaigns encourage people to exercise and eat well. How do they work?", "options": ["They give information that shifts MPB to the right", "They lower MSC", "They tax unhealthy food", "They ban junk food"], "answer": 0, "exp": "Better information raises people’s private benefit from healthy choices.", "rw": "Thailand’s ThaiHealth Promotion Foundation is funded by a surcharge on alcohol and tobacco taxes."},
  {"id": "mfpg7", "concept": "PPOL", "level": "SL", "type": "mc", "q": "Why might giving a subsidy for solar panels not reach poorer households?", "options": ["Poorer households may still not afford the upfront cost or may rent their homes", "Subsidies always reach the poor", "Solar panels are free", "Poor households use more electricity"], "answer": 0, "exp": "Subsidies help most those who can already afford to buy.", "rw": "Some schemes target low-income households to address this."},
  {"id": "mfpg8", "concept": "PPOL", "level": "SL", "type": "mc", "q": "Which policy would best correct a positive production externality from worker training?", "options": ["A subsidy or tax deduction for firms that train workers", "A tax on training", "A ban on training", "Removing all education"], "answer": 0, "exp": "Lowering the cost of training raises it towards the social optimum.", "rw": "Singapore’s SkillsFuture scheme subsidises training for workers."},
  {"id": "mfpg9", "concept": "PPOL", "level": "SL", "type": "mc", "q": "Some countries pay people small amounts to get vaccinated or offer prizes. Which approach is this?", "options": ["Incentives or nudges to raise consumption of a merit good", "A tax", "A ban", "Tradable permits"], "answer": 0, "exp": "Small rewards can increase take-up of things people undervalue.", "rw": "During COVID-19, some places offered lotteries or gifts to people getting vaccinated."},
  {"id": "mfpg10", "concept": "PPOL", "level": "SL", "type": "mc", "q": "Why might direct provision of a merit good lead to inefficiency?", "options": ["Without the profit motive, providers may have less incentive to cut costs and improve quality", "It always costs nothing", "It ends consumption", "It creates external costs"], "answer": 0, "exp": "Government providers may lack competition, leading to waste or long waiting times.", "rw": "Debates about public hospital waiting times often raise this point."},
  {"id": "mfpg11", "concept": "PPOL", "level": "SL", "type": "order", "q": "Put this evaluation of subsidising university education in order.", "items": ["A subsidy raises consumption of a merit good with external benefits", "Society gains from a more skilled workforce", "But it has a high opportunity cost and may mainly help better-off students", "Targeting help to low-income students could improve value for money"], "exp": "Good evaluation considers effects, costs, equity and alternatives.", "rw": "Thailand’s student loan fund (the Student Loan Fund, or กยศ.) targets students who need financial help.", "double": true},
  {"id": "mfpg12", "concept": "PPOL", "level": "SL", "type": "mc", "q": "Why is it hard to set the “right” size of a subsidy for a merit good?", "options": ["External benefits are difficult to measure", "Subsidies are always too high", "Governments know the exact benefits", "Merit goods have no benefits"], "answer": 0, "exp": "Like taxes, subsidies rely on estimates of external effects.", "rw": "Over-subsidising can also cause overconsumption and waste."},
  {"id": "mfpg13", "concept": "PPOL", "level": "SL", "type": "diagram", "diagram": "posCons", "q": "Which policy would shift MPB right towards MSB?", "options": ["An advertising campaign promoting the benefits of the good", "A tax on the good", "A subsidy to producers", "A ban on the good"], "answer": 0, "exp": "Information raises private demand; a producer subsidy shifts supply instead.", "rw": "Campaigns encouraging blood donation and vaccination use this approach.", "time": 1.25},
  {"id": "mfpg14", "concept": "PPOL", "level": "SL", "type": "mc", "q": "The Bangkok rail network is supported by government spending. Which externality argument supports this?", "options": ["Public transport reduces congestion and pollution, a positive externality", "Trains create external costs", "Public transport is a demerit good", "It is a common pool resource"], "answer": 0, "exp": "Encouraging public transport benefits third parties through cleaner air and less traffic.", "rw": "New lines such as the Pink and Yellow monorails opened in 2023."},
  {"id": "mfpg15", "concept": "PPOL", "level": "SL", "type": "mc", "q": "Which statement best evaluates policies to correct positive externalities?", "options": ["They can raise welfare, but their success depends on accurate measurement, cost and reaching the right people", "They always fail", "They are free", "They only work for public goods"], "answer": 0, "exp": "Good evaluation weighs benefits against costs and practical problems.", "rw": "Combining policies, such as subsidies plus information, often works best."},
  {"id": "mfcp1", "concept": "CPRS", "level": "SL", "type": "mc", "q": "Fish in the Gulf of Thailand are rivalrous but non-excludable. This makes them…", "options": ["A common pool resource", "A public good", "A private good", "A club good"], "answer": 0, "exp": "Anyone can fish (non-excludable), but each fish caught leaves fewer for others (rivalrous).", "rw": "Fish stocks in the Gulf of Thailand have fallen sharply because of decades of overfishing."},
  {"id": "mfcp2", "concept": "CPRS", "level": "SL", "type": "mc", "q": "What is the “tragedy of the commons”?", "options": ["Individuals overuse a shared resource because no one owns it, until it is depleted", "A public good is underprovided", "Private goods are too expensive", "Governments own too much land"], "answer": 0, "exp": "Each user gains from using more, while the cost of depletion is shared by everyone.", "rw": "Garrett Hardin made the idea famous in a 1968 article."},
  {"id": "mfcp3", "concept": "CPRS", "level": "SL", "type": "mc", "q": "Cod stocks off Newfoundland, Canada collapsed after decades of overfishing. What did the government do in 1992?", "options": ["Banned cod fishing (a moratorium)", "Gave subsidies to fishing boats", "Removed all quotas", "Lowered fishing taxes"], "answer": 0, "exp": "When stocks collapse, governments may ban fishing completely to allow recovery.", "rw": "Around 30,000 people lost their jobs, and the cod stocks still have not fully recovered."},
  {"id": "mfcp4", "concept": "CPRS", "level": "SL", "type": "mc", "q": "Maya Bay in Krabi was closed to tourists in 2018 after its coral reefs were badly damaged. Why was the bay overused?", "options": ["It was a common pool resource: tour operators did not pay the cost of damage", "It was a private good", "Tourists paid too much", "It was a demerit good"], "answer": 0, "exp": "Each tour boat added to the damage but paid nothing for it.", "rw": "The bay reopened in 2022 with daily visitor limits and a ban on boats entering the bay itself."},
  {"id": "mfcp5", "concept": "CPRS", "level": "SL", "type": "mc", "q": "What does “sustainability” mean in economics?", "options": ["Meeting present needs without reducing the ability of future generations to meet theirs", "Using all resources now", "Producing as much as possible", "Keeping prices low"], "answer": 0, "exp": "Overusing common pool resources is unsustainable because it harms future generations.", "rw": "This definition comes from the 1987 Brundtland Report."},
  {"id": "mfcp6", "concept": "CPRS", "level": "SL", "type": "mc", "q": "How do individual transferable fishing quotas (ITQs) help protect fish stocks?", "options": ["They cap the total catch and give fishers a stake in keeping stocks healthy", "They remove all limits", "They ban fishing forever", "They subsidise bigger boats"], "answer": 0, "exp": "Quotas create a kind of ownership, reducing the rush to catch fish first.", "rw": "Iceland and New Zealand use ITQ systems to manage their fisheries."},
  {"id": "mfcp7", "concept": "CPRS", "level": "SL", "type": "mc", "q": "In 2015 the EU gave Thailand a “yellow card” warning over illegal fishing. Why did this push Thailand to reform?", "options": ["It threatened a ban on Thai seafood exports to the EU", "The EU wanted to buy more fish", "It lowered EU tariffs", "It subsidised Thai boats"], "answer": 0, "exp": "Trade pressure gave Thailand a strong incentive to regulate its fishing industry.", "rw": "Thailand tightened rules on fishing and labour, and the EU lifted the yellow card in 2019."},
  {"id": "mfcp8", "concept": "CPRS", "level": "SL", "type": "mc", "q": "Bangkok has sunk in some areas partly because of heavy groundwater pumping. Which policy helped slow this?", "options": ["Charging for and restricting groundwater use", "Subsidising groundwater pumping", "Removing all rules", "Encouraging more wells"], "answer": 0, "exp": "Putting a price on a common resource reduces overuse.", "rw": "Rules on groundwater use have helped slow land sinking in Bangkok, but sea-level rise remains a threat."},
  {"id": "mfcp9", "concept": "CPRS", "level": "SL", "type": "mc", "q": "Elinor Ostrom won the Nobel Prize in Economics in 2009. What did her research show?", "options": ["Local communities can often manage common resources well without government ownership or privatisation", "Common resources are always destroyed", "Only governments can manage resources", "Privatisation always works best"], "answer": 0, "exp": "Ostrom found that communities with clear rules and monitoring can avoid the tragedy of the commons.", "rw": "Community forests in northern Thailand are an example of local management."},
  {"id": "mfcp10", "concept": "CPRS", "level": "SL", "type": "order", "q": "Put the tragedy of the commons in order.", "items": ["A resource is free for anyone to use", "Each user takes as much as they can before others do", "The resource is used faster than it can recover", "It is depleted, harming everyone, including future generations"], "exp": "Without ownership or rules, individual incentives lead to collective harm.", "rw": "Overfishing, deforestation and overgrazing all follow this pattern."},
  {"id": "mfcp11", "concept": "CPRS", "level": "SL", "type": "mc", "q": "Why is the Amazon rainforest often described as being overused like a common pool resource?", "options": ["Those cutting it down don’t pay for the global loss of carbon storage and biodiversity", "It is privately owned by one firm", "It is a demerit good", "It is excludable"], "answer": 0, "exp": "The benefits of the forest are shared globally, but the gains from clearing it go to individuals.", "rw": "Brazil’s deforestation rates have risen and fallen with changes in government policy."},
  {"id": "mfcp12", "concept": "CPRS", "level": "SL", "type": "mc", "q": "Which of these is a common pool resource?", "options": ["Fish in the open ocean", "A national defence system", "A bottle of water", "A Netflix subscription"], "answer": 0, "exp": "Ocean fish are rivalrous and non-excludable.", "rw": "Most of the high seas lie outside any country’s control."},
  {"id": "mfcp13", "concept": "CPRS", "level": "SL", "type": "mc", "q": "Why is overuse of common pool resources linked to negative externalities?", "options": ["Each user’s extra use imposes costs on other users and future generations", "It creates external benefits", "It is a public good", "It reduces prices for everyone"], "answer": 0, "exp": "Users ignore the cost their use imposes on others.", "rw": "IB links common pool resources to sustainability and negative externalities."},
  {"id": "mfcp14", "concept": "CPRS", "level": "SL", "type": "mc", "q": "Why is cooperation between countries needed to protect fish in the South China Sea?", "options": ["Fish move across borders, so one country’s limits are undermined if others overfish", "Fish are a private good", "No one fishes there", "Fish are a public good"], "answer": 0, "exp": "Shared resources need shared rules, or each country has an incentive to overfish.", "rw": "Disputes over territory make cooperation on fishing in the South China Sea especially difficult."},
  {"id": "mfcp15", "concept": "CPRS", "level": "SL", "type": "order", "q": "Put this evaluation of fishing quotas in order.", "items": ["Quotas limit the total catch to protect fish stocks", "This allows stocks to recover over time", "But quotas need monitoring, and illegal fishing can undermine them", "So they work best with strong enforcement and cooperation"], "exp": "A balanced evaluation considers effectiveness, problems and conditions for success.", "rw": "Satellite tracking of fishing boats has made enforcement easier."},
  {"id": "mfpu1", "concept": "PUBG", "level": "SL", "type": "mc", "q": "A public good is…", "options": ["Non-rivalrous and non-excludable", "Rivalrous and excludable", "Rivalrous and non-excludable", "Excludable but non-rivalrous"], "answer": 0, "exp": "One person’s use does not reduce another’s, and no one can be stopped from using it.", "rw": "National defence is the textbook example."},
  {"id": "mfpu2", "concept": "PUBG", "level": "SL", "type": "mc", "q": "What is the free rider problem?", "options": ["People can benefit from a public good without paying, so firms cannot make a profit providing it", "People pay too much for public goods", "Public goods are rivalrous", "Governments charge too much"], "answer": 0, "exp": "If people can’t be excluded, many will not pay, so the market fails to provide the good.", "rw": "This is why public goods are usually funded through taxes."},
  {"id": "mfpu3", "concept": "PUBG", "level": "SL", "type": "mc", "q": "Street lighting in Bangkok lights the road for everyone who passes. Why is it a public good?", "options": ["It is non-rivalrous and non-excludable", "It is rivalrous", "It is excludable", "It is a demerit good"], "answer": 0, "exp": "Your use of the light doesn’t reduce mine, and no one can be stopped from using it.", "rw": "Street lights are paid for by local government."},
  {"id": "mfpu4", "concept": "PUBG", "level": "SL", "type": "mc", "q": "Why is a lighthouse a classic example of a public good?", "options": ["All ships benefit, and none can be stopped from seeing the light", "Only one ship can use it at a time", "Ships must pay to see it", "It is a private good"], "answer": 0, "exp": "Ship owners cannot be excluded from seeing the light, so few would pay voluntarily.", "rw": "Economists have long used lighthouses to explain public goods."},
  {"id": "mfpu5", "concept": "PUBG", "level": "SL", "type": "mc", "q": "After the major floods of 2011, Thailand invested in flood defences around Bangkok. Why does the government, not private firms, usually provide flood defences?", "options": ["They are public goods, so firms cannot charge everyone who benefits", "Firms are not allowed to build them", "Flood defences are rivalrous", "They are demerit goods"], "answer": 0, "exp": "Everyone in the protected area benefits, whether they pay or not.", "rw": "The 2011 floods were among the costliest natural disasters in Thai history."},
  {"id": "mfpu6", "concept": "PUBG", "level": "SL", "type": "mc", "q": "What is a quasi-public good?", "options": ["A good with some, but not all, characteristics of a public good, such as a road that could be tolled", "A good that is fully excludable and rivalrous", "A demerit good", "A common pool resource"], "answer": 0, "exp": "Roads are usually non-excludable, but tolls can make them excludable, and congestion makes them rivalrous.", "rw": "Bangkok’s expressways charge tolls, turning part of the road network into excludable goods."},
  {"id": "mfpu7", "concept": "PUBG", "level": "SL", "type": "mc", "q": "Which of these is a pure public good?", "options": ["National defence", "A restaurant meal", "A toll road", "A school place"], "answer": 0, "exp": "Defence protects everyone and cannot exclude anyone in the country.", "rw": "Defence is almost always funded through general taxes."},
  {"id": "mfpu8", "concept": "PUBG", "level": "SL", "type": "mc", "q": "Why does the market fail to provide public goods?", "options": ["Because of the free rider problem, firms cannot make people pay", "Because demand is too high", "Because they are too cheap to make", "Because consumers do not want them"], "answer": 0, "exp": "If no one can be made to pay, there is no profit, so firms will not supply the good.", "rw": "This is called a “missing market”."},
  {"id": "mfpu9", "concept": "PUBG", "level": "SL", "type": "mc", "q": "A city’s New Year fireworks display can be seen from all over the city. Why would a private firm struggle to provide it?", "options": ["People could watch without paying, so it is hard to earn revenue", "Fireworks are rivalrous", "Only one person can watch", "Fireworks are excludable"], "answer": 0, "exp": "Non-excludability creates a free rider problem.", "rw": "Big fireworks shows are often funded by governments or sponsors."},
  {"id": "mfpu10", "concept": "PUBG", "level": "SL", "type": "mc", "q": "Wikipedia is free to read and one person reading it does not stop another. How is it funded?", "options": ["Mostly through voluntary donations", "Through tariffs", "By charging every reader", "By a government tax in Thailand"], "answer": 0, "exp": "Some public goods are funded by donations, though free riding means many readers never give.", "rw": "Wikipedia regularly runs fundraising campaigns asking readers to donate."},
  {"id": "mfpu11", "concept": "PUBG", "level": "SL", "type": "mc", "q": "A Netflix subscription is excludable (you must pay) but non-rivalrous (many can stream the same show). This makes it…", "options": ["A club good", "A public good", "A common pool resource", "A pure private good"], "answer": 0, "exp": "Club goods can exclude non-payers but are not used up by one person.", "rw": "Digital goods such as streaming services often fall into this category."},

const chEyes = (x1, x2, y, r = 6.5, look = 0) => [x1, x2].map(x =>
  `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="${CO}" stroke-width="2.5"/><circle cx="${x + look}" cy="${y + 1}" r="${r * .56}" fill="${CO}"/><circle cx="${x + look - r * .22}" cy="${y - r * .12}" r="${r * .22}" fill="#fff"/>`).join('');
const chHappy = (x1, x2, y, w = 5) => [x1, x2].map(x => `<path d="M${x - w} ${y + 2}q${w} ${-w * 1.5} ${w * 2} 0" fill="none" stroke="${CO}" stroke-width="3.2" stroke-linecap="round"/>`).join('');
const chSleepy = (x1, x2, y, w = 5) => [x1, x2].map(x => `<path d="M${x - w} ${y}q${w} ${w * 1.2} ${w * 2} 0" fill="none" stroke="${CO}" stroke-width="3.2" stroke-linecap="round"/>`).join('');
const chCheeks = (x1, x2, y, r = 4.5) => [x1, x2].map(x => `<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r * .65}" fill="#ff6b9a" opacity=".55"/>`).join('');
const chBrows = (x1, x2, y, w = 6, angry = true) => `<path d="M${x1 - w} ${y - (angry ? 2 : -1)}l${w * 2} ${angry ? 3 : -2}M${x2 + w} ${y - (angry ? 2 : -1)}l${-w * 2} ${angry ? 3 : -2}" stroke="${CO}" stroke-width="3" stroke-linecap="round"/>`;
function chMouth(type, x, y, w = 6){
  const s = `stroke="${CO}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"`;
  switch (type) {
    case 'smile': return `<path d="M${x - w} ${y}q${w} ${w * 1.1} ${w * 2} 0" fill="none" ${s}/>`;
    case 'grin':  return `<path d="M${x - w} ${y}q${w} ${w * 1.7} ${w * 2} 0z" fill="#7a1f3d" ${s}/><path d="M${x - w * .45} ${y + w * .55}q${w * .45} ${-w * .35} ${w * .9} 0" fill="#ff7a93"/>`;
    case 'o':     return `<ellipse cx="${x}" cy="${y + 2}" rx="${w * .45}" ry="${w * .6}" fill="#7a1f3d" ${s}/>`;
    case 'frown': return `<path d="M${x - w} ${y + w * .7}q${w} ${-w * 1.1} ${w * 2} 0" fill="none" ${s}/>`;
    case 'flat':  return `<path d="M${x - w} ${y + 1}h${w * 2}" ${s}/>`;
    case 'smirk': return `<path d="M${x - w} ${y + 1}q${w * 1.3} ${w * .7} ${w * 2} ${-w * .6}" fill="none" ${s}/>`;
    case 'wavy':  return `<path d="M${x - w} ${y + 2}q${w * .5} -3 ${w} 0t${w} 0" fill="none" ${s}/>`;
    case 'tongue':return `<path d="M${x - w} ${y}q${w} ${w * 1.2} ${w * 2} 0" fill="none" ${s}/><path d="M${x + w * .1} ${y + w * .5}q${w * .35} ${w * 1.1} ${w * .8} ${w * .1}" fill="#ff7a93" ${s} stroke-width="2.4"/>`;
  }
}
