  {"id": "mn2", "concept": "FMONC", "level": "HL", "type": "diagram", "diagram": "moncLR", "q": "This firm is in monopolistic competition in the long run. What profit does it make?", "options": ["Normal profit only", "Abnormal profit", "A loss", "It depends on the market price"], "answer": 0, "exp": "Demand just touches ATC at Q, so P = ATC: only normal profit.", "rw": "New cafés open wherever existing ones do well, until most earn only normal profit.", "time": 1.25},
  {"id": "mn3", "concept": "FMONC", "level": "HL", "type": "mc", "q": "Why do abnormal profits disappear in the long run in monopolistic competition?", "options": ["New firms enter and take customers, so each firm’s demand shifts left", "The government taxes them away", "Firms merge", "Costs fall"], "answer": 0, "exp": "Low barriers let new firms in until each firm earns only normal profit.", "rw": "When bubble tea became a craze, new shops opened quickly and profit per shop fell."},
  {"id": "mn4", "concept": "FMONC", "level": "HL", "type": "diagram", "diagram": "moncLR", "q": "In long-run equilibrium, this firm produces where ATC is still falling. What does this show?", "options": ["Excess capacity: the firm is not productively efficient", "The firm is allocatively efficient", "The firm makes a loss", "Economies of scale have run out"], "answer": 0, "exp": "Output Q is below the level at minimum ATC, so the firm could produce more at a lower average cost.", "rw": "Many cafés and hair salons have empty seats for much of the day: a sign of excess capacity.", "time": 1.25},
  {"id": "mn5", "concept": "FMONC", "level": "HL", "type": "mc", "q": "Which is an example of non-price competition?", "options": ["Advertising and branding", "A price cut", "A discount sale", "Matching a rival’s price"], "answer": 0, "exp": "Firms compete through product differences, image and service rather than price.", "rw": "Restaurants compete with décor, delivery apps, loyalty cards and social media, not just price."},
  {"id": "mn6", "concept": "FMONC", "level": "HL", "type": "mc", "q": "Which market is the best example of monopolistic competition?", "options": ["Restaurants in a large city", "The national electricity grid", "Wheat farming", "Smartphone operating systems"], "answer": 0, "exp": "Many sellers, each slightly different, with easy entry and exit.", "rw": "Hair salons, restaurants and clothing boutiques are classic examples."},
  {"id": "mn7", "concept": "FMONC", "level": "HL", "type": "order", "q": "A monopolistically competitive industry is earning abnormal profits. Put what happens next in order.", "items": ["Firms earn abnormal profits in the short run", "New firms are attracted and enter", "Each existing firm’s demand shifts left", "Abnormal profits fall until only normal profit remains"], "exp": "Easy entry competes away abnormal profit, just as in perfect competition, but firms keep some market power.", "rw": "Food trends such as Korean fried chicken shops show this cycle: early profits, a rush of new shops, then normal profits."},
  {"id": "ol1", "concept": "FOLIG", "level": "HL", "type": "mc", "q": "An oligopoly is a market…", "options": ["Dominated by a few large, interdependent firms", "With one seller", "With many small firms", "With no barriers to entry"], "answer": 0, "exp": "Each firm’s decisions affect its rivals, so firms must consider how rivals will react.", "rw": "Thailand’s mobile network market is dominated by a few large operators."},
  {"id": "ol2", "concept": "FOLIG", "level": "HL", "type": "mc", "q": "A four-firm concentration ratio (CR4) of 85% means…", "options": ["The four largest firms have 85% of market sales", "Four firms each have 85% of the market", "85% of firms are large", "The market has four firms"], "answer": 0, "exp": "The concentration ratio adds up the market shares of the largest firms.", "rw": "Many countries’ supermarket and mobile phone markets have high concentration ratios."},
  {"id": "ol3", "concept": "FOLIG", "level": "HL", "type": "diagram", "diagram": "kinked", "q": "In the kinked demand curve model, why is price likely to stay at P?", "options": ["Rivals match price cuts but not price rises", "Rivals match price rises but not price cuts", "The government fixes the price", "Demand is perfectly inelastic"], "answer": 0, "exp": "Raising price loses many customers (elastic upper section); cutting price gains few, because rivals follow (inelastic lower section).", "rw": "Petrol stations on the same road often match each other’s price cuts within hours.", "time": 1.25},
  {"id": "ol4", "concept": "FOLIG", "level": "HL", "type": "diagram", "diagram": "kinked", "q": "MC can move up or down within the vertical gap in MR without changing price or output. Why?", "options": ["MC still equals MR within the gap at Q", "MR is zero within the gap", "Demand is perfectly elastic", "Costs do not matter to oligopolists"], "answer": 0, "exp": "The MR curve has a vertical section at Q, so MC can shift within it and the profit-maximising Q and P stay the same.", "rw": "Soft drink prices often stay the same for long periods even when ingredient costs change.", "time": 1.25},
  {"id": "ol5", "concept": "FOLIG", "level": "HL", "type": "diagram", "diagram": "gameMatrix", "q": "What is each firm’s dominant strategy?", "options": ["Charge a low price", "Charge a high price", "Copy the other firm", "There is no dominant strategy"], "answer": 0, "exp": "Whatever B does, A earns more with a low price (12 > 10 and 6 > 4). The same is true for B.", "rw": "Airlines on the same route face this dilemma when deciding whether to cut fares.", "time": 1.25},
  {"id": "ol6", "concept": "FOLIG", "level": "HL", "type": "diagram", "diagram": "gameMatrix", "q": "What is the Nash equilibrium in this game?", "options": ["Both firms charge a low price", "Both firms charge a high price", "A charges high, B charges low", "There is no equilibrium"], "answer": 0, "exp": "With both on low price, neither can gain by changing alone, even though both would earn more (10 each) if they both charged high.", "rw": "Price wars between supermarkets or ride-hailing apps leave firms in the low-price outcome.", "time": 1.25, "double": true},
  {"id": "ol7", "concept": "FOLIG", "level": "HL", "type": "mc", "q": "When firms formally agree to fix prices or output, this is called…", "options": ["A cartel", "Tacit collusion", "Price leadership", "Non-price competition"], "answer": 0, "exp": "A cartel is an explicit (formal) collusive agreement, which is illegal in most countries.", "rw": "OPEC is the best-known example of a cartel, coordinating oil output among member countries."},
  {"id": "ol8", "concept": "FOLIG", "level": "HL", "type": "mc", "q": "Why are cartels often unstable?", "options": ["Each member has an incentive to cheat by producing more than agreed", "Members always agree on prices", "Cartels are legal everywhere", "Demand never changes"], "answer": 0, "exp": "If others stick to the quota, a cheat can sell more at the high price and earn more profit.", "rw": "OPEC members have at times produced above their agreed quotas."},
  {"id": "ol9", "concept": "FOLIG", "level": "HL", "type": "mc", "q": "What is tacit collusion?", "options": ["Informal coordination without an agreement, such as following a price leader", "A written agreement to fix prices", "Government price controls", "A merger of two firms"], "answer": 0, "exp": "Firms behave cooperatively without ever formally agreeing, so it is hard to prove.", "rw": "In some markets, smaller firms simply follow the price changes of the market leader."},
  {"id": "ol10", "concept": "FOLIG", "level": "HL", "type": "mc", "q": "Which is a common form of competition in oligopoly?", "options": ["Non-price competition, such as advertising and product innovation", "Frequent price wars", "Selling identical products at the market price", "No competition at all"], "answer": 0, "exp": "Price wars hurt everyone, so oligopolists often compete through branding, features and marketing instead.", "rw": "Smartphone makers compete heavily on features, design and marketing, not just on price."},
  {"id": "fe1", "concept": "FEFF", "level": "HL", "type": "mc", "q": "Allocative efficiency occurs where…", "options": ["Price = marginal cost", "Price = average cost", "Marginal revenue = 0", "Average cost is at its minimum"], "answer": 0, "exp": "P = MC means the value consumers place on the last unit equals the cost of producing it.", "rw": "Economists use P = MC as the benchmark when judging whether a market produces the right amount."},
  {"id": "fe2", "concept": "FEFF", "level": "HL", "type": "mc", "q": "Productive efficiency occurs where…", "options": ["Firms produce at the lowest point of their ATC curve", "Price equals marginal cost", "Marginal cost equals marginal revenue", "Total revenue is maximised"], "answer": 0, "exp": "Producing at minimum ATC means goods are made at the lowest possible cost per unit.", "rw": "Strong competition, as in many manufacturing sectors, pushes firms to produce at the lowest possible cost."},
  {"id": "fe3", "concept": "FEFF", "level": "HL", "type": "mc", "q": "Which market structure is both allocatively and productively efficient in the long run?", "options": ["Perfect competition", "Monopoly", "Monopolistic competition", "Oligopoly"], "answer": 0, "exp": "Only in perfect competition does long-run equilibrium give P = MC = minimum ATC.", "rw": "Perfect competition is a benchmark used to judge how real markets perform."},
  {"id": "fe4", "concept": "FEFF", "level": "HL", "type": "mc", "q": "Which government policy directly targets the abuse of market power?", "options": ["Competition (anti-monopoly) law, such as fines for price-fixing", "A subsidy for producers", "A minimum wage", "A tax on imports"], "answer": 0, "exp": "Competition authorities can fine firms, block mergers and break up abusive practices.", "rw": "The European Commission has fined Google billions of euros for abusing a dominant position."},
  {"id": "fe5", "concept": "FEFF", "level": "HL", "type": "mc", "q": "Why might a government regulate the price of a natural monopoly, such as a water company?", "options": ["To stop it charging high prices while keeping the cost savings of one supplier", "To create more competitors", "To raise tax revenue", "To reduce economies of scale"], "answer": 0, "exp": "Breaking up a natural monopoly would raise costs, so regulators cap prices instead.", "rw": "In the UK, regulators set limits on what water and energy companies can charge customers."},
  {"id": "fe6", "concept": "FEFF", "level": "HL", "type": "mc", "q": "Why might a government block a merger?", "options": ["It would reduce competition and give the new firm too much market power", "It would lower prices", "It would increase consumer choice", "It would create too many firms"], "answer": 0, "exp": "Fewer, bigger firms can raise prices and cut output, so authorities review large mergers.", "rw": "Competition authorities around the world can block mergers they believe would weaken competition."},
  {"id": "fe7", "concept": "FEFF", "level": "HL", "type": "mc", "q": "Other things equal, which market structure is likely to cause the largest welfare loss?", "options": ["Monopoly", "Perfect competition", "Monopolistic competition", "All cause the same loss"], "answer": 0, "exp": "A monopolist restricts output furthest below the allocatively efficient level, so the welfare loss is largest.", "rw": "The higher prices and lower output of monopoly are why governments monitor dominant firms closely."},

  // ================= EXTRA QUESTIONS (15+ per section) =================
  {"id": "ped9", "concept": "PED", "level": "SL", "type": "mc", "q": "Why is demand for most primary commodities, such as rice and crude oil, price inelastic?", "options": ["They are necessities with few close substitutes", "They are luxuries", "They have many close substitutes", "Consumers buy them out of habit only"], "answer": 0, "exp": "People still need food and fuel when prices rise, and there are few good substitutes, so quantity demanded falls only a little.", "rw": "When world oil prices spiked in 2022, global oil consumption barely fell in the short run."},
  {"id": "ped10", "concept": "PED", "level": "SL", "type": "mc", "q": "Why is demand for a manufactured good, such as one brand of smartphone, usually more price elastic than demand for a commodity?", "options": ["There are many close substitutes, such as other brands", "Manufactured goods are necessities", "Manufactured goods are always cheaper", "Consumers never compare prices"], "answer": 0, "exp": "Branded manufactured goods compete with rival brands, so a price rise sends many buyers elsewhere.", "rw": "If one phone maker raises prices, buyers can switch to rivals such as Samsung, Xiaomi or OPPO."},
  {"id": "ped11", "concept": "PED", "level": "SL", "type": "diagram-options", "q": "A drought cuts the supply of a commodity. Which diagram best shows why commodity prices are so volatile?", "optionDiagrams": ["volInelastic", "volElastic", "dLeft", "sRight"], "answer": 0, "exp": "Demand and supply for commodities are both price inelastic (steep), so a supply shift causes a big change in price.", "rw": "Cocoa prices roughly tripled in 2024 after poor harvests in Côte d’Ivoire and Ghana.", "time": 1.25, "double": true},
  {"id": "ped12", "concept": "PED", "level": "SL", "type": "mc", "q": "A bad harvest cuts the supply of coffee. Because demand for coffee is price inelastic, the price will…", "options": ["Rise by a large amount", "Rise by a small amount", "Fall", "Stay the same"], "answer": 0, "exp": "With inelastic demand, price must rise a lot before quantity demanded falls enough to match the lower supply.", "rw": "Frost and drought in Brazil, the world’s biggest coffee producer, have repeatedly sent coffee prices soaring."},
  {"id": "ped13", "concept": "PED", "level": "SL", "type": "mc", "q": "Farmers enjoy a bumper harvest. Demand for their crop is price inelastic. What happens to farmers’ total revenue?", "options": ["It falls, because price falls by a larger percentage than quantity rises", "It rises, because more is sold", "It stays the same", "It rises, because price rises"], "answer": 0, "exp": "With inelastic demand, the big fall in price outweighs the rise in quantity sold, so revenue falls: the “paradox of plenty”.", "rw": "Farm incomes often fall in years of record harvests because prices collapse, a pattern seen in many crop markets.", "double": true},
  {"id": "ped14", "concept": "PED", "level": "HL", "type": "mc", "q": "The price of petrol rises by 25% and quantity demanded falls by 5%. What is the PED?", "options": ["0.2", "5.0", "1.25", "0.5"], "answer": 0, "exp": "PED = %ΔQd ÷ %ΔP = 5% ÷ 25% = 0.2: very price inelastic.", "rw": "Studies typically find short-run PED for petrol well below 1, as drivers have few quick alternatives.", "time": 1.5},
  {"id": "ped15", "concept": "PED", "level": "SL", "type": "order", "q": "A drought hits a commodity market. Put the chain in order.", "items": ["Supply of the commodity falls", "The price rises sharply, because demand is price inelastic", "Producers’ incomes swing wildly from year to year", "The government considers price support or buffer stocks"], "exp": "Inelastic demand and supply turn supply shocks into big price swings, which makes producer incomes unstable.", "rw": "Volatile commodity prices are one reason many developing economies try to diversify into manufacturing and services."},
  {"id": "ped16", "concept": "PED", "level": "SL", "type": "mc", "q": "Which of these is likely to have the most price elastic demand?", "options": ["One brand of chocolate bar", "Electricity", "Rice", "Insulin"], "answer": 0, "exp": "A single brand has many close substitutes on the same shelf; the others are necessities with few substitutes.", "rw": "Supermarket price promotions on one chocolate brand can shift sales sharply away from rival brands."},
  {"id": "ped17", "concept": "PED", "level": "SL", "type": "mc", "q": "Demand for a good is unit elastic (PED = 1). The firm cuts its price by 10%. Total revenue will…", "options": ["Stay the same", "Rise by 10%", "Fall by 10%", "Double"], "answer": 0, "exp": "With unit elastic demand, quantity rises by the same percentage as price falls, so P × Q is unchanged.", "rw": "Firms rarely know their exact PED, which is why companies test price changes on small markets first."},
  {"id": "yed7", "concept": "YED", "level": "HL", "type": "mc", "q": "Average income rises by 10% and demand for a good rises from 200 to 260 units. What is the YED?", "options": ["3.0", "0.3", "30", "1.3"], "answer": 0, "exp": "%ΔQd = 60 ÷ 200 = 30%. YED = 30% ÷ 10% = 3.0, so it is an income elastic (luxury) good.", "rw": "Demand for international travel from emerging Asian economies has grown much faster than incomes.", "time": 1.5},
  {"id": "yed8", "concept": "YED", "level": "SL", "type": "mc", "q": "If a good’s YED is between 0 and 1, the good is…", "options": ["A normal good and a necessity", "A luxury good", "An inferior good", "A good whose demand does not change"], "answer": 0, "exp": "Demand rises with income, but by a smaller percentage: a normal, income inelastic good (a necessity).", "rw": "Spending on staples such as toothpaste and rice rises only slowly as incomes grow."},
  {"id": "yed9", "concept": "YED", "level": "SL", "type": "diagram-options", "q": "Incomes rise. Which diagram shows the effect on the market for a normal good?", "optionDiagrams": ["dRight", "dLeft", "sRight", "sLeft"], "answer": 0, "exp": "For a normal good, higher income raises demand at every price, so the demand curve shifts right.", "rw": "As Thai incomes have risen, demand for cars and air-conditioners has grown strongly.", "time": 1.25},
  {"id": "yed10", "concept": "YED", "level": "SL", "type": "mc", "q": "A recession hits and incomes fall. Which firm is likely to see the biggest fall in sales?", "options": ["A luxury cruise company", "A supermarket selling rice", "A discount store", "A pharmacy"], "answer": 0, "exp": "Luxuries have a high YED, so their demand falls proportionately more than income in a recession.", "rw": "Cruise lines and luxury brands saw sharp falls in demand during the 2008–09 global recession."},
  {"id": "yed11", "concept": "YED", "level": "SL", "type": "mc", "q": "Why is YED useful to firms?", "options": ["It helps them predict how sales will change over the business cycle", "It shows how sales respond to their own price", "It measures their costs", "It shows the price of substitutes"], "answer": 0, "exp": "Firms selling high-YED goods can expect sales to boom and slump with the economy, so they plan output and stock accordingly.", "rw": "Car makers adjust production plans using forecasts of income growth in their key markets."},
  {"id": "yed12", "concept": "YED", "level": "SL", "type": "mc", "q": "As incomes rise in a growing economy, the share of household spending on food tends to…", "options": ["Fall, because food has a low YED", "Rise, because food has a high YED", "Stay the same", "Fall to zero"], "answer": 0, "exp": "Food spending rises more slowly than income (YED between 0 and 1), so its share of the budget falls. This is Engel’s law.", "rw": "Households in rich countries typically spend a far smaller share of income on food than households in low-income countries."},
  {"id": "yed13", "concept": "YED", "level": "SL", "type": "order", "q": "Order these YED values from lowest to highest.", "items": ["−1.2 (strongly inferior)", "−0.3 (inferior)", "0.4 (necessity)", "1.0 (unit income elastic)", "2.5 (luxury)"], "exp": "Negative YED means inferior; between 0 and 1 means a necessity; above 1 means a luxury.", "rw": "Retailers stock more budget brands in downturns and more premium lines in booms, following these patterns."},
  {"id": "yed14", "concept": "YED", "level": "SL", "type": "mc", "q": "A good has a YED of 0. This means…", "options": ["Demand does not change when income changes", "Demand falls when income rises", "Demand rises strongly with income", "The good is free"], "answer": 0, "exp": "A YED of zero means quantity demanded is completely unresponsive to income.", "rw": "Demand for basic salt changes very little whether incomes rise or fall."},
  {"id": "yed15", "concept": "YED", "level": "SL", "type": "mc", "q": "Why might a country that mainly exports primary products grow more slowly than one exporting manufactured goods and services?", "options": ["World demand for primary products has a low YED", "Primary products have a high YED", "Primary products are luxuries", "Manufactured goods have a negative YED"], "answer": 0, "exp": "As world incomes grow, spending shifts towards manufactures and services, so demand for primary exports grows slowly.", "rw": "Economies like South Korea grew rapidly by shifting from farm exports to electronics, cars and ships.", "double": true},
  {"id": "pes8", "concept": "PES", "level": "SL", "type": "diagram", "diagram": "pesCompare", "q": "S₁ and S₂ pass through the same point. At P₁, which supply curve is relatively more price elastic?", "options": ["S₂, the flatter curve", "S₁, the steeper curve", "Both are equally elastic", "You cannot tell from a diagram"], "answer": 0, "exp": "From the same point, a price change causes a bigger change in quantity supplied along the flatter curve.", "rw": "Factory-made goods often have flatter (more elastic) supply curves than crops, which take a season to grow.", "time": 1.25},
  {"id": "pes9", "concept": "PES", "level": "SL", "type": "mc", "q": "Why is the supply of manufactured goods usually more price elastic than the supply of primary commodities?", "options": ["Factories can raise output quickly, but crops and mines take time to expand", "Manufactured goods are scarce", "Commodities are easy to store", "Manufacturers face no costs"], "answer": 0, "exp": "Manufacturers can add shifts or use spare capacity; farmers must wait for the next harvest and mines take years to develop.", "rw": "Rubber trees take around six years to mature, so rubber supply responds slowly to higher prices."},
  {"id": "pes10", "concept": "PES", "level": "HL", "type": "mc", "q": "The price of a good rises from $20 to $25 and quantity supplied rises from 100 to 150 units. What is the PES?", "options": ["2.0", "0.5", "1.25", "50"], "answer": 0, "exp": "%ΔQs = 50 ÷ 100 = 50%. %ΔP = 5 ÷ 20 = 25%. PES = 50% ÷ 25% = 2.0: price elastic supply.", "rw": "Firms with spare capacity, like many factories in a slowdown, can show highly elastic supply.", "time": 1.5},
  {"id": "pes11", "concept": "PES", "level": "SL", "type": "mc", "q": "Which of these makes supply LESS price elastic?", "options": ["The good is perishable and cannot be stored", "Firms hold large stocks", "There is spare capacity", "Factors of production move easily between industries"], "answer": 0, "exp": "Perishable goods cannot be held back and released later, so producers cannot easily adjust quantity to price.", "rw": "Fresh fish must be sold the day it is landed, so supply at the market that morning is almost fixed."},
  {"id": "pes12", "concept": "PES", "level": "SL", "type": "mc", "q": "A PES of 0.3 means supply is…", "options": ["Price inelastic", "Price elastic", "Unit elastic", "Perfectly elastic"], "answer": 0, "exp": "PES is below 1, so quantity supplied changes by a smaller percentage than price.", "rw": "Housing supply in crowded cities often has a PES well below 1."},
  {"id": "pes13", "concept": "PES", "level": "SL", "type": "order", "q": "Rank these from most price elastic supply to least price elastic supply.", "items": ["Digital music downloads", "T-shirts from a large factory", "Fresh strawberries this week", "Original Picasso paintings"], "exp": "Downloads can be copied at almost no cost; factories can add shifts; this week’s strawberries are nearly fixed; Picassos can never increase.", "rw": "Original artworks by dead artists have perfectly inelastic supply, which is why auction prices can be so high."},
  {"id": "pes14", "concept": "PES", "level": "SL", "type": "mc", "q": "Demand for durian rises sharply. In the short run, supply is price inelastic. What happens?", "options": ["The price rises a lot, with only a small rise in quantity", "The price rises a little, with a big rise in quantity", "The price falls", "Nothing changes"], "answer": 0, "exp": "With inelastic supply, extra demand mostly pushes up the price, because growers cannot quickly produce more.", "rw": "Booming Chinese demand pushed up Thai durian prices, and new orchards took years to start fruiting."},
  {"id": "pes15", "concept": "PES", "level": "SL", "type": "mc", "q": "How could a government help make supply more price elastic?", "options": ["Improve infrastructure and train workers so resources move more easily", "Raise taxes on producers", "Set a maximum price", "Ban imports"], "answer": 0, "exp": "Mobile factors of production and good transport let firms expand output faster when prices rise.", "rw": "Investment in roads, ports and skills training is often aimed at making supply more responsive."},
  {"id": "max10", "concept": "MAXP", "level": "SL", "type": "mc", "q": "Under a maximum price, which of these is a way a government might ration the scarce good?", "options": ["Ration coupons that limit how much each household can buy", "A tax on sellers", "A minimum wage", "A subsidy for advertising"], "answer": 0, "exp": "With a shortage, something other than price must decide who gets the good: coupons, queues or first-come, first-served.", "rw": "Many countries used ration books for food during the Second World War, alongside price controls."},
  {"id": "max11", "concept": "MAXP", "level": "HL", "type": "mc", "q": "Equilibrium is $6 with 700 units traded. A maximum price of $4 is set: Qd = 900 and Qs = 500. By how much does the quantity actually traded fall?", "options": ["200 units", "400 units", "500 units", "900 units"], "answer": 0, "exp": "Only Qs (500) can be bought, because firms supply no more. So the quantity traded falls from 700 to 500: by 200 units.", "rw": "Price caps on goods like fuel can lead to less being sold, not more, because supply shrinks.", "time": 1.5, "double": true},
  {"id": "min10", "concept": "MINP", "level": "SL", "type": "mc", "q": "Who is most likely to lose from a minimum wage set well above the equilibrium wage?", "options": ["Low-skilled workers who can no longer find a job", "Workers who keep their jobs", "The government", "Buyers of luxury goods"], "answer": 0, "exp": "Firms hire fewer workers at the higher wage, so the least productive workers are most at risk of unemployment.", "rw": "Debates over large minimum wage rises in Thailand often focus on the risk to small firms and low-skilled jobs."},
  {"id": "min11", "concept": "MINP", "level": "HL", "type": "mc", "q": "A minimum wage of ฿400 a day is set. At this wage, 1,000 people want jobs but firms want to hire only 800. How many people are unemployed as a result?", "options": ["200", "800", "1,000", "1,800"], "answer": 0, "exp": "Unemployment = quantity of labour supplied − quantity demanded = 1,000 − 800 = 200.", "rw": "Labour economists compare job numbers before and after minimum wage changes to measure this effect.", "time": 1.5},
  {"id": "oth11", "concept": "OTHGOV", "level": "SL", "type": "diagram-options", "q": "The government runs a hard-hitting anti-smoking advertising campaign. Which diagram shows the effect on the cigarette market?", "optionDiagrams": ["dLeft", "dRight", "sLeft", "sRight"], "answer": 0, "exp": "Negative advertising lowers the desire to smoke, so demand for cigarettes shifts left.", "rw": "Thailand requires large graphic health warnings covering most of each cigarette pack.", "time": 1.25},
  {"id": "oth12", "concept": "OTHGOV", "level": "SL", "type": "diagram-options", "q": "New regulations force factories to fit expensive pollution filters. Which diagram shows the effect on the market for their product?", "optionDiagrams": ["sLeft", "sRight", "dLeft", "dRight"], "answer": 0, "exp": "The rules raise firms’ costs of production, so supply shifts left: price rises and quantity falls.", "rw": "Stricter emission rules for vehicles and factories raise production costs, which are partly passed on to buyers.", "time": 1.25, "double": true},
  {"id": "oth13", "concept": "OTHGOV", "level": "SL", "type": "mc", "q": "Tradable pollution permits are an example of…", "options": ["A market-based policy", "Command and control regulation", "Direct provision", "A nudge"], "answer": 0, "exp": "Firms buy and sell the right to pollute, so a price signal decides who cuts pollution most cheaply.", "rw": "The EU Emissions Trading System is the world’s best-known carbon permit market."},
  {"id": "oth14", "concept": "OTHGOV", "level": "SL", "type": "mc", "q": "What is a weakness of command and control regulation?", "options": ["It can be costly to enforce and gives firms no reward for cutting pollution below the limit", "It raises a lot of tax revenue", "It always fails", "It relies only on prices"], "answer": 0, "exp": "Inspectors and fines are expensive, and once a firm meets the limit it has no incentive to do better.", "rw": "Enforcing factory emission limits needs regular inspections, which can be difficult and costly."},
  {"id": "oth15", "concept": "OTHGOV", "level": "SL", "type": "order", "q": "A school canteen uses a nudge to promote healthy eating. Put the steps in order.", "items": ["The canteen puts fruit at eye level and sweets out of sight", "Students notice the fruit first", "More students choose fruit, though sweets are still for sale", "Healthier eating rises without a ban or a tax"], "exp": "Nudges change how choices are presented, not the choices available or their prices.", "rw": "Studies of school and workplace canteens find that placing healthy food first can increase how often it is chosen."},
  {"id": "fp9", "concept": "FPROD", "level": "HL", "type": "mc", "q": "3 workers produce 30 units. 4 workers produce 36 units. What is the average product of 4 workers?", "options": ["9 units", "6 units", "36 units", "10 units"], "answer": 0, "exp": "AP = TP ÷ L = 36 ÷ 4 = 9 units. (The 4th worker’s MP is 6, which pulled the average down from 10.)", "rw": "Factories compare output per worker across shifts to spot when adding staff stops paying off.", "time": 1.5},
  {"id": "fp10", "concept": "FPROD", "level": "HL", "type": "mc", "q": "In economics, the short run is a period when…", "options": ["At least one factor of production is fixed", "All factors of production are variable", "Firms cannot hire workers", "Output cannot change"], "answer": 0, "exp": "The short run is not a set length of time: it is however long at least one input, often capital, cannot be changed.", "rw": "For a power station the short run may last years; for a food stall it may be just days."},
  {"id": "fp11", "concept": "FPROD", "level": "HL", "type": "diagram", "diagram": "prodCurves", "q": "MP is falling but is still above AP. What is happening to AP?", "options": ["AP is still rising", "AP is falling", "AP is at its minimum", "AP is negative"], "answer": 0, "exp": "As long as the extra worker adds more than the average, the average rises, even if MP itself is falling.", "rw": "A new player who scores more than the team average raises the average, even if they score less than last season’s signing.", "time": 1.25},
  {"id": "fp12", "concept": "FPROD", "level": "HL", "type": "mc", "q": "Hiring one more worker makes total product fall. What is that worker’s marginal product?", "options": ["Negative", "Zero", "Positive but falling", "Equal to AP"], "answer": 0, "exp": "If TP falls, the extra worker has reduced output: negative MP, usually from overcrowding.", "rw": "Too many cooks in a small kitchen can get in each other’s way and slow down service."},
  {"id": "fp13", "concept": "FPROD", "level": "HL", "type": "mc", "q": "What mainly causes increasing marginal returns at low levels of output?", "options": ["Specialisation and division of labour", "Diseconomies of scale", "Rising wages", "Running out of the fixed factor"], "answer": 0, "exp": "Early on, extra workers let the team specialise, so each one adds more than the last.", "rw": "Adam Smith’s pin factory showed how dividing tasks between workers multiplies output."},
  {"id": "fp14", "concept": "FPROD", "level": "HL", "type": "order", "q": "Put the steps for calculating marginal product from a table in order.", "items": ["Find total product after the extra worker is hired", "Subtract total product before that worker was hired", "Divide by the change in the number of workers (usually 1)"], "exp": "MP = ΔTP ÷ ΔL.", "rw": "Managers use the same logic when deciding whether an extra staff member is worth the wage."},
  {"id": "fp15", "concept": "FPROD", "level": "HL", "type": "mc", "q": "Which is most likely to be a fixed factor for a rice farm in the short run?", "options": ["The amount of land", "Seasonal workers", "Fertiliser", "Water used for irrigation"], "answer": 0, "exp": "Land cannot be increased quickly, while labour, fertiliser and water can be varied.", "rw": "Many Thai rice farms are small family plots, so adding workers soon brings diminishing returns."},
  {"id": "fc9", "concept": "FSRC", "level": "HL", "type": "mc", "q": "Total fixed cost is $200 and output is 50 units. What is average fixed cost?", "options": ["$4", "$250", "$10,000", "$150"], "answer": 0, "exp": "AFC = TFC ÷ Q = $200 ÷ 50 = $4.", "rw": "Airlines push to fill seats because each extra passenger spreads the fixed cost of the flight.", "time": 1.5},
  {"id": "fc10", "concept": "FSRC", "level": "HL", "type": "mc", "q": "At 40 units, ATC is $12 and AVC is $9. What is total fixed cost?", "options": ["$120", "$360", "$480", "$3"], "answer": 0, "exp": "AFC = ATC − AVC = $3. TFC = AFC × Q = $3 × 40 = $120.", "rw": "Accountants use these links between costs to check budgets for consistency.", "time": 1.5, "double": true},
  {"id": "fc11", "concept": "FSRC", "level": "HL", "type": "diagram", "diagram": "srCosts", "q": "Where the MC curve is below the ATC curve, ATC is…", "options": ["Falling", "Rising", "At its maximum", "Constant"], "answer": 0, "exp": "If the extra unit costs less than the average, it pulls the average down.", "rw": "Each extra burger made in a busy kitchen can cost less than the average, until staff and grills get stretched.", "time": 1.25},
  {"id": "fc12", "concept": "FSRC", "level": "HL", "type": "mc", "q": "Which is a variable cost for a café in Bangkok?", "options": ["Coffee beans", "Monthly rent", "Insurance", "Repayments on the espresso machine loan"], "answer": 0, "exp": "Coffee beans rise and fall with the number of drinks sold; the others are paid whatever the sales.", "rw": "Café owners track the cost of beans and milk per cup as a key variable cost."},
  {"id": "fc13", "concept": "FSRC", "level": "HL", "type": "mc", "q": "A firm’s rent goes up. Which cost curves shift up?", "options": ["ATC and AFC, but not MC or AVC", "MC only", "AVC only", "All the cost curves"], "answer": 0, "exp": "Rent is a fixed cost, so it changes AFC and ATC but has no effect on the cost of producing an extra unit.", "rw": "Rising shop rents in city centres raise average costs even if the cost of each extra sale is unchanged.", "double": true},
  {"id": "fc14", "concept": "FSRC", "level": "HL", "type": "mc", "q": "At zero output, a firm’s total cost equals…", "options": ["Total fixed cost", "Zero", "Total variable cost", "Marginal cost"], "answer": 0, "exp": "With no output, variable costs are zero, but fixed costs must still be paid.", "rw": "A closed restaurant still pays rent and insurance even with no customers."},
  {"id": "fc15", "concept": "FSRC", "level": "HL", "type": "order", "q": "As output rises, put these minimum points in the order they are reached.", "items": ["Marginal cost reaches its minimum", "Average variable cost reaches its minimum", "Average total cost reaches its minimum"], "exp": "MC turns up first; it cuts AVC at AVC’s minimum, then ATC at ATC’s minimum, which comes at a higher output because AFC is still falling.", "rw": "This ordering appears in every well-drawn short-run cost diagram in IB exams."},
  {"id": "fl9", "concept": "FLRC", "level": "HL", "type": "mc", "q": "Which is a technical economy of scale?", "options": ["Using large, specialised machinery that smaller firms cannot afford", "Bulk-buying discounts", "Cheaper loans", "Spreading advertising costs"], "answer": 0, "exp": "Big firms can use big, efficient equipment, cutting the cost per unit.", "rw": "Giant container ships carry goods far more cheaply per box than small ships."},
  {"id": "fl10", "concept": "FLRC", "level": "HL", "type": "mc", "q": "Which is a financial economy of scale?", "options": ["Large firms can borrow at lower interest rates", "Workers specialise in one task", "Firms use bigger machines", "Managers duplicate each other’s work"], "answer": 0, "exp": "Lenders see big firms as less risky, so they lend to them more cheaply.", "rw": "Large companies can raise money by selling bonds at lower interest rates than small firms pay on bank loans."},
  {"id": "fl11", "concept": "FLRC", "level": "HL", "type": "mc", "q": "A firm doubles all of its inputs and its output rises by 150%. This shows…", "options": ["Increasing returns to scale", "Decreasing returns to scale", "Constant returns to scale", "Diminishing marginal returns"], "answer": 0, "exp": "Output more than doubles when all inputs double, so the firm has increasing returns to scale.", "rw": "Network-based businesses can show increasing returns as they grow.", "double": true},
  {"id": "fl12", "concept": "FLRC", "level": "HL", "type": "mc", "q": "Which is an external economy of scale?", "options": ["Specialist suppliers cluster around an industry, cutting costs for all its firms", "A firm buys inputs in bulk", "A firm builds a bigger factory", "A firm hires a specialist manager"], "answer": 0, "exp": "External economies come from the growth of the whole industry in an area, not from one firm growing.", "rw": "Thailand’s Eastern Seaboard car cluster gives car makers easy access to parts suppliers and skilled workers."},
  {"id": "fl13", "concept": "FLRC", "level": "HL", "type": "diagram", "diagram": "lrac", "q": "A firm producing a small output wants lower average costs. According to the diagram, it should…", "options": ["Grow towards Q*", "Shrink", "Stay the same size", "Grow far beyond Q*"], "answer": 0, "exp": "LRAC falls up to Q* because of economies of scale; beyond Q* diseconomies push costs up.", "rw": "Many start-ups chase growth partly to reach the scale where their costs per customer fall.", "time": 1.25},
  {"id": "fl14", "concept": "FLRC", "level": "HL", "type": "mc", "q": "How is the LRAC curve related to short-run ATC curves?", "options": ["It is an envelope of many short-run ATC curves", "It is the same as the MC curve", "It lies above every short-run ATC curve", "It is vertical"], "answer": 0, "exp": "Each short-run curve is for one factory size; the LRAC traces the lowest possible cost of each output when size can change.", "rw": "Firms choose the plant size that matches the output they expect to sell."},
  {"id": "fl15", "concept": "FLRC", "level": "HL", "type": "mc", "q": "Factory A makes 1,000 units for $20,000. Factory B makes 5,000 units for $75,000. Which has the lower average cost?", "options": ["B, at $15 per unit", "A, at $20 per unit", "They are the same", "A, at $15 per unit"], "answer": 0, "exp": "A: $20,000 ÷ 1,000 = $20. B: $75,000 ÷ 5,000 = $15. The larger factory benefits from economies of scale.", "rw": "Car makers concentrate production in a few very large plants to keep unit costs down.", "time": 1.5},
  {"id": "fr8", "concept": "FREV", "level": "HL", "type": "mc", "q": "A firm sells 200 units at $5 each. What is its total revenue?", "options": ["$1,000", "$40", "$205", "$5"], "answer": 0, "exp": "TR = P × Q = $5 × 200 = $1,000.", "rw": "Street vendors work out daily takings exactly like this.", "time": 1.5},
  {"id": "fr9", "concept": "FREV", "level": "HL", "type": "mc", "q": "For a perfectly competitive firm, marginal revenue is…", "options": ["Equal to the price", "Less than the price", "Greater than the price", "Always zero"], "answer": 0, "exp": "A price taker sells every extra unit at the same market price, so MR = P = AR.", "rw": "A small rice farmer gets the market price for each extra sack sold."},
  {"id": "fr10", "concept": "FREV", "level": "HL", "type": "diagram", "diagram": "monRev", "q": "If the firm increases output beyond Q₁, what happens to total revenue?", "options": ["It falls", "It rises", "It stays the same", "It doubles"], "answer": 0, "exp": "Beyond Q₁, MR is negative, so each extra unit sold reduces total revenue.", "rw": "Flooding a market with extra stock can lower total takings if prices must fall a lot to sell it.", "time": 1.25},
  {"id": "fr11", "concept": "FREV", "level": "HL", "type": "mc", "q": "Total revenue rises from $600 to $660 when output rises from 30 to 32 units. What is the marginal revenue per unit?", "options": ["$30", "$60", "$20.63", "$660"], "answer": 0, "exp": "MR = ΔTR ÷ ΔQ = $60 ÷ 2 = $30 per unit.", "rw": "Businesses compare the extra revenue from more sales with the extra cost before expanding.", "time": 1.5, "double": true},
  {"id": "fr12", "concept": "FREV", "level": "HL", "type": "order", "q": "Put the steps for finding total revenue from a demand curve in order.", "items": ["Choose a price", "Read off the quantity demanded at that price", "Multiply the price by the quantity"], "exp": "TR = P × Q: the area of the rectangle under the demand curve at that price.", "rw": "Concert promoters estimate revenue this way when setting ticket prices."},
  {"id": "fr13", "concept": "FREV", "level": "HL", "type": "mc", "q": "A price maker is a firm that…", "options": ["Can choose its price because it faces a downward-sloping demand curve", "Must accept the market price", "Sells an identical product to many rivals", "Has no costs"], "answer": 0, "exp": "With some market power, the firm can raise its price and still sell some output.", "rw": "Apple sets iPhone prices itself rather than accepting a “market price”."},
  {"id": "fr14", "concept": "FREV", "level": "HL", "type": "mc", "q": "Where demand is unit elastic, marginal revenue is…", "options": ["Zero", "Positive", "Negative", "Equal to the price"], "answer": 0, "exp": "At unit elasticity, a small price change leaves TR unchanged, so MR = 0 and TR is at its maximum.", "rw": "Revenue-maximising pricing tools look for the price where demand is unit elastic."},
  {"id": "fr15", "concept": "FREV", "level": "HL", "type": "mc", "q": "A firm sells 4 units at $10 each, or 5 units at $9 each. What is the marginal revenue of the 5th unit?", "options": ["$5", "$9", "$45", "$1"], "answer": 0, "exp": "TR rises from $40 to $45, so MR = $5. It is less than the $9 price because the price cut applies to all 5 units.", "rw": "This is why firms with market power often prefer selling fewer units at a higher price.", "time": 1.5},
  {"id": "ff10", "concept": "FPROF", "level": "HL", "type": "diagram", "diagram": "pcProfit", "q": "At output Q*, which statement is true?", "options": ["MC = MR, and price is above ATC", "MC is below MR", "Price equals ATC", "The firm is making a loss"], "answer": 0, "exp": "Q* is where MC = MR (profit maximising) and P > ATC, so the firm earns abnormal profit.", "rw": "Firms with rising sales often check whether the last units still add more to revenue than to cost.", "time": 1.25},
  {"id": "ff11", "concept": "FPROF", "level": "HL", "type": "diagram", "diagram": "pcLoss", "q": "If the price fell below the AVC curve, what should this firm do in the short run?", "options": ["Shut down", "Keep producing", "Raise its price", "Expand output"], "answer": 0, "exp": "Below AVC, every unit loses more than its variable cost, so shutting down (losing only fixed costs) is better.", "rw": "Some factories pause production lines when selling prices drop below the cost of materials and labour.", "time": 1.25, "double": true},
  {"id": "ff12", "concept": "FPROF", "level": "HL", "type": "mc", "q": "Why do economists include opportunity cost in a firm’s total costs?", "options": ["To show whether the resources could earn more elsewhere", "To make profits look larger", "Because accountants require it", "Because it lowers taxes"], "answer": 0, "exp": "Economic profit compares the business with the owner’s next best alternative.", "rw": "A café owner who could earn more as a manager elsewhere is making an economic loss, even with an accounting profit."},
  {"id": "ff13", "concept": "FPROF", "level": "HL", "type": "mc", "q": "Total revenue is $50,000 and explicit costs are $35,000. The owner could earn $20,000 working elsewhere. What is the economic profit?", "options": ["A loss of $5,000", "A profit of $15,000", "A profit of $50,000", "Zero"], "answer": 0, "exp": "Economic profit = $50,000 − $35,000 − $20,000 (opportunity cost) = −$5,000.", "rw": "Small-business owners sometimes close profitable firms because a salaried job would pay more.", "time": 1.5, "double": true},
  {"id": "ff14", "concept": "FPROF", "level": "HL", "type": "mc", "q": "In the long run, a firm leaves an industry if…", "options": ["Price stays below average total cost", "Price is below marginal cost", "Price is above AVC", "MR is zero"], "answer": 0, "exp": "In the long run all costs must be covered; if P < ATC persists, the firm exits.", "rw": "Many high-street shops closed for good as online shopping kept their prices below average cost."},
  {"id": "ff15", "concept": "FPROF", "level": "HL", "type": "order", "q": "Put the steps for finding a firm’s profit on a diagram in order.", "items": ["Find the output where MC = MR", "Read the price from the AR curve at that output", "Read ATC at that output", "Profit = (AR − ATC) × quantity"], "exp": "Output comes from MC = MR; then compare price and average cost at that output.", "rw": "This is exactly the method IB examiners expect in a Paper 1 or Paper 2 diagram answer."},
  {"id": "pc9", "concept": "FPC", "level": "HL", "type": "mc", "q": "Why can’t a perfectly competitive firm charge more than the market price?", "options": ["Buyers would switch to identical products from other firms", "The government forbids it", "Its costs would rise", "It would make a loss"], "answer": 0, "exp": "With identical products and perfect information, any firm charging more sells nothing.", "rw": "A rice seller at a wholesale market charging above the going rate would quickly lose buyers."},
  {"id": "pc10", "concept": "FPC", "level": "HL", "type": "mc", "q": "In the long run, a firm in perfect competition earns…", "options": ["Normal profit", "Abnormal profit", "A loss", "Maximum revenue"], "answer": 0, "exp": "Free entry and exit push price to minimum ATC, leaving only normal profit.", "rw": "Markets with easy entry, like many crops, rarely stay highly profitable for long."},
  {"id": "pc11", "concept": "FPC", "level": "HL", "type": "order", "q": "Firms in a perfectly competitive industry are making losses. Put the long-run adjustment in order.", "items": ["Loss-making firms leave the industry", "Market supply shifts to the left", "The market price rises", "The remaining firms earn normal profit"], "exp": "Free exit removes supply until price rises back to minimum ATC.", "rw": "When rubber prices slumped in the 2010s, some Thai rubber farmers switched to other crops such as durian."},
  {"id": "pc12", "concept": "FPC", "level": "HL", "type": "mc", "q": "Which assumption allows abnormal profits to be competed away in perfect competition?", "options": ["Freedom of entry and exit", "Product differentiation", "Barriers to entry", "A small number of sellers"], "answer": 0, "exp": "New firms can enter freely whenever profits are high.", "rw": "Low entry barriers in crop farming mean high prices quickly attract new growers."},
  {"id": "pc13", "concept": "FPC", "level": "HL", "type": "diagram", "diagram": "pcProfit", "q": "If the market price fell to the lowest point of the ATC curve, this firm would earn…", "options": ["Normal profit", "Abnormal profit", "A loss", "It would shut down"], "answer": 0, "exp": "At minimum ATC, price equals average total cost: normal profit, the long-run equilibrium.", "rw": "This is the point the whole industry moves towards once new firms have entered.", "time": 1.25},
  {"id": "pc14", "concept": "FPC", "level": "HL", "type": "mc", "q": "Why is perfect information important in perfect competition?", "options": ["Buyers know all prices, so no firm can charge more than others", "Firms keep secrets from rivals", "It creates brand loyalty", "It raises barriers to entry"], "answer": 0, "exp": "If buyers know every price, a firm that charges more instantly loses customers.", "rw": "Price comparison websites push some markets closer to this assumption."},
  {"id": "pc15", "concept": "FPC", "level": "HL", "type": "mc", "q": "Why do foreign currency markets come close to perfect competition?", "options": ["Many traders deal in an identical product, with prices available instantly", "One bank sets the price", "Each currency is a differentiated brand", "Entry is impossible"], "answer": 0, "exp": "Huge numbers of buyers and sellers, an identical product and instant price information match the model closely.", "rw": "Trillions of dollars of currency are traded each day, with prices visible to traders worldwide."},
  {"id": "mo10", "concept": "FMON", "level": "HL", "type": "mc", "q": "Which is a legal barrier to entry?", "options": ["Licences and patents", "Brand loyalty", "Economies of scale", "Aggressive pricing"], "answer": 0, "exp": "Laws can give one firm the sole right to sell a product or operate in a market.", "rw": "Governments often grant a limited number of licences for activities such as mobile spectrum or casinos."},
  {"id": "mo11", "concept": "FMON", "level": "HL", "type": "mc", "q": "A monopoly sells 500 units at $20 each. ATC at that output is $14. What is its abnormal profit?", "options": ["$3,000", "$10,000", "$7,000", "$6"], "answer": 0, "exp": "Profit = (P − ATC) × Q = ($20 − $14) × 500 = $3,000.", "rw": "Competition authorities look for persistent high profits as one sign of market power.", "time": 1.5},
  {"id": "mo12", "concept": "FMON", "level": "HL", "type": "diagram", "diagram": "monProfit", "q": "Why does the monopoly produce at Q rather than a larger output?", "options": ["Beyond Q, MC is greater than MR", "Demand is zero beyond Q", "ATC is lowest at Q", "The government limits its output"], "answer": 0, "exp": "Each unit beyond Q would add more to cost than to revenue, reducing profit.", "rw": "Dominant firms may deliberately hold back supply to keep prices high.", "time": 1.25},
  {"id": "mo13", "concept": "FMON", "level": "HL", "type": "mc", "q": "Why might a monopoly have less incentive to keep its costs down?", "options": ["Without competitors, there is less pressure to be efficient", "Its costs are always lower", "It is always regulated", "It always makes losses"], "answer": 0, "exp": "Secure from rivals, a monopoly may let costs creep up. Economists call this X-inefficiency.", "rw": "Critics of some state-owned monopolies point to overstaffing and slow service."},
  {"id": "mo14", "concept": "FMON", "level": "HL", "type": "mc", "q": "Which is a natural barrier to entry?", "options": ["Very large economies of scale", "Patents", "Government licences", "Tariffs"], "answer": 0, "exp": "If one firm can supply the whole market most cheaply, new entrants cannot compete on cost.", "rw": "Building a rival national electricity grid would be hugely expensive, so few firms try."},
  {"id": "mo15", "concept": "FMON", "level": "HL", "type": "order", "q": "Order these market structures from most competitive to least competitive.", "items": ["Perfect competition", "Monopolistic competition", "Oligopoly", "Monopoly"], "exp": "Competition falls as the number of firms falls and barriers to entry rise.", "rw": "Most real markets sit somewhere in the middle of this spectrum."},
  {"id": "mn8", "concept": "FMONC", "level": "HL", "type": "mc", "q": "A firm in monopolistic competition faces a demand curve that is…", "options": ["Downward sloping and fairly elastic", "Horizontal", "Vertical", "Upward sloping"], "answer": 0, "exp": "Its product is slightly different, so it has a little market power, but close substitutes make demand elastic.", "rw": "A noodle shop can charge a bit more for a famous recipe, but not much, with rivals on the same street."},
  {"id": "mn9", "concept": "FMONC", "level": "HL", "type": "mc", "q": "In the short run, a firm in monopolistic competition can make…", "options": ["Abnormal profit, normal profit or a loss", "Only normal profit", "Only abnormal profit", "Only a loss"], "answer": 0, "exp": "In the short run anything is possible; entry and exit push it to normal profit in the long run.", "rw": "A trendy new café may earn big profits at first, before copycats open nearby."},
  {"id": "mn10", "concept": "FMONC", "level": "HL", "type": "diagram", "diagram": "moncLR", "q": "Is this firm allocatively efficient?", "options": ["No, because price is above marginal cost", "Yes, because price equals marginal cost", "Yes, because it is at minimum ATC", "No, because it is making a loss"], "answer": 0, "exp": "At Q, P is above MC, so society would value extra units more than they cost to make.", "rw": "The variety consumers enjoy comes at the cost of slightly higher prices than perfect competition would give.", "time": 1.25},
  {"id": "mn11", "concept": "FMONC", "level": "HL", "type": "mc", "q": "Why do firms in monopolistic competition spend money on advertising and branding?", "options": ["To differentiate their product and make demand less price elastic", "To lower their costs", "Because their products are identical", "To form a cartel"], "answer": 0, "exp": "Brand loyalty means customers are less likely to switch when prices rise.", "rw": "Local coffee chains build loyalty with distinctive décor, loyalty apps and social media."},
  {"id": "mn12", "concept": "FMONC", "level": "HL", "type": "mc", "q": "What is a benefit of monopolistic competition for consumers?", "options": ["A wide variety and choice of products", "The lowest possible prices", "Allocative efficiency", "No advertising"], "answer": 0, "exp": "Product differentiation gives consumers lots of choice in style, location and quality.", "rw": "A Bangkok food court offers dozens of different dishes from competing stalls."},
  {"id": "mn13", "concept": "FMONC", "level": "HL", "type": "mc", "q": "Compared with perfect competition, the long-run price in monopolistic competition is…", "options": ["Higher, because P > MC and ATC is not at its minimum", "Lower", "The same", "Zero"], "answer": 0, "exp": "Firms produce with excess capacity and charge above marginal cost, so the price is higher.", "rw": "Branded haircuts usually cost more than they would in a market of identical salons."},
  {"id": "mn14", "concept": "FMONC", "level": "HL", "type": "order", "q": "A new bubble tea shop opens next door to an existing one. Put what happens to the existing shop in order.", "items": ["Some customers switch to the new shop", "The existing shop’s demand curve shifts left", "Its abnormal profit shrinks", "It responds with new flavours or promotions"], "exp": "Entry takes customers from existing firms, pushing them towards normal profit and encouraging non-price competition.", "rw": "Bubble tea brands constantly launch new flavours to stand out in crowded markets."},
  {"id": "mn15", "concept": "FMONC", "level": "HL", "type": "mc", "q": "What separates monopolistic competition from oligopoly?", "options": ["There are many small firms, so each ignores rivals’ reactions", "Products are identical", "Barriers to entry are high", "There is only one firm"], "answer": 0, "exp": "With many small firms, no single firm’s decisions noticeably affect the others, so firms are not interdependent.", "rw": "A single restaurant changing its prices does not make every other restaurant in the city react."},
  {"id": "ol11", "concept": "FOLIG", "level": "HL", "type": "mc", "q": "What is a price war?", "options": ["Rival firms repeatedly cut prices to win customers from each other", "Firms agree to raise prices together", "The government sets prices", "A firm raises prices to signal quality"], "answer": 0, "exp": "In oligopoly, one firm’s price cut can trigger matching cuts, lowering profits for all.", "rw": "Ride-hailing firms in Southeast Asia fought heavy price wars before Uber sold its regional business to Grab in 2018."},
  {"id": "ol12", "concept": "FOLIG", "level": "HL", "type": "diagram", "diagram": "gameMatrix", "q": "If the firms could trust each other, which outcome would give the highest combined profit?", "options": ["Both charge a high price ($10m each)", "Both charge a low price", "A charges high and B charges low", "A charges low and B charges high"], "answer": 0, "exp": "High/high gives $20m in total, the most of any outcome. But without trust, each is tempted to cut prices.", "rw": "This is why firms are tempted to collude, and why collusion is illegal in most countries.", "time": 1.25},
  {"id": "ol13", "concept": "FOLIG", "level": "HL", "type": "mc", "q": "Why do oligopolies often have high barriers to entry?", "options": ["Large economies of scale and strong brands", "Low start-up costs", "Perfect information", "Identical products"], "answer": 0, "exp": "New firms struggle to match the low costs and brand loyalty of established giants.", "rw": "Starting a new airline needs aircraft, airport slots and a trusted brand, which is a huge barrier."},
  {"id": "ol14", "concept": "FOLIG", "level": "HL", "type": "order", "q": "Put the stages of a cartel breaking down in order.", "items": ["Firms agree to restrict output and raise prices", "One member secretly produces more than its quota", "The market price starts to fall", "Other members raise output too, and the cartel collapses"], "exp": "Each member gains by cheating, so cartels are often unstable.", "rw": "The 1980s oil price collapse followed OPEC members producing above their quotas."},
  {"id": "ol15", "concept": "FOLIG", "level": "HL", "type": "mc", "q": "The five largest firms in a market have shares of 30%, 25%, 15%, 10% and 5%. What is the four-firm concentration ratio?", "options": ["80%", "85%", "30%", "70%"], "answer": 0, "exp": "CR4 adds the four largest shares: 30 + 25 + 15 + 10 = 80%.", "rw": "Competition authorities use concentration ratios to judge how much market power a few firms have.", "time": 1.5, "double": true},
  {"id": "fe8", "concept": "FEFF", "level": "HL", "type": "diagram", "diagram": "monProfit", "q": "At output Q, compare the price with marginal cost. What does this show?", "options": ["P > MC: allocative inefficiency", "P = MC: allocative efficiency", "P < MC: overproduction", "P = ATC: normal profit"], "answer": 0, "exp": "Consumers value the last unit (P) more than it costs to make (MC), so too little is produced.", "rw": "This gap is the economic case for keeping an eye on firms with monopoly power.", "time": 1.25},
  {"id": "fe9", "concept": "FEFF", "level": "HL", "type": "mc", "q": "What is dynamic efficiency?", "options": ["Innovation and improved products and processes over time", "Producing at the lowest ATC", "Price equal to MC", "Selling at the lowest price"], "answer": 0, "exp": "Dynamic efficiency is about progress: new technology, new products and falling costs over time.", "rw": "Smartphones today do far more than the first models for a similar real price."},
  {"id": "fe10", "concept": "FEFF", "level": "HL", "type": "mc", "q": "Why might a monopoly be more dynamically efficient than a perfectly competitive firm?", "options": ["Its abnormal profits can fund research and development", "It charges lower prices", "It produces more output", "It is allocatively efficient"], "answer": 0, "exp": "Firms in perfect competition earn only normal profit, leaving little to spend on innovation.", "rw": "Drug companies argue patent protection funds the costly research behind new medicines."},
  {"id": "fe11", "concept": "FEFF", "level": "HL", "type": "mc", "q": "Which is an argument for allowing a large merger?", "options": ["The combined firm may gain economies of scale and lower costs", "Prices will definitely fall", "It increases the number of firms", "It always improves choice"], "answer": 0, "exp": "Lower costs could benefit consumers, if they are passed on, so authorities weigh this against lost competition.", "rw": "Merging airlines often argue they can cut costs by sharing routes and aircraft."},
  {"id": "fe12", "concept": "FEFF", "level": "HL", "type": "mc", "q": "What does nationalisation mean?", "options": ["The government takes ownership of a firm or industry", "A firm is sold to private owners", "A firm merges with a rival", "A firm leaves the country"], "answer": 0, "exp": "Governments sometimes nationalise natural monopolies to control prices and protect consumers.", "rw": "Many countries run railways or water supply through state-owned companies."},
  {"id": "fe13", "concept": "FEFF", "level": "HL", "type": "order", "q": "Put the steps in a competition authority’s price-fixing case in order.", "items": ["A complaint or tip-off is received", "The authority investigates the firms’ prices and communications", "The firms are found guilty of collusion", "Fines are imposed and the practice must stop"], "exp": "Proving collusion needs evidence of agreements, which is why investigations can take years.", "rw": "Thailand’s Trade Competition Commission can investigate and fine firms that collude."},
  {"id": "fe14", "concept": "FEFF", "level": "HL", "type": "mc", "q": "Under monopoly, which effect is a transfer rather than a loss to society?", "options": ["Some consumer surplus becomes the monopoly’s profit", "The deadweight (welfare) loss", "The lower output", "Higher costs from inefficiency"], "answer": 0, "exp": "The higher price moves surplus from consumers to the firm; the deadweight loss is surplus that nobody gets.", "rw": "This distinction matters when governments decide how much to worry about a firm’s high profits.", "double": true},
  {"id": "fe15", "concept": "FEFF", "level": "HL", "type": "mc", "q": "What is a problem with regulating a monopoly’s prices?", "options": ["Regulators may not know the firm’s true costs", "Prices always rise", "It removes all economies of scale", "It is illegal"], "answer": 0, "exp": "Firms know their costs better than regulators, so caps may be set too high or too low.", "rw": "Energy regulators spend years reviewing companies’ cost data before setting price limits."},

  // ================= UNIT 4: INTEGRATION, EXCHANGE RATES, BALANCE OF PAYMENTS =================
  {"id": "bt1", "concept": "BLOC", "level": "SL", "type": "mc", "q": "Thailand and Japan signed JTEPA, a deal between just the two countries that cuts tariffs on each other’s goods. This is…", "options": ["A bilateral trade agreement", "A multilateral trade agreement", "A customs union", "A monetary union"], "answer": 0, "exp": "A bilateral agreement involves two countries; a multilateral one involves several.", "rw": "JTEPA came into force in 2007 and cut tariffs on goods such as Thai food exports and Japanese car parts."},
  {"id": "bt2", "concept": "BLOC", "level": "SL", "type": "mc", "q": "RCEP, signed in 2020 by 15 Asia-Pacific countries including the ASEAN members, China and Japan, is an example of…", "options": ["A multilateral (regional) trade agreement", "A bilateral trade agreement", "A monetary union", "A common market"], "answer": 0, "exp": "RCEP involves many countries in one region agreeing to cut trade barriers between them.", "rw": "RCEP is often described as the world’s largest trade agreement, covering around 30% of world GDP."},
  {"id": "bt3", "concept": "BLOC", "level": "SL", "type": "mc", "q": "In a free trade area such as the ASEAN Free Trade Area (AFTA), members…", "options": ["Remove trade barriers between themselves but keep their own tariffs on non-members", "Set a common external tariff", "Use a single currency", "Allow free movement of labour and capital"], "answer": 0, "exp": "A free trade area frees trade between members, but each member still sets its own tariffs on outsiders.", "rw": "AFTA was launched in 1992, and tariffs on most goods traded between the original ASEAN members are now zero."},
  {"id": "bt4", "concept": "BLOC", "level": "SL", "type": "mc", "q": "Mercosur members (Brazil, Argentina, Paraguay and Uruguay) trade freely with each other and apply a common external tariff to outsiders. This makes Mercosur a…", "options": ["Customs union", "Free trade area", "Monetary union", "Bilateral agreement"], "answer": 0, "exp": "A customs union is a free trade area plus a common external tariff on non-members.", "rw": "The EU is also a customs union: goods from outside face the same tariff whichever EU port they enter."},
  {"id": "bt5", "concept": "BLOC", "level": "SL", "type": "mc", "q": "The EU single market lets goods, services, capital and people move freely between member countries. This stage of integration is called a…", "options": ["Common market", "Free trade area", "Customs union", "Preferential trade agreement"], "answer": 0, "exp": "A common market adds free movement of factors of production (labour and capital) to a customs union.", "rw": "EU citizens can live and work in any other member country without a work permit."},
  {"id": "bt6", "concept": "BLOC", "level": "SL", "type": "order", "q": "Order these stages of economic integration from least integrated to most integrated.", "items": ["Preferential trade agreement", "Free trade area", "Customs union", "Common market", "Monetary union"], "exp": "Each stage adds something: lower tariffs, then zero tariffs, then a common external tariff, then free factor movement, then a single currency.", "rw": "The EU has moved through almost every stage, from a customs union in 1968 to the euro in 1999.", "double": true},
  {"id": "bt7", "concept": "BLOC", "level": "SL", "type": "mc", "q": "Why do free trade areas such as USMCA (between the USA, Mexico and Canada) need “rules of origin”?", "options": ["To stop goods entering through the member with the lowest tariff and then moving tariff-free", "To set a common currency", "To fix exchange rates", "To ban all imports"], "answer": 0, "exp": "Members keep different tariffs on outsiders, so rules decide which goods count as “made in the bloc”.", "rw": "USMCA replaced NAFTA in 2020 and raised the share of a car that must be made in North America to qualify."},
  {"id": "bt8", "concept": "BLOC", "level": "HL", "type": "mc", "q": "After joining a customs union, a country stops importing low-cost rice from a non-member and buys more expensive rice from a member instead, because the member’s rice now faces no tariff. This is…", "options": ["Trade diversion", "Trade creation", "Dumping", "Retaliation"], "answer": 0, "exp": "Trade has been diverted from a more efficient outside producer to a less efficient member: a loss of efficiency.", "rw": "When the UK joined the European Community in 1973, it had to apply tariffs to food from Commonwealth suppliers such as New Zealand, diverting trade to European farmers."},
  {"id": "bt9", "concept": "BLOC", "level": "HL", "type": "mc", "q": "When AFTA cut tariffs, some ASEAN consumers switched from higher-cost domestic goods to cheaper imports from other member countries. Economists call this…", "options": ["Trade creation", "Trade diversion", "Protectionism", "Dumping"], "answer": 0, "exp": "Trade is created when lower-cost producers within the bloc replace higher-cost domestic production.", "rw": "Trade between ASEAN members has grown strongly since tariffs were removed."},
  {"id": "bt10", "concept": "BLOC", "level": "SL", "type": "mc", "q": "Which is a benefit for firms when their country joins a trading bloc such as ASEAN?", "options": ["A larger market lets them gain economies of scale", "They face no competition", "Prices always rise", "Trade with non-members automatically increases"], "answer": 0, "exp": "Selling tariff-free to many countries lets firms expand output and lower average costs.", "rw": "With access to all of ASEAN, Thai food producers such as CP Foods sell across the region."},
  {"id": "bt11", "concept": "BLOC", "level": "SL", "type": "mc", "q": "The UK left the EU customs union in 2021. Which disadvantage of a customs union did supporters of leaving point to?", "options": ["A member cannot negotiate its own trade deals with non-members", "It must adopt the euro", "It must pay tariffs on trade with other members", "It cannot trade with outside countries at all"], "answer": 0, "exp": "Customs union members share one external trade policy, so they negotiate trade deals as a group.", "rw": "Since leaving, the UK has signed its own trade deals, such as with Australia and New Zealand."},
  {"id": "bt12", "concept": "BLOC", "level": "SL", "type": "mc", "q": "The UK joined the CPTPP trade agreement in December 2024. What did it hope to gain?", "options": ["Better access to fast-growing Asia-Pacific markets", "The euro", "A place back in the EU customs union", "A fixed exchange rate with the dollar"], "answer": 0, "exp": "Trade agreements cut barriers to members’ markets, helping exporters.", "rw": "CPTPP members include Japan, Australia, Canada, Vietnam, Malaysia and Singapore."},
  {"id": "bt13", "concept": "BLOC", "level": "SL", "type": "mc", "q": "Trade agreements such as RCEP must follow the rules of which organisation?", "options": ["The World Trade Organization (WTO)", "The International Monetary Fund (IMF)", "The World Bank", "OPEC"], "answer": 0, "exp": "WTO rules allow regional trade agreements, as long as they cover substantially all trade between members.", "rw": "The WTO has 160+ members and settles trade disputes between countries."},
  {"id": "bt14", "concept": "BLOC", "level": "SL", "type": "order", "q": "ASEAN cuts tariffs on cars traded between its members to zero. Put the effects on Thailand’s car industry in order.", "items": ["Tariffs on cars from other ASEAN members fall to zero", "Thai-made cars become cheaper in Indonesia and the Philippines", "Demand for Thai-made cars across the region rises", "Car plants in Thailand expand and gain economies of scale"], "exp": "Tariff-free access to a bigger market boosts exports and lets producers expand.", "rw": "Thailand is often called the “Detroit of Asia”, as many car makers use it as their regional export hub."},
  {"id": "bt15", "concept": "BLOC", "level": "SL", "type": "mc", "q": "Which statement about a customs union is true?", "options": ["Members apply a common external tariff on non-members", "Members keep separate tariffs on non-members", "Members must share a currency", "Members cannot trade with outsiders"], "answer": 0, "exp": "The common external tariff is what separates a customs union from a free trade area.", "rw": "Mercosur and the EU are both customs unions with a common external tariff."},
  {"id": "mu1", "concept": "MONU", "level": "SL", "type": "mc", "q": "When Croatia adopted the euro in 2023, which benefit did Croatian firms gain when trading with Germany?", "options": ["No exchange rate risk or currency conversion costs", "Higher tariffs on German goods", "Their own interest rate policy", "A cheaper national currency"], "answer": 0, "exp": "With one currency, firms no longer worry about exchange rate swings or pay to convert money.", "rw": "Croatia became the 20th member of the eurozone on 1 January 2023."},
  {"id": "mu2", "concept": "MONU", "level": "SL", "type": "mc", "q": "In a monetary union such as the eurozone, who sets interest rates?", "options": ["A single central bank: the European Central Bank", "Each country’s own central bank", "The IMF", "National governments"], "answer": 0, "exp": "Members share one currency and one monetary policy, set by the ECB in Frankfurt.", "rw": "The ECB sets one interest rate for all eurozone countries, from Germany to Greece."},
  {"id": "mu3", "concept": "MONU", "level": "SL", "type": "mc", "q": "During the eurozone debt crisis of the 2010s, Greece could not devalue its currency to make its exports cheaper. Why not?", "options": ["It used the euro, so it had no national currency to devalue", "Devaluation is illegal everywhere", "Its exports were already very cheap", "The IMF banned it"], "answer": 0, "exp": "Losing your own currency means losing the exchange rate as a tool to regain competitiveness.", "rw": "Greece instead had to cut wages and prices, a slow and painful process, with unemployment above 25% at its peak.", "double": true},
  {"id": "mu4", "concept": "MONU", "level": "SL", "type": "mc", "q": "Why can a single interest rate be a problem for a monetary union like the eurozone?", "options": ["Members may be at different points in the business cycle", "All members always have the same inflation rate", "Interest rates do not affect spending", "It makes trade more expensive"], "answer": 0, "exp": "A rate that suits a booming member may be too high for one in recession, and the reverse.", "rw": "In the 2000s, low ECB rates suited slow-growing Germany but fuelled housing booms in Spain and Ireland."},
  {"id": "mu5", "concept": "MONU", "level": "SL", "type": "mc", "q": "Which is a benefit of the euro for consumers?", "options": ["Price transparency: it is easy to compare prices across member countries", "Higher prices", "More currency exchange fees", "Separate interest rates in each country"], "answer": 0, "exp": "With prices in one currency, consumers can easily see if goods are cheaper in another member country.", "rw": "A tourist from Italy can compare prices in Spain or France without converting currencies."},
  {"id": "mu6", "concept": "MONU", "level": "SL", "type": "mc", "q": "Denmark is in the EU single market but kept its own currency, the krone. What does Denmark keep by not adopting the euro?", "options": ["Its own currency and central bank, even though it pegs the krone to the euro", "Free trade with the EU", "A common external tariff", "Free movement of labour"], "answer": 0, "exp": "Denmark has the trade benefits of the EU without joining the monetary union, though its peg limits its policy freedom.", "rw": "Danish voters rejected joining the euro in a referendum in 2000."},
  {"id": "mu7", "concept": "MONU", "level": "SL", "type": "order", "q": "One eurozone country falls into recession while the others boom. Put what happens in order.", "items": ["The ECB keeps interest rates high to control inflation in the booming countries", "Borrowing in the struggling country stays expensive", "Spending and output there fall further", "Unemployment rises, and the country cannot devalue to help its exports"], "exp": "One interest rate cannot suit everyone, and members cannot use the exchange rate to adjust.", "rw": "This “one size fits all” problem was widely discussed during the eurozone crisis.", "double": true},
  {"id": "mu8", "concept": "MONU", "level": "SL", "type": "mc", "q": "Which condition makes a monetary union more likely to succeed?", "options": ["Workers can move easily between member countries to find jobs", "Members have very different business cycles", "Members have very different inflation rates", "Money cannot be transferred between regions"], "answer": 0, "exp": "If workers move from struggling regions to booming ones, the union can adjust without its own exchange rates.", "rw": "The US works well as a monetary union partly because workers move between states and federal taxes support poorer states."},
  {"id": "mu9", "concept": "MONU", "level": "SL", "type": "mc", "q": "Which is a cost for a country that joins a monetary union?", "options": ["It loses independent monetary policy", "Transaction costs fall", "Exchange rate risk disappears", "Trade with members increases"], "answer": 0, "exp": "The central bank of the union sets interest rates, so a member can’t set rates to suit its own economy.", "rw": "Countries joining the euro hand control of interest rates to the European Central Bank."},
  {"id": "mu10", "concept": "MONU", "level": "SL", "type": "mc", "q": "After the UK left the EU single market in 2021, many UK exporters to the EU faced…", "options": ["New customs checks and paperwork", "Lower costs and fewer checks", "A single currency with the EU", "Free movement of goods with no forms"], "answer": 0, "exp": "Leaving a common market brings back border checks, rules-of-origin paperwork and delays.", "rw": "Some small UK firms stopped selling to EU customers because of the extra paperwork after Brexit."},
  {"id": "mu11", "concept": "MONU", "level": "SL", "type": "mc", "q": "Which is an argument for a country staying outside a trading bloc?", "options": ["It keeps full control of its own trade policy", "It gets access to larger markets", "It gains economies of scale", "It attracts more investment from bloc members"], "answer": 0, "exp": "Outside a bloc, a country can set its own tariffs and sign its own trade deals.", "rw": "Switzerland is not in the EU and negotiates many of its own trade agreements, though it has close deals with the EU."},
  {"id": "mu12", "concept": "MONU", "level": "SL", "type": "mc", "q": "Japanese car makers such as Nissan and Toyota built factories in the UK in the 1980s and 1990s. Why did EU membership make the UK attractive for this investment?", "options": ["Cars built in the UK could be sold across the EU without tariffs", "UK wages were the lowest in the world", "The UK used the euro", "There were no taxes in the UK"], "answer": 0, "exp": "Being inside a trading bloc lets foreign investors sell to all members tariff-free.", "rw": "Nissan’s plant in Sunderland became one of the UK’s biggest car factories, exporting much of its output to Europe."},
  {"id": "mu13", "concept": "MONU", "level": "SL", "type": "order", "q": "Put the steps by which a single currency increases trade between members in order.", "items": ["Exchange rate risk between members disappears", "Firms no longer pay currency conversion costs", "Trading across borders becomes cheaper and simpler", "Trade between member countries rises"], "exp": "Removing currency costs and risks lowers the cost of cross-border trade.", "rw": "Studies of the euro suggest it raised trade between members, though estimates of how much vary."},
  {"id": "mu14", "concept": "MONU", "level": "SL", "type": "mc", "q": "Why might a monetary union like the eurozone need money transferred between member governments?", "options": ["To support members hit by shocks, since they cannot use their own monetary policy", "To pay tariffs to each other", "To fix the euro to the dollar", "To ban imports"], "answer": 0, "exp": "Without their own currency and interest rates, struggling members need other support, such as fiscal transfers.", "rw": "The EU’s NextGenerationEU recovery fund after COVID-19 transferred money to the hardest-hit members."},
  {"id": "mu15", "concept": "MONU", "level": "SL", "type": "mc", "q": "ASEAN has a free trade area but no single currency. Which is a likely reason?", "options": ["Members’ incomes and economic cycles differ widely", "ASEAN members don’t trade with each other", "ASEAN already has a single currency", "Currencies are banned in ASEAN"], "answer": 0, "exp": "A single currency works best when members have similar economies; ASEAN ranges from Singapore to Myanmar.", "rw": "After the eurozone crisis, ASEAN leaders showed little interest in a shared currency."},
