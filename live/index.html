  {"id": "xf1", "concept": "FXFL", "level": "SL", "type": "mc", "q": "The Thai baht has floated since July 1997, with some management by the Bank of Thailand. In a floating system, a currency’s value is set by…", "options": ["Demand for and supply of the currency on the foreign exchange market", "The government announcing a rate", "The government’s budget", "The price of gold"], "answer": 0, "exp": "Like any price, a floating exchange rate moves to where demand for the currency equals supply.", "rw": "Exchange rates can change every second as banks and traders buy and sell currencies."},
  {"id": "xf2", "concept": "FXFL", "level": "SL", "type": "diagram-options", "q": "More Chinese tourists visit Thailand. Which diagram shows the effect on the market for baht?", "optionDiagrams": ["fxDRight", "fxDLeft", "fxSRight", "fxSLeft"], "answer": 0, "exp": "Tourists must buy baht to spend in Thailand, so demand for baht shifts right and the baht appreciates.", "rw": "China has long been one of Thailand’s biggest sources of tourists.", "time": 1.25},
  {"id": "xf3", "concept": "FXFL", "level": "SL", "type": "diagram-options", "q": "Thai firms import more oil, which is paid for in US dollars. Which diagram shows the effect on the market for baht?", "optionDiagrams": ["fxSRight", "fxSLeft", "fxDRight", "fxDLeft"], "answer": 0, "exp": "To buy dollars, Thai firms sell baht, so the supply of baht shifts right and the baht depreciates.", "rw": "Thailand imports most of its oil, so oil prices have a big effect on demand for dollars.", "time": 1.25, "double": true},
  {"id": "xf4", "concept": "FXFL", "level": "SL", "type": "diagram", "diagram": "fxDRight", "q": "What has happened to the value of the baht in this diagram?", "options": ["It has appreciated from e₁ to e₂", "It has depreciated from e₁ to e₂", "The government has devalued it", "It has not changed"], "answer": 0, "exp": "Higher demand for baht raises its price in dollars: an appreciation.", "rw": "A stronger baht means each baht buys more dollars, so trips abroad become cheaper for Thais.", "time": 1.25},
  {"id": "xf5", "concept": "FXFL", "level": "SL", "type": "mc", "q": "In 2022 the US Federal Reserve raised interest rates much faster than the Bank of Thailand. What happened to the baht against the dollar?", "options": ["It depreciated, as money flowed to the US for higher returns", "It appreciated", "It stayed fixed", "It was revalued"], "answer": 0, "exp": "Higher US interest rates raised demand for dollars and the supply of baht, so the baht fell.", "rw": "The baht weakened to around 38 per dollar in late 2022, its weakest level in many years."},
  {"id": "xf6", "concept": "FXFL", "level": "SL", "type": "mc", "q": "In 2024 the Bank of Japan raised interest rates for the first time in 17 years. Other things equal, what effect should this have on the yen?", "options": ["Make it appreciate", "Make it depreciate", "No effect", "Fix it to the dollar"], "answer": 0, "exp": "Higher interest rates attract foreign savings, raising demand for the yen.", "rw": "Japan had kept interest rates at or below zero for years, which weighed on the yen."},
  {"id": "xf7", "concept": "FXFL", "level": "SL", "type": "mc", "q": "The baht appreciates from 36 baht per US dollar to 33 baht per US dollar. A dollar now buys…", "options": ["Fewer baht", "More baht", "The same number of baht", "No baht"], "answer": 0, "exp": "A stronger baht means each dollar exchanges for fewer baht (33 instead of 36).", "rw": "For American tourists, a stronger baht makes holidays in Thailand more expensive."},
  {"id": "xf8", "concept": "FXFL", "level": "HL", "type": "mc", "q": "The exchange rate is US$1 = ฿35. An American tourist buys a ฿1,400 dinner in Bangkok. How much does it cost in US dollars?", "options": ["$40", "$49,000", "$35", "$14"], "answer": 0, "exp": "฿1,400 ÷ 35 = $40.", "rw": "Card payment apps do this conversion instantly for tourists.", "time": 1.5},
  {"id": "xf9", "concept": "FXFL", "level": "HL", "type": "mc", "q": "The exchange rate moves from US$1 = ฿30 to US$1 = ฿36. By what percentage has the dollar appreciated against the baht?", "options": ["20%", "6%", "16.7%", "36%"], "answer": 0, "exp": "Each dollar now buys 6 more baht: 6 ÷ 30 = 20%.", "rw": "Big moves like this change the price of every import and export between the two countries.", "time": 1.5, "double": true},
  {"id": "xf10", "concept": "FXFL", "level": "HL", "type": "mc", "q": "If US$1 = ฿36, what is the value of ฿1 in US dollars?", "options": ["About $0.028 (2.8 cents)", "$36", "$0.36", "$1.36"], "answer": 0, "exp": "Take the reciprocal: 1 ÷ 36 ≈ 0.028.", "rw": "Exchange rates can be quoted either way round, so always check which currency comes first.", "time": 1.5},
  {"id": "xf11", "concept": "FXFL", "level": "SL", "type": "mc", "q": "In 1992, speculators led by George Soros expected the British pound to fall and sold huge amounts of it. What effect does such selling have?", "options": ["The supply of pounds rises, pushing the pound down further", "Demand for pounds rises", "The pound appreciates", "Nothing happens"], "answer": 0, "exp": "Speculative selling increases supply of the currency, which can make the expected fall happen.", "rw": "On “Black Wednesday”, the UK was forced to leave the European Exchange Rate Mechanism, and the pound fell sharply."},
  {"id": "xf12", "concept": "FXFL", "level": "SL", "type": "order", "q": "Inflation in Thailand rises faster than in its trading partners. Put the effects on the baht in order.", "items": ["Thai goods become relatively more expensive abroad", "Foreign demand for Thai exports falls", "Demand for baht falls", "The baht depreciates"], "exp": "Relatively high inflation makes exports less competitive, lowering demand for the currency.", "rw": "Countries with persistently high inflation, such as Argentina and Turkey, have seen their currencies fall sharply."},
  {"id": "xf13", "concept": "FXFL", "level": "SL", "type": "mc", "q": "Which of these increases the SUPPLY of baht on the foreign exchange market?", "options": ["Thai firms building factories in Vietnam", "Foreign tourists visiting Phuket", "Japanese firms building car plants in Thailand", "Foreign students paying fees to Thai universities"], "answer": 0, "exp": "Investing abroad means selling baht to buy foreign currency. The others create demand for baht.", "rw": "Thai firms such as SCG and CP Group have invested heavily in neighbouring countries."},
  {"id": "xf14", "concept": "FXFL", "level": "SL", "type": "diagram", "diagram": "fxSLeft", "q": "Which event could cause this change in the market for baht?", "options": ["Thai households cut their spending on imported goods", "Thai firms buy more foreign machinery", "Thai investors buy more US shares", "Thais travel abroad more"], "answer": 0, "exp": "Less spending on imports means fewer baht sold, so supply shifts left and the baht appreciates.", "rw": "When Thais travelled abroad less during COVID-19, fewer baht were sold for foreign currency.", "time": 1.25},
  {"id": "xf15", "concept": "FXFL", "level": "SL", "type": "order", "q": "The Bank of Thailand raises interest rates and foreign investors buy Thai government bonds. Put the effects in order.", "items": ["Thai bonds now offer a higher return", "Foreign investors buy baht to purchase the bonds", "Demand for baht shifts right", "The baht appreciates"], "exp": "Higher interest rates attract “hot money”, raising demand for the currency.", "rw": "Central bank decisions in Bangkok and Washington are watched closely by currency traders."},
  {"id": "xe1", "concept": "FXEF", "level": "SL", "type": "mc", "q": "The Japanese yen weakened sharply between 2022 and 2024. What happened to tourism to Japan?", "options": ["It boomed, as Japan became cheaper for foreign visitors", "It fell, as Japan became more expensive", "It was unaffected", "Only Japanese tourists benefited"], "answer": 0, "exp": "A weaker yen means foreign currencies buy more yen, making Japanese hotels, food and shopping cheaper.", "rw": "Japan welcomed a record number of foreign visitors in 2024, many from Thailand and elsewhere in Asia."},
  {"id": "xe2", "concept": "FXEF", "level": "SL", "type": "mc", "q": "The baht depreciates. What happens to the price of Thai rice in US dollars?", "options": ["It falls, making Thai rice more competitive abroad", "It rises", "It stays the same", "It doubles"], "answer": 0, "exp": "Each dollar buys more baht, so the same baht price is fewer dollars for foreign buyers.", "rw": "Thai rice competes with rice from Vietnam and India, so exchange rates matter a lot to exporters."},
  {"id": "xe3", "concept": "FXEF", "level": "SL", "type": "mc", "q": "The British pound fell sharply after the 2016 Brexit vote. Why did UK inflation rise in the following year?", "options": ["Imported goods became more expensive in pounds", "Exports became more expensive", "Interest rates were raised sharply", "Wages fell"], "answer": 0, "exp": "A weaker pound raised the price of imports, from food to fuel, pushing up inflation.", "rw": "UK inflation rose to around 3% in 2017, partly because of the weaker pound."},
  {"id": "xe4", "concept": "FXEF", "level": "SL", "type": "mc", "q": "A stronger baht is likely to…", "options": ["Lower the cost of imported raw materials for Thai firms", "Make Thai exports cheaper abroad", "Raise import prices", "Increase tourism to Thailand"], "answer": 0, "exp": "An appreciation makes imports cheaper in baht, including the oil and components firms buy.", "rw": "Thai electronics makers that import components benefit when the baht is strong."},
  {"id": "xe5", "concept": "FXEF", "level": "SL", "type": "mc", "q": "Who is most likely to GAIN from a depreciation of the baht?", "options": ["Thai exporters, such as rice and car exporters", "Thai students studying abroad", "Thai firms buying imported machinery", "Thai tourists visiting Japan"], "answer": 0, "exp": "Exporters earn foreign currency that converts into more baht, and their goods become cheaper abroad.", "rw": "Thai exporters often call for a weaker baht when it rises strongly."},
  {"id": "xe6", "concept": "FXEF", "level": "SL", "type": "mc", "q": "Who is most likely to LOSE from a depreciation of the baht?", "options": ["Thai households buying imported goods", "Thai exporters", "Hotels in Phuket", "Foreign tourists in Thailand"], "answer": 0, "exp": "Imports cost more in baht, so households pay more for imported goods.", "rw": "A weaker baht raises the cost of imported products such as iPhones and fuel."},
  {"id": "xe7", "concept": "FXEF", "level": "SL", "type": "mc", "q": "How might a depreciation affect unemployment in an export-led economy such as Thailand?", "options": ["It may reduce unemployment, as demand for exports rises", "It always raises unemployment", "It has no effect", "It removes all unemployment"], "answer": 0, "exp": "Higher export demand raises output, so firms in export industries hire more workers.", "rw": "Factories in Thailand’s Eastern Economic Corridor depend heavily on export orders."},
  {"id": "xe8", "concept": "FXEF", "level": "SL", "type": "mc", "q": "In the 1997 Asian financial crisis, many Thai firms that had borrowed in US dollars went bankrupt when the baht collapsed. Why?", "options": ["Their dollar debts became far more expensive to repay in baht", "Their debts disappeared", "Interest rates fell to zero", "Their exports stopped"], "answer": 0, "exp": "Debts in foreign currency grow in local-currency terms when the local currency falls.", "rw": "The baht lost about half its value against the dollar within months in 1997."},
  {"id": "xe9", "concept": "FXEF", "level": "SL", "type": "order", "q": "The baht depreciates. Put the long-run effects on Thailand’s current account in order.", "items": ["Thai exports become cheaper abroad and imports become dearer in Thailand", "Export volumes rise and import volumes fall", "Net exports increase", "The current account balance improves"], "exp": "Cheaper exports and dearer imports raise net exports, if demand is elastic enough.", "rw": "Exporters’ groups often point to exchange rates when explaining changes in Thailand’s trade figures."},
  {"id": "xe10", "concept": "FXEF", "level": "HL", "type": "mc", "q": "According to the Marshall–Lerner condition, a depreciation improves the current account only if…", "options": ["PEDx + PEDm > 1", "PEDx + PEDm < 1", "PEDx = PEDm", "PEDx + PEDm = 0"], "answer": 0, "exp": "Demand for exports and imports must be elastic enough for volumes to change more than prices.", "rw": "Economists estimate these elasticities to predict how a currency fall will affect trade.", "double": true},
  {"id": "xe11", "concept": "FXEF", "level": "HL", "type": "diagram", "diagram": "jcurve", "q": "This diagram shows a country’s current account balance after a depreciation. Why does it get worse at first?", "options": ["In the short run, demand for exports and imports is price inelastic", "Exports become more expensive", "Imports become cheaper", "Interest rates rise"], "answer": 0, "exp": "Contracts are already fixed and buyers take time to switch, so volumes barely change while import prices rise.", "rw": "Economists looked for a J-curve in the UK’s trade figures after the pound fell in 2016.", "time": 1.25},
  {"id": "xe12", "concept": "FXEF", "level": "HL", "type": "mc", "q": "The J-curve suggests that after a depreciation, the current account…", "options": ["Worsens at first, then improves", "Improves at first, then worsens", "Improves immediately and permanently", "Never changes"], "answer": 0, "exp": "Demand becomes more price elastic over time, so the Marshall–Lerner condition is eventually met.", "rw": "Policymakers warn that the trade benefits of a weaker currency can take a year or more to appear."},
  {"id": "xe13", "concept": "FXEF", "level": "HL", "type": "mc", "q": "A Thai factory imports a machine priced at US$10,000. The exchange rate moves from ฿33 to ฿36 per dollar. How much more does the machine cost in baht?", "options": ["฿30,000 more", "฿3,000 more", "฿360,000 more", "No change"], "answer": 0, "exp": "Before: 10,000 × 33 = ฿330,000. After: 10,000 × 36 = ฿360,000. Difference: ฿30,000.", "rw": "Thai firms often “hedge” currency risk by agreeing exchange rates with banks in advance.", "time": 1.5},
  {"id": "xe14", "concept": "FXEF", "level": "SL", "type": "mc", "q": "The Swiss franc rose sharply after January 2015. What was a likely effect on Switzerland’s economy?", "options": ["Exporters struggled and inflation fell", "Exports boomed", "Inflation rose sharply", "Imports became more expensive"], "answer": 0, "exp": "A much stronger franc made Swiss exports dearer abroad and imports cheaper at home.", "rw": "Swiss watchmakers and tourism businesses complained of lost sales, and Swiss prices fell for a period."},
  {"id": "xe15", "concept": "FXEF", "level": "SL", "type": "order", "q": "The baht appreciates strongly. Put the possible effects on inflation in Thailand in order.", "items": ["Imported goods and raw materials become cheaper in baht", "Firms’ costs of production fall", "Firms pass on lower costs in their prices", "Inflation in Thailand falls"], "exp": "An appreciation can lower inflation by cutting the cost of imports.", "rw": "Central banks watch the exchange rate when forecasting inflation."},
  {"id": "xs1", "concept": "FXSY", "level": "SL", "type": "mc", "q": "The Hong Kong dollar has been pegged to the US dollar since 1983, within a narrow band. This is an example of…", "options": ["A fixed exchange rate system", "A freely floating system", "A monetary union", "A managed float with no target"], "answer": 0, "exp": "The Hong Kong Monetary Authority keeps the HK dollar within 7.75–7.85 per US dollar.", "rw": "The peg has survived several crises, including 1997 and 2008."},
  {"id": "xs2", "concept": "FXSY", "level": "SL", "type": "mc", "q": "Before July 1997, the baht was kept stable against a basket dominated by the US dollar. When speculators sold baht, how did the Bank of Thailand try to defend it?", "options": ["It bought baht using its foreign currency reserves", "It printed more baht", "It sold more baht", "It cut interest rates to zero"], "answer": 0, "exp": "Buying baht raises demand for it, holding up its value, but this uses up reserves.", "rw": "Thailand spent most of its usable reserves defending the baht in 1997."},
  {"id": "xs3", "concept": "FXSY", "level": "SL", "type": "mc", "q": "In July 1997, Thailand ran low on reserves and let the baht float. What happened next?", "options": ["The baht lost a large share of its value against the dollar", "The baht appreciated strongly", "Nothing changed", "Thailand adopted the US dollar"], "answer": 0, "exp": "Once the central bank stopped buying baht, its value fell to where demand met supply, far below the old rate.", "rw": "The baht’s collapse sparked the Asian financial crisis, which spread to Indonesia, Malaysia and South Korea."},
  {"id": "xs4", "concept": "FXSY", "level": "SL", "type": "diagram", "diagram": "fxPeg", "q": "Demand for baht has fallen from D₁ to D₂, but the government wants to keep the exchange rate at the peg. What must the central bank do?", "options": ["Buy baht with its foreign currency reserves", "Sell baht", "Cut interest rates", "Do nothing"], "answer": 0, "exp": "At the peg there is now excess supply of baht; the central bank must buy it up, shifting demand back to D₁.", "rw": "This is exactly what the Bank of Thailand did before it ran out of reserves in 1997.", "time": 1.25, "double": true},
  {"id": "xs5", "concept": "FXSY", "level": "SL", "type": "mc", "q": "In August 2015 China’s central bank cut the yuan’s official reference rate by about 2%. A deliberate cut in the value of a fixed or managed currency is called…", "options": ["Devaluation", "Depreciation", "Revaluation", "Appreciation"], "answer": 0, "exp": "Devaluation is a government decision; depreciation is a market-driven fall.", "rw": "The surprise move unsettled world financial markets for several weeks."},
  {"id": "xs6", "concept": "FXSY", "level": "SL", "type": "mc", "q": "The Japanese yen fell against the dollar in 2022 because of market forces, not a government decision. This fall is called…", "options": ["Depreciation", "Devaluation", "Revaluation", "Deflation"], "answer": 0, "exp": "A fall in a floating currency caused by demand and supply is a depreciation.", "rw": "Japan’s finance ministry did intervene in 2022 to slow the yen’s fall, but it mostly floats."},
  {"id": "xs7", "concept": "FXSY", "level": "SL", "type": "mc", "q": "Which is an advantage of a fixed exchange rate, such as Hong Kong’s peg to the dollar?", "options": ["Certainty for traders and investors", "The central bank can set interest rates freely", "It never needs foreign reserves", "It automatically removes trade deficits"], "answer": 0, "exp": "Firms know what the exchange rate will be, making trade and investment planning easier.", "rw": "The stable HK dollar is one reason Hong Kong became a major financial centre."},
  {"id": "xs8", "concept": "FXSY", "level": "SL", "type": "mc", "q": "Hong Kong’s interest rates tend to follow those set by the US Federal Reserve. Why?", "options": ["Keeping the peg means giving up independent monetary policy", "Hong Kong uses the US dollar", "The IMF requires it", "It has no central bank of any kind"], "answer": 0, "exp": "If Hong Kong set very different rates, money would flow in or out and threaten the peg.", "rw": "When the Fed raised rates in 2022, Hong Kong’s rates rose too."},
  {"id": "xs9", "concept": "FXSY", "level": "SL", "type": "mc", "q": "The Bank of Thailand runs a managed float. What does this mean?", "options": ["The baht mostly floats, but the central bank intervenes to smooth sharp swings", "The rate is fixed by law", "The baht has no value", "The rate is set by the IMF"], "answer": 0, "exp": "A managed float lets the market set the rate while the central bank limits excessive volatility.", "rw": "Many emerging economies, including India and Indonesia, also manage their floating currencies."},
  {"id": "xs10", "concept": "FXSY", "level": "SL", "type": "mc", "q": "In January 2015 the Swiss National Bank suddenly stopped capping the franc against the euro. What happened?", "options": ["The franc jumped sharply in value", "The franc collapsed", "Switzerland joined the euro", "The franc was fixed to the dollar"], "answer": 0, "exp": "Without the central bank selling francs to hold it down, strong demand pushed the franc up immediately.", "rw": "The franc rose by around 20–30% against the euro within minutes, shocking financial markets."},
  {"id": "xs11", "concept": "FXSY", "level": "SL", "type": "mc", "q": "How can a central bank raise its currency’s value without spending reserves?", "options": ["Raise interest rates to attract foreign savings", "Cut interest rates", "Print more money", "Lower taxes"], "answer": 0, "exp": "Higher interest rates raise demand for the currency from foreign investors.", "rw": "Some central banks raised rates sharply in 2022 to support their currencies against the strong dollar."},
  {"id": "xs12", "concept": "FXSY", "level": "SL", "type": "order", "q": "Put the steps of a central bank defending its currency under attack in order.", "items": ["Speculators sell the currency, pushing it below its target", "The central bank buys its own currency with foreign reserves", "It may also raise interest rates to attract capital", "If reserves run out, it may be forced to devalue or float"], "exp": "Defending a peg costs reserves; when they run low, the peg can break.", "rw": "This sequence played out in the UK in 1992 and in Thailand in 1997."},
  {"id": "xs13", "concept": "FXSY", "level": "SL", "type": "mc", "q": "Saudi Arabia pegs the riyal to the US dollar. Why might a major oil exporter choose this?", "options": ["Oil is priced in dollars, so the peg keeps export revenue stable in riyals", "To make oil cheaper", "To join the eurozone", "To set interest rates independently"], "answer": 0, "exp": "With oil sold in dollars, a dollar peg reduces uncertainty for the government and businesses.", "rw": "The riyal has been fixed at 3.75 per US dollar since the 1980s."},
  {"id": "xs14", "concept": "FXSY", "level": "SL", "type": "mc", "q": "Which sign suggests a currency is overvalued under a fixed exchange rate?", "options": ["Persistent current account deficits and falling foreign reserves", "Large current account surpluses", "Rising foreign reserves", "Strong export growth"], "answer": 0, "exp": "An overvalued peg makes exports uncompetitive, and the central bank must spend reserves to defend it.", "rw": "Thailand showed both warning signs in the months before the 1997 crisis."},
  {"id": "xs15", "concept": "FXSY", "level": "SL", "type": "order", "q": "Order these exchange rate systems from least to most central bank intervention.", "items": ["Freely floating", "Managed float", "Fixed (pegged) exchange rate"], "exp": "A free float has no intervention; a managed float has some; a peg needs constant management.", "rw": "The US dollar floats freely, the baht is a managed float, and the HK dollar is pegged."},
  {"id": "bs1", "concept": "BOPS", "level": "SL", "type": "mc", "q": "Thailand earns money from foreign tourists staying in Phuket. Where is this recorded in Thailand’s balance of payments?", "options": ["Current account: exports of services", "Capital account", "Financial account: direct investment", "Current account: primary income"], "answer": 0, "exp": "Tourists buying Thai hotel stays and meals are buying Thai services: a service export.", "rw": "Tourism has been one of Thailand’s biggest sources of foreign currency."},
  {"id": "bs2", "concept": "BOPS", "level": "SL", "type": "mc", "q": "Filipino workers abroad send money home to their families. In the Philippines’ balance of payments, this is…", "options": ["Secondary income (current transfers) in the current account", "Financial account: portfolio investment", "Capital account", "Exports of goods"], "answer": 0, "exp": "Remittances are transfers, with nothing given in return, so they count as secondary income.", "rw": "Remittances from Filipinos working overseas are worth close to a tenth of the Philippines’ GDP."},
  {"id": "bs3", "concept": "BOPS", "level": "SL", "type": "mc", "q": "Toyota builds a new factory in Thailand. In Thailand’s balance of payments, this is…", "options": ["Financial account: foreign direct investment (an inflow)", "Current account: exports of goods", "Capital account", "Secondary income"], "answer": 0, "exp": "Buying or building productive assets abroad is direct investment, recorded in the financial account.", "rw": "Japanese firms have long been among the largest foreign direct investors in Thailand."},
  {"id": "bs4", "concept": "BOPS", "level": "SL", "type": "mc", "q": "Profits that a Japanese-owned car plant in Thailand sends back to Japan appear in Thailand’s balance of payments as…", "options": ["Primary income (an outflow) in the current account", "Exports of services", "The capital account", "The financial account"], "answer": 0, "exp": "Profits, interest and dividends paid to foreign owners are primary income outflows.", "rw": "Countries with lots of foreign-owned firms often have large primary income outflows."},
  {"id": "bs5", "concept": "BOPS", "level": "SL", "type": "mc", "q": "A Thai investor buys shares in Apple. In Thailand’s balance of payments, this is…", "options": ["Financial account: portfolio investment (an outflow)", "Current account: imports of goods", "Capital account", "Primary income"], "answer": 0, "exp": "Buying foreign shares without control of the firm is portfolio investment in the financial account.", "rw": "Thai investors increasingly buy US shares through online trading apps."},
  {"id": "bs6", "concept": "BOPS", "level": "SL", "type": "mc", "q": "Which of these is recorded in the capital account?", "options": ["Debt forgiveness and the sale of non-produced assets such as patents", "Exports of rice", "Remittances from workers abroad", "Purchases of foreign shares"], "answer": 0, "exp": "The capital account is small: capital transfers and non-produced, non-financial assets.", "rw": "When rich countries cancel debts owed by poor countries, it is recorded as a capital transfer."},
  {"id": "bs7", "concept": "BOPS", "level": "SL", "type": "order", "q": "Put the steps for calculating a current account balance in order.", "items": ["Find the balance of trade in goods (exports − imports)", "Add the balance of trade in services", "Add net primary income", "Add net secondary income"], "exp": "Current account = goods balance + services balance + net primary income + net secondary income.", "rw": "Central banks, such as the Bank of Thailand, publish these figures every month."},
  {"id": "bs8", "concept": "BOPS", "level": "HL", "type": "mc", "q": "A country has goods exports of $200bn and goods imports of $230bn. Its services balance is +$40bn, net primary income is −$15bn and net secondary income is +$10bn. What is its current account balance?", "options": ["+$5bn", "−$30bn", "+$25bn", "−$5bn"], "answer": 0, "exp": "(200 − 230) + 40 − 15 + 10 = +$5bn.", "rw": "A country can run a deficit in goods but a surplus overall, thanks to services such as tourism.", "time": 1.5, "double": true},
  {"id": "bs9", "concept": "BOPS", "level": "SL", "type": "mc", "q": "Why must the balance of payments always balance overall?", "options": ["A current account deficit must be financed by a surplus on the capital and financial accounts", "Governments make it balance by law", "Imports always equal exports", "Central banks print money to balance it"], "answer": 0, "exp": "Every purchase from abroad must be paid for, by earning, borrowing or selling assets, so the accounts sum to zero.", "rw": "In practice, an “errors and omissions” item makes up for imperfect data."},
  {"id": "bs10", "concept": "BOPS", "level": "HL", "type": "mc", "q": "A country has a current account deficit of $12bn and a capital account surplus of $2bn. Ignoring errors and omissions, what is its financial account balance?", "options": ["+$10bn (a surplus)", "−$10bn (a deficit)", "+$14bn", "−$14bn"], "answer": 0, "exp": "Current + capital + financial = 0, so −12 + 2 + financial = 0, giving financial = +$10bn.", "rw": "Countries with current account deficits rely on foreign investment or borrowing to fill the gap.", "time": 1.5},
  {"id": "bs11", "concept": "BOPS", "level": "SL", "type": "mc", "q": "Which is a debit (an outflow) in Thailand’s current account?", "options": ["Thai tourists spending money in Japan", "Foreign tourists visiting Chiang Mai", "Rice exports to China", "Money sent home by Thai workers abroad"], "answer": 0, "exp": "Thais travelling abroad buy foreign services, which is an import.", "rw": "Japan is one of the most popular overseas destinations for Thai tourists."},
  {"id": "bs12", "concept": "BOPS", "level": "SL", "type": "mc", "q": "Changes in the Bank of Thailand’s foreign currency reserves are recorded in…", "options": ["The financial account (reserve assets)", "The current account", "The capital account", "Primary income"], "answer": 0, "exp": "Reserves are financial assets held by the central bank, so changes in them sit in the financial account.", "rw": "Thailand built up large reserves after 1997 to protect against future crises."},
  {"id": "bs13", "concept": "BOPS", "level": "SL", "type": "mc", "q": "A country records a “trade in goods deficit”. This means…", "options": ["Imports of goods are greater than exports of goods", "Exports of goods are greater than imports of goods", "The current account must be in surplus", "The capital account is in deficit"], "answer": 0, "exp": "The goods balance compares exports and imports of physical goods only.", "rw": "The US has run a large trade in goods deficit for decades."},
  {"id": "bs14", "concept": "BOPS", "level": "SL", "type": "mc", "q": "A Bangkok hospital treats a patient who flies in from the Middle East. In Thailand’s balance of payments this is…", "options": ["An export of services", "An import of services", "A capital transfer", "Direct investment"], "answer": 0, "exp": "A foreign resident buying a Thai service is a service export, even though it happens in Thailand.", "rw": "Thailand is one of the world’s leading destinations for medical tourism."},
  {"id": "bs15", "concept": "BOPS", "level": "SL", "type": "order", "q": "Put the three accounts of the balance of payments in order, starting with the one that records everyday trade.", "items": ["Current account: trade in goods and services, and income", "Capital account: capital transfers and non-produced assets", "Financial account: investment flows and reserves"], "exp": "The current account records trade and income; the capital and financial accounts record asset and investment flows.", "rw": "IB exam questions often ask you to place a transaction in the correct account."},

function chMouth(type, x, y, w = 6){
  const s = `stroke="${CO}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"`;
  switch (type) {
    case 'smile': return `<path d="M${x - w} ${y}q${w} ${w * 1.1} ${w * 2} 0" fill="none" ${s}/>`;
    case 'grin':  return `<path d="M${x - w} ${y}q${w} ${w * 1.7} ${w * 2} 0z" fill="#7a1f3d" ${s}/><path d="M${x - w * .45} ${y + w * .55}q${w * .45} ${-w * .35} ${w * .9} 0" fill="#ff7a93"/>`;
    case 'o':     return `<ellipse cx="${x}" cy="${y + 2}" rx="${w * .45}" ry="${w * .6}" fill="#7a1f3d" ${s}/>`;
    case 'frown': return `<path d="M${x - w} ${y + w * .7}q${w} ${-w * 1.1} ${w * 2} 0" fill="none" ${s}/>`;
    case 'flat':  return `<path d="M${x - w} ${y + 1}h${w * 2}" ${s}/>`;
    case 'smirk': return `<path d="M${x - w} ${y + 1}q${w * 1.3} ${w * .7} ${w * 2} ${-w * .6}" fill="none" ${s}/>`;
    case 'wavy':  return `<path d="M${x - w} ${y + 2}q${w * .5} -3 ${w} 0t${w} 0" fill="none" ${s}/>`;
    case 'tongue':return `<path d="M${x - w} ${y}q${w} ${w * 1.2} ${w * 2} 0" fill="none" ${s}/><path d="M${x + w * .1} ${y + w * .5}q${w * .35} ${w * 1.1} ${w * .8} ${w * .1}" fill="#ff7a93" ${s} stroke-width="2.4"/>`;
  }
}

  (d.dots||[]).forEach(p => {
    if (p.yl !== undefined) s += `<path class="guide" d="M66 ${Y(p.y)}H${X(p.x)}"/><text x="60" y="${Y(p.y)+6}" text-anchor="end">${lbl(p.yl)}</text>`;
    if (p.xl !== undefined) s += `<path class="guide" d="M${X(p.x)} ${Y(p.y)}V230"/><text x="${X(p.x)}" y="256" text-anchor="middle">${lbl(p.xl)}</text>`;
  });
  (d.hlines||[]).forEach(h => s += `<line class="ln pc" x1="66" y1="${Y(h.y)}" x2="${X(9.4)}" y2="${Y(h.y)}"/><text class="pc" x="60" y="${Y(h.y)+6}" text-anchor="end">${lbl(h.label)}</text>`);
  const label = (l, ax, ay, bx, by) => {
    if (!l.label) return '';
    const [tx, ty] = l.lp ? [X(l.lp[0]), Y(l.lp[1])] : [X(bx)+7, Y(by) + (by > ay ? 4 : 16)];
    return `<text class="${l.k}${l.old?' old':''}" x="${tx}" y="${ty}"${l.alt?' style="fill:#7aa8ff"':''}>${lbl(l.label)}</text>`;
  };
  (d.lines||[]).forEach(l => {
    const cls = `${l.k}${l.old?' old':''}`;
    s += `<line class="ln ${cls}" x1="${X(l.a[0])}" y1="${Y(l.a[1])}" x2="${X(l.b[0])}" y2="${Y(l.b[1])}"${l.dash?' stroke-dasharray="7 6"':''}${l.alt?' style="stroke:#7aa8ff"':''}/>`;
    s += label(l, l.a[0], l.a[1], l.b[0], l.b[1]);
  });
  (d.curves||[]).forEach(c => {
    const pts = []; for (let i = 0; i <= 48; i++) { const x = c.x0 + (c.x1 - c.x0) * i / 48; pts.push(X(x).toFixed(1) + ' ' + Y(c.f(x)).toFixed(1)); }
    s += `<path class="ln ${c.k}" d="M${pts.join('L')}"/>` + label(c, c.x0, c.f(c.x0), c.x1, c.f(c.x1));
  });
  (d.texts||[]).forEach(t => s += `<text class="${t.k||''}" x="${X(t.x)}" y="${Y(t.y)+6}" text-anchor="${t.anchor||'start'}">${lbl(t.t)}</text>`);
  areas.filter(a => a.l).forEach(a => s += `<text class="al" x="${X(a.at[0])}" y="${Y(a.at[1])+8}" text-anchor="middle">${a.l}</text>`);
  (d.dots||[]).forEach(p => s += `<circle class="dot" cx="${X(p.x)}" cy="${Y(p.y)}" r="5.5"/>`);
  if (d.arrow) {
    const [[x1,y1],[x2,y2]] = d.arrow; const ax = X(x1), ay = Y(y1), bx = X(x2), by = Y(y2);
    const ang = Math.atan2(by - ay, bx - ax), h = 11;
    const p1 = [bx - h*Math.cos(ang - .5), by - h*Math.sin(ang - .5)], p2 = [bx - h*Math.cos(ang + .5), by - h*Math.sin(ang + .5)];
    s += `<line class="arr" x1="${ax}" y1="${ay}" x2="${bx - 5*Math.cos(ang)}" y2="${by - 5*Math.sin(ang)}"/><path class="arrh" d="M${bx} ${by}L${p1}L${p2}z"/>`;
  }
  return s + '</svg>';
}

   NETWORK — live games through Firebase.
   Students open the page normally; the teacher adds ?host to the address.
   ?net=local swaps Firebase for a stand-in that links browser tabs (for testing).

/* ---------- Automatic updates ----------
   APP_VERSION must match live/version.json; bump both every time the game is published. */
const APP_VERSION = '2026-11-12c';
let NEW_VERSION = null;
async function checkVersion(){
  if (location.protocol === 'file:') return;
  try {
    const r = await fetch('version.json?t=' + Date.now(), {cache:'no-store'}); if (!r.ok) return;
    const v = (await r.json()).version;
    if (v && v !== APP_VERSION) { NEW_VERSION = v; maybeUpdate(); }
  } catch (e) { /* offline or blocked: just keep going */ }
}
/* Only reload when nobody would lose anything: the host on the setup screen, or a student who hasn't joined a game. */
const safeToReload = () => ROLE === 'host' ? S.phase === 'setup' : !SS.joined;
function maybeUpdate(){
  if (!NEW_VERSION) return;
  if (safeToReload()) {
    try { if (sessionStorage.getItem('erl-upd') === NEW_VERSION) return; sessionStorage.setItem('erl-upd', NEW_VERSION); } catch (e) {}
    const u = new URL(location.href); u.searchParams.set('v', NEW_VERSION); location.replace(u.toString());
  } else if (!document.getElementById('updBanner')) {
    const d = document.createElement('div'); d.id = 'updBanner'; d.className = 'upd-banner';
    d.innerHTML = `<span>A new version of the game is ready. It will update after this game.</span><button data-act="updateNow">Update now</button>`;
    document.body.appendChild(d);
  }
}
const PARAMS = new URLSearchParams(location.search);
const ROLE = PARAMS.has('host') ? 'host' : 'student';
const LOCAL_NET = PARAMS.get('net') === 'local';
const FB_VERSION = '10.12.2';
const liveAvailable = () => LOCAL_NET || !!window.FIREBASE_CONFIG;
const clean = o => JSON.parse(JSON.stringify(o));
const pageUrl = () => location.href.split('#')[0].split('?')[0];
const studentUrl = () => pageUrl() + (LOCAL_NET ? '?net=local' : '');
const hostUrl = () => pageUrl() + '?host' + (LOCAL_NET ? '&net=local' : '');
let NET = null, netPromise = null;
function getNet(){
  if (!netPromise) netPromise = (LOCAL_NET ? Promise.resolve(makeLocalNet()) : makeFirebaseNet(window.FIREBASE_CONFIG))
    .then(n => (NET = n)).catch(err => { netPromise = null; throw err; });
  return netPromise;
}
async function makeFirebaseNet(cfg){
  if (!cfg) throw new Error('not-configured');
  const base = `https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
  let app, auth, db;
  try { [app, auth, db] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-database.js')]); }
  catch (e) { throw new Error('offline'); }
  const fa = app.initializeApp(cfg);
  const cred = await auth.signInAnonymously(auth.getAuth(fa));
  const d = db.getDatabase(fa); const r = path => db.ref(d, path);
  return { uid: cred.user.uid,
    set: (path, v) => db.set(r(path), v), update: (path, o) => db.update(r(path), o), remove: path => db.remove(r(path)),
    get: async path => (await db.get(r(path))).val(),
    on: (path, cb) => db.onValue(r(path), snap => cb(snap.val())) };
}
function makeLocalNet(){
  const KEY = 'erl-localdb', listeners = new Set();
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
  const parts = path => path.split('/').filter(Boolean);
  const getAt = (db, path) => parts(path).reduce((o, k) => (o == null || o[k] === undefined) ? null : o[k], db);
  const setAt = (db, path, v) => { const ks = parts(path); let o = db;
    for (let i = 0; i < ks.length - 1; i++) { if (typeof o[ks[i]] !== 'object' || o[ks[i]] === null) o[ks[i]] = {}; o = o[ks[i]]; }
    if (v === null || v === undefined) delete o[ks[ks.length-1]]; else o[ks[ks.length-1]] = clean(v); };
  const notify = () => { const db = load(); listeners.forEach(l => { const v = getAt(db, l.path), j = JSON.stringify(v); if (j !== l.last) { l.last = j; l.cb(v === null ? null : JSON.parse(j)); } }); };
  window.addEventListener('storage', e => { if (e.key === KEY) notify(); });
  const write = fn => { const db = load(); fn(db); localStorage.setItem(KEY, JSON.stringify(db)); setTimeout(notify, 0); return Promise.resolve(); };
  let uid = sessionStorage.getItem('erl-uid'); if (!uid) { uid = 'u' + Math.random().toString(36).slice(2, 10); sessionStorage.setItem('erl-uid', uid); }
  return { uid,
    set: (path, v) => write(db => setAt(db, path, v)),
    update: (path, o) => write(db => Object.entries(o).forEach(([k, v]) => setAt(db, path + '/' + k, v))),
    remove: path => write(db => setAt(db, path, null)),
    get: path => Promise.resolve(getAt(load(), path)),
    on: (path, cb) => { const l = {path, cb, last:undefined}; listeners.add(l);
      setTimeout(() => { const v = getAt(load(), path); l.last = JSON.stringify(v); cb(v); }, 0); return () => listeners.delete(l); } };
}
function friendlyNetError(err){
  const m = String((err && (err.code || err.message)) || err);
  if (m === 'not-configured') return 'Live games aren’t connected to Firebase yet (firebase-config.js is missing).';
  if (m === 'offline') return 'Couldn’t reach Firebase. Check your internet connection and try again.';
  if (/operation-not-allowed|admin-restricted/.test(m)) return 'Anonymous sign-in isn’t switched on in Firebase (Authentication → Sign-in method → Anonymous).';
  if (/unauthorized-domain|requests-from-referer|referer/.test(m)) return 'This web address isn’t on Firebase’s list of authorised domains (Authentication → Settings → Authorised domains).';
  if (/permission|PERMISSION_DENIED/i.test(m)) return 'Firebase refused the request. Check that the security rules have been published.';
  if (/network-request-failed/.test(m)) return 'Network problem: couldn’t reach Firebase. Check your connection.';
  return 'Something went wrong connecting to Firebase: ' + m;
}

function vReveal(){

  if (q.type === 'order') {

    const full = rs.filter(r => r.frac === 1).length, partial = rs.filter(r => r.frac > 0 && r.frac < 1).length;

        <div class="stat"><b>${partial}</b><small>partly correct</small></div>
        <div class="stat"><b>${avg.toFixed(1)}/${q.items.length}</b><small>avg. items in place</small></div></div>${why}</div></div></div>`;
  }
  const counts = q.disp.map((_,i) => ps.filter(p => S.answers[p.id] && S.answers[p.id].choice === i).length);
  const max = Math.max(1, ...counts);
  const bars = `<div class="card"><div class="bars">${counts.map((c,i) => `<div class="bcol o${i} ${i===q.correct?'':'lose'}">

    <span class="k">${SHAPES[i]}${i===q.correct?`<svg class="ok" viewBox="0 0 24 24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`:''}</span></div>`).join('')}</div></div>`;
  const side = q.type === 'diagram' ? `<div style="display:flex;flex-direction:column;gap:16px"><div class="diag-card" style="width:100%;max-width:330px">${svgDiagram(q.diagram)}</div></div>` : why;

/* Remember the games this browser creates, so any left behind (crash, closed lid) are deleted next time. */
const MYROOMS = 'erl-myrooms';
const myRooms = () => { try { return JSON.parse(localStorage.getItem(MYROOMS)) || []; } catch (e) { return []; } };
const saveMyRooms = list => { try { localStorage.setItem(MYROOMS, JSON.stringify(list)); } catch (e) {} };
async function cleanLeftoverRooms(net){
  const keep = [];
  for (const pin of myRooms()) {
    if (pin === S.pin) { keep.push(pin); continue; }
    try { await net.remove(`rooms/${pin}`); } catch (e) { /* not ours any more, or already gone */ }
  }
  saveMyRooms(keep);
}
async function openLiveLobby(){
  S.phase = 'lobby'; S.players = []; S.pin = ''; S.netError = ''; S.botTarget = 0; render();
  try {
    const net = await getNet(); let pin;
    await cleanLeftoverRooms(net);
    for (let i = 0; i < 10; i++) { pin = String(100000 + Math.floor(Math.random()*900000)); if (!(await net.get(`rooms/${pin}/host`))) break; }
    await net.set(`rooms/${pin}`, {host:net.uid, created:Date.now(), state:{phase:'lobby', qi:0, total:0, paused:false}});
    S.room = `rooms/${pin}`; S.pin = pin; saveMyRooms([...myRooms(), pin]);
    S.unsubPlayers = net.on(`${S.room}/players`, v => onPlayers(v || {}));
  } catch (err) { S.netError = friendlyNetError(err); }
  render();
}
function onPlayers(v){
  const entries = Object.entries(v).sort((a,b) => (a[1].joinedAt||0) - (b[1].joinedAt||0));
  if (S.phase === 'lobby' && entries.length > MAX_PLAYERS) entries.slice(MAX_PLAYERS).forEach(([id]) => NET.remove(`${S.room}/players/${id}`));
  const old = new Map(S.players.map(p => [p.id, p]));
  S.players = entries.slice(0, MAX_PLAYERS).map(([id, p]) => old.get(id) || {id, name:String(p.name || 'Player').slice(0,15), icon:okIcon(p.icon), score:0, gain:0, prevRank:0});
  if (S.phase === 'lobby') renderHost(); else updateLive();
}
function closeRoom(){
  if (S.unsubPlayers) S.unsubPlayers(); if (S.unsubAns) S.unsubAns();
  S.unsubPlayers = S.unsubAns = null;
  if (S.live && S.room && NET) { const pin = S.pin; NET.remove(S.room).then(() => saveMyRooms(myRooms().filter(p => p !== pin))).catch(() => {}); }
  S.room = null; S.pin = '';
}
/* What students may see: never the answer until the reveal. */
function pubQ(q, withAnswer){
  const o = {id:q.id, concept:q.concept, level:q.level, type:q.type, q:q.q, T:q.T, double:!!q.double};
  if (q.diagram) o.diagram = q.diagram;
  if (q.type === 'order') o.shown = q.shown; else o.disp = q.disp.map(d => d.diagram ? {diagram:d.diagram} : {text:d.text});
  if (withAnswer) { o.exp = q.exp; if (q.rw) o.rw = q.rw; if (q.type === 'order') o.items = q.items; else o.correct = q.correct; }
  return o;
}
let lastPushed = '';
function pushState(){
  if (ROLE !== 'host' || !S.live || !S.room || !NET) return;
  const q = cur(); const st = {phase:S.phase, qi:S.qi, qs:String(S.qi), total:S.questions.length, paused:!!S.paused};
  if (q && S.phase !== 'lobby') st.q = pubQ(q, ['reveal','leaderboard','podium'].includes(S.phase));
  if (S.phase === 'question') st.left = +Math.max(0, q.T - S.elapsed).toFixed(1);
  const j = JSON.stringify(st); if (j === lastPushed) return; lastPushed = j;
  NET.set(`${S.room}/state`, clean(st)).catch(() => {});
}

function addBot(){
  const used = new Set(S.players.map(p => p.name));
  const name = shuffle(BOT_NAMES).find(n => !used.has(n)); if (!name) return;
  S.players.push({id:'b'+Math.random().toString(36).slice(2,8), name, icon:randomIcon(), bot:true, skill:.45 + Math.random()*.47, score:0});
}

/* ---------- Balanced question mix ----------
   Aim for about 50% multiple choice, 30% diagram and 20% ordering (as far as the ticked topics allow),
   spread evenly across the ticked topics, and avoid the same type twice in a row. */
const KIND = q => q.type === 'order' ? 'order' : (q.type === 'mc' ? 'mc' : 'diagram');
const KIND_LABEL = {mc:'multiple choice', diagram:'diagram', order:'ordering'};
function mixTargets(src, n){
  const avail = {mc:0, diagram:0, order:0}; src.forEach(q => avail[KIND(q)]++);
  const want = {order:Math.round(n * .2), diagram:Math.round(n * .3)}; want.mc = n - want.order - want.diagram;
  const t = {}; let spare = 0;
  for (const k of ['order','diagram','mc']) { t[k] = Math.min(want[k], avail[k]); spare += want[k] - t[k]; }
  for (const k of ['mc','diagram','order']) { const add = Math.min(spare, avail[k] - t[k]); t[k] += add; spare -= add; }
  return t;
}
function pickBalanced(src, n){
  n = Math.min(n, src.length);
  const target = mixTargets(src, n);
  const concepts = [...new Set(src.map(q => q.concept))];
  const perConcept = n / concepts.length;
  const left = shuffle(src), picked = [], kCount = {mc:0, diagram:0, order:0}, cCount = {};
  while (picked.length < n && left.length) {
    let best = -1, bestScore = -Infinity;
    left.forEach((q, i) => {
      const k = KIND(q), c = q.concept;
      const typeNeed = (target[k] - kCount[k]) / Math.max(1, target[k]);
      const topicNeed = (perConcept - (cCount[c] || 0)) / perConcept;
      const score = (kCount[k] >= target[k] ? -10 : 0) + typeNeed * 2 + topicNeed + Math.random() * .15;
      if (score > bestScore) { bestScore = score; best = i; }
    });
    const [q] = left.splice(best, 1); picked.push(q); kCount[KIND(q)]++; cCount[q.concept] = (cCount[q.concept] || 0) + 1;
  }
  /* Order them: open with multiple choice if possible, then never repeat a type back-to-back where avoidable. */
  const out = [], rest = shuffle(picked);
  while (rest.length) {
    const last = out.length ? KIND(out[out.length - 1]) : null;
    const counts = {}; rest.forEach(q => counts[KIND(q)] = (counts[KIND(q)] || 0) + 1);
    let options = rest.filter(q => KIND(q) !== last);
    if (!out.length && rest.some(q => KIND(q) === 'mc')) options = rest.filter(q => KIND(q) === 'mc');
    if (!options.length) options = rest;
    const top = Math.max(...options.map(q => counts[KIND(q)]));
    const q = options.find(o => counts[KIND(o)] === top);
    rest.splice(rest.indexOf(q), 1); out.push(q);
  }
  return out;
}
function mixPreview(){
  const src = pool(); const n = Math.min(S.settings.count, src.length); if (!n) return '';
  const t = mixTargets(src, n);
  return ['mc','diagram','order'].filter(k => t[k]).map(k => `<b>${t[k]}</b> ${KIND_LABEL[k]}`).join(' · ');
}
function buildQuestions(){
  const T = S.settings.time;
  return pickBalanced(pool(), S.settings.count).map(src => {
    const q = {...src};
    q.T = T * (q.time || (q.type === 'order' ? 1.5 : 1));
    if (q.type === 'order') {
      let shown; do { shown = shuffle(q.items); } while (shown.every((t,i) => t === q.items[i]));
      q.shown = shown;
    } else {
      const base = q.type === 'diagram-options' ? q.optionDiagrams.map(d => ({diagram:d})) : q.options.map(t => ({text:t}));
      const perm = shuffle(base.map((_,i) => i));
      q.disp = perm.map(i => ({...base[i], orig:i}));
      q.correct = perm.indexOf(q.answer);
    }
    return q;
  });
}

function startGame(){
  S.played = 0; S.confirmEnd = false;
  if (S.live && S.room) { NET.remove(`${S.room}/answers`).catch(() => {}); NET.remove(`${S.room}/scores`).catch(() => {}); }
  S.questions = buildQuestions(); S.qi = 0;
  S.players.forEach(p => { p.score = 0; p.gain = 0; p.prevRank = 0; });
  getReady();
}
function getReady(){ S.phase = 'getready'; S.elapsed = 0; S.paused = false; render(); }

function startQuestion(){
  const q = cur(); S.phase = 'question'; S.elapsed = 0; S.answers = {}; S.results = {}; S.doneAt = null;
  if (q.type === 'order') S.myOrder = [...q.shown];
  S.plan = {};
  if (S.live && S.room) {
    if (S.unsubAns) S.unsubAns();
    const qi = S.qi;
    S.unsubAns = NET.on(`${S.room}/answers/${qi}`, v => {
      if (S.phase !== 'question' || S.qi !== qi) return;
      for (const [id, a] of Object.entries(v || {})) {
        if (S.answers[id] || !S.players.find(p => p.id === id)) continue;
        const ok = q.type === 'order' ? Array.isArray(a.order) && a.order.length === q.items.length : Number.isInteger(a.choice) && a.choice >= 0 && a.choice < 4;
        S.answers[id] = ok ? {...a, time:S.elapsed} : {choice:-1, order:[], time:S.elapsed};
      }
      updateLive();
    });
  }
  S.players.filter(p => p.bot).forEach(b => {
    const skip = Math.random() < .04;
    const p = b.skill * (q.double ? .85 : 1) * (q.level === 'HL' ? .9 : 1);
    let ans;
    if (q.type === 'order') {
      const o = [...q.items];
      if (Math.random() > p) { const k = 1 + Math.floor(Math.random()*2); for (let j = 0; j < k; j++) { const i = Math.floor(Math.random()*(o.length-1)); [o[i],o[i+1]] = [o[i+1],o[i]]; } }
      ans = {order:o};
    } else {
      ans = {choice: Math.random() < p ? q.correct : shuffle([0,1,2,3].filter(i => i !== q.correct))[0]};
    }
    const at = skip ? Infinity : Math.min(q.T - .3, q.T * (.18 + Math.random()*.6) * (1.25 - b.skill*.4));
    S.plan[b.id] = {at, ans};
  });
  render();
}

function scoreFor(q, a){
  if (!a) return {frac:0, pts:0};
  const speed = 1 - .5 * Math.min(a.time, q.T) / q.T;
  const frac = q.type === 'order' ? a.order.filter((t,i) => t === q.items[i]).length / q.items.length : (a.choice === q.correct ? 1 : 0);
  return {frac, pts: frac > 0 ? Math.round(1000 * speed * frac * (q.double ? 2 : 1)) : 0};
}

function reveal(){
  const q = cur(); const before = ranked();
  S.players.forEach(p => { p.prevRank = before.indexOf(p) + 1; const r = scoreFor(q, S.answers[p.id]); S.results[p.id] = r; p.gain = r.pts; p.score += r.pts; });
  S.played = S.qi + 1;
  if (S.live && S.room) {
    if (S.unsubAns) { S.unsubAns(); S.unsubAns = null; }
    const sc = {}; S.players.forEach(p => sc[p.id] = {name:p.name, icon:p.icon, score:p.score, gain:p.gain, frac:S.results[p.id].frac, pts:S.results[p.id].pts});
    NET.set(`${S.room}/scores`, sc).catch(() => {});
  }
  S.phase = 'reveal'; S.paused = false; render();
}

function hostPrimary(){
  if (S.phase === 'setup') openLobby();
  else if (S.phase === 'lobby' && S.players.length) startGame();
  else if (S.phase === 'reveal') { if (S.qi === S.questions.length - 1) { S.phase = 'podium'; render(); } else { S.phase = 'leaderboard'; render(); } }
  else if (S.phase === 'leaderboard') { S.qi++; getReady(); }
}

function answer(a){
  if (S.phase !== 'question' || S.answers.you || S.paused) return;
  if (ROLE === 'student') {
    SS.answered = S.qi; SS.myAns = a; S.answers = {you:a}; renderStudent();
    NET.set(`${SS.room}/answers/${S.qi}/${NET.uid}`, clean(a)).catch(() => {});
    return;
  }
  S.answers.you = {...a, time:S.elapsed}; renderStudent(); updateLive();
}

function removePlayer(id){
  if (S.live && S.room) NET.remove(`${S.room}/players/${id}`).catch(() => {});
  S.players = S.players.filter(p => p.id !== id);
  delete S.answers[id]; delete S.plan[id];
  if (id === 'you') { S.you.joined = false; }
  else if (S.phase === 'lobby') S.botTarget = Math.max(0, S.botTarget - 1);
  render();
}

/* =========================================================
   TICK (100 ms)
   ========================================================= */
function updateLive(){
  const q = cur(); if (!q || S.phase !== 'question') return;
  const left = Math.max(0, q.T - S.elapsed);
  const bar = $('#ringBar'), lbl = $('#ringLbl');
  if (bar) bar.style.strokeDashoffset = (326.7 * (1 - left / q.T)).toFixed(1);
  if (lbl) { lbl.textContent = Math.ceil(left); $('#ring').classList.toggle('low', left <= 5); }
  const st = $('#sTimer'); if (st) st.style.width = (left / q.T * 100) + '%';
  const c = $('#ansCount'); if (c) c.textContent = Object.keys(S.answers).length;
}

setInterval(() => {
  if (ROLE === 'student') { if (S.phase === 'question' && !S.paused && S.you.joined) { S.elapsed += .1; updateLive(); } return; }
  if (S.paused) return;
  if (S.phase === 'lobby') {
    S.lobbyClock += .1;
    const bots = S.players.filter(p => p.bot).length;
    if (bots < S.botTarget && S.players.length < MAX_PLAYERS && S.lobbyClock >= S.nextBotAt) {
      addBot(); S.nextBotAt = S.lobbyClock + .12 + Math.random()*.45; renderHost();
      if (!S.you.joined && S.players.length >= MAX_PLAYERS) renderStudent();
    }
  } else if (S.phase === 'getready') {
    S.elapsed += .1; if (S.elapsed >= 2.4) startQuestion();
  } else if (S.phase === 'question') {
    const q = cur(); S.elapsed += .1;
    if (S.live && Math.floor(S.elapsed) !== Math.floor(S.elapsed - .1)) pushState();
    for (const id in S.plan) if (!S.answers[id] && S.elapsed >= S.plan[id].at) S.answers[id] = {...S.plan[id].ans, time:S.elapsed};
    updateLive();
    const all = S.players.length && S.players.every(p => S.answers[p.id]);
    if (all && S.doneAt === null) S.doneAt = S.elapsed;
    if (S.elapsed >= q.T || (S.doneAt !== null && S.elapsed - S.doneAt >= .6)) reveal();
  }
}, 100);

/* =========================================================
   EVENTS
   ========================================================= */
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-concept]'); if (!t) return;
  if (t.id === 'hostPrimary') return hostPrimary();
  if (t.id === 'toggleStudent') { S.showStudent = !S.showStudent; $('#stage').classList.toggle('solo', !S.showStudent); t.textContent = S.showStudent ? 'Hide student view' : 'Show student view'; return; }
  if (t.dataset.icon) {
    S.you.icon = okIcon(t.dataset.icon);
    document.querySelectorAll('.ipick-b').forEach(b => { const on = b.dataset.icon === S.you.icon; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
    const nm = document.getElementById('ipickName'); if (nm) nm.textContent = ICONS.find(i => i[0] === S.you.icon)[1];
    return;
  }
  if (t.dataset.view) {
    $('#stage').classList.toggle('show-student', t.dataset.view === 'student');
    document.querySelectorAll('#viewTabs button').forEach(b => b.classList.toggle('on', b === t));
    updateTabs(); return;
  }
  if (t.dataset.mode) { S.settings.mode = t.dataset.mode; applyLayout(); return renderHost(); }
  if (t.dataset.hl) { S.settings.hl = t.dataset.hl === '1'; return renderHost(); }
  if (t.dataset.time) { S.settings.time = +t.dataset.time; return renderHost(); }
  if (t.dataset.remove) return removePlayer(t.dataset.remove);
  if (t.dataset.pick) return answer({choice:+t.dataset.pick});
  if (t.dataset.mv) { const [i,d] = t.dataset.mv.split(':').map(Number); moveItem(i, i+d); return; }
  const act = t.dataset.act;
  if (act === 'pause') { S.paused = !S.paused; render(); updateLive(); }
  if (act === 'skip') reveal();
  if (act === 'end') { S.wasPaused = S.paused; S.paused = true; S.confirmEnd = true; render(); updateLive(); }
  if (act === 'endCancel') { S.confirmEnd = false; S.paused = S.wasPaused; render(); updateLive(); }
  if (act === 'endResults') { S.confirmEnd = false; S.paused = false; S.phase = 'podium'; render(); }
  if (act === 'endSetup') { closeRoom(); S.confirmEnd = false; S.paused = false; S.phase = 'setup'; S.players = S.players.filter(p => p.id === 'you'); render(); }
  if (act === 'back') { closeRoom(); S.netError = ''; S.phase = 'setup'; S.players = S.players.filter(p => p.id === 'you'); render(); }
  if (act === 'retryLive') openLiveLobby();
  if (act === 'joinLive') joinLive();
  if (act === 'updateNow') { if (S.live && S.room && ROLE === 'host') closeRoom(); try { sessionStorage.setItem('erl-upd', NEW_VERSION); } catch (e) {} const u = new URL(location.href); u.searchParams.set('v', NEW_VERSION); location.replace(u.toString()); }
  if (act === 'rejoin') { SS.ended = SS.removed = false; SS.joined = false; S.you.joined = false; renderStudent(); }
  if (act === 'join') joinYou();
  if (act === 'submitOrder') answer({order:[...S.myOrder]});
  if (act === 'again') { S.phase = 'lobby'; S.botTarget = S.players.filter(p=>p.bot).length; startGame(); }
  if (act === 'new') { closeRoom(); S.phase = 'setup'; S.players = S.players.filter(p => p.id === 'you'); render(); }
});

document.addEventListener('change', e => {
  const t = e.target;
  const toggle = (ids, on) => ids.forEach(id => on ? S.settings.concepts.add(id) : S.settings.concepts.delete(id));
  if (t.dataset.concept) toggle([t.dataset.concept], t.checked);
  else if (t.dataset.sub) toggle(SYLLABUS.flatMap(u => u.subs).find(s => s.id === t.dataset.sub).concepts.map(c => c.id), t.checked);
  else if (t.dataset.unit) toggle(SYLLABUS.find(u => u.id === t.dataset.unit).subs.flatMap(s => s.concepts.map(c => c.id)), t.checked);
  else return;
  renderHost();
});

document.addEventListener('input', e => {
  const t = e.target; if (t.id !== 'rCount' && t.id !== 'rBots') return;
  if (t.id === 'rCount') S.settings.count = +t.value; else S.settings.bots = +t.value;
  t.style.setProperty('--p', ((t.value - t.min) / Math.max(1, t.max - t.min) * 100) + '%');
  const span = t.parentElement.querySelector('label span');
  if (t.id === 'rCount') span.textContent = `${t.value} of ${t.max} available`; else span.textContent = `${t.value} + you`;
});
document.addEventListener('change', e => { if (e.target.id === 'rCount' || e.target.id === 'rBots') renderHost(); });

/* Join without a <form>: some embedded previews block form submission. */
function joinYou(){
  let name = $('#nick').value.trim().slice(0,15); if (!name) { $('#nick').focus(); return; }
  if (S.players.length >= MAX_PLAYERS) return;
  const used = new Set(S.players.map(p => p.name)); const base = name; let n = 2; while (used.has(name)) name = base.slice(0,13) + n++;
  S.you = {joined:true, name, icon:S.you.icon}; S.players.push({id:'you', name, icon:S.you.icon, bot:false, score:0}); render();
}

document.addEventListener('keydown', e => {
  if (e.target.id === 'nick' && e.key === 'Enter') { e.preventDefault(); joinYou(); return; }
  if ((e.target.id === 'liveNick' || e.target.id === 'pinIn') && e.key === 'Enter') { e.preventDefault(); joinLive(); return; }
  if (S.confirmEnd) { if (e.key === 'Escape') { S.confirmEnd = false; S.paused = S.wasPaused; render(); updateLive(); } if (e.code === 'Space') e.preventDefault(); return; }
  const inInput = /INPUT|TEXTAREA/.test(document.activeElement.tagName) && document.activeElement.type !== 'range';
  if (inInput) return;
  const item = document.activeElement.closest && document.activeElement.closest('.sitem');
  if (item && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    e.preventDefault(); const i = +item.dataset.i; moveItem(i, i + (e.key === 'ArrowUp' ? -1 : 1), true); return;
  }
  if (S.phase === 'question' && /^[1-4]$/.test(e.key)) { const q = cur(); if (q.type !== 'order') answer({choice:+e.key - 1}); return; }
  if (e.code === 'Space' && !item) { e.preventDefault(); const b = $('#hostPrimary'); if (b && !b.disabled) hostPrimary(); }
});

function moveItem(i, j, refocus){
  if (j < 0 || j >= S.myOrder.length) return;
  const [x] = S.myOrder.splice(i, 1); S.myOrder.splice(j, 0, x); renderStudent();
  if (refocus) { const el = document.querySelector(`.sitem[data-i="${j}"]`); el && el.focus(); }
}

/* =========================================================
   STUDENT — joining and following a live game
   ========================================================= */
function studentLiveView(){
  const logo = `<div class="s-logo">${ICON.logo}</div>`;
  if (SS.removed) return `<div class="s-center">${logo}<h2>You were removed from the game</h2><div class="muted">Your teacher removed you. You can join again with a different nickname.</div>
    <button class="btn" data-act="rejoin">Join a game</button></div>`;
  if (SS.ended) return `<div class="s-center">${logo}<h2>The game has ended</h2><div class="muted">Thanks for playing!</div><button class="btn" data-act="rejoin">Join another game</button></div>`;
  if (!SS.joined) {
    if (!liveAvailable()) return `<div class="s-center">${logo}<h2>EconRules Live</h2><div class="muted">Live games aren’t set up on this copy yet.</div>
      <a class="host-link" href="${esc(hostUrl())}">Teacher? Host a game →</a></div>`;
    return `<div class="s-center">${logo}<h2>Join a game</h2>
      <div class="join-form">
        <input class="input pin-input" id="pinIn" inputmode="numeric" maxlength="7" placeholder="Game PIN" autocomplete="off" value="${esc(SS.pin)}">
        <input class="input" id="liveNick" maxlength="15" placeholder="Nickname" autocomplete="off" value="${esc(S.you.name)}">
        ${iconPicker()}
        <button class="btn wide" data-act="joinLive" ${SS.busy ? 'disabled' : ''}>${SS.busy ? 'Joining…' : 'Join'}</button>
        ${SS.err ? `<div class="join-err">${esc(SS.err)}</div>` : ''}
      </div>
      <a class="host-link" href="${esc(hostUrl())}">Teacher? Host a game →</a></div>`;
  }
  return sView();
}
async function joinLive(){
  const pin = ($('#pinIn').value || '').replace(/\D/g, ''); let name = $('#liveNick').value.trim().slice(0, 15);
  SS.pin = pin; S.you.name = name; SS.err = '';
  if (pin.length !== 6) { SS.err = 'Enter the 6-digit game PIN from the big screen.'; return renderStudent(); }
  if (!name) { SS.err = 'Choose a nickname.'; return renderStudent(); }
  SS.busy = true; renderStudent();
  try {
    const net = await getNet(); const room = `rooms/${pin}`;
    const st = await net.get(`${room}/state`);
    if (!st) throw {friendly:'No game found with that PIN. Check the PIN on the big screen.'};
    if (st.phase !== 'lobby') throw {friendly:'That game has already started. Ask your teacher about the next one.'};
    const players = (await net.get(`${room}/players`)) || {};
    if (Object.keys(players).length >= MAX_PLAYERS) throw {friendly:'This game is full (25 players).'};
    const used = new Set(Object.values(players).map(p => p.name)); const base = name; let n = 2;
    while (used.has(name)) name = base.slice(0, 13) + n++;
    await net.set(`${room}/players/${net.uid}`, {name, icon:okIcon(S.you.icon), joinedAt:Date.now()});
    Object.assign(SS, {joined:true, room, ended:false, removed:false, scores:{}, answered:-1});
    S.you = {joined:true, name, icon:S.you.icon}; S.players = [{id:'you', name, icon:S.you.icon, score:0}]; S.phase = 'lobby';
    SS.unsubs = [
      net.on(`${room}/state`, onStudentState),
      net.on(`${room}/scores`, onStudentScores),
      net.on(`${room}/players/${net.uid}`, async v => {
        if (!SS.joined || v !== null || SS.ended) return;
        /* Our player entry vanished: either the teacher removed us, or the whole game was closed. */
        let st = null; try { st = await net.get(`${room}/state`); } catch (e) {}
        if (!SS.joined) return;
        if (st) SS.removed = true; else SS.ended = true;
        leaveLive(); renderStudent();
      }),
    ];
  } catch (err) { SS.err = err.friendly || friendlyNetError(err); }
  SS.busy = false; renderStudent();
}
function leaveLive(){ SS.unsubs.forEach(u => u()); SS.unsubs = []; SS.joined = false; S.you.joined = false; }
let studentKey = '';
function onStudentState(st){
  if (!st) { if (SS.joined) { SS.ended = true; leaveLive(); renderStudent(); } return; }
  S.phase = st.phase; S.qi = st.qi || 0;
  S.questions = new Array(st.total || 0); if (st.q) S.questions[S.qi] = st.q;
  S.answers = SS.answered === S.qi ? {you:SS.myAns} : {};
  const key = `${st.phase}:${S.qi}:${!!st.paused}:${!!(st.q && st.q.exp)}`;
  if (st.phase === 'question' && st.q) {
    if (!studentKey.startsWith(`question:${S.qi}:`) && st.q.type === 'order') S.myOrder = [...st.q.shown];
    S.elapsed = st.q.T - (st.left == null ? st.q.T : st.left);
  }
  S.paused = !!st.paused;
  syncStudentResults();
  if (key !== studentKey) { studentKey = key; renderStudent(); } else updateLive();
}
function syncStudentResults(){
  const me = SS.scores[NET.uid];
  S.results = me ? {you:{frac:me.frac || 0, pts:me.pts || 0}} : {};
  const list = Object.entries(SS.scores).map(([id, p]) => ({id: id === NET.uid ? 'you' : id, name:p.name, icon:okIcon(p.icon), score:p.score || 0, gain:p.gain || 0}));
  S.players = list.length ? list : [{id:'you', name:S.you.name, icon:S.you.icon, score:0}];
  if (!S.players.find(p => p.id === 'you')) S.players.push({id:'you', name:S.you.name, icon:S.you.icon, score:0});
}
function onStudentScores(sc){
  SS.scores = sc || {}; syncStudentResults();
  if (['reveal','leaderboard','podium'].includes(S.phase)) renderStudent();
}

/* drag-and-drop for ordering */
let dragFrom = null;
document.addEventListener('dragstart', e => { const it = e.target.closest('.sitem'); if (!it) return; dragFrom = +it.dataset.i; it.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', ''); });
document.addEventListener('dragover', e => { const it = e.target.closest('.sitem'); if (!it || dragFrom === null) return; e.preventDefault(); document.querySelectorAll('.sitem.over').forEach(x => x.classList.remove('over')); it.classList.add('over'); });
document.addEventListener('drop', e => { const it = e.target.closest('.sitem'); if (!it || dragFrom === null) return; e.preventDefault(); const to = +it.dataset.i; const f = dragFrom; dragFrom = null; moveItem(f, to); });
document.addEventListener('dragend', () => { dragFrom = null; document.querySelectorAll('.sitem').forEach(x => x.classList.remove('over','dragging')); });

window.addEventListener('pagehide', () => { if (ROLE === 'host') closeRoom(); });
S.settings.mode = liveAvailable() ? 'live' : 'practice';
applyLayout();
render();
checkVersion(); setInterval(checkVersion, 5 * 60 * 1000);
</script>
