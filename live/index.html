async function makeFirebaseNet(cfg){
  if (!cfg) throw new Error('not-configured');
  const base = `https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
  let app, auth, db;
  try { [app, auth, db] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-database.js')]); }
  catch (e) { throw new Error('offline'); }
  const fa = app.initializeApp(cfg);
  const cred = await auth.signInAnonymously(auth.getAuth(fa));
  const d = db.getDatabase(fa); const r = path => db.ref(d, path);
  return { uid: cred.user.uid,
    set: (path, v) => db.set(r(path), v), update: (path, o) => db.update(r(path), o), remove: path => db.remove(r(path)),
    get: async path => (await db.get(r(path))).val(),
    on: (path, cb) => db.onValue(r(path), snap => cb(snap.val())) };
}
function makeLocalNet(){
  const KEY = 'erl-localdb', listeners = new Set();
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
  const parts = path => path.split('/').filter(Boolean);
  const getAt = (db, path) => parts(path).reduce((o, k) => (o == null || o[k] === undefined) ? null : o[k], db);
  const setAt = (db, path, v) => { const ks = parts(path); let o = db;
    for (let i = 0; i < ks.length - 1; i++) { if (typeof o[ks[i]] !== 'object' || o[ks[i]] === null) o[ks[i]] = {}; o = o[ks[i]]; }
    if (v === null || v === undefined) delete o[ks[ks.length-1]]; else o[ks[ks.length-1]] = clean(v); };
  const notify = () => { const db = load(); listeners.forEach(l => { const v = getAt(db, l.path), j = JSON.stringify(v); if (j !== l.last) { l.last = j; l.cb(v === null ? null : JSON.parse(j)); } }); };
  window.addEventListener('storage', e => { if (e.key === KEY) notify(); });
  const write = fn => { const db = load(); fn(db); localStorage.setItem(KEY, JSON.stringify(db)); setTimeout(notify, 0); return Promise.resolve(); };
  let uid = sessionStorage.getItem('erl-uid'); if (!uid) { uid = 'u' + Math.random().toString(36).slice(2, 10); sessionStorage.setItem('erl-uid', uid); }
  return { uid,
    set: (path, v) => write(db => setAt(db, path, v)),
    update: (path, o) => write(db => Object.entries(o).forEach(([k, v]) => setAt(db, path + '/' + k, v))),
    remove: path => write(db => setAt(db, path, null)),
    get: path => Promise.resolve(getAt(load(), path)),
    on: (path, cb) => { const l = {path, cb, last:undefined}; listeners.add(l);
      setTimeout(() => { const v = getAt(load(), path); l.last = JSON.stringify(v); cb(v); }, 0); return () => listeners.delete(l); } };
}
function friendlyNetError(err){
  const m = String((err && (err.code || err.message)) || err);
  if (m === 'not-configured') return 'Live games aren’t connected to Firebase yet (firebase-config.js is missing).';
  if (m === 'offline') return 'Couldn’t reach Firebase. Check your internet connection and try again.';
  if (/operation-not-allowed|admin-restricted/.test(m)) return 'Anonymous sign-in isn’t switched on in Firebase (Authentication → Sign-in method → Anonymous).';
  if (/unauthorized-domain|requests-from-referer|referer/.test(m)) return 'This web address isn’t on Firebase’s list of authorised domains (Authentication → Settings → Authorised domains).';
  if (/permission|PERMISSION_DENIED/i.test(m)) return 'Firebase refused the request. Check that the security rules have been published.';
  if (/network-request-failed/.test(m)) return 'Network problem: couldn’t reach Firebase. Check your connection.';
  return 'Something went wrong connecting to Firebase: ' + m;
}

    const sel = all.filter(id => S.settings.concepts.has(id));
    const total = all.reduce((t,id) => t + conceptCount(id), 0);
    const st = !all.length ? 'off' : sel.length === all.length ? 'all' : sel.length ? 'some' : 'none';
    const subs = u.subs.length ? `<div class="subs">${u.subs.map(s => {
      const ids = s.concepts.map(c => c.id); const ssel = ids.filter(id => S.settings.concepts.has(id));
      const sst = !ids.length ? 'off' : ssel.length === ids.length ? 'all' : ssel.length ? 'some' : 'none';
      return `<div class="sub ${ids.length ? 'on' : 'off'}">
        <input type="checkbox" class="cb" data-sub="${s.id}" ${sst==='all'?'checked':''} ${sst==='some'?'data-ind="1"':''} ${sst==='off'?'disabled':''} aria-label="${esc(s.name)}">
        <span class="num">${s.id}</span><span>${esc(s.name)}</span>${s.hl?' <span class="hl-tag">HL</span>':''}
        ${ids.length ? '' : '<span class="soon">Coming soon</span>'}</div>
        ${ids.length ? `<div class="concepts">${s.concepts.map(c => `<label class="concept">
          <input type="checkbox" class="cb" data-concept="${c.id}" ${S.settings.concepts.has(c.id)?'checked':''}>
          <span>${esc(c.name)}</span><span class="n">${conceptCount(c.id)} questions</span></label>`).join('')}</div>` : ''}`;
    }).join('')}</div>` : '';
    return `<div class="unit ${all.length ? '' : 'off'}"><div class="unit-head">
      <input type="checkbox" class="cb" data-unit="${u.id}" ${st==='all'?'checked':''} ${st==='some'?'data-ind="1"':''} ${st==='off'?'disabled':''} aria-label="${esc(u.name)}">
      <span>${esc(u.name)}</span><span class="count">${all.length ? `${total} questions` : 'Coming soon'}</span></div>${subs}</div>`;
  }).join('');
  const pct = (v,min,max) => ((v-min)/(max-min)*100) + '%';
  return `<div class="setup fade-in">
    <div class="setup-intro"><div class="eyebrow">New game</div><h1>What are we revising today?</h1>
      <div class="muted">Tick a whole unit, a subtopic or a single concept. Questions are picked at random from what you tick.</div></div>
    <div class="tree">${unitHtml}</div>
    <div class="settings card">
      <div class="field"><label>Game mode <span>${S.settings.mode==='live' ? 'students join on their own laptops' : 'you plus practice bots'}</span></label>
        <div class="seg"><button data-mode="live" class="${S.settings.mode==='live'?'on':''}" ${liveAvailable()?'':'disabled'}>Live game</button><button data-mode="practice" class="${S.settings.mode==='practice'?'on':''}">Practice</button></div>
        ${liveAvailable() ? '' : '<div class="muted" style="font-size:12px;margin-top:8px">Live games need firebase-config.js next to this file.</div>'}</div>
      <div class="field"><label>Level</label>
        <div class="seg"><button data-hl="0" class="${!S.settings.hl?'on':''}">SL only</button><button data-hl="1" class="${S.settings.hl?'on':''}">SL + HL</button></div></div>
      <div class="field"><label>Questions <span>${n} of ${avail} available</span></label>
        <input type="range" id="rCount" min="1" max="${Math.max(avail,1)}" value="${n}" style="--p:${pct(n,1,Math.max(avail,2))}" ${avail?'':'disabled'}></div>
      <div class="field"><label>Time per question <span>ordering & calculations get extra time</span></label>
        <div class="seg">${[10,20,30,45].map(t => `<button data-time="${t}" class="${S.settings.time===t?'on':''}">${t}s</button>`).join('')}</div></div>
      ${S.settings.mode==='practice' ? `<div class="field"><label>Practice bots <span>${S.settings.bots} + you</span></label>
        <input type="range" id="rBots" min="0" max="24" value="${S.settings.bots}" style="--p:${pct(S.settings.bots,0,24)}"></div>` : ''}
      <div class="summary">
        <div class="stat"><b>${n}</b><small>questions</small></div>
        <div class="stat"><b>${pool().filter(q=>q.double).length}</b><small>double-point Qs in pool</small></div>
        <div class="stat"><b>${S.settings.mode==='live' ? MAX_PLAYERS : S.settings.bots + 1}</b><small>players max</small></div>
      </div>
      <button class="btn wide" id="hostPrimary" ${n?'':'disabled'}>Open the lobby</button>
    </div></div>`;
}

function vLobby(){
  const ps = activePlayers();
  if (S.live && S.netError) return `<div class="lobby fade-in"><div class="net-err"><h2>Couldn’t start a live game</h2><p>${esc(S.netError)}</p>
    <div class="end-btns"><button class="btn" data-act="retryLive">Try again</button><button class="icon-btn" data-act="back">Back to setup</button></div></div></div>`;
  if (S.live && !S.pin) return `<div class="lobby fade-in"><div class="pin-card"><small>Creating your game…</small><div class="pin">••• •••</div></div></div>`;
  const where = S.live ? `<span class="join-url">${esc(studentUrl())}</span>` : '<b>econrules · play</b>';
  return `<div class="lobby fade-in">
    <div class="pin-card"><small>Join at ${where} with game PIN</small><div class="pin">${S.pin.slice(0,3)} ${S.pin.slice(3)}</div></div>
    <div class="lobby-meta">
      <div class="count">${ICON.people}<span>${ps.length}</span><span class="muted" style="font-size:16px">/ ${MAX_PLAYERS} players</span></div>
      <div class="spacer"></div>
      <button class="icon-btn" data-act="back">Back to setup</button>
      <button class="btn" id="hostPrimary" ${ps.length?'':'disabled'}>Start game <kbd>Space</kbd></button>
    </div>
    <div class="roster">${ps.length ? ps.map(p => `<span class="pchip ${p.id==='you'?'me':''} ${shownChips.has(p.id)?'':'new'}">${esc(p.name)}
      <button class="x" data-remove="${p.id}" title="Remove ${esc(p.name)}">${ICON.x}</button></span>`).join('')
      : '<div class="empty">Waiting for players to join…</div>'}</div></div>`;
}

function qHead(q, extra=''){
  return `<div class="qhead">
    <span class="chip">Question ${S.qi+1} of ${S.questions.length}</span>
    <span class="chip">${SHORT[q.concept]}</span><span class="chip">${TYPE_LABEL[q.type]}</span>
    ${q.level==='HL'?'<span class="chip hl">HL</span>':''}${q.double?'<span class="chip dbl">★ Double points</span>':''}
    <div class="ctrl">${extra}<button class="icon-btn end" data-act="end">${ICON.stop}End game</button></div></div>
    <div class="progress"><i style="width:${(S.qi)/S.questions.length*100}%"></i></div>`;
}

function vGetReady(){
  const q = cur();
  return `<div class="ready">
    <div class="eyebrow">Question ${S.qi+1} of ${S.questions.length} · ${SHORT[q.concept]} · ${TYPE_LABEL[q.type]}</div>
    ${q.double ? '<div class="double-burst">★ DOUBLE POINTS ★<small>THIS ONE IS WORTH 2×</small></div>' : '<div class="big pop">Get ready…</div>'}
    <div class="bar"><i></i></div>
    <button class="icon-btn end" data-act="end" style="margin-top:8px">${ICON.stop}End game</button></div>`;
}

function optTile(q, d, i, state=''){
  const tick = state==='right' ? `<span class="tick">${ICON.check}</span>` : '';
  if (q.type === 'diagram-options')
    return `<div class="opt dgo o${i} ${state}"><div class="top">${SHAPES[i]}<span>${LETTERS[i]}</span>${tick}</div><div class="mini">${svgDiagram(d.diagram, true)}</div></div>`;
  return `<div class="opt o${i} ${state}">${SHAPES[i]}<span>${esc(d.text)}</span>${tick}</div>`;
}

function vQuestion(){
  const q = cur(); const T = q.T;
  const ctrl = `<button class="icon-btn" data-act="pause">${S.paused?ICON.play+'Resume':ICON.pause+'Pause'}</button>
    <button class="icon-btn" data-act="skip">${ICON.skip}Skip</button>`;
  const ring = `<div class="ring" id="ring"><svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="52"/>
    <circle class="bar" id="ringBar" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="0"/></svg><div class="lbl" id="ringLbl">${Math.ceil(T)}</div></div>`;
  const answered = `<div class="answered"><b id="ansCount">0</b><small>of ${activePlayers().length} answered</small></div>`;
  let body;
  if (q.type === 'order') {
    body = `<div class="qmid nodiag">${ring}<div class="muted" style="text-align:center">Drag the items into the right order on your laptop</div>${answered}</div>
      <div class="olist">${q.shown.map((t,i) => `<div class="oitem" style="--oc:var(--c${i%4})"><span class="badge">${LETTERS[i] || i+1}</span>${esc(t)}</div>`).join('')}</div>`;
  } else {
    const mid = q.type === 'diagram' ? `<div class="diag-card">${svgDiagram(q.diagram)}</div>` : '<div></div>';
    body = `<div class="qmid ${q.type==='diagram'?'':'nodiag'}">${ring}${mid}${answered}</div>
      <div class="opts ${q.type==='diagram-options'?'four':''}">${q.disp.map((d,i) => optTile(q,d,i)).join('')}</div>`;
  }
  return `<div class="fade-in">${qHead(q, ctrl)}<h2 class="qtext">${esc(q.q)}</h2>${body}</div>${S.paused && !S.confirmEnd ? pausedOverlay() : ''}`;
}

function pausedOverlay(){
  return `<div class="paused"><h2>Paused</h2><div class="muted">The timer is frozen for everyone.</div>
    <button class="btn" data-act="pause">${ICON.play} Resume</button></div>`;
}

function vReveal(){
  const q = cur(); const ps = activePlayers(); const last = S.qi === S.questions.length - 1;
  const ctrl = `<button class="btn sm" id="hostPrimary">${last ? 'Final results' : 'Leaderboard'} <kbd>Space</kbd></button>`;
  const why = `<div class="why fade-in"><div class="ic">${ICON.bulb}</div><div><h3>Why</h3><p>${esc(q.exp)}</p>
    ${q.rw ? `<div class="rw"><h3>${ICON.globe} In the real world</h3><p>${esc(q.rw)}</p></div>` : ''}</div></div>`;
  if (q.type === 'order') {
    const rs = ps.map(p => S.results[p.id]).filter(Boolean);
    const full = rs.filter(r => r.frac === 1).length, partial = rs.filter(r => r.frac > 0 && r.frac < 1).length;
    const avg = rs.length ? rs.reduce((t,r) => t + r.frac * q.items.length, 0) / rs.length : 0;
    return `<div class="fade-in">${qHead(q, ctrl)}<h2 class="qtext">${esc(q.q)}</h2>
      <div class="reveal-row"><div class="olist">${q.items.map((t,i) => `<div class="oitem ok" style="animation:fadeIn .4s ${i*.12}s both"><span class="badge">${i+1}</span>${esc(t)}</div>`).join('')}</div>
      <div style="display:flex;flex-direction:column;gap:16px"><div class="ostats">
        <div class="stat"><b>${full}</b><small>fully correct</small></div>
        <div class="stat"><b>${partial}</b><small>partly correct</small></div>
        <div class="stat"><b>${avg.toFixed(1)}/${q.items.length}</b><small>avg. items in place</small></div></div>${why}</div></div></div>`;
  }
  const counts = q.disp.map((_,i) => ps.filter(p => S.answers[p.id] && S.answers[p.id].choice === i).length);
  const max = Math.max(1, ...counts);
  const bars = `<div class="card"><div class="bars">${counts.map((c,i) => `<div class="bcol o${i} ${i===q.correct?'':'lose'}">
    <span class="v">${c}</span><div class="b" style="height:${Math.max(4, c/max*110)}px;animation-delay:${i*.08}s"></div>
    <span class="k">${SHAPES[i]}${i===q.correct?`<svg class="ok" viewBox="0 0 24 24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`:''}</span></div>`).join('')}</div></div>`;
  const side = q.type === 'diagram' ? `<div style="display:flex;flex-direction:column;gap:16px"><div class="diag-card" style="width:100%;max-width:330px">${svgDiagram(q.diagram)}</div></div>` : why;
  return `<div class="fade-in">${qHead(q, ctrl)}<h2 class="qtext">${esc(q.q)}</h2>
    <div class="reveal-row">${bars}${side}</div>
    ${q.type==='diagram' ? `<div style="margin-bottom:18px">${why}</div>` : ''}
    <div class="opts ${q.type==='diagram-options'?'four':''}">${q.disp.map((d,i) => optTile(q,d,i, i===q.correct?'right':'dim')).join('')}</div></div>`;
}

function ranked(){ return [...activePlayers()].sort((a,b) => b.score - a.score || a.name.localeCompare(b.name)); }

function vLeaderboard(){
  const r = ranked(); const top = r.slice(0,5); const meIdx = r.findIndex(p => p.id === 'you');
  const row = (p,i) => {
    const mv = p.prevRank && p.prevRank !== i+1 ? (p.prevRank > i+1 ? `<span class="mv up">▲${p.prevRank-(i+1)}</span>` : `<span class="mv dn">▼${(i+1)-p.prevRank}</span>`) : '<span class="mv"></span>';
    return `<div class="lbrow r${i+1} ${p.id==='you'?'me':''}" style="animation-delay:${i*.07}s"><span class="rk">${i+1}</span>
      <span class="nm">${esc(p.name)}</span>${p.gain?`<span class="gain">+${fmt(p.gain)}</span>`:''}${mv}<span class="sc">${fmt(p.score)}</span>
      <button class="x" data-remove="${p.id}" title="Remove ${esc(p.name)}">${ICON.x}</button></div>`;
  };
  return `<div class="fade-in">${qHead(cur(), `<button class="btn sm" id="hostPrimary">Next question <kbd>Space</kbd></button>`)}
    <h2 class="qtext" style="margin-bottom:6px">Leaderboard</h2>
    <div class="lb">${top.map(row).join('')}${meIdx >= 5 ? `<div class="lbgap">• • •</div>${row(r[meIdx], meIdx)}` : ''}</div></div>`;
}

function vPodium(){
  const r = ranked(); const col = (p, cls, n) => p ? `<div class="pcol ${cls}"><div class="pn">${esc(p.name)}</div><div class="ps">${fmt(p.score)} pts</div><div class="blk">${n}</div></div>` : `<div class="pcol ${cls}"></div>`;
  const colors = ['#ff5470','#3d86ff','#ffad2e','#1fc79a','#3ad6ff','#fff'];
  const conf = Array.from({length:70}, () => `<i style="left:${Math.random()*100}%;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${2.5+Math.random()*2.5}s;animation-delay:${1+Math.random()*1.5}s;transform:rotate(${Math.random()*360}deg)"></i>`).join('');
  return `<div class="confetti">${conf}</div><div class="fade-in" style="text-align:center">
    <div class="eyebrow">Game over · ${S.played} question${S.played === 1 ? '' : 's'}</div><h2 class="qtext" style="margin:8px 0 0">Final results</h2>
    <div class="podium">${col(r[1],'p2',2)}${col(r[0],'p1',1)}${col(r[2],'p3',3)}</div>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:18px"><button class="btn" data-act="again">Play again</button><button class="icon-btn" data-act="new">New game</button></div>
    ${r.length > 3 ? `<div class="rest">${r.slice(3).map((p,i) => `<div class="${p.id==='you'?'me':''}"><b>${i+4}</b><span>${esc(p.name)}</span><em>${fmt(p.score)}</em></div>`).join('')}</div>` : ''}</div>`;
}

/* =========================================================
   STUDENT VIEWS
   ========================================================= */
function sView(){
  const q = cur(); const me = S.players.find(p => p.id === 'you');
  const header = q ? `<div class="s-top"><b>${esc(S.you.name)}</b><span class="sp"></span>${me?`${fmt(me.score)} pts`:''}</div>` : '';
  switch (S.phase) {
    case 'setup':
      return `<div class="s-center"><div class="s-logo">${ICON.logo}</div><h2>EconRules Live</h2><div class="muted">Waiting for your teacher to open a game…</div></div>`;
    case 'lobby':
      if (!S.you.joined) return `<div class="s-center"><div class="s-logo">${ICON.logo}</div><h2>Join the game</h2>
        <div class="join-form" id="joinForm"><input class="input" value="${S.pin}" aria-label="Game PIN" readonly>
        <input class="input" id="nick" maxlength="15" placeholder="Your nickname" autocomplete="off" value="${esc(S.you.name)}">
        <button class="btn wide" data-act="join" ${activePlayers().length >= MAX_PLAYERS ? 'disabled' : ''}>${activePlayers().length >= MAX_PLAYERS ? 'Room is full' : 'Join'}</button></div></div>`;
      return `<div class="s-center"><div class="result-ic ok">${ICON.check.replace('<svg','<svg style="stroke:#fff"')}</div><h2>You’re in!</h2><div class="muted">Look for <b style="color:var(--text)">${esc(S.you.name)}</b> on the big screen.</div></div>`;
  }
  if (!S.you.joined) return `<div class="s-center"><div class="s-logo">${ICON.logo}</div><h2>Game in progress</h2><div class="muted">You can join the next game.</div></div>`;
  if (S.phase === 'getready') return `${header}<div class="s-center"><div class="eyebrow">Question ${S.qi+1}</div>
    ${q.double ? '<div class="double-burst" style="font-size:30px">★ 2× POINTS ★</div>' : '<h2 class="pop">Get ready…</h2>'}</div>`;
  if (S.phase === 'question') {
    const mine = S.answers.you;
    const pausedHtml = S.paused ? `<div class="paused"><h2 style="font-size:28px">Paused</h2></div>` : '';
    if (mine) return `${header}<div class="s-center"><div class="s-logo" style="animation:pulse 1.8s infinite">${ICON.logo}</div><h2>Answer locked in</h2><div class="muted">Waiting for everyone else…</div></div>${pausedHtml}`;
    let ui;
    if (q.type === 'order') {
      ui = `<div class="slist" id="slist">${S.myOrder.map((t,i) => `<div class="sitem" draggable="true" tabindex="0" data-i="${i}">
        <span class="grip">${ICON.grip}</span><span class="num">${i+1}</span><span class="t">${esc(t)}</span>
        <span class="mvb"><button data-mv="${i}:-1" ${i===0?'disabled':''} aria-label="Move up">${ICON.up}</button><button data-mv="${i}:1" ${i===S.myOrder.length-1?'disabled':''} aria-label="Move down">${ICON.down}</button></span></div>`).join('')}</div>
        <button class="btn wide" data-act="submitOrder">Submit order</button><div class="hint">Drag, use the arrows, or focus an item and press ↑ ↓</div>`;
    } else {
      ui = `${q.type==='diagram' ? `<div class="s-diag">${svgDiagram(q.diagram)}</div>` : ''}
        <div class="s-opts ${q.type==='diagram-options'?'grid2':''}">${q.disp.map((d,i) => q.type==='diagram-options'
          ? `<button class="sopt dgo o${i}" data-pick="${i}"><span class="top">${SHAPES[i]}${LETTERS[i]}<kbd>${i+1}</kbd></span><span class="mini">${svgDiagram(d.diagram, true)}</span></button>`
          : `<button class="sopt o${i}" data-pick="${i}">${SHAPES[i]}<span>${esc(d.text)}</span><kbd>${i+1}</kbd></button>`).join('')}</div>`;
    }
    return `${header}<div class="s-timer"><i id="sTimer" style="width:100%"></i></div><p class="s-q">${esc(q.q)}</p>${ui}${pausedHtml}`;
  }
  const r = ranked(); const rank = r.findIndex(p => p.id === 'you') + 1;
  if (S.phase === 'reveal') {
    const res = S.results.you || {frac:0, pts:0};
    const kind = res.frac === 1 ? 'ok' : res.frac > 0 ? 'part' : 'no';
    const title = !S.answers.you ? 'Time’s up' : kind === 'ok' ? 'Correct!' : kind === 'part' ? `${Math.round(res.frac*q.items.length)} of ${q.items.length} in place` : 'Not quite';
    const icon = kind === 'no' ? '<svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
    return `${header}<div class="s-center"><div class="result-ic ${kind}">${icon}</div><h2>${title}</h2>
      <div class="pts pop">+${fmt(res.pts)}</div>${q.double && res.pts ? '<span class="chip dbl">★ Double points</span>' : ''}
      <div class="muted">You’re in <b style="color:var(--text)">${ordinal(rank)}</b> place of ${r.length}</div>
      <div class="s-why"><b style="color:var(--good)">Why: </b>${esc(q.exp)}${q.rw ? `<div class="s-rw"><b>In the real world: </b>${esc(q.rw)}</div>` : ''}</div></div>`;
  }
  if (S.phase === 'leaderboard') return `${header}<div class="s-center"><div class="muted">You’re in</div><div class="s-rank pop">${ordinal(rank)}</div>
    <div class="muted">${fmt(me.score)} points · ${rank > 1 ? `${fmt(r[rank-2].score - me.score)} behind ${esc(r[rank-2].name)}` : 'out in front!'}</div></div>`;
  if (S.phase === 'podium') return `<div class="s-center"><div class="muted">You finished</div><div class="s-rank pop">${ordinal(rank)}</div>
    <div class="muted">of ${r.length} players · ${fmt(me.score)} points</div>${rank <= 3 ? '<span class="chip dbl">★ On the podium!</span>' : ''}</div>`;
  return '';
}

/* =========================================================
   RENDER
   ========================================================= */
/* Only play the fade-in when the screen actually changes, not on every refresh. */
let lastHostPhase = null;
const shownChips = new Set();
function endDialog(){
  const played = S.played;
  return `<div class="paused end-dialog"><h2>End the game now?</h2>
    <div class="muted">${played} of ${S.questions.length} questions played. The timer is paused while you decide.</div>
    <div class="end-btns">
      <button class="btn" data-act="endResults" ${played ? '' : 'disabled'}>Show final results</button>
      <button class="icon-btn" data-act="endSetup">Back to setup</button>
      <button class="icon-btn" data-act="endCancel">Keep playing</button>
    </div>${played ? '' : '<div class="muted" style="font-size:13px">No questions finished yet, so there are no results to show.</div>'}</div>`;
}
function renderHost(){
  const v = {setup:vSetup, lobby:vLobby, getready:vGetReady, question:vQuestion, reveal:vReveal, leaderboard:vLeaderboard, podium:vPodium}[S.phase];
  const key = S.phase + ':' + S.qi;
  if (S.phase !== 'lobby') shownChips.clear();
  $('#host').classList.toggle('still', key === lastHostPhase); lastHostPhase = key;
  $('#host').innerHTML = v() + (S.confirmEnd ? endDialog() : '');
  if (S.phase === 'lobby') S.players.forEach(p => shownChips.add(p.id));
  $('#host').querySelectorAll('[data-ind]').forEach(el => el.indeterminate = true);
}
function renderStudent(){ $('#student').innerHTML = ROLE === 'student' ? studentLiveView() : sView(); if (ROLE === 'host') updateTabs(); }
/* On narrow windows: light up the Student tab when the student has something to do. */
function updateTabs(){
  const need = (S.phase === 'lobby' && !S.you.joined) || (S.phase === 'question' && S.you.joined && !S.answers.you);
  $('#viewTabs').classList.toggle('need', need && !$('#stage').classList.contains('show-student'));
}
function render(){
  if (ROLE === 'student') return renderStudent();
  renderHost(); renderStudent(); pushState();
}
function applyLayout(){
  document.body.classList.toggle('student-mode', ROLE === 'student');
  const solo = ROLE === 'host' && (S.settings.mode === 'live' || !S.showStudent);
  $('#stage').classList.toggle('solo', solo);
  $('#toggleStudent').style.display = ROLE === 'host' && S.settings.mode === 'live' ? 'none' : '';
  $('#modePill').innerHTML = S.settings.mode === 'live' ? 'Live game · <b>students join on their laptops</b>' : 'Practice mode · <b>bots</b> fill the room';
}

/* =========================================================
   GAME FLOW
   ========================================================= */
function openLobby(){
  S.live = S.settings.mode === 'live';
  if (S.live) return openLiveLobby();
  S.pin = String(100000 + Math.floor(Math.random()*900000));
  S.players = S.you.joined ? S.players.filter(p => p.id === 'you') : [];
  if (!S.you.joined) S.players = [];
  S.botTarget = S.settings.bots; S.lobbyClock = 0; S.nextBotAt = .6;
  S.phase = 'lobby'; render();
}

async function openLiveLobby(){
  S.phase = 'lobby'; S.players = []; S.pin = ''; S.netError = ''; S.botTarget = 0; render();
  try {
    const net = await getNet(); let pin;
    for (let i = 0; i < 10; i++) { pin = String(100000 + Math.floor(Math.random()*900000)); if (!(await net.get(`rooms/${pin}/host`))) break; }
    await net.set(`rooms/${pin}`, {host:net.uid, created:Date.now(), state:{phase:'lobby', qi:0, total:0, paused:false}});
    S.room = `rooms/${pin}`; S.pin = pin;
    S.unsubPlayers = net.on(`${S.room}/players`, v => onPlayers(v || {}));
  } catch (err) { S.netError = friendlyNetError(err); }
  render();
}
function onPlayers(v){
  const entries = Object.entries(v).sort((a,b) => (a[1].joinedAt||0) - (b[1].joinedAt||0));
  if (S.phase === 'lobby' && entries.length > MAX_PLAYERS) entries.slice(MAX_PLAYERS).forEach(([id]) => NET.remove(`${S.room}/players/${id}`));
  const old = new Map(S.players.map(p => [p.id, p]));
  S.players = entries.slice(0, MAX_PLAYERS).map(([id, p]) => old.get(id) || {id, name:String(p.name || 'Player').slice(0,15), score:0, gain:0, prevRank:0});
  if (S.phase === 'lobby') renderHost(); else updateLive();
}
function closeRoom(){
  if (S.unsubPlayers) S.unsubPlayers(); if (S.unsubAns) S.unsubAns();
  S.unsubPlayers = S.unsubAns = null;
  if (S.live && S.room && NET) NET.remove(S.room).catch(() => {});
  S.room = null; S.pin = '';
}
/* What students may see: never the answer until the reveal. */
function pubQ(q, withAnswer){
  const o = {id:q.id, concept:q.concept, level:q.level, type:q.type, q:q.q, T:q.T, double:!!q.double};
  if (q.diagram) o.diagram = q.diagram;
  if (q.type === 'order') o.shown = q.shown; else o.disp = q.disp.map(d => d.diagram ? {diagram:d.diagram} : {text:d.text});
  if (withAnswer) { o.exp = q.exp; if (q.rw) o.rw = q.rw; if (q.type === 'order') o.items = q.items; else o.correct = q.correct; }
  return o;
}
let lastPushed = '';
function pushState(){
  if (ROLE !== 'host' || !S.live || !S.room || !NET) return;
  const q = cur(); const st = {phase:S.phase, qi:S.qi, qs:String(S.qi), total:S.questions.length, paused:!!S.paused};
  if (q && S.phase !== 'lobby') st.q = pubQ(q, ['reveal','leaderboard','podium'].includes(S.phase));
  if (S.phase === 'question') st.left = +Math.max(0, q.T - S.elapsed).toFixed(1);
  const j = JSON.stringify(st); if (j === lastPushed) return; lastPushed = j;
  NET.set(`${S.room}/state`, clean(st)).catch(() => {});
}

function addBot(){
  const used = new Set(S.players.map(p => p.name));
  const name = shuffle(BOT_NAMES).find(n => !used.has(n)); if (!name) return;
  S.players.push({id:'b'+Math.random().toString(36).slice(2,8), name, bot:true, skill:.45 + Math.random()*.47, score:0});
}

function buildQuestions(){
  const T = S.settings.time;
  return shuffle(pool()).slice(0, S.settings.count).map(src => {
    const q = {...src};
    q.T = T * (q.time || (q.type === 'order' ? 1.5 : 1));
    if (q.type === 'order') {
      let shown; do { shown = shuffle(q.items); } while (shown.every((t,i) => t === q.items[i]));
      q.shown = shown;
    } else {
      const base = q.type === 'diagram-options' ? q.optionDiagrams.map(d => ({diagram:d})) : q.options.map(t => ({text:t}));
      const perm = shuffle(base.map((_,i) => i));
      q.disp = perm.map(i => ({...base[i], orig:i}));
      q.correct = perm.indexOf(q.answer);
    }
    return q;
  });
}

function startGame(){
  S.played = 0; S.confirmEnd = false;
  if (S.live && S.room) { NET.remove(`${S.room}/answers`).catch(() => {}); NET.remove(`${S.room}/scores`).catch(() => {}); }
  S.questions = buildQuestions(); S.qi = 0;
  S.players.forEach(p => { p.score = 0; p.gain = 0; p.prevRank = 0; });
  getReady();
}
function getReady(){ S.phase = 'getready'; S.elapsed = 0; S.paused = false; render(); }

function startQuestion(){
  const q = cur(); S.phase = 'question'; S.elapsed = 0; S.answers = {}; S.results = {}; S.doneAt = null;
  if (q.type === 'order') S.myOrder = [...q.shown];
  S.plan = {};
  if (S.live && S.room) {
    if (S.unsubAns) S.unsubAns();
    const qi = S.qi;
    S.unsubAns = NET.on(`${S.room}/answers/${qi}`, v => {
      if (S.phase !== 'question' || S.qi !== qi) return;
      for (const [id, a] of Object.entries(v || {})) {
        if (S.answers[id] || !S.players.find(p => p.id === id)) continue;
        const ok = q.type === 'order' ? Array.isArray(a.order) && a.order.length === q.items.length : Number.isInteger(a.choice) && a.choice >= 0 && a.choice < 4;
        S.answers[id] = ok ? {...a, time:S.elapsed} : {choice:-1, order:[], time:S.elapsed};
      }
      updateLive();
    });
  }
  S.players.filter(p => p.bot).forEach(b => {
    const skip = Math.random() < .04;
    const p = b.skill * (q.double ? .85 : 1) * (q.level === 'HL' ? .9 : 1);
    let ans;
    if (q.type === 'order') {
      const o = [...q.items];
      if (Math.random() > p) { const k = 1 + Math.floor(Math.random()*2); for (let j = 0; j < k; j++) { const i = Math.floor(Math.random()*(o.length-1)); [o[i],o[i+1]] = [o[i+1],o[i]]; } }
      ans = {order:o};
    } else {
      ans = {choice: Math.random() < p ? q.correct : shuffle([0,1,2,3].filter(i => i !== q.correct))[0]};
    }
    const at = skip ? Infinity : Math.min(q.T - .3, q.T * (.18 + Math.random()*.6) * (1.25 - b.skill*.4));
    S.plan[b.id] = {at, ans};
  });
  render();
}

function scoreFor(q, a){
  if (!a) return {frac:0, pts:0};
  const speed = 1 - .5 * Math.min(a.time, q.T) / q.T;
  const frac = q.type === 'order' ? a.order.filter((t,i) => t === q.items[i]).length / q.items.length : (a.choice === q.correct ? 1 : 0);
  return {frac, pts: frac > 0 ? Math.round(1000 * speed * frac * (q.double ? 2 : 1)) : 0};
}

function reveal(){
  const q = cur(); const before = ranked();
  S.players.forEach(p => { p.prevRank = before.indexOf(p) + 1; const r = scoreFor(q, S.answers[p.id]); S.results[p.id] = r; p.gain = r.pts; p.score += r.pts; });
  S.played = S.qi + 1;
  if (S.live && S.room) {
    if (S.unsubAns) { S.unsubAns(); S.unsubAns = null; }
    const sc = {}; S.players.forEach(p => sc[p.id] = {name:p.name, score:p.score, gain:p.gain, frac:S.results[p.id].frac, pts:S.results[p.id].pts});
    NET.set(`${S.room}/scores`, sc).catch(() => {});
  }
  S.phase = 'reveal'; S.paused = false; render();
}

function hostPrimary(){
  if (S.phase === 'setup') openLobby();
  else if (S.phase === 'lobby' && S.players.length) startGame();
  else if (S.phase === 'reveal') { if (S.qi === S.questions.length - 1) { S.phase = 'podium'; render(); } else { S.phase = 'leaderboard'; render(); } }
  else if (S.phase === 'leaderboard') { S.qi++; getReady(); }
}

function answer(a){
  if (S.phase !== 'question' || S.answers.you || S.paused) return;
  if (ROLE === 'student') {
    SS.answered = S.qi; SS.myAns = a; S.answers = {you:a}; renderStudent();
    NET.set(`${SS.room}/answers/${S.qi}/${NET.uid}`, clean(a)).catch(() => {});
    return;
  }
  S.answers.you = {...a, time:S.elapsed}; renderStudent(); updateLive();
}

function removePlayer(id){
  if (S.live && S.room) NET.remove(`${S.room}/players/${id}`).catch(() => {});
  S.players = S.players.filter(p => p.id !== id);
  delete S.answers[id]; delete S.plan[id];
  if (id === 'you') { S.you.joined = false; }
  else if (S.phase === 'lobby') S.botTarget = Math.max(0, S.botTarget - 1);
  render();
}

/* =========================================================
   TICK (100 ms)
   ========================================================= */
function updateLive(){
  const q = cur(); if (!q || S.phase !== 'question') return;
  const left = Math.max(0, q.T - S.elapsed);
  const bar = $('#ringBar'), lbl = $('#ringLbl');
  if (bar) bar.style.strokeDashoffset = (326.7 * (1 - left / q.T)).toFixed(1);
  if (lbl) { lbl.textContent = Math.ceil(left); $('#ring').classList.toggle('low', left <= 5); }
  const st = $('#sTimer'); if (st) st.style.width = (left / q.T * 100) + '%';
  const c = $('#ansCount'); if (c) c.textContent = Object.keys(S.answers).length;
}

setInterval(() => {
  if (ROLE === 'student') { if (S.phase === 'question' && !S.paused && S.you.joined) { S.elapsed += .1; updateLive(); } return; }
  if (S.paused) return;
  if (S.phase === 'lobby') {
    S.lobbyClock += .1;
    const bots = S.players.filter(p => p.bot).length;
    if (bots < S.botTarget && S.players.length < MAX_PLAYERS && S.lobbyClock >= S.nextBotAt) {
      addBot(); S.nextBotAt = S.lobbyClock + .12 + Math.random()*.45; renderHost();
      if (!S.you.joined && S.players.length >= MAX_PLAYERS) renderStudent();
    }
  } else if (S.phase === 'getready') {
    S.elapsed += .1; if (S.elapsed >= 2.4) startQuestion();
  } else if (S.phase === 'question') {
    const q = cur(); S.elapsed += .1;
    if (S.live && Math.floor(S.elapsed) !== Math.floor(S.elapsed - .1)) pushState();
    for (const id in S.plan) if (!S.answers[id] && S.elapsed >= S.plan[id].at) S.answers[id] = {...S.plan[id].ans, time:S.elapsed};
    updateLive();
    const all = S.players.length && S.players.every(p => S.answers[p.id]);
    if (all && S.doneAt === null) S.doneAt = S.elapsed;
    if (S.elapsed >= q.T || (S.doneAt !== null && S.elapsed - S.doneAt >= .6)) reveal();
  }
}, 100);

/* =========================================================
   EVENTS
   ========================================================= */
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-concept]'); if (!t) return;
  if (t.id === 'hostPrimary') return hostPrimary();
  if (t.id === 'toggleStudent') { S.showStudent = !S.showStudent; $('#stage').classList.toggle('solo', !S.showStudent); t.textContent = S.showStudent ? 'Hide student view' : 'Show student view'; return; }
  if (t.dataset.view) {
    $('#stage').classList.toggle('show-student', t.dataset.view === 'student');
    document.querySelectorAll('#viewTabs button').forEach(b => b.classList.toggle('on', b === t));
    updateTabs(); return;
  }
  if (t.dataset.mode) { S.settings.mode = t.dataset.mode; applyLayout(); return renderHost(); }
  if (t.dataset.hl) { S.settings.hl = t.dataset.hl === '1'; return renderHost(); }
  if (t.dataset.time) { S.settings.time = +t.dataset.time; return renderHost(); }
  if (t.dataset.remove) return removePlayer(t.dataset.remove);
  if (t.dataset.pick) return answer({choice:+t.dataset.pick});
  if (t.dataset.mv) { const [i,d] = t.dataset.mv.split(':').map(Number); moveItem(i, i+d); return; }
  const act = t.dataset.act;
  if (act === 'pause') { S.paused = !S.paused; render(); updateLive(); }
  if (act === 'skip') reveal();
  if (act === 'end') { S.wasPaused = S.paused; S.paused = true; S.confirmEnd = true; render(); updateLive(); }
  if (act === 'endCancel') { S.confirmEnd = false; S.paused = S.wasPaused; render(); updateLive(); }
  if (act === 'endResults') { S.confirmEnd = false; S.paused = false; S.phase = 'podium'; render(); }
  if (act === 'endSetup') { closeRoom(); S.confirmEnd = false; S.paused = false; S.phase = 'setup'; S.players = S.players.filter(p => p.id === 'you'); render(); }
  if (act === 'back') { closeRoom(); S.netError = ''; S.phase = 'setup'; S.players = S.players.filter(p => p.id === 'you'); render(); }
  if (act === 'retryLive') openLiveLobby();
  if (act === 'joinLive') joinLive();
  if (act === 'rejoin') { SS.ended = SS.removed = false; SS.joined = false; S.you.joined = false; renderStudent(); }
  if (act === 'join') joinYou();
  if (act === 'submitOrder') answer({order:[...S.myOrder]});
  if (act === 'again') { S.phase = 'lobby'; S.botTarget = S.players.filter(p=>p.bot).length; startGame(); }
  if (act === 'new') { closeRoom(); S.phase = 'setup'; S.players = S.players.filter(p => p.id === 'you'); render(); }
});

document.addEventListener('change', e => {
  const t = e.target;
  const toggle = (ids, on) => ids.forEach(id => on ? S.settings.concepts.add(id) : S.settings.concepts.delete(id));
  if (t.dataset.concept) toggle([t.dataset.concept], t.checked);
  else if (t.dataset.sub) toggle(SYLLABUS.flatMap(u => u.subs).find(s => s.id === t.dataset.sub).concepts.map(c => c.id), t.checked);
  else if (t.dataset.unit) toggle(SYLLABUS.find(u => u.id === t.dataset.unit).subs.flatMap(s => s.concepts.map(c => c.id)), t.checked);
  else return;
  renderHost();
});

document.addEventListener('input', e => {
  const t = e.target; if (t.id !== 'rCount' && t.id !== 'rBots') return;
  if (t.id === 'rCount') S.settings.count = +t.value; else S.settings.bots = +t.value;
  t.style.setProperty('--p', ((t.value - t.min) / Math.max(1, t.max - t.min) * 100) + '%');
  const span = t.parentElement.querySelector('label span');
  if (t.id === 'rCount') span.textContent = `${t.value} of ${t.max} available`; else span.textContent = `${t.value} + you`;
});
document.addEventListener('change', e => { if (e.target.id === 'rCount' || e.target.id === 'rBots') renderHost(); });

/* Join without a <form>: some embedded previews block form submission. */
function joinYou(){
  let name = $('#nick').value.trim().slice(0,15); if (!name) { $('#nick').focus(); return; }
  if (S.players.length >= MAX_PLAYERS) return;
  const used = new Set(S.players.map(p => p.name)); const base = name; let n = 2; while (used.has(name)) name = base.slice(0,13) + n++;
  S.you = {joined:true, name}; S.players.push({id:'you', name, bot:false, score:0}); render();
}

document.addEventListener('keydown', e => {
  if (e.target.id === 'nick' && e.key === 'Enter') { e.preventDefault(); joinYou(); return; }
  if ((e.target.id === 'liveNick' || e.target.id === 'pinIn') && e.key === 'Enter') { e.preventDefault(); joinLive(); return; }
  if (S.confirmEnd) { if (e.key === 'Escape') { S.confirmEnd = false; S.paused = S.wasPaused; render(); updateLive(); } if (e.code === 'Space') e.preventDefault(); return; }
  const inInput = /INPUT|TEXTAREA/.test(document.activeElement.tagName) && document.activeElement.type !== 'range';
  if (inInput) return;
  const item = document.activeElement.closest && document.activeElement.closest('.sitem');
  if (item && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    e.preventDefault(); const i = +item.dataset.i; moveItem(i, i + (e.key === 'ArrowUp' ? -1 : 1), true); return;
  }
  if (S.phase === 'question' && /^[1-4]$/.test(e.key)) { const q = cur(); if (q.type !== 'order') answer({choice:+e.key - 1}); return; }
  if (e.code === 'Space' && !item) { e.preventDefault(); const b = $('#hostPrimary'); if (b && !b.disabled) hostPrimary(); }
});

function moveItem(i, j, refocus){
  if (j < 0 || j >= S.myOrder.length) return;
  const [x] = S.myOrder.splice(i, 1); S.myOrder.splice(j, 0, x); renderStudent();
  if (refocus) { const el = document.querySelector(`.sitem[data-i="${j}"]`); el && el.focus(); }
}

/* =========================================================
   STUDENT — joining and following a live game
   ========================================================= */
function studentLiveView(){
  const logo = `<div class="s-logo">${ICON.logo}</div>`;
  if (SS.removed) return `<div class="s-center">${logo}<h2>You were removed from the game</h2><div class="muted">Your teacher removed you. You can join again with a different nickname.</div>
    <button class="btn" data-act="rejoin">Join a game</button></div>`;
  if (SS.ended) return `<div class="s-center">${logo}<h2>The game has ended</h2><div class="muted">Thanks for playing!</div><button class="btn" data-act="rejoin">Join another game</button></div>`;
  if (!SS.joined) {
    if (!liveAvailable()) return `<div class="s-center">${logo}<h2>EconRules Live</h2><div class="muted">Live games aren’t set up on this copy yet.</div>
      <a class="host-link" href="${esc(hostUrl())}">Teacher? Host a game →</a></div>`;
    return `<div class="s-center">${logo}<h2>Join a game</h2>
      <div class="join-form">
        <input class="input pin-input" id="pinIn" inputmode="numeric" maxlength="7" placeholder="Game PIN" autocomplete="off" value="${esc(SS.pin)}">
        <input class="input" id="liveNick" maxlength="15" placeholder="Nickname" autocomplete="off" value="${esc(S.you.name)}">
        <button class="btn wide" data-act="joinLive" ${SS.busy ? 'disabled' : ''}>${SS.busy ? 'Joining…' : 'Join'}</button>
        ${SS.err ? `<div class="join-err">${esc(SS.err)}</div>` : ''}
      </div>
      <a class="host-link" href="${esc(hostUrl())}">Teacher? Host a game →</a></div>`;
  }
  return sView();
}
async function joinLive(){
  const pin = ($('#pinIn').value || '').replace(/\D/g, ''); let name = $('#liveNick').value.trim().slice(0, 15);
  SS.pin = pin; S.you.name = name; SS.err = '';
  if (pin.length !== 6) { SS.err = 'Enter the 6-digit game PIN from the big screen.'; return renderStudent(); }
  if (!name) { SS.err = 'Choose a nickname.'; return renderStudent(); }
  SS.busy = true; renderStudent();
  try {
    const net = await getNet(); const room = `rooms/${pin}`;
    const st = await net.get(`${room}/state`);
    if (!st) throw {friendly:'No game found with that PIN. Check the PIN on the big screen.'};
    if (st.phase !== 'lobby') throw {friendly:'That game has already started. Ask your teacher about the next one.'};
    const players = (await net.get(`${room}/players`)) || {};
    if (Object.keys(players).length >= MAX_PLAYERS) throw {friendly:'This game is full (25 players).'};
    const used = new Set(Object.values(players).map(p => p.name)); const base = name; let n = 2;
    while (used.has(name)) name = base.slice(0, 13) + n++;
    await net.set(`${room}/players/${net.uid}`, {name, joinedAt:Date.now()});
    Object.assign(SS, {joined:true, room, ended:false, removed:false, scores:{}, answered:-1});
    S.you = {joined:true, name}; S.players = [{id:'you', name, score:0}]; S.phase = 'lobby';
    SS.unsubs = [
      net.on(`${room}/state`, onStudentState),
      net.on(`${room}/scores`, onStudentScores),
      net.on(`${room}/players/${net.uid}`, async v => {
        if (!SS.joined || v !== null || SS.ended) return;
        /* Our player entry vanished: either the teacher removed us, or the whole game was closed. */
        let st = null; try { st = await net.get(`${room}/state`); } catch (e) {}
        if (!SS.joined) return;
        if (st) SS.removed = true; else SS.ended = true;
        leaveLive(); renderStudent();
      }),
    ];
  } catch (err) { SS.err = err.friendly || friendlyNetError(err); }
  SS.busy = false; renderStudent();
}
function leaveLive(){ SS.unsubs.forEach(u => u()); SS.unsubs = []; SS.joined = false; S.you.joined = false; }
let studentKey = '';
function onStudentState(st){
  if (!st) { if (SS.joined) { SS.ended = true; leaveLive(); renderStudent(); } return; }
  S.phase = st.phase; S.qi = st.qi || 0;
  S.questions = new Array(st.total || 0); if (st.q) S.questions[S.qi] = st.q;
  S.answers = SS.answered === S.qi ? {you:SS.myAns} : {};
  const key = `${st.phase}:${S.qi}:${!!st.paused}:${!!(st.q && st.q.exp)}`;
  if (st.phase === 'question' && st.q) {
    if (!studentKey.startsWith(`question:${S.qi}:`) && st.q.type === 'order') S.myOrder = [...st.q.shown];
    S.elapsed = st.q.T - (st.left == null ? st.q.T : st.left);
  }
  S.paused = !!st.paused;
  syncStudentResults();
  if (key !== studentKey) { studentKey = key; renderStudent(); } else updateLive();
}
function syncStudentResults(){
  const me = SS.scores[NET.uid];
  S.results = me ? {you:{frac:me.frac || 0, pts:me.pts || 0}} : {};
  const list = Object.entries(SS.scores).map(([id, p]) => ({id: id === NET.uid ? 'you' : id, name:p.name, score:p.score || 0, gain:p.gain || 0}));
  S.players = list.length ? list : [{id:'you', name:S.you.name, score:0}];
  if (!S.players.find(p => p.id === 'you')) S.players.push({id:'you', name:S.you.name, score:0});
}
function onStudentScores(sc){
  SS.scores = sc || {}; syncStudentResults();
  if (['reveal','leaderboard','podium'].includes(S.phase)) renderStudent();
}

/* drag-and-drop for ordering */
let dragFrom = null;
document.addEventListener('dragstart', e => { const it = e.target.closest('.sitem'); if (!it) return; dragFrom = +it.dataset.i; it.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', ''); });
document.addEventListener('dragover', e => { const it = e.target.closest('.sitem'); if (!it || dragFrom === null) return; e.preventDefault(); document.querySelectorAll('.sitem.over').forEach(x => x.classList.remove('over')); it.classList.add('over'); });
document.addEventListener('drop', e => { const it = e.target.closest('.sitem'); if (!it || dragFrom === null) return; e.preventDefault(); const to = +it.dataset.i; const f = dragFrom; dragFrom = null; moveItem(f, to); });
document.addEventListener('dragend', () => { dragFrom = null; document.querySelectorAll('.sitem').forEach(x => x.classList.remove('over','dragging')); });

window.addEventListener('pagehide', () => { if (ROLE === 'host') closeRoom(); });
S.settings.mode = liveAvailable() ? 'live' : 'practice';
applyLayout();
render();
</script>
</body>
</html>
