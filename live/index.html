  {"id": "xs4", "concept": "FXSY", "level": "SL", "type": "diagram", "diagram": "fxPeg", "q": "Demand for baht has fallen from D₁ to D₂, but the government wants to keep the exchange rate at the peg. What must the central bank do?", "options": ["Buy baht with its foreign currency reserves", "Sell baht", "Cut interest rates", "Do nothing"], "answer": 0, "exp": "At the peg there is now excess supply of baht; the central bank must buy it up, shifting demand back to D₁.", "rw": "This is exactly what the Bank of Thailand did before it ran out of reserves in 1997.", "time": 1.25, "double": true},
  {"id": "xs5", "concept": "FXSY", "level": "SL", "type": "mc", "q": "In August 2015 China’s central bank cut the yuan’s official reference rate by about 2%. A deliberate cut in the value of a fixed or managed currency is called…", "options": ["Devaluation", "Depreciation", "Revaluation", "Appreciation"], "answer": 0, "exp": "Devaluation is a government decision; depreciation is a market-driven fall.", "rw": "The surprise move unsettled world financial markets for several weeks."},
  {"id": "xs6", "concept": "FXSY", "level": "SL", "type": "mc", "q": "The Japanese yen fell against the dollar in 2022 because of market forces, not a government decision. This fall is called…", "options": ["Depreciation", "Devaluation", "Revaluation", "Deflation"], "answer": 0, "exp": "A fall in a floating currency caused by demand and supply is a depreciation.", "rw": "Japan’s finance ministry did intervene in 2022 to slow the yen’s fall, but it mostly floats."},
  {"id": "xs7", "concept": "FXSY", "level": "SL", "type": "mc", "q": "Which is an advantage of a fixed exchange rate, such as Hong Kong’s peg to the dollar?", "options": ["Certainty for traders and investors", "The central bank can set interest rates freely", "It never needs foreign reserves", "It automatically removes trade deficits"], "answer": 0, "exp": "Firms know what the exchange rate will be, making trade and investment planning easier.", "rw": "The stable HK dollar is one reason Hong Kong became a major financial centre."},
  {"id": "xs8", "concept": "FXSY", "level": "SL", "type": "mc", "q": "Hong Kong’s interest rates tend to follow those set by the US Federal Reserve. Why?", "options": ["Keeping the peg means giving up independent monetary policy", "Hong Kong uses the US dollar", "The IMF requires it", "It has no central bank of any kind"], "answer": 0, "exp": "If Hong Kong set very different rates, money would flow in or out and threaten the peg.", "rw": "When the Fed raised rates in 2022, Hong Kong’s rates rose too."},
  {"id": "xs9", "concept": "FXSY", "level": "SL", "type": "mc", "q": "The Bank of Thailand runs a managed float. What does this mean?", "options": ["The baht mostly floats, but the central bank intervenes to smooth sharp swings", "The rate is fixed by law", "The baht has no value", "The rate is set by the IMF"], "answer": 0, "exp": "A managed float lets the market set the rate while the central bank limits excessive volatility.", "rw": "Many emerging economies, including India and Indonesia, also manage their floating currencies."},
  {"id": "xs10", "concept": "FXSY", "level": "SL", "type": "mc", "q": "In January 2015 the Swiss National Bank suddenly stopped capping the franc against the euro. What happened?", "options": ["The franc jumped sharply in value", "The franc collapsed", "Switzerland joined the euro", "The franc was fixed to the dollar"], "answer": 0, "exp": "Without the central bank selling francs to hold it down, strong demand pushed the franc up immediately.", "rw": "The franc rose by around 20–30% against the euro within minutes, shocking financial markets."},
  {"id": "xs11", "concept": "FXSY", "level": "SL", "type": "mc", "q": "How can a central bank raise its currency’s value without spending reserves?", "options": ["Raise interest rates to attract foreign savings", "Cut interest rates", "Print more money", "Lower taxes"], "answer": 0, "exp": "Higher interest rates raise demand for the currency from foreign investors.", "rw": "Some central banks raised rates sharply in 2022 to support their currencies against the strong dollar."},
  {"id": "xs12", "concept": "FXSY", "level": "SL", "type": "order", "q": "Put the steps of a central bank defending its currency under attack in order.", "items": ["Speculators sell the currency, pushing it below its target", "The central bank buys its own currency with foreign reserves", "It may also raise interest rates to attract capital", "If reserves run out, it may be forced to devalue or float"], "exp": "Defending a peg costs reserves; when they run low, the peg can break.", "rw": "This sequence played out in the UK in 1992 and in Thailand in 1997."},
  {"id": "xs13", "concept": "FXSY", "level": "SL", "type": "mc", "q": "Saudi Arabia pegs the riyal to the US dollar. Why might a major oil exporter choose this?", "options": ["Oil is priced in dollars, so the peg keeps export revenue stable in riyals", "To make oil cheaper", "To join the eurozone", "To set interest rates independently"], "answer": 0, "exp": "With oil sold in dollars, a dollar peg reduces uncertainty for the government and businesses.", "rw": "The riyal has been fixed at 3.75 per US dollar since the 1980s."},
  {"id": "xs14", "concept": "FXSY", "level": "SL", "type": "mc", "q": "Which sign suggests a currency is overvalued under a fixed exchange rate?", "options": ["Persistent current account deficits and falling foreign reserves", "Large current account surpluses", "Rising foreign reserves", "Strong export growth"], "answer": 0, "exp": "An overvalued peg makes exports uncompetitive, and the central bank must spend reserves to defend it.", "rw": "Thailand showed both warning signs in the months before the 1997 crisis."},
  {"id": "xs15", "concept": "FXSY", "level": "SL", "type": "order", "q": "Order these exchange rate systems from least to most central bank intervention.", "items": ["Freely floating", "Managed float", "Fixed (pegged) exchange rate"], "exp": "A free float has no intervention; a managed float has some; a peg needs constant management.", "rw": "The US dollar floats freely, the baht is a managed float, and the HK dollar is pegged."},
  {"id": "bs1", "concept": "BOPS", "level": "SL", "type": "mc", "q": "Thailand earns money from foreign tourists staying in Phuket. Where is this recorded in Thailand’s balance of payments?", "options": ["Current account: exports of services", "Capital account", "Financial account: direct investment", "Current account: primary income"], "answer": 0, "exp": "Tourists buying Thai hotel stays and meals are buying Thai services: a service export.", "rw": "Tourism has been one of Thailand’s biggest sources of foreign currency."},
  {"id": "bs2", "concept": "BOPS", "level": "SL", "type": "mc", "q": "Filipino workers abroad send money home to their families. In the Philippines’ balance of payments, this is…", "options": ["Secondary income (current transfers) in the current account", "Financial account: portfolio investment", "Capital account", "Exports of goods"], "answer": 0, "exp": "Remittances are transfers, with nothing given in return, so they count as secondary income.", "rw": "Remittances from Filipinos working overseas are worth close to a tenth of the Philippines’ GDP."},
  {"id": "bs3", "concept": "BOPS", "level": "SL", "type": "mc", "q": "Toyota builds a new factory in Thailand. In Thailand’s balance of payments, this is…", "options": ["Financial account: foreign direct investment (an inflow)", "Current account: exports of goods", "Capital account", "Secondary income"], "answer": 0, "exp": "Buying or building productive assets abroad is direct investment, recorded in the financial account.", "rw": "Japanese firms have long been among the largest foreign direct investors in Thailand."},
  {"id": "bs4", "concept": "BOPS", "level": "SL", "type": "mc", "q": "Profits that a Japanese-owned car plant in Thailand sends back to Japan appear in Thailand’s balance of payments as…", "options": ["Primary income (an outflow) in the current account", "Exports of services", "The capital account", "The financial account"], "answer": 0, "exp": "Profits, interest and dividends paid to foreign owners are primary income outflows.", "rw": "Countries with lots of foreign-owned firms often have large primary income outflows."},
  {"id": "bs5", "concept": "BOPS", "level": "SL", "type": "mc", "q": "A Thai investor buys shares in Apple. In Thailand’s balance of payments, this is…", "options": ["Financial account: portfolio investment (an outflow)", "Current account: imports of goods", "Capital account", "Primary income"], "answer": 0, "exp": "Buying foreign shares without control of the firm is portfolio investment in the financial account.", "rw": "Thai investors increasingly buy US shares through online trading apps."},
  {"id": "bs6", "concept": "BOPS", "level": "SL", "type": "mc", "q": "Which of these is recorded in the capital account?", "options": ["Debt forgiveness and the sale of non-produced assets such as patents", "Exports of rice", "Remittances from workers abroad", "Purchases of foreign shares"], "answer": 0, "exp": "The capital account is small: capital transfers and non-produced, non-financial assets.", "rw": "When rich countries cancel debts owed by poor countries, it is recorded as a capital transfer."},
  {"id": "bs7", "concept": "BOPS", "level": "SL", "type": "order", "q": "Put the steps for calculating a current account balance in order.", "items": ["Find the balance of trade in goods (exports − imports)", "Add the balance of trade in services", "Add net primary income", "Add net secondary income"], "exp": "Current account = goods balance + services balance + net primary income + net secondary income.", "rw": "Central banks, such as the Bank of Thailand, publish these figures every month."},
  {"id": "bs8", "concept": "BOPS", "level": "HL", "type": "mc", "q": "A country has goods exports of $200bn and goods imports of $230bn. Its services balance is +$40bn, net primary income is −$15bn and net secondary income is +$10bn. What is its current account balance?", "options": ["+$5bn", "−$30bn", "+$25bn", "−$5bn"], "answer": 0, "exp": "(200 − 230) + 40 − 15 + 10 = +$5bn.", "rw": "A country can run a deficit in goods but a surplus overall, thanks to services such as tourism.", "time": 1.5, "double": true},
  {"id": "bs9", "concept": "BOPS", "level": "SL", "type": "mc", "q": "Why must the balance of payments always balance overall?", "options": ["A current account deficit must be financed by a surplus on the capital and financial accounts", "Governments make it balance by law", "Imports always equal exports", "Central banks print money to balance it"], "answer": 0, "exp": "Every purchase from abroad must be paid for, by earning, borrowing or selling assets, so the accounts sum to zero.", "rw": "In practice, an “errors and omissions” item makes up for imperfect data."},
  {"id": "bs10", "concept": "BOPS", "level": "HL", "type": "mc", "q": "A country has a current account deficit of $12bn and a capital account surplus of $2bn. Ignoring errors and omissions, what is its financial account balance?", "options": ["+$10bn (a surplus)", "−$10bn (a deficit)", "+$14bn", "−$14bn"], "answer": 0, "exp": "Current + capital + financial = 0, so −12 + 2 + financial = 0, giving financial = +$10bn.", "rw": "Countries with current account deficits rely on foreign investment or borrowing to fill the gap.", "time": 1.5},
  {"id": "bs11", "concept": "BOPS", "level": "SL", "type": "mc", "q": "Which is a debit (an outflow) in Thailand’s current account?", "options": ["Thai tourists spending money in Japan", "Foreign tourists visiting Chiang Mai", "Rice exports to China", "Money sent home by Thai workers abroad"], "answer": 0, "exp": "Thais travelling abroad buy foreign services, which is an import.", "rw": "Japan is one of the most popular overseas destinations for Thai tourists."},
  {"id": "bs12", "concept": "BOPS", "level": "SL", "type": "mc", "q": "Changes in the Bank of Thailand’s foreign currency reserves are recorded in…", "options": ["The financial account (reserve assets)", "The current account", "The capital account", "Primary income"], "answer": 0, "exp": "Reserves are financial assets held by the central bank, so changes in them sit in the financial account.", "rw": "Thailand built up large reserves after 1997 to protect against future crises."},
  {"id": "bs13", "concept": "BOPS", "level": "SL", "type": "mc", "q": "A country records a “trade in goods deficit”. This means…", "options": ["Imports of goods are greater than exports of goods", "Exports of goods are greater than imports of goods", "The current account must be in surplus", "The capital account is in deficit"], "answer": 0, "exp": "The goods balance compares exports and imports of physical goods only.", "rw": "The US has run a large trade in goods deficit for decades."},
  {"id": "bs14", "concept": "BOPS", "level": "SL", "type": "mc", "q": "A Bangkok hospital treats a patient who flies in from the Middle East. In Thailand’s balance of payments this is…", "options": ["An export of services", "An import of services", "A capital transfer", "Direct investment"], "answer": 0, "exp": "A foreign resident buying a Thai service is a service export, even though it happens in Thailand.", "rw": "Thailand is one of the world’s leading destinations for medical tourism."},
  {"id": "bs15", "concept": "BOPS", "level": "SL", "type": "order", "q": "Put the three accounts of the balance of payments in order, starting with the one that records everyday trade.", "items": ["Current account: trade in goods and services, and income", "Capital account: capital transfers and non-produced assets", "Financial account: investment flows and reserves"], "exp": "The current account records trade and income; the capital and financial accounts record asset and investment flows.", "rw": "IB exam questions often ask you to place a transaction in the correct account."},
  {"id": "bc1", "concept": "BOPC", "level": "SL", "type": "mc", "q": "The USA has run a current account deficit for decades. How is such a persistent deficit financed?", "options": ["By a financial account surplus: foreigners buy US assets or lend to the US", "By printing money", "By cutting exports", "It needs no financing"], "answer": 0, "exp": "Paying for extra imports needs money from abroad: foreign investment and lending fill the gap.", "rw": "Foreign governments and investors hold trillions of dollars of US government bonds."},
  {"id": "bc2", "concept": "BOPC", "level": "SL", "type": "mc", "q": "Thailand’s current account went into deficit in 2021 and 2022. Which was a major reason?", "options": ["Tourism revenue collapsed during the COVID-19 pandemic", "Rice exports boomed", "Oil imports stopped", "Remittances doubled"], "answer": 0, "exp": "Tourism is a big service export for Thailand, so losing it removed a major source of current account credits.", "rw": "Higher oil import prices in 2022 added to the deficit."},
  {"id": "bc3", "concept": "BOPC", "level": "SL", "type": "mc", "q": "Which is a likely consequence of a large, persistent current account deficit?", "options": ["Rising foreign debt and pressure on the currency to depreciate", "A stronger currency", "Lower foreign debt", "Rising foreign reserves"], "answer": 0, "exp": "Financing deficits means borrowing or selling assets abroad, and more of the currency is supplied to buy imports.", "rw": "Large deficits were one warning sign before Thailand’s 1997 crisis."},
  {"id": "bc4", "concept": "BOPC", "level": "SL", "type": "mc", "q": "Germany has run large current account surpluses for many years. Why do other countries sometimes criticise this?", "options": ["One country’s surplus means deficits elsewhere, and it may reflect weak domestic spending", "Surpluses always cause hyperinflation", "Germany has no exports", "It reduces world trade to zero"], "answer": 0, "exp": "Critics argue Germany could spend more at home, which would boost demand for other countries’ exports.", "rw": "The IMF and the US have both urged Germany to raise domestic investment."},
  {"id": "bc5", "concept": "BOPC", "level": "SL", "type": "mc", "q": "Which is an expenditure-switching policy to reduce a current account deficit?", "options": ["Putting tariffs on imports, or letting the currency depreciate", "Raising income taxes", "Cutting government spending", "Raising interest rates"], "answer": 0, "exp": "Expenditure switching makes imports dearer or exports cheaper, so spending switches to domestic goods.", "rw": "The US used tariffs on Chinese goods from 2018, partly aiming to cut its trade deficit."},
  {"id": "bc6", "concept": "BOPC", "level": "SL", "type": "mc", "q": "Which is an expenditure-reducing policy to reduce a current account deficit?", "options": ["Contractionary fiscal policy, such as higher taxes", "A tariff on imports", "Devaluing the currency", "Export subsidies"], "answer": 0, "exp": "Cutting total spending reduces spending on imports too, but it also slows growth.", "rw": "Countries in crisis, such as Greece in the 2010s, used spending cuts that sharply reduced imports."},
  {"id": "bc7", "concept": "BOPC", "level": "SL", "type": "mc", "q": "Why are supply-side policies a long-term way to reduce a current account deficit?", "options": ["They raise productivity and make exports more competitive", "They raise export prices", "They work instantly", "They cut exports"], "answer": 0, "exp": "Better skills, infrastructure and technology lower costs and improve quality, helping exporters.", "rw": "South Korea’s heavy investment in education and technology helped it become a major exporter."},
  {"id": "bc8", "concept": "BOPC", "level": "SL", "type": "order", "q": "A government raises income taxes to cut a current account deficit. Put the effects in order.", "items": ["Households’ disposable income falls", "Spending on all goods falls", "Spending on imports falls", "The current account deficit narrows, but growth may slow"], "exp": "Expenditure-reducing policies work by cutting overall spending, including on imports.", "rw": "This trade-off between the current account and growth is a common IB evaluation point."},
  {"id": "bc9", "concept": "BOPC", "level": "SL", "type": "mc", "q": "When the US put tariffs on Chinese goods in 2018, what drawback of using tariffs to cut a deficit did it show?", "options": ["Trading partners may retaliate with tariffs of their own", "Imports became cheaper", "US exports automatically rose", "The deficit disappeared immediately"], "answer": 0, "exp": "Retaliation can hit the country’s own exporters, offsetting any gains.", "rw": "China responded with tariffs on US goods such as soybeans, hurting American farmers."},
  {"id": "bc10", "concept": "BOPC", "level": "SL", "type": "mc", "q": "A current account deficit is less worrying if it is caused by…", "options": ["Imports of capital goods that will raise future productivity", "Imports of luxury consumer goods financed by short-term loans", "Falling export competitiveness", "Money flowing out of the country"], "answer": 0, "exp": "Importing machinery can boost future output and exports, helping the country repay later.", "rw": "Fast-growing economies often run deficits while they import machinery to build new industries."},
  {"id": "bc11", "concept": "BOPC", "level": "HL", "type": "mc", "q": "A country’s demand for exports has a PED of 0.3 and its demand for imports has a PED of 0.4. Will a depreciation improve its current account, according to the Marshall–Lerner condition?", "options": ["No, because 0.3 + 0.4 is less than 1", "Yes, because 0.3 + 0.4 is greater than 0", "Yes, always", "No, because exports are larger than imports"], "answer": 0, "exp": "The condition needs PEDx + PEDm > 1. Here the sum is 0.7, so the current account would worsen.", "rw": "Short-run trade elasticities are often low, which is why the J-curve dips first.", "time": 1.5, "double": true},
  {"id": "bc12", "concept": "BOPC", "level": "HL", "type": "diagram", "diagram": "jcurve", "q": "On this J-curve, why does the current account eventually improve after the depreciation?", "options": ["Demand for exports and imports becomes more price elastic over time", "Import prices fall back", "Interest rates fall", "Exports become more expensive"], "answer": 0, "exp": "Over time, foreign buyers switch to the cheaper exports and domestic buyers switch away from dearer imports.", "rw": "Economists studying the UK after 2016 debated how strong this improvement was.", "time": 1.25},
  {"id": "bc13", "concept": "BOPC", "level": "SL", "type": "mc", "q": "China and Germany run large current account surpluses. Which is a risk of a large surplus?", "options": ["Upward pressure on the currency and criticism or retaliation from trading partners", "Rising foreign debt", "A weaker currency", "Falling foreign reserves"], "answer": 0, "exp": "Surplus countries face pressure for their currencies to rise and accusations of unfair trade.", "rw": "The US has repeatedly accused China of keeping the yuan artificially weak to support its surplus."},
  {"id": "bc14", "concept": "BOPC", "level": "SL", "type": "mc", "q": "Why might a fall in world oil prices improve Thailand’s current account?", "options": ["Thailand imports far more oil than it produces, so its import bill falls", "Thailand is the world’s largest oil exporter", "Oil is a service export", "Tourists spend more on oil"], "answer": 0, "exp": "Lower oil prices cut the value of Thailand’s imports, improving its current account.", "rw": "Oil price swings have a big effect on Thailand’s trade balance."},
  {"id": "bc15", "concept": "BOPC", "level": "SL", "type": "order", "q": "A country’s current account deficit is financed by short-term foreign loans. Put a possible chain of events in order.", "items": ["Foreign lenders lose confidence", "Money flows out of the country", "The currency depreciates sharply", "Foreign currency debts become much harder to repay"], "exp": "Relying on short-term “hot money” can lead to a sudden crisis if lenders pull out.", "rw": "This happened in Thailand and other Asian economies in 1997."},
  // ---------- Free trade and protection ----------
  {"id": "trg1", "concept": "GAIN", "level": "SL", "type": "mc", "q": "Vietnam’s exports of electronics, including Samsung phones assembled there, soared after it opened up to trade and foreign investment. Which benefit of trade does this show?", "options": ["Access to world markets lets a country specialise, raising output and jobs", "Trade always destroys jobs", "Imports fall to zero", "Prices rise for consumers"], "answer": 0, "exp": "Selling to the whole world, not just the home market, lets a country expand the industries it is good at.", "rw": "Samsung makes around half of its smartphones in Vietnam, making electronics one of Vietnam’s biggest exports."},
  {"id": "trg2", "concept": "GAIN", "level": "SL", "type": "mc", "q": "Shoppers in Bangkok can buy Japanese snacks, Korean cosmetics and Australian beef. Which benefit of trade does this show?", "options": ["Greater choice for consumers", "Higher prices", "Less competition", "Fewer goods available"], "answer": 0, "exp": "Trade widens the range of goods and services available to consumers.", "rw": "Imported foods and brands are a common sight in Thai supermarkets and convenience stores."},
  {"id": "trg3", "concept": "GAIN", "level": "SL", "type": "mc", "q": "Thai car plants export vehicles across ASEAN and beyond. How does access to these export markets help them lower costs?", "options": ["A larger market allows bigger output and economies of scale", "Their wages rise", "They pay more tariffs", "They make fewer cars"], "answer": 0, "exp": "Producing for export as well as the home market lets firms spread fixed costs over more units.", "rw": "Thailand produces well over a million vehicles a year, with a large share exported."},
  {"id": "trg4", "concept": "GAIN", "level": "SL", "type": "mc", "q": "Thai firms that face competition from imports often improve their products and cut costs. Which benefit of trade is this?", "options": ["Competition pushes domestic firms to become more efficient and innovative", "Domestic prices always rise", "Firms stop investing", "Quality falls"], "answer": 0, "exp": "Foreign competition reduces the market power of domestic firms and rewards efficiency.", "rw": "Local coffee chains have had to compete with international brands on quality and service."},
  {"id": "trg5", "concept": "GAIN", "level": "SL", "type": "mc", "q": "Thailand imports most of the crude oil it uses. Which benefit of trade does this show?", "options": ["Access to resources a country lacks or cannot produce cheaply", "Less choice for consumers", "Fewer jobs", "Higher production costs"], "answer": 0, "exp": "Trade gives countries access to goods and raw materials they cannot produce, or can only produce at high cost.", "rw": "Thailand produces some oil and gas, but far less than it consumes."},
  {"id": "trg6", "concept": "GAIN", "level": "SL", "type": "mc", "q": "How did Japanese car makers investing in Thailand spread technology to the Thai economy?", "options": ["They trained local workers and suppliers in new methods and skills", "They banned technology", "They took technology out of Thailand", "They only used imported workers"], "answer": 0, "exp": "Foreign investment and imported machinery can bring new technology, management methods and skills.", "rw": "Many Thai auto-parts suppliers grew up supplying Toyota, Honda and other Japanese makers."},
  {"id": "trg7", "concept": "GAIN", "level": "SL", "type": "mc", "q": "Cambodia earns most of its export revenue from garments. Why does earning foreign currency through exports matter for a developing country?", "options": ["It pays for imports such as machinery, fuel and medicines", "It automatically raises inflation", "It lowers living standards", "It is not needed"], "answer": 0, "exp": "Developing countries need foreign currency to import capital goods and essentials they cannot produce.", "rw": "Garment factories employ hundreds of thousands of Cambodian workers, mostly women."},
  {"id": "trg8", "concept": "GAIN", "level": "SL", "type": "order", "q": "A country opens up to trade. Put the chain in order.", "items": ["The country specialises in goods it produces at a low opportunity cost", "Output of those goods rises", "It exports its surplus and imports other goods", "Consumers can enjoy more goods than without trade"], "exp": "Specialisation and exchange let countries consume beyond what they could produce alone.", "rw": "This is the basic logic behind trade agreements such as RCEP and the WTO."},
  {"id": "trg9", "concept": "GAIN", "level": "SL", "type": "mc", "q": "After the ASEAN–China free trade deal cut tariffs, cheap Chinese garlic flooded into Thailand. Which group in Thailand was most likely to lose?", "options": ["Thai garlic farmers who compete with the imports", "Thai consumers", "Thai exporters", "Thai firms using garlic as an input"], "answer": 0, "exp": "Trade creates winners and losers: producers who compete with imports can lose out.", "rw": "Farmers in northern Thailand complained that cheap imported garlic pushed down their prices."},
  {"id": "trg10", "concept": "GAIN", "level": "SL", "type": "mc", "q": "Free trade is said to lead to a more efficient use of the world’s resources. Why?", "options": ["Goods are produced where they can be made at the lowest opportunity cost", "Every country produces everything itself", "Prices are fixed by governments", "Governments decide all production"], "answer": 0, "exp": "With free trade, production moves to the places that can make each good most efficiently.", "rw": "This idea underpins the WTO’s aim of lowering trade barriers worldwide."},
  {"id": "trg11", "concept": "GAIN", "level": "SL", "type": "mc", "q": "Singapore has almost no farmland, yet it is one of the world’s richest countries. How does trade help?", "options": ["It imports most of its food and specialises in services and high-tech goods", "It grows all its own food", "It bans imports", "It avoids trade completely"], "answer": 0, "exp": "Trade lets Singapore specialise in what it does best and buy the rest from abroad.", "rw": "Singapore imports over 90% of its food."},
  {"id": "trg12", "concept": "GAIN", "level": "SL", "type": "mc", "q": "In the 2000s, cheap manufactured goods from China helped keep prices low in many countries. Which benefit of trade does this show?", "options": ["Competition from low-cost imports can help keep inflation down", "Imports raise all prices", "Trade increases costs", "Exports reduce supply"], "answer": 0, "exp": "Cheaper imports lower the cost of living and put pressure on domestic firms to keep prices down.", "rw": "Economists have linked lower prices for clothing and electronics in rich countries to imports from China."},
  {"id": "trg13", "concept": "GAIN", "level": "SL", "type": "order", "q": "Japanese car makers invest in Thailand. Put the effects in order.", "items": ["Foreign firms build factories in Thailand", "Thai workers and suppliers gain skills and technology", "Local suppliers become more productive", "Thailand’s exports and incomes grow"], "exp": "Foreign direct investment can bring capital, technology and access to export markets.", "rw": "The car industry is one of Thailand’s largest manufacturing employers."},
  {"id": "trg14", "concept": "GAIN", "level": "SL", "type": "mc", "q": "Which is a possible DISADVANTAGE of free trade for a developing country?", "options": ["New domestic industries may struggle against large, established foreign firms", "Consumers get more choice", "Prices fall", "Exports rise"], "answer": 0, "exp": "Without protection, young industries may be wiped out before they can grow.", "rw": "This concern lies behind the infant industry argument for protection."},
  {"id": "trg15", "concept": "GAIN", "level": "SL", "type": "mc", "q": "After the Second World War, France and Germany pooled their coal and steel industries in 1951 to make war between them “materially impossible”. Which possible benefit of trade does this show?", "options": ["Countries that depend on each other through trade have more to lose from conflict", "Trade creates armies", "Trade bans diplomacy", "Exports are weapons"], "answer": 0, "exp": "Close trade links raise the cost of conflict between countries.", "rw": "The European Coal and Steel Community was the starting point for today’s European Union."},
  {"id": "tra1", "concept": "ABSC", "level": "HL", "type": "diagram", "diagram": "ppfCA", "q": "The diagram uses hypothetical figures to show how much rice or how many cars Thailand and Japan can make with their resources. Which country has an absolute advantage in rice?", "options": ["Thailand: it can produce 8 units of rice to Japan’s 6", "Japan: it can produce more rice", "Neither country", "Both countries equally"], "answer": 0, "exp": "Absolute advantage means producing more of a good with the same resources: Thailand 8 vs Japan 6.", "rw": "Thailand is one of the world’s biggest rice exporters.", "time": 1.25},
  {"id": "tra2", "concept": "ABSC", "level": "HL", "type": "diagram", "diagram": "ppfCA", "q": "What is Thailand’s opportunity cost of producing 1 car?", "options": ["2 units of rice", "0.5 units of rice", "1 unit of rice", "4 units of rice"], "answer": 0, "exp": "Thailand gives up 8 rice for 4 cars, so 1 car costs 8 ÷ 4 = 2 units of rice.", "rw": "Opportunity cost is the key to comparative advantage: what you give up, not how much you can make.", "time": 1.5},
  {"id": "tra3", "concept": "ABSC", "level": "HL", "type": "diagram", "diagram": "ppfCA", "q": "What is Japan’s opportunity cost of producing 1 unit of rice?", "options": ["1 car", "0.5 cars", "2 cars", "6 cars"], "answer": 0, "exp": "Japan gives up 6 cars for 6 rice, so 1 rice costs 1 car.", "rw": "Japan’s land is scarce and expensive, which raises its cost of growing rice.", "time": 1.5},
  {"id": "tra4", "concept": "ABSC", "level": "HL", "type": "diagram", "diagram": "ppfCA", "q": "Which country has a comparative advantage in rice?", "options": ["Thailand: its opportunity cost of rice (0.5 cars) is lower than Japan’s (1 car)", "Japan: its opportunity cost of rice is lower", "Japan, because it can make more cars", "Neither country"], "answer": 0, "exp": "Comparative advantage goes to the country with the lower opportunity cost: Thailand gives up only 0.5 cars per unit of rice.", "rw": "Real trade follows this pattern: Thailand exports rice to Japan, and Japan exports cars and parts to Thailand.", "time": 1.5, "double": true},
  {"id": "tra5", "concept": "ABSC", "level": "HL", "type": "diagram", "diagram": "ppfCA", "q": "Which terms of trade would let BOTH countries gain?", "options": ["1 car for 1.5 units of rice", "1 car for 3 units of rice", "1 car for 0.5 units of rice", "1 car for 2.5 units of rice"], "answer": 0, "exp": "A car costs Thailand 2 rice and Japan 1 rice. Any price between 1 and 2 rice per car benefits both.", "rw": "In reality, terms of trade are set by world prices, which can move against commodity exporters.", "time": 1.5, "double": true},
  {"id": "tra6", "concept": "ABSC", "level": "HL", "type": "diagram", "diagram": "ppfAbs", "q": "In this hypothetical example, Thailand can produce more of BOTH goods than Laos. Can the two countries still gain from trade?", "options": ["Yes, as long as their opportunity costs differ", "No, Thailand should produce everything", "No, because Laos has no advantage", "Only if Laos subsidises its exports"], "answer": 0, "exp": "Gains from trade depend on comparative advantage (different opportunity costs), not absolute advantage.", "rw": "Laos trades heavily with Thailand, exporting electricity from hydropower dams and importing Thai manufactured goods.", "time": 1.25, "double": true},
  {"id": "tra7", "concept": "ABSC", "level": "HL", "type": "diagram", "diagram": "ppfAbs", "q": "In which good does Laos have a comparative advantage?", "options": ["Rice: 1 rice costs Laos 0.67 cars, compared with 1 car for Thailand", "Cars", "Both goods", "Neither good"], "answer": 0, "exp": "Laos: 3 rice or 2 cars, so 1 rice costs 2/3 of a car. Thailand: 1 rice costs 1 car. Laos has the lower cost in rice.", "rw": "Even a country that is less productive in everything has a comparative advantage in something.", "time": 1.5},
  {"id": "tra8", "concept": "ABSC", "level": "HL", "type": "diagram", "diagram": "ppfTrade", "q": "Thailand specialises at point S (all rice) and trades rice for cars. What does point C show?", "options": ["Consumption beyond Thailand’s PPF, made possible by trade", "Unemployment in Thailand", "What Thailand can produce without trade", "An impossible point, even with trade"], "answer": 0, "exp": "By specialising and trading, Thailand can consume a combination it could never produce on its own.", "rw": "This is the core diagram behind the gains from trade.", "time": 1.25},
  {"id": "tra9", "concept": "ABSC", "level": "HL", "type": "mc", "q": "Absolute advantage means a country…", "options": ["Can produce more of a good than another country using the same resources", "Has a lower opportunity cost of producing a good", "Exports the most goods", "Has the largest population"], "answer": 0, "exp": "Absolute advantage is about productivity: more output from the same inputs.", "rw": "China has an absolute advantage in producing many manufactured goods because of its scale and efficiency."},
  {"id": "tra10", "concept": "ABSC", "level": "HL", "type": "mc", "q": "Comparative advantage means a country…", "options": ["Can produce a good at a lower opportunity cost than another country", "Can produce more of every good", "Has the cheapest labour", "Has no trade barriers"], "answer": 0, "exp": "Comparative advantage compares what each country gives up to make a good.", "rw": "Ricardo’s idea of comparative advantage, published in 1817, is still the foundation of trade theory."},
  {"id": "tra11", "concept": "ABSC", "level": "HL", "type": "mc", "q": "Bangladesh is one of the world’s largest clothing exporters, even though some countries could make clothes with more advanced technology. Which concept best explains this?", "options": ["Comparative advantage", "Absolute advantage in every good", "Protectionism", "Dumping"], "answer": 0, "exp": "Bangladesh’s low opportunity cost in labour-intensive clothing gives it a comparative advantage.", "rw": "Clothing makes up over 80% of Bangladesh’s export earnings."},
  {"id": "tra12", "concept": "ABSC", "level": "HL", "type": "mc", "q": "In a day, a Thai worker can produce 10 kg of rice or 2 shirts; a Bangladeshi worker can produce 4 kg of rice or 4 shirts (hypothetical figures). Who has the comparative advantage in shirts?", "options": ["Bangladesh: 1 shirt costs 1 kg of rice, compared with 5 kg in Thailand", "Thailand", "Neither", "Both"], "answer": 0, "exp": "Thailand: 1 shirt = 10 ÷ 2 = 5 kg of rice. Bangladesh: 1 shirt = 4 ÷ 4 = 1 kg. Bangladesh has the lower opportunity cost.", "rw": "This pattern matches reality: Bangladesh specialises in garments, Thailand in rice and more advanced manufacturing.", "time": 1.5},
  {"id": "tra13", "concept": "ABSC", "level": "HL", "type": "mc", "q": "Using the same figures (Thai worker: 10 kg of rice or 2 shirts), what is the Thai worker’s opportunity cost of 1 kg of rice?", "options": ["0.2 shirts", "5 shirts", "2 shirts", "0.5 shirts"], "answer": 0, "exp": "10 kg of rice costs 2 shirts, so 1 kg costs 2 ÷ 10 = 0.2 shirts.", "rw": "Opportunity costs are reciprocals: if 1 shirt costs 5 kg of rice, 1 kg of rice costs 1/5 of a shirt.", "time": 1.5},
  {"id": "tra14", "concept": "ABSC", "level": "HL", "type": "order", "q": "Put the steps for working out comparative advantage from a table in order.", "items": ["Find each country’s output of both goods using the same resources", "Calculate each country’s opportunity cost of each good", "Compare the opportunity costs between countries", "The country with the lower opportunity cost specialises in that good"], "exp": "Comparative advantage always comes down to comparing opportunity costs.", "rw": "IB Paper 3 regularly asks for exactly these calculations."},
  {"id": "tra15", "concept": "ABSC", "level": "HL", "type": "mc", "q": "David Ricardo’s famous example showed England and Portugal both gaining by trading cloth and wine, even though Portugal was better at producing both. What did this show?", "options": ["Trade based on comparative advantage can benefit both countries", "Only the more efficient country gains", "Trade only helps rich countries", "Countries should be self-sufficient"], "answer": 0, "exp": "Even the less efficient country gains, because each specialises where its opportunity cost is lowest.", "rw": "Ricardo set out the example in 1817, and it is still taught worldwide."},
  {"id": "trl1", "concept": "LIMC", "level": "HL", "type": "mc", "q": "The simple theory of comparative advantage ignores transport costs. Why does this matter for heavy, low-value goods such as cement?", "options": ["High transport costs can wipe out the gains from specialisation", "Transport is always free", "It makes trade more profitable", "It has no effect"], "answer": 0, "exp": "If shipping costs more than the cost saving from specialisation, trade does not pay.", "rw": "Cement is mostly produced and sold within countries because it is so expensive to transport."},
  {"id": "trl2", "concept": "LIMC", "level": "HL", "type": "mc", "q": "Zambia earns most of its export revenue from copper. Which limitation of specialising by comparative advantage does this show?", "options": ["Over-dependence on one export leaves the economy exposed to price swings", "Copper is not traded", "Specialisation never happens", "It guarantees a stable income"], "answer": 0, "exp": "When one commodity dominates exports, a fall in its world price hits the whole economy.", "rw": "Copper makes up around 70% of Zambia’s exports, so its economy rises and falls with copper prices."},
  {"id": "trl3", "concept": "LIMC", "level": "HL", "type": "mc", "q": "The theory assumes workers move easily between industries. Why might this fail in practice?", "options": ["Workers who lose jobs to imports may lack the skills or location for new industries", "Workers can always retrain overnight", "Machines can make any good", "Land can be moved"], "answer": 0, "exp": "Factors of production are often immobile, so displaced workers can stay unemployed for a long time.", "rw": "Studies of the “China shock” found some US manufacturing towns suffered lasting job losses after imports surged."},
  {"id": "trl4", "concept": "LIMC", "level": "HL", "type": "mc", "q": "Comparative advantage is usually shown with straight-line PPFs, meaning constant opportunity costs. Why is this unrealistic?", "options": ["Opportunity costs usually rise as a country specialises more", "Costs always fall", "Real PPFs are always straight", "All resources are identical"], "answer": 0, "exp": "Resources are not equally good at producing everything, so each extra unit costs more to produce.", "rw": "Expanding rice farming onto poorer land, for example, gives lower yields at a higher cost."},
  {"id": "trl5", "concept": "LIMC", "level": "HL", "type": "mc", "q": "South Korea was once a poor, mainly farming economy, but it built world-class car and electronics industries. What does this suggest about comparative advantage?", "options": ["It can change over time and can be created through investment", "It never changes", "Countries should never try to change it", "Korea broke WTO rules"], "answer": 0, "exp": "Investment in skills, technology and infrastructure can create a new comparative advantage: dynamic comparative advantage.", "rw": "Samsung, Hyundai and LG grew from Korea’s push into manufacturing from the 1960s onwards."},
  {"id": "trl6", "concept": "LIMC", "level": "HL", "type": "mc", "q": "Why might a developing country NOT want to specialise only in its current comparative advantage, such as raw coffee beans?", "options": ["Primary products often have low YED and volatile prices, limiting long-run growth", "Coffee prices always rise", "Raw coffee has high value added", "Specialisation is banned"], "answer": 0, "exp": "Specialising in low-value commodities can trap a country in slow, unstable growth.", "rw": "Ethiopia and Uganda earn much of their export income from coffee, leaving them exposed to price swings."},
  {"id": "trl7", "concept": "LIMC", "level": "HL", "type": "mc", "q": "Japan has long charged very high tariffs on imported rice. How do trade barriers like this affect the gains predicted by comparative advantage?", "options": ["They prevent full specialisation, so the gains are smaller", "They increase the gains", "They have no effect", "They create comparative advantage"], "answer": 0, "exp": "The theory assumes free trade; real-world barriers stop countries from specialising fully.", "rw": "Japan’s rice tariffs have been estimated at the equivalent of several hundred per cent."},
  {"id": "trl8", "concept": "LIMC", "level": "HL", "type": "mc", "q": "Rich countries pay large subsidies to their farmers. How does this distort trade based on comparative advantage?", "options": ["Subsidised farmers can undercut lower-cost producers in poorer countries", "Subsidies reveal true costs", "It helps farmers in poor countries", "It has no effect"], "answer": 0, "exp": "Subsidies let higher-cost producers sell more cheaply than lower-cost ones, reversing true comparative advantage.", "rw": "West African cotton farmers argued that US cotton subsidies pushed down the world price they received."},
  {"id": "trl9", "concept": "LIMC", "level": "HL", "type": "mc", "q": "The theory assumes full employment. Why does this matter?", "options": ["If workers who lose jobs to imports stay unemployed, the country may not gain overall", "Unemployment never happens", "It makes the gains larger", "It only affects exports"], "answer": 0, "exp": "Gains from trade assume resources move to new uses; if they sit idle, output can fall.", "rw": "Regions that lost factories to import competition often struggle with high unemployment for years."},
  {"id": "trl10", "concept": "LIMC", "level": "HL", "type": "mc", "q": "In 2023 India banned most exports of non-basmati rice, sending prices up in importing countries. Which limitation of relying on comparative advantage does this show?", "options": ["Countries that depend on imports for essentials such as food face supply risks", "Exporters never restrict trade", "Rice is not traded internationally", "It guarantees food security"], "answer": 0, "exp": "Relying on others for essentials can be risky if exporters suddenly restrict supply.", "rw": "India is the world’s largest rice exporter, so its ban caused prices in Asia and Africa to jump."},
  {"id": "trl11", "concept": "LIMC", "level": "HL", "type": "mc", "q": "The theory of comparative advantage looks at countries as a whole. Which important issue does it ignore?", "options": ["How the gains from trade are shared between groups within a country", "Total output", "Opportunity cost", "Specialisation"], "answer": 0, "exp": "A country can gain overall while particular workers, firms or regions lose badly.", "rw": "This is one reason free trade can be politically unpopular even when it raises national income."},
  {"id": "trl12", "concept": "LIMC", "level": "HL", "type": "mc", "q": "Exchange rates are left out of the simple model. How could an overvalued currency affect trade based on comparative advantage?", "options": ["It can make a country’s goods uncompetitive even where it has a comparative advantage", "It has no effect", "It always helps exporters", "It removes opportunity costs"], "answer": 0, "exp": "A strong currency raises export prices abroad, which can override comparative advantage.", "rw": "Swiss exporters struggled after the franc surged in 2015, despite their strengths."},
  {"id": "trl13", "concept": "LIMC", "level": "HL", "type": "order", "q": "Côte d’Ivoire relies heavily on cocoa exports. Put the risks of over-specialising in one commodity in order.", "items": ["The country relies on cocoa for a large share of export earnings", "World cocoa prices swing sharply", "Export earnings and government revenue become unstable", "Planning for long-term growth and development becomes harder"], "exp": "Heavy dependence on one commodity turns world price swings into economic instability.", "rw": "Côte d’Ivoire is the world’s largest cocoa producer, and cocoa prices have swung wildly in recent years."},
  {"id": "trl14", "concept": "LIMC", "level": "HL", "type": "mc", "q": "Which of these is NOT a limitation of the theory of comparative advantage?", "options": ["It shows that specialisation can raise total world output", "It ignores transport costs", "It assumes perfect competition", "It assumes factors of production are perfectly mobile"], "answer": 0, "exp": "Raising world output is the theory’s main conclusion; the others are unrealistic assumptions that limit it.", "rw": "Good IB evaluation uses these assumptions to question how far the theory applies."},
  {"id": "trl15", "concept": "LIMC", "level": "HL", "type": "order", "q": "Put the steps by which a country could create a new comparative advantage in order.", "items": ["The government and firms invest in education, skills and infrastructure", "Firms develop new technology and processes", "Productivity in the new industry rises", "The country’s opportunity cost of producing the good falls"], "exp": "Comparative advantage is not fixed: investment can build it.", "rw": "Taiwan built a world-leading semiconductor industry, led by TSMC, through decades of investment."},
  {"id": "trt1", "concept": "TARF", "level": "SL", "type": "mc", "q": "In 2018 the US placed a 25% tariff on imported steel. A tariff is…", "options": ["A tax on imported goods", "A limit on the quantity of imports", "A subsidy for domestic producers", "A ban on exports"], "answer": 0, "exp": "A tariff raises the price of imports, making domestic goods more competitive.", "rw": "The US also put a 10% tariff on imported aluminium at the same time."},
  {"id": "trt2", "concept": "TARF", "level": "SL", "type": "diagram", "diagram": "tariffW", "q": "A tariff raises the domestic price from Pw to Pw+t. Which area shows the government’s tariff revenue?", "options": ["C", "A", "B + D", "A + B + C + D"], "answer": 0, "exp": "Tariff revenue = tariff per unit × imports after the tariff (Q₂ to Q₃): rectangle C.", "rw": "Tariffs bring in revenue for governments, but consumers pay for it through higher prices.", "time": 1.25},
  {"id": "trt3", "concept": "TARF", "level": "SL", "type": "diagram", "diagram": "tariffW", "q": "Which areas show the welfare (deadweight) loss caused by the tariff?", "options": ["B + D", "C", "A", "A + C"], "answer": 0, "exp": "B is the cost of inefficient domestic production; D is the loss from consumers buying less. Nobody gains these areas.", "rw": "Economists estimate these losses when judging whether a tariff is worth its cost.", "time": 1.25, "double": true},
  {"id": "trt4", "concept": "TARF", "level": "SL", "type": "diagram", "diagram": "tariffW", "q": "Which area shows the gain in producer surplus for domestic producers?", "options": ["A", "B", "C", "D"], "answer": 0, "exp": "Domestic firms sell more (Q₁ to Q₂) at a higher price, gaining area A.", "rw": "US steel producers saw higher prices and profits after the 2018 tariffs.", "time": 1.25},
  {"id": "trt5", "concept": "TARF", "level": "SL", "type": "diagram", "diagram": "tariffW", "q": "What happens to the quantity of imports after the tariff?", "options": ["It falls from Q₁–Q₄ to Q₂–Q₃", "It rises from Q₂–Q₃ to Q₁–Q₄", "It stays the same", "It falls to zero"], "answer": 0, "exp": "Domestic production rises and consumption falls, so the gap filled by imports shrinks.", "rw": "US steel imports fell after the 2018 tariffs were introduced.", "time": 1.25},
  {"id": "trt6", "concept": "TARF", "level": "SL", "type": "diagram", "diagram": "tariffW", "q": "What does area B represent?", "options": ["Inefficient domestic production replacing cheaper imports", "Tariff revenue", "Consumer surplus gained", "Producer surplus gained"], "answer": 0, "exp": "Units between Q₁ and Q₂ are now made at home at a cost above the world price: a waste of resources.", "rw": "This “production effect” is one reason economists see tariffs as inefficient.", "time": 1.25},
  {"id": "trt7", "concept": "TARF", "level": "HL", "type": "mc", "q": "In 2018 the US put tariffs on imported washing machines. Suppose the world price is $400, a $100 tariff is imposed and 30,000 machines are then imported. What is the tariff revenue?", "options": ["$3 million", "$12 million", "$15 million", "$30,000"], "answer": 0, "exp": "Revenue = tariff per unit × imports = $100 × 30,000 = $3,000,000.", "rw": "A study found washing machine prices in the US rose by around 12% after these tariffs.", "time": 1.5},
  {"id": "trt8", "concept": "TARF", "level": "HL", "type": "diagram", "diagram": "tariffW", "q": "Pw = $2 and Pw+t = $4. Q₁, Q₂, Q₃ and Q₄ are 2, 4, 6 and 8 thousand units. What is the welfare loss (areas B + D)?", "options": ["$4,000", "$8,000", "$2,000", "$12,000"], "answer": 0, "exp": "B = ½ × 2,000 × $2 = $2,000. D = ½ × 2,000 × $2 = $2,000. Total = $4,000.", "rw": "Calculating welfare areas like this is a standard HL Paper 3 skill.", "time": 1.5, "double": true},
  {"id": "trt9", "concept": "TARF", "level": "SL", "type": "mc", "q": "Studies of the 2018 US steel tariffs found job losses in industries that use steel, such as car parts makers. Why?", "options": ["Their input costs rose, making them less competitive", "Steel became cheaper", "Demand for cars rose", "Steel imports rose"], "answer": 0, "exp": "Protecting one industry raises costs for every industry that uses its product.", "rw": "Far more Americans work in steel-using industries than in steel-making itself."},
  {"id": "trt10", "concept": "TARF", "level": "SL", "type": "mc", "q": "Who gains from a tariff on imported steel?", "options": ["Domestic steel producers and the government", "Domestic firms that use steel", "Foreign steel producers", "Buyers of products made from steel"], "answer": 0, "exp": "Domestic producers sell more at a higher price, and the government collects revenue.", "rw": "Steelworkers’ unions supported the 2018 US steel tariffs."},
  {"id": "trt11", "concept": "TARF", "level": "SL", "type": "mc", "q": "Japan charges very high tariffs on imported rice. Who loses most from this?", "options": ["Japanese consumers, who pay higher rice prices", "Japanese rice farmers", "The Japanese government, which collects revenue", "Workers on Japanese rice farms"], "answer": 0, "exp": "Consumers pay the higher price on every bag of rice, whether imported or home-grown.", "rw": "Rice in Japan has typically cost several times the world price."},
  {"id": "trt12", "concept": "TARF", "level": "SL", "type": "mc", "q": "In 2025 the US raised tariffs on imports from many countries, including Thailand. How might this affect Thai exporters?", "options": ["Their goods become more expensive in the US, so US demand for them may fall", "Their US sales automatically rise", "Prices of Thai imports fall", "There is no effect"], "answer": 0, "exp": "A tariff raises the price US buyers pay for Thai goods, reducing the quantity demanded.", "rw": "The US is one of Thailand’s largest export markets, especially for electronics."},
  {"id": "trt13", "concept": "TARF", "level": "SL", "type": "order", "q": "A tariff is placed on imported cars. Put the effects in order.", "items": ["The price of imported cars rises", "Consumers buy fewer imports, and some switch to domestic cars", "Domestic car makers sell more and may hire more workers", "The government collects revenue, but consumers pay more overall"], "exp": "A tariff shifts spending from imports to domestic goods, at a cost to consumers.", "rw": "Thailand has long charged high import duties on fully built cars to encourage local production."},
  {"id": "trt14", "concept": "TARF", "level": "SL", "type": "mc", "q": "Why are tariffs on basic goods such as food and clothing often called regressive?", "options": ["They take a larger share of income from poorer households", "They only affect rich people", "They lower prices for the poor", "They are paid by foreign governments"], "answer": 0, "exp": "Poorer households spend a bigger share of their income on basics, so tariffs on basics hit them hardest.", "rw": "This is an important equity point when evaluating tariffs."},
  {"id": "trt15", "concept": "TARF", "level": "SL", "type": "order", "q": "Put the steps of a tariff war, like the US–China dispute that began in 2018, in order.", "items": ["Country A puts tariffs on Country B’s goods", "Country B retaliates with tariffs on Country A’s exports", "Exporters in both countries lose sales", "Consumers in both countries pay higher prices"], "exp": "Retaliation means both sides can end up worse off.", "rw": "At its peak, the US and China had tariffs on hundreds of billions of dollars of each other’s goods.", "double": true},
  {"id": "trq1", "concept": "QUOT", "level": "SL", "type": "mc", "q": "In 1981 Japan agreed to limit the number of cars it exported to the US. This “voluntary export restraint” worked like…", "options": ["A quota", "A tariff", "A subsidy", "A free trade agreement"], "answer": 0, "exp": "It capped the quantity of Japanese cars entering the US, just like an import quota.", "rw": "Japanese car makers responded by building factories in the US and moving into more expensive models."},
  {"id": "trq2", "concept": "QUOT", "level": "SL", "type": "diagram", "diagram": "quotaW", "q": "A quota limits imports to Q₂–Q₃ (S+Q is domestic supply plus the quota) and the price rises to Pq. Which area is the extra revenue earned by foreign exporters or licence holders (quota rent)?", "options": ["C", "A", "B", "D"], "answer": 0, "exp": "Whoever sells the limited imports gets the higher price Pq instead of Pw: area C.", "rw": "Under the 1980s car limits, Japanese firms earned higher profits on each car they sold in the US.", "time": 1.25},
  {"id": "trq3", "concept": "QUOT", "level": "SL", "type": "diagram", "diagram": "quotaW", "q": "How does a quota differ from a tariff in this diagram?", "options": ["Area C goes to foreign exporters or licence holders, not the government", "Consumers pay less", "Imports rise", "Domestic producers lose"], "answer": 0, "exp": "With a tariff, rectangle C is government revenue; with a quota, it goes to whoever holds the right to import.", "rw": "Some governments auction import licences to capture this revenue.", "time": 1.25, "double": true},
  {"id": "trq4", "concept": "QUOT", "level": "SL", "type": "diagram", "diagram": "quotaW", "q": "What happens to the domestic price after the quota?", "options": ["It rises from Pw to Pq", "It falls", "It stays at Pw", "It falls to zero"], "answer": 0, "exp": "Restricting supply raises the price until demand equals domestic supply plus the quota.", "rw": "Quotas raise prices for consumers in the same way as tariffs.", "time": 1.25},
  {"id": "trq5", "concept": "QUOT", "level": "SL", "type": "diagram", "diagram": "quotaW", "q": "Which areas show the welfare loss from the quota?", "options": ["B + D", "C", "A", "A + C"], "answer": 0, "exp": "As with a tariff, B is inefficient domestic production and D is lost consumption.", "rw": "Some economists argue quotas cost a country more than tariffs, because area C goes abroad.", "time": 1.25},
  {"id": "trq6", "concept": "QUOT", "level": "SL", "type": "mc", "q": "The US limits sugar imports with quotas. What is the effect on sugar prices in the US?", "options": ["They are kept above world prices", "They fall below world prices", "They equal world prices", "They fall to zero"], "answer": 0, "exp": "Limiting imports reduces supply in the US market, raising the price.", "rw": "US sugar prices have often been around double the world price, benefiting US sugar growers."},
  {"id": "trq7", "concept": "QUOT", "level": "SL", "type": "mc", "q": "The Multi Fibre Arrangement limited textile exports from developing countries until 2005. What happened when the quotas ended?", "options": ["Clothing exports from low-cost producers such as China and Bangladesh surged", "Clothing exports fell", "Clothing prices rose", "Trade in clothing stopped"], "answer": 0, "exp": "Removing quotas let production move to the lowest-cost producers.", "rw": "Clothing prices in rich countries fell, while some higher-cost producers lost market share."},
  {"id": "trq8", "concept": "QUOT", "level": "SL", "type": "mc", "q": "Which is an example of an administrative barrier to trade?", "options": ["Strict product standards or slow customs checks that make importing harder", "A tariff", "A production subsidy", "A free trade agreement"], "answer": 0, "exp": "Administrative barriers use rules and red tape, rather than taxes or limits, to restrict imports.", "rw": "Complex rules can raise costs for exporters even when tariffs are zero."},
  {"id": "trq9", "concept": "QUOT", "level": "SL", "type": "mc", "q": "The EU bans imports of beef from cattle treated with growth hormones. This is an example of…", "options": ["An administrative (regulatory) barrier", "A quota", "A tariff", "An export subsidy"], "answer": 0, "exp": "Product rules can block imports that do not meet the standard.", "rw": "The US challenged the ban at the WTO, arguing it was protectionism rather than a health measure."},
  {"id": "trq10", "concept": "QUOT", "level": "SL", "type": "mc", "q": "Why might a government prefer a tariff to a quota?", "options": ["A tariff raises government revenue, while quota rent may go abroad", "A tariff fixes the quantity of imports exactly", "Tariffs never raise prices", "Quotas raise revenue"], "answer": 0, "exp": "With a tariff the government collects area C; with a quota, foreign exporters or licence holders do.", "rw": "The WTO generally prefers tariffs to quotas because they are more transparent."},
  {"id": "trq11", "concept": "QUOT", "level": "SL", "type": "mc", "q": "Why might a government prefer a quota to a tariff?", "options": ["A quota guarantees the maximum quantity imported", "A quota raises more revenue", "A quota lowers prices", "Quotas are always allowed by the WTO"], "answer": 0, "exp": "With a tariff, imports can still surge if foreign prices fall; a quota sets a firm limit.", "rw": "Some countries use “tariff-rate quotas”: a low tariff up to a limit, and a high tariff above it."},
  {"id": "trq12", "concept": "QUOT", "level": "SL", "type": "mc", "q": "Are administrative barriers, such as food safety rules, always protectionism in disguise?", "options": ["Not always: some genuinely protect health and safety, but they can be used to block imports unfairly", "Yes, always", "No, they never affect trade", "They are banned by the WTO"], "answer": 0, "exp": "Good evaluation asks whether a rule is mainly about safety or mainly about keeping imports out.", "rw": "WTO rules allow health measures if they are based on scientific evidence."},
  {"id": "trq13", "concept": "QUOT", "level": "SL", "type": "order", "q": "A government sets a quota on imported garlic. Put the effects in order.", "items": ["The government limits garlic imports to a fixed quantity", "The supply of garlic in the domestic market falls", "The domestic price of garlic rises", "Domestic farmers sell more, but consumers pay more"], "exp": "Quotas raise prices by restricting supply.", "rw": "Several countries have used quotas or licences to limit cheap garlic imports."},
  {"id": "trq14", "concept": "QUOT", "level": "HL", "type": "mc", "q": "The world price is $2. A quota raises the domestic price to $4, and 2,000 units are imported under the quota. How much quota rent goes to foreign exporters or licence holders?", "options": ["$4,000", "$2,000", "$8,000", "$16,000"], "answer": 0, "exp": "Quota rent = (Pq − Pw) × imports = $2 × 2,000 = $4,000.", "rw": "This is the same rectangle that would be tariff revenue under an equivalent tariff.", "time": 1.5},
  {"id": "trq15", "concept": "QUOT", "level": "SL", "type": "mc", "q": "Thailand requires imported food to carry labels in Thai. What effect can rules like this have?", "options": ["They raise costs for foreign exporters, acting as a barrier to trade", "They lower import costs", "They act as a subsidy", "They raise tariff revenue"], "answer": 0, "exp": "Even sensible rules add costs for foreign firms, which can reduce imports.", "rw": "Labelling rules help consumers, so evaluating them means weighing benefits against trade costs."},
  {"id": "trp1", "concept": "PSUB", "level": "SL", "type": "diagram", "diagram": "psubW", "q": "The government pays domestic producers a subsidy of s per unit. What happens to the quantity of imports?", "options": ["It falls from Q₁–Q₃ to Q₂–Q₃", "It rises", "It falls to zero", "It stays the same"], "answer": 0, "exp": "Domestic supply shifts right, so domestic firms produce more and fewer imports are needed.", "rw": "Many countries subsidise farmers to reduce their reliance on imported food.", "time": 1.25},
  {"id": "trp2", "concept": "PSUB", "level": "SL", "type": "diagram", "diagram": "psubW", "q": "What price do domestic consumers pay after the subsidy?", "options": ["Still Pw: the subsidy does not change the world price", "Pw + s", "Zero", "A price below Pw"], "answer": 0, "exp": "Consumers still pay the world price; only producers receive the extra (Pw + s).", "rw": "This is why a subsidy is often seen as less harmful to consumers than a tariff.", "time": 1.25, "double": true},
  {"id": "trp3", "concept": "PSUB", "level": "SL", "type": "diagram", "diagram": "psubW", "q": "Which areas show the total cost of the subsidy to the government?", "options": ["A + B", "A", "B", "A − B"], "answer": 0, "exp": "Cost = subsidy per unit × domestic output (Q₂): the rectangle A + B.", "rw": "Subsidies have an opportunity cost: the money could fund schools or hospitals.", "time": 1.25},
  {"id": "trp4", "concept": "PSUB", "level": "SL", "type": "diagram", "diagram": "psubW", "q": "What does area B show?", "options": ["A welfare loss: higher-cost domestic production replaces cheaper imports", "Tariff revenue", "A gain in consumer surplus", "Quota rent"], "answer": 0, "exp": "Units from Q₁ to Q₂ cost more to produce at home than to import.", "rw": "This efficiency loss is part of the cost of protecting an industry.", "time": 1.25},
  {"id": "trp5", "concept": "PSUB", "level": "HL", "type": "diagram", "diagram": "psubW", "q": "The subsidy is $2 per unit, and domestic output rises to 5,000 units (Q₂). What does the subsidy cost the government?", "options": ["$10,000", "$6,000", "$14,000", "$2,000"], "answer": 0, "exp": "Cost = $2 × 5,000 = $10,000 (areas A + B).", "rw": "Governments must weigh this cost against the jobs and output it supports.", "time": 1.5},
  {"id": "trp6", "concept": "PSUB", "level": "SL", "type": "mc", "q": "Why might a government prefer a production subsidy to a tariff when protecting farmers?", "options": ["Consumers still pay the world price", "It raises government revenue", "It costs nothing", "It raises prices for consumers"], "answer": 0, "exp": "A subsidy supports producers without raising prices, though taxpayers pay for it.", "rw": "The EU moved from price support towards direct payments to farmers partly for this reason."},
  {"id": "trp7", "concept": "PSUB", "level": "SL", "type": "mc", "q": "The US CHIPS Act of 2022 offers large subsidies to firms that make semiconductors in the US. Which argument for protection does this mainly reflect?", "options": ["National security and strategic industries", "Anti-dumping", "Raising tariff revenue", "Keeping consumer prices high"], "answer": 0, "exp": "Governments see chips as vital for defence and the economy, so they want production at home.", "rw": "Firms such as TSMC, Intel and Samsung announced new US chip factories after the Act."},
  {"id": "trp8", "concept": "PSUB", "level": "SL", "type": "mc", "q": "What is an export subsidy?", "options": ["A payment to firms for each unit they export", "A tax on exports", "A limit on exports", "A subsidy for imports"], "answer": 0, "exp": "Export subsidies make a country’s exports cheaper on world markets.", "rw": "Export subsidies on farm goods are now largely banned under WTO rules."},
  {"id": "trp9", "concept": "PSUB", "level": "SL", "type": "diagram", "diagram": "esubW", "q": "An export subsidy means producers receive Pw + s for exports. What happens to the quantity exported?", "options": ["It rises from Q₂–Q₃ to Q₁–Q₄", "It falls", "It stays the same", "It turns into imports"], "answer": 0, "exp": "Domestic output rises (to Q₄) and domestic consumption falls (to Q₁), so exports increase.", "rw": "Subsidised exports add to world supply, which can push down world prices.", "time": 1.25},
  {"id": "trp10", "concept": "PSUB", "level": "SL", "type": "diagram", "diagram": "esubW", "q": "What happens to domestic consumers when an export subsidy is introduced?", "options": ["They pay a higher price (Pw + s) and buy less: Q₁ instead of Q₂", "They pay less", "They buy more", "They are unaffected"], "answer": 0, "exp": "Producers will not sell at home for less than they get abroad, so the domestic price rises too.", "rw": "Export subsidies can raise food prices for a country’s own consumers.", "time": 1.25, "double": true},
  {"id": "trp11", "concept": "PSUB", "level": "HL", "type": "diagram", "diagram": "esubW", "q": "The subsidy is $2 per unit, and exports rise to 6,000 units (Q₁ to Q₄). What is the cost of the export subsidy?", "options": ["$12,000", "$4,000", "$16,000", "$8,000"], "answer": 0, "exp": "Cost = subsidy per unit × exports = $2 × 6,000 = $12,000.", "rw": "The cost rises as exports grow, which can make export subsidies very expensive.", "time": 1.5},
  {"id": "trp12", "concept": "PSUB", "level": "SL", "type": "mc", "q": "EU export subsidies on farm goods were criticised for decades. Why?", "options": ["They pushed subsidised food onto world markets, lowering prices for farmers in poorer countries", "They raised world food prices", "They helped farmers in poor countries", "They reduced EU production"], "answer": 0, "exp": "Subsidised exports increase world supply and depress world prices.", "rw": "Development charities campaigned against EU sugar and dairy export subsidies."},
  {"id": "trp13", "concept": "PSUB", "level": "SL", "type": "mc", "q": "At the WTO meeting in Nairobi in 2015, members agreed to eliminate export subsidies on farm goods. What was the main reason?", "options": ["They distort world trade and harm producers who are not subsidised", "They were too cheap", "They helped consumers too much", "They raised tariffs"], "answer": 0, "exp": "Export subsidies give an unfair advantage and can wipe out unsubsidised farmers elsewhere.", "rw": "The Nairobi decision was hailed as one of the WTO’s biggest farm-trade reforms."},
  {"id": "trp14", "concept": "PSUB", "level": "SL", "type": "mc", "q": "The EU and the US argued at the WTO for around 17 years over subsidies to Airbus and Boeing. What does this show about subsidies?", "options": ["Trading partners see them as unfair competition and may retaliate", "Subsidies are always accepted", "Subsidies only affect farming", "They never lead to disputes"], "answer": 0, "exp": "Subsidies can trigger long trade disputes and retaliatory tariffs.", "rw": "Both sides were allowed to impose tariffs on billions of dollars of each other’s goods before a truce in 2021."},
  {"id": "trp15", "concept": "PSUB", "level": "SL", "type": "order", "q": "A government introduces an export subsidy on rice. Put the effects in order.", "items": ["Farmers receive more for each tonne they export", "Farmers switch sales from the home market to exports", "Domestic rice prices rise and local consumers buy less", "The government pays the subsidy on every exported tonne"], "exp": "Export subsidies boost exports but raise domestic prices and cost taxpayers money.", "rw": "This is why export subsidies are now restricted under WTO rules."},
  {"id": "trpa1", "concept": "PROA", "level": "SL", "type": "mc", "q": "Indonesia banned exports of raw nickel ore in 2020 to build its own processing industry. Which argument for protection is this closest to?", "options": ["Developing domestic industries and keeping more value added at home", "Raising tariff revenue", "Protecting consumers from high prices", "Anti-dumping"], "answer": 0, "exp": "By forcing processing at home, Indonesia aimed to create jobs and capture more of the value.", "rw": "Indonesia now has a large nickel-smelting industry linked to electric vehicle batteries."},
  {"id": "trpa2", "concept": "PROA", "level": "SL", "type": "mc", "q": "What is the infant industry argument for protection?", "options": ["New industries need temporary protection until they grow big enough to compete", "Old industries should be protected forever", "Children should not work in factories", "All tariffs should be zero"], "answer": 0, "exp": "Young firms lack economies of scale and experience; temporary protection gives them time to grow.", "rw": "Many now-rich countries, including the US and South Korea, protected young industries in the past."},
  {"id": "trpa3", "concept": "PROA", "level": "SL", "type": "mc", "q": "South Korea protected its young car and steel industries in the 1960s–80s. What is the main risk of the infant industry argument?", "options": ["The industry may never “grow up” and may rely on protection forever", "The industry may grow too fast", "Consumers may pay less", "Exports may fall to zero immediately"], "answer": 0, "exp": "Protected firms may have little incentive to become efficient, and protection is hard to remove.", "rw": "Korea succeeded partly by forcing protected firms to compete in export markets.", "double": true},
  {"id": "trpa4", "concept": "PROA", "level": "SL", "type": "mc", "q": "In 2024 the EU put extra tariffs on electric cars from China, arguing they were unfairly subsidised. This argument for protection is based on…", "options": ["Unfair competition from subsidised imports", "Infant industries", "Raising revenue", "Health and safety"], "answer": 0, "exp": "Countervailing duties offset foreign subsidies that let imports undercut domestic producers.", "rw": "China disputed the claims and responded with investigations into EU products such as brandy and pork."},
  {"id": "trpa5", "concept": "PROA", "level": "SL", "type": "mc", "q": "What is dumping?", "options": ["Selling exports abroad below cost, or below the price charged at home", "Selling goods at the market price", "Banning imports", "Illegally dumping waste"], "answer": 0, "exp": "Dumping can drive foreign producers out of business, so WTO rules allow anti-dumping duties.", "rw": "Steel is one of the products most often subject to anti-dumping duties."},
  {"id": "trpa6", "concept": "PROA", "level": "SL", "type": "mc", "q": "In 2025 the US imposed anti-dumping and anti-subsidy duties on solar panels from Cambodia, Malaysia, Thailand and Vietnam. What is the aim of such duties?", "options": ["To offset unfairly low prices and protect domestic producers", "To lower solar panel prices in the US", "To increase US imports", "To subsidise imports"], "answer": 0, "exp": "Anti-dumping duties raise the price of imports judged to be sold unfairly cheaply.", "rw": "The duties hit solar factories in Thailand, many of them Chinese-owned."},
  {"id": "trpa7", "concept": "PROA", "level": "SL", "type": "mc", "q": "Some low-income countries rely on tariffs for a large share of government revenue. Why?", "options": ["Tariffs are easy to collect at the border compared with income taxes", "They have no other taxes at all", "Tariffs are always low", "The WTO requires it"], "answer": 0, "exp": "Collecting income tax needs strong administration; collecting taxes at ports is simpler.", "rw": "In some low-income countries, trade taxes make up a much bigger share of revenue than in rich countries."},
  {"id": "trpa8", "concept": "PROA", "level": "SL", "type": "mc", "q": "Japan protects its rice farmers with high tariffs, partly to keep rice production at home. Which argument for protection is this?", "options": ["Food security: avoiding reliance on imports in a crisis", "Food is always cheaper at home", "Lowering food prices", "Food cannot be traded"], "answer": 0, "exp": "Many governments see domestic food production as a matter of national security.", "rw": "Japan imports most of its food overall, which makes it keen to protect rice, its staple."},
  {"id": "trpa9", "concept": "PROA", "level": "SL", "type": "mc", "q": "Governments sometimes use protection to save jobs in declining industries. What is the main weakness of this argument?", "options": ["It delays the move of workers to more efficient industries, and the cost to consumers per job saved can be very high", "It always works permanently", "It creates jobs in export industries", "It lowers prices"], "answer": 0, "exp": "Protection keeps resources in uncompetitive industries and costs consumers and other industries.", "rw": "Studies of the 2018 US steel tariffs estimated the cost per job saved was far higher than a steelworker’s wage."},
  {"id": "trpa10", "concept": "PROA", "level": "SL", "type": "mc", "q": "The EU’s Carbon Border Adjustment Mechanism (CBAM) charges importers of goods such as steel and cement for the carbon emitted making them. Which argument does the EU use?", "options": ["Protecting the environment and preventing production moving to countries with weaker climate rules", "Protecting infant industries", "Raising revenue for farmers", "Anti-dumping"], "answer": 0, "exp": "CBAM aims to stop firms avoiding EU carbon prices by producing elsewhere (“carbon leakage”).", "rw": "Countries such as India have criticised CBAM as disguised protectionism."},
  {"id": "trpa11", "concept": "PROA", "level": "SL", "type": "mc", "q": "Which argument for protection do many economists consider the most convincing?", "options": ["Temporary protection for genuinely new industries with real potential to compete", "Saving every job in declining industries", "Permanently fixing a current account deficit", "Keeping prices high for consumers"], "answer": 0, "exp": "A time-limited infant industry case has the strongest economic logic, if the industry can really become competitive.", "rw": "Even this argument is hard to apply, as governments struggle to “pick winners”."},
  {"id": "trpa12", "concept": "PROA", "level": "SL", "type": "mc", "q": "Why is using tariffs to fix a current account deficit often ineffective in the long run?", "options": ["Retaliation and currency changes can cancel out the effect, and it doesn’t fix weak competitiveness", "It always works", "It cuts imports forever", "It raises exports immediately"], "answer": 0, "exp": "Tariffs treat the symptom, not the cause, and other countries may respond in kind.", "rw": "Despite tariffs on Chinese goods from 2018, the overall US trade deficit did not shrink."},
  {"id": "trpa13", "concept": "PROA", "level": "SL", "type": "order", "q": "Put the steps of how the infant industry argument is meant to work in order.", "items": ["A new domestic industry is protected by tariffs", "It grows and gains economies of scale and experience", "Its costs fall to world levels", "Protection is removed and the industry competes internationally"], "exp": "The key word is “temporary”: protection should end once the industry can compete.", "rw": "Critics point out that the last step, removing protection, often never happens."},
  {"id": "trpa14", "concept": "PROA", "level": "SL", "type": "mc", "q": "Health and safety standards, such as bans on unsafe toys, protect consumers. When do they become protectionism?", "options": ["When they are applied more strictly to imports than to domestic goods, mainly to block competition", "Never", "Always", "Only when they are written down"], "answer": 0, "exp": "Rules that treat foreign and domestic goods differently, without good evidence, are protectionist.", "rw": "The WTO requires health rules to be based on science and applied equally."},
  {"id": "trpa15", "concept": "PROA", "level": "SL", "type": "order", "q": "Put this evaluation of protecting a domestic steel industry for national security in order.", "items": ["Steel is needed for defence and infrastructure", "Relying on imports could be risky in a conflict", "But protection raises steel costs for every steel-using industry", "So the policy needs clear limits and regular review"], "exp": "A strong evaluation weighs the argument, the costs and the conditions under which it makes sense.", "rw": "The US justified its 2018 steel tariffs on national security grounds."},
  {"id": "trpb1", "concept": "PROB", "level": "SL", "type": "mc", "q": "After the US raised tariffs on Chinese goods in 2018, China put tariffs on US soybeans. Which argument against protection does this show?", "options": ["Retaliation can hurt a country’s own exporters", "Protection always helps farmers", "Tariffs lower prices", "Imports rise"], "answer": 0, "exp": "Other countries respond, so exporters in the protecting country lose sales.", "rw": "The US government paid billions of dollars to farmers to compensate them for lost sales to China."},
