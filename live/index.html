<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EconRules Live</title>
<script src="firebase-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050915; --bg2:#0a1124; --panel:rgba(255,255,255,.045); --panel2:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --text:#ecf1ff; --muted:#8c9ac0; --dim:#5d6a8f;
  --blue:#3d7bff; --cyan:#3ad6ff; --good:#2fe0a0; --bad:#ff5d73; --gold:#ffc94d;
  --c0:#ff5470; --c1:#3d86ff; --c2:#ffad2e; --c3:#1fc79a;
  --r:18px; --display:'Space Grotesk',Inter,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--text);
  background:
    radial-gradient(1100px 600px at 10% -15%,rgba(61,123,255,.28),transparent 60%),
    radial-gradient(900px 520px at 105% 0%,rgba(58,214,255,.14),transparent 60%),
    radial-gradient(800px 600px at 50% 120%,rgba(61,123,255,.12),transparent 60%),
    var(--bg);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 75%);
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:inherit}
.app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--line);
  background:rgba(5,9,21,.6);backdrop-filter:blur(14px);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand-mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--blue),var(--cyan));box-shadow:0 6px 20px rgba(61,123,255,.45)}
.brand-mark svg{width:17px;height:17px}
.live{font-size:11px;font-weight:700;letter-spacing:.12em;padding:4px 8px;border-radius:999px;
  background:rgba(255,84,112,.14);color:#ff8ea0;border:1px solid rgba(255,84,112,.3);display:inline-flex;align-items:center;gap:6px}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#ff5470;box-shadow:0 0 0 0 rgba(255,84,112,.6);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,84,112,.6)}70%{box-shadow:0 0 0 8px rgba(255,84,112,0)}100%{box-shadow:0 0 0 0 rgba(255,84,112,0)}}
.spacer{flex:1}
.pill{font-size:12.5px;color:var(--muted);padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.pill b{color:var(--text);font-weight:600}
.btn-ghost{font-size:13px;font-weight:600;padding:8px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);transition:.2s}
.btn-ghost:hover{background:var(--panel2);border-color:rgba(255,255,255,.28)}

/* ---------- stage ---------- */
.stage{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:22px;padding:22px 24px 10px}
.stage.solo{grid-template-columns:minmax(0,1fr)}
.stage.solo .device-wrap{display:none}
.pane-label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 10px 4px;display:flex;align-items:center;gap:8px}
.pane-label svg{width:14px;height:14px}
.host{position:relative;border-radius:24px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
  box-shadow:0 30px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);min-height:calc(100vh - 150px);padding:28px 30px;overflow:hidden}
.device{position:relative;border-radius:22px;border:1px solid var(--line2);background:#0a0f1f;box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden;
  min-height:calc(100vh - 150px);display:flex;flex-direction:column}
.device-bar{display:flex;align-items:center;gap:7px;padding:11px 14px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.03);font-size:12px;color:var(--muted)}
.device-bar i{width:9px;height:9px;border-radius:50%;background:#2a3350;display:inline-block}
.device-bar span{margin-left:8px}
.sv{flex:1;padding:22px 20px;display:flex;flex-direction:column;position:relative}
footer{text-align:center;font-size:11.5px;color:var(--dim);padding:8px 0 18px;letter-spacing:.04em}

/* ---------- common ---------- */
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;margin:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.muted{color:var(--muted)}
.card{border-radius:var(--r);border:1px solid var(--line);background:var(--panel);padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-weight:700;font-size:15px;padding:13px 22px;border-radius:13px;
  background:linear-gradient(135deg,var(--blue),#4f9bff 55%,var(--cyan));color:#fff;box-shadow:0 10px 30px rgba(61,123,255,.38),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .15s,box-shadow .2s,opacity .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 14px 36px rgba(61,123,255,.5),inset 0 1px 0 rgba(255,255,255,.3)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
.btn.sm{font-size:13px;padding:9px 15px;border-radius:10px}
.btn.wide{width:100%}
.btn kbd{font:600 11px Inter;padding:2px 6px;border-radius:5px;background:rgba(255,255,255,.2)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:#cfd8f5}
.chip.dbl{border-color:rgba(255,201,77,.5);background:rgba(255,201,77,.12);color:var(--gold)}
.chip.hl{border-color:rgba(58,214,255,.35);background:rgba(58,214,255,.08);color:var(--cyan)}
.fade-in{animation:fadeIn .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}

/* ---------- setup ---------- */
.setup{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,1fr);gap:22px;align-items:start}
.setup h1{font-size:34px;margin:6px 0 4px}
.setup-intro{grid-column:1/-1;margin-bottom:4px}
.tree{display:flex;flex-direction:column;gap:12px}
.unit{border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.025);overflow:hidden}
.unit-head{display:flex;align-items:center;gap:12px;padding:14px 16px;font-weight:600}
.unit-head .count{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
.unit.off .unit-head{color:var(--dim)}
.subs{border-top:1px solid var(--line);padding:6px 8px 10px}
.sub{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:14px}
.sub .num{font-family:var(--display);font-weight:600;color:var(--muted);width:30px}
.sub.off{color:var(--dim)}
.sub.off .num{color:var(--dim)}
.soon{margin-left:auto;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.concepts{margin:0 0 4px 52px;display:flex;flex-direction:column;gap:2px}
.concept{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:14px;cursor:pointer;transition:background .15s}
.concept:hover,.sub.on:hover{background:rgba(255,255,255,.04)}
.concept .n{margin-left:auto;font-size:12px;color:var(--muted)}
.hl-tag{font-size:10px;font-weight:700;letter-spacing:.06em;padding:2px 6px;border-radius:5px;background:rgba(58,214,255,.1);color:var(--cyan);border:1px solid rgba(58,214,255,.25)}
.cb{appearance:none;-webkit-appearance:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);background:rgba(255,255,255,.03);display:grid;place-items:center;cursor:pointer;flex:none;transition:.15s;margin:0}
.cb:checked,.cb:indeterminate{background:linear-gradient(135deg,var(--blue),var(--cyan));border-color:transparent}
.cb:checked::after{content:"";width:10px;height:5px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.cb:indeterminate::after{content:"";width:10px;height:2.5px;background:#fff;border-radius:2px}
.cb:disabled{opacity:.3;cursor:not-allowed}
.settings{position:sticky;top:90px;display:flex;flex-direction:column;gap:20px}
.field label{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:#cdd6f3;margin-bottom:10px}
.field label span{color:var(--muted);font-weight:500}
.seg{display:flex;padding:4px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.seg button{flex:1;padding:9px 0;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);transition:.2s}
.seg button.on{background:var(--panel2);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.08)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--blue) var(--p,50%),rgba(255,255,255,.1) var(--p,50%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(61,123,255,.6);cursor:pointer}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:0;cursor:pointer}
.summary{display:flex;gap:10px;flex-wrap:wrap}
.mix{font-size:13.5px;color:var(--muted);padding:10px 12px;border-radius:12px;background:rgba(58,214,255,.06);border:1px solid rgba(58,214,255,.2)}
.mix b{color:var(--text);font-family:var(--display);font-size:15px}
.stat{flex:1;min-width:80px;padding:12px;border-radius:12px;background:rgba(0,0,0,.2);border:1px solid var(--line)}
.stat b{display:block;font-family:var(--display);font-size:24px}
.stat small{color:var(--muted);font-size:11.5px}

/* ---------- lobby ---------- */
.lobby{display:flex;flex-direction:column;align-items:center;text-align:center;height:100%}
.pin-card{margin-top:10px;padding:22px 40px;border-radius:22px;background:linear-gradient(135deg,rgba(61,123,255,.18),rgba(58,214,255,.08));border:1px solid rgba(61,123,255,.35);box-shadow:0 20px 60px rgba(61,123,255,.2)}
.pin-card small{font-size:13px;color:#b7c6ef;letter-spacing:.06em}
.pin{font-family:var(--display);font-size:68px;font-weight:700;letter-spacing:.08em;line-height:1.05;background:linear-gradient(180deg,#fff,#a9c4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.lobby-meta{display:flex;align-items:center;gap:16px;margin:26px 0 18px;width:100%}
.lobby-meta .count{font-family:var(--display);font-size:22px;font-weight:600;display:flex;align-items:center;gap:10px}
.lobby-meta .count svg{width:22px;height:22px;color:var(--cyan)}
.roster{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-content:flex-start;width:100%;min-height:160px}
.pchip{display:inline-flex;align-items:center;gap:8px;padding:9px 10px 9px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:600;font-size:14.5px}
.pchip.new{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.picon{display:block;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.ptile{display:inline-flex;align-items:center;gap:14px;padding:10px 12px 10px 10px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border:1px solid var(--line2);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.ptile-n{font-family:var(--display);font-weight:700;font-size:clamp(20px,1.9vw,28px);letter-spacing:-.01em;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptile.new{animation:tileIn .6s cubic-bezier(.2,1.5,.4,1) both}
.ptile.new .picon{animation:iconSpin .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes tileIn{0%{opacity:0;transform:translateY(16px) scale(.6)}100%{opacity:1;transform:none}}
@keyframes iconSpin{0%{transform:rotate(-25deg) scale(.4)}100%{transform:none}}
.ptile.me{border-color:rgba(58,214,255,.7);box-shadow:0 0 0 3px rgba(58,214,255,.18),0 10px 30px rgba(0,0,0,.3)}
.roster{gap:14px!important}
.ipick-label{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;gap:8px}
.ipick-label span{color:var(--cyan);letter-spacing:.04em;text-transform:none;font-size:13px}
.ipick{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;padding:10px;border-radius:16px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.ipick-b{border-radius:14px;padding:3px;display:grid;place-items:center;transition:transform .15s,box-shadow .15s,opacity .15s;opacity:.72}
.ipick-b:hover{transform:translateY(-2px) scale(1.06);opacity:1}
.ipick-b.on{opacity:1;box-shadow:0 0 0 3px #fff,0 0 22px rgba(255,255,255,.35);animation:pickBounce .45s cubic-bezier(.2,1.6,.4,1)}
.ipick-b .picon{width:100%;height:auto;max-width:48px}
@keyframes pickBounce{0%{transform:scale(.8)}100%{transform:scale(1)}}
.me-icon .picon{filter:drop-shadow(0 16px 40px rgba(61,123,255,.45))}
.s-top .picon{margin-right:2px}
.lbrow .picon{margin-left:-4px}
.pcol .pi{margin-bottom:8px;opacity:0;animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
.pcol.p1 .pi{animation-delay:1.1s} .pcol.p2 .pi{animation-delay:.6s} .pcol.p3 .pi{animation-delay:.2s}
.rest div{align-items:center}
.still .fade-in{animation:none}
.pchip.me{border-color:rgba(58,214,255,.6);background:rgba(58,214,255,.12);box-shadow:0 0 0 3px rgba(58,214,255,.12)}
.x{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:var(--dim);transition:.15s}
.x:hover{background:rgba(255,84,112,.18);color:#ff8ea0}
.x svg{width:12px;height:12px}
.empty{color:var(--dim);font-size:14px;margin-top:30px}

/* ---------- question ---------- */
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qhead .ctrl{margin-left:auto;display:flex;gap:8px}
.icon-btn{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:8px 13px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);transition:.15s}
.icon-btn:hover{background:var(--panel2)}
.icon-btn svg{width:14px;height:14px}
.progress{height:4px;border-radius:4px;background:rgba(255,255,255,.07);margin:16px 0 0;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:4px;transition:width .4s}
.qtext{font-size:clamp(24px,2.5vw,36px);line-height:1.2;text-align:center;margin:26px auto 22px;max-width:980px;font-weight:600}
.qmid{display:grid;grid-template-columns:120px minmax(0,1fr) 120px;align-items:center;gap:20px;margin-bottom:22px}
.qmid.nodiag{grid-template-columns:120px 1fr 120px;min-height:150px}
.ring{position:relative;width:112px;height:112px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .track{stroke:rgba(255,255,255,.08)}
.ring .bar{stroke:url(#ringGrad);stroke-linecap:round;transition:stroke-dashoffset .1s linear}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:36px;font-weight:700}
.ring.low .lbl{color:var(--bad)}
.answered{text-align:center}
.answered b{display:block;font-family:var(--display);font-size:42px;line-height:1}
.answered small{color:var(--muted);font-size:13px}
.diag-card{justify-self:center;width:min(100%,480px);border-radius:18px;border:1px solid var(--line);background:rgba(0,0,0,.25);padding:12px 14px 6px}
.diag{width:100%;height:auto;display:block}
.diag .ax{stroke:#b4c0e2;stroke-width:2.5;fill:none}
.diag .axh{fill:#a9b6da}
.diag text{font-family:Inter,sans-serif;font-size:20px;fill:#e2e8fa;font-weight:700}
.diag .sb{font-size:.72em}
.diag.mini text{font-size:27px}
.diag.mini .ln{stroke-width:5}
.diag.mini .guide{stroke-width:2}
.diag .guide{stroke:#8f9dc4;stroke-width:1.6;stroke-dasharray:5 5}
.diag .ln{fill:none;stroke-width:4;stroke-linecap:round}
.diag .d{stroke:var(--cyan)} .diag text.d{fill:var(--cyan);stroke:none}
.diag .s{stroke:var(--gold)} .diag text.s{fill:var(--gold);stroke:none}
.diag .old{opacity:.4}
.diag .pc{stroke:#ff8ea0} .diag text.pc{fill:#ff8ea0;stroke:none}
.diag .arr{stroke:#fff;stroke-width:2.5;fill:none}
.diag .arrh{fill:#fff}
.diag .dot{fill:#fff}
.diag .mc{stroke:#ff7b93} .diag text.mc{fill:#ff7b93;stroke:none}
.diag .ac{stroke:#4be3a8} .diag text.ac{fill:#4be3a8;stroke:none}
.diag .av{stroke:#c3a6ff} .diag text.av{fill:#c3a6ff;stroke:none}
.diag .mr{stroke:#7aa8ff} .diag text.mr{fill:#7aa8ff;stroke:none}
.diag .mxc{fill:rgba(255,255,255,.04);stroke:rgba(255,255,255,.3);stroke-width:1.5}
.diag .ar{fill:rgba(122,168,255,.13);stroke:rgba(255,255,255,.28);stroke-width:1.2}
.diag .ar2{fill:rgba(122,168,255,.22)}
.diag text.al{fill:#fff;font-size:22px;font-weight:800;paint-order:stroke;stroke:#0a1124;stroke-width:4px;stroke-linejoin:round}
.diag.mini text.al{font-size:28px}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opts.four{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.opt{position:relative;display:flex;align-items:center;gap:16px;min-height:88px;padding:18px 22px;border-radius:16px;font-size:clamp(16px,1.35vw,21px);font-weight:600;line-height:1.25;color:#fff;
  background:var(--oc);box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),0 10px 28px color-mix(in srgb,var(--oc) 30%,transparent);transition:opacity .35s,transform .35s,filter .35s;text-align:left}
.opt .shape{flex:none;width:30px;height:30px;fill:#fff;opacity:.95}
.opt.o0{--oc:var(--c0)} .opt.o1{--oc:var(--c1)} .opt.o2{--oc:var(--c2)} .opt.o3{--oc:var(--c3)}
.opt.dgo{flex-direction:column;align-items:stretch;gap:8px;padding:12px 12px 10px}
.opt.dgo .top{display:flex;align-items:center;gap:10px}
.opt.dgo .shape{width:22px;height:22px}
.opt.dgo .mini{background:rgba(5,9,21,.82);border-radius:11px;padding:6px 6px 0}
.opt.dim{opacity:.22;filter:saturate(.4)}
.opt.right{transform:scale(1.02);box-shadow:0 0 0 3px #fff,0 16px 40px color-mix(in srgb,var(--oc) 45%,transparent)}
.opt .tick{margin-left:auto;width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.opt .tick svg{width:18px;height:18px;stroke:var(--oc)}
.opt.dgo .tick{position:absolute;top:10px;right:10px;width:28px;height:28px}

.olist{display:flex;flex-direction:column;gap:10px;max-width:820px;margin:0 auto;width:100%}
.oitem{display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);font-size:18px;font-weight:600;border-left:5px solid var(--oc,var(--blue))}
.oitem .badge{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-family:var(--display);font-size:15px;background:rgba(255,255,255,.08);flex:none}
.oitem.ok{border-color:rgba(47,224,160,.4);border-left-color:var(--good);background:rgba(47,224,160,.07)}
.oitem.ok .badge{background:var(--good);color:#04241a}

/* ---------- get ready ---------- */

   exp:'Close substitutes let consumers switch easily when the price rises, so quantity demanded responds strongly.'},
  {id:'ped4', concept:'PED', level:'HL', type:'mc', double:true, time:1.5,
   q:'The price of a good rises from $10 to $12 and quantity demanded falls from 100 to 90 units. What is the PED?',
   options:['0.5','2.0','0.2','5.0'], answer:0,
   exp:'%ΔQd = 10 ÷ 100 = 10% (a fall). %ΔP = 2 ÷ 10 = 20% (a rise). PED = 10% ÷ 20% = 0.5. PED is usually written without the minus sign.'},
  {id:'ped5', concept:'PED', level:'SL', type:'diagram', diagram:'pedCompare',
   q:'D₁ and D₂ pass through the same point. At P₁, which demand curve is relatively more price elastic?',
   options:['D₂, the flatter curve','D₁, the steeper curve','Both are equally elastic','You cannot tell from a diagram'], answer:0,
   exp:'From the same starting point, a given price change causes a bigger change in quantity demanded on the flatter curve.'},
  {id:'ped6', concept:'PED', level:'SL', type:'diagram', diagram:'dVertical',
   q:'What is the PED of this demand curve?',
   options:['0 — perfectly inelastic','1 — unit elastic','Infinity — perfectly elastic','Between 0 and 1'], answer:0,
   exp:'Quantity demanded does not change at all when price changes, so PED = 0.'},
  {id:'ped7', concept:'PED', level:'SL', type:'order', q:'Order these PED values from most price elastic to least price elastic.',
   items:['3.0','1.5','1.0','0.4','0'],
   exp:'The bigger the PED value, the more price elastic the demand: above 1 is elastic, below 1 is inelastic, and 0 is perfectly inelastic.'},
  {id:'ped8', concept:'PED', level:'SL', type:'order', double:true, q:'Put this chain of reasoning in order.',
   items:['The product has many close substitutes','Demand for the product is price elastic','The firm lowers its price','Quantity demanded rises by a larger percentage','Total revenue rises'],
   exp:'Substitutes make demand price elastic. With elastic demand, a price cut raises revenue because the % rise in Qd outweighs the % fall in price.'},
  // ---------- YED ----------
  {id:'yed1', concept:'YED', level:'SL', type:'mc', q:'A good has a YED of −0.8. What type of good is it?',
   options:['An inferior good','A normal good (necessity)','A normal good (luxury)','A substitute good'], answer:0,
   exp:'A negative YED means demand falls as income rises, which defines an inferior good.'},
  {id:'yed2', concept:'YED', level:'SL', type:'mc', q:'A good has a YED of +2.5. It is best described as…',
   options:['A luxury: income elastic normal good','A necessity: income inelastic normal good','An inferior good','A good with price elastic demand'], answer:0,
   exp:'YED is greater than 1, so demand rises proportionately more than income: an income elastic (luxury) good.'},
  {id:'yed3', concept:'YED', level:'HL', type:'mc', time:1.5,
   q:'Average income rises by 5% and demand for restaurant meals rises by 10%. What is the YED?',
   options:['+2.0','+0.5','−2.0','+5.0'], answer:0,
   exp:'YED = %ΔQd ÷ %ΔY = 10% ÷ 5% = +2.0.'},
  {id:'yed4', concept:'YED', level:'SL', type:'mc', q:'Why do the incomes of primary producers, such as farmers, tend to grow more slowly than the economy as a whole?',
   options:['Primary products have a low YED','Primary products have a high YED','Primary products are inferior goods','Primary products have a high PED'], answer:0,
   exp:'As incomes rise, spending on food rises only a little (YED between 0 and 1), so farmers receive a shrinking share of total spending.'},
  {id:'yed5', concept:'YED', level:'SL', type:'diagram-options', double:true, time:1.25,
   q:'Incomes rise. Which diagram shows the effect on the market for an inferior good?',
   optionDiagrams:['dRight','dLeft','sLeft','sRight'], answer:1,
   exp:'For an inferior good, higher income means lower demand at every price, so the demand curve shifts left.'},
  {id:'yed6', concept:'YED', level:'SL', type:'order', q:'Order these goods from most income elastic to least income elastic.',
   items:['Overseas holidays (YED +3.0)','Restaurant meals (YED +1.2)','Bread (YED +0.3)','Instant noodles (YED −0.6)'],
   exp:'Luxuries have YED above 1, necessities between 0 and 1, and inferior goods below 0.'},
  // ---------- PES ----------
  {id:'pes1', concept:'PES', level:'SL', type:'mc', q:'Which of these makes supply more price elastic?',
   options:['Firms have plenty of spare capacity','Production takes a long time','The good cannot be stored','Factors of production are immobile'], answer:0,
   exp:'Spare capacity means firms can raise output quickly when the price rises.'},
  {id:'pes2', concept:'PES', level:'SL', type:'mc', q:'Why is the supply of agricultural products usually price inelastic in the short run?',
   options:['Crops take time to grow','Farmers have many substitutes','Demand for food is price inelastic','Governments set farm prices'], answer:0,
   exp:'Time lags in production mean farmers cannot quickly increase output when the price rises.'},
  {id:'pes3', concept:'PES', level:'HL', type:'mc', time:1.5,
   q:'The price of a good rises by 20% and quantity supplied rises by 10%. What is the PES?',
   options:['0.5','2.0','−0.5','0.2'], answer:0,
   exp:'PES = %ΔQs ÷ %ΔP = 10% ÷ 20% = 0.5, so supply is price inelastic.'},
  {id:'pes4', concept:'PES', level:'SL', type:'diagram', diagram:'sOrigin', double:true,
   q:'This straight-line supply curve starts at the origin. What is its PES?',
   options:['Exactly 1','0','Between 0 and 1','Infinity'], answer:0,
   exp:'Any straight-line supply curve through the origin has PES = 1 at every point, whatever its slope.'},
  {id:'pes5', concept:'PES', level:'SL', type:'diagram', diagram:'sVertical',
   q:'Which situation is best shown by this supply curve?',
   options:['Seats in a stadium for tonight’s match','Bottled water from a factory with spare capacity','Downloads of a music app','T-shirts from a large clothing firm'], answer:0,
   exp:'The number of seats is fixed for tonight, so quantity supplied cannot respond to price: PES = 0.'},
  {id:'pes6', concept:'PES', level:'SL', type:'diagram-options', time:1.25,
   q:'Which diagram shows perfectly elastic supply?',
   optionDiagrams:['sHoriz','sVertical','sOrigin','sQaxis'], answer:0,
   exp:'A horizontal supply curve means firms will supply any quantity at that price, so PES = infinity.'},
  {id:'pes7', concept:'PES', level:'SL', type:'order', q:'Order these time periods from least elastic supply to most elastic supply.',
   items:['Today (output is fixed)','Short run (some factors fixed)','Long run (all factors variable)'],
   exp:'The more time firms have to adjust their factors of production, the more elastic supply becomes.'},

  // ================= 2.7 ROLE OF GOVERNMENT =================
  // ---------- Indirect taxes ----------
  {id:'tax1', concept:'TAX', level:'SL', type:'mc', q:'An indirect tax is a tax on…',
   options:['Spending on goods and services','People’s incomes','Firms’ profits','Wealth and property'], answer:0,
   exp:'Indirect taxes (such as VAT or excise taxes) are placed on spending on goods and services and collected through firms.'},
  {id:'tax2', concept:'TAX', level:'SL', type:'diagram', diagram:'taxSpecific',
   q:'A specific (per-unit) tax is imposed. What does the vertical distance between S and S+tax show?',
   options:['The tax per unit','The total tax revenue','The consumer burden only','The fall in quantity'], answer:0,
   exp:'A specific tax adds the same amount to costs at every output, so supply shifts up by exactly the tax per unit (Pc − Pp).'},
  {id:'tax3', concept:'TAX', level:'SL', type:'diagram-options', time:1.25,
   q:'Which diagram shows an ad valorem (percentage) tax?',
   optionDiagrams:['taxAdval','taxSpecific','subsidy','dLeft'], answer:0,
   exp:'An ad valorem tax is a percentage of price, so the tax per unit grows as price rises and the curves move further apart.'},
  {id:'tax4', concept:'TAX', level:'SL', type:'mc', q:'Why do governments impose indirect taxes?',
   options:['To raise revenue and reduce consumption of demerit goods','To increase consumption of merit goods','To lower prices for consumers','To increase producers’ revenue'], answer:0,
   exp:'Indirect taxes raise government revenue and, by raising prices, discourage consumption of goods such as cigarettes and alcohol.'},
  {id:'tax5', concept:'TAX', level:'SL', type:'diagram', diagram:'taxInelastic', double:true,
   q:'Demand for this good is price inelastic. Who bears most of the tax burden?',
   options:['Consumers','Producers','It is shared equally','The government'], answer:0,
   exp:'With inelastic demand, the price consumers pay (Pc) rises by most of the tax, while the price producers keep (Pp) falls only a little.'},
  {id:'tax6', concept:'TAX', level:'SL', type:'mc', q:'A government wants a tax that raises a lot of revenue. It should tax goods whose demand is…',
   options:['Price inelastic','Price elastic','Income elastic','Perfectly elastic'], answer:0,
   exp:'When demand is price inelastic, quantity falls only a little after the tax, so the tax base (and revenue) stays large.'},
  {id:'tax7', concept:'TAX', level:'HL', type:'mc', double:true, time:1.5,
   q:'A $2 per-unit tax raises the price consumers pay from $5 to $6.50. 400 units are now sold. How much tax revenue does the government collect?',
   options:['$800','$600','$200','$2,600'], answer:0,
   exp:'Tax revenue = tax per unit × quantity sold = $2 × 400 = $800.'},
  {id:'tax8', concept:'TAX', level:'HL', type:'mc', time:1.5,
   q:'A $2 per-unit tax raises the price consumers pay from $5 to $6.50. What share of the tax is paid by consumers?',
   options:['75%','25%','50%','100%'], answer:0,
   exp:'Consumers pay $1.50 more out of the $2 tax: 1.5 ÷ 2 = 75%. Producers bear the other $0.50 (25%).'},
  {id:'tax9', concept:'TAX', level:'SL', type:'order', double:true, q:'An indirect tax is placed on cigarettes. Put the effects in order.',
   items:['Firms’ costs of supplying cigarettes rise','Supply shifts up by the amount of the tax','The price paid by consumers rises','Quantity demanded falls','Consumption of the demerit good falls'],
   exp:'The tax raises costs, shifting supply up; the higher price leads to a movement along demand to a lower quantity.'},
  {id:'tax10', concept:'TAX', level:'SL', type:'mc', q:'Why are indirect taxes often described as regressive?',
   options:['Low-income households pay a larger share of their income in tax','High-income households pay more tax in total','They are only paid by firms','They fall as incomes rise'], answer:0,
   exp:'Everyone pays the same tax on a good, so it takes a bigger proportion of a low income than a high income.'},
  {id:'tax11', concept:'TAX', level:'SL', type:'mc', q:'What does “tax incidence” mean?',
   options:['How the tax burden is split between consumers and producers','The total revenue the tax raises','The rate at which a good is taxed','How often the tax is collected'], answer:0,
   exp:'Incidence describes who really pays: the price elasticities of demand and supply decide how the burden is shared.'},

  // ---------- Subsidies ----------
  {id:'sub1', concept:'SUB', level:'SL', type:'mc', q:'A subsidy is…',
   options:['A payment from the government to producers that lowers their costs','A tax that raises firms’ costs','A legal maximum price','A ban on producing a good'], answer:0,
   exp:'A subsidy is paid to producers, lowering their costs of production and encouraging them to supply more.'},
  {id:'sub2', concept:'SUB', level:'SL', type:'diagram', diagram:'subsidy',
   q:'A per-unit subsidy shifts supply from S₁ to S₂. What does the distance between Pp and Pc show?',
   options:['The subsidy per unit','The total cost of the subsidy','The gain to consumers only','The rise in quantity'], answer:0,
   exp:'Producers receive Pp and consumers pay Pc; the government pays the gap, which is the subsidy per unit.'},
  {id:'sub3', concept:'SUB', level:'SL', type:'diagram-options', double:true, time:1.25,
   q:'Which diagram shows the effect of a per-unit subsidy?',
   optionDiagrams:['subsidy','taxSpecific','dRight','sLeft'], answer:0,
   exp:'A subsidy lowers costs, so supply shifts down (right) by the subsidy per unit: price falls and quantity rises.'},
  {id:'sub4', concept:'SUB', level:'SL', type:'mc', q:'Which is a reason for a government to grant a subsidy?',
   options:['To increase consumption of a merit good, such as vaccinations','To raise government revenue','To reduce consumption of a demerit good','To raise prices for consumers'], answer:0,
   exp:'Subsidies lower prices and raise output, so they are used to encourage merit goods and support producers.'},
  {id:'sub5', concept:'SUB', level:'SL', type:'mc', q:'Which stakeholder is most likely to lose from a subsidy?',
   options:['Taxpayers, because of the opportunity cost of government spending','Producers of the good','Consumers of the good','Workers in the industry'], answer:0,
   exp:'The subsidy must be paid for, so money could have been spent elsewhere, such as on healthcare or education.'},
  {id:'sub6', concept:'SUB', level:'HL', type:'mc', time:1.5,
   q:'A $3 per-unit subsidy lowers the price consumers pay from $10 to $8. 500 units are now sold. What is the total cost of the subsidy?',
   options:['$1,500','$1,000','$500','$4,000'], answer:0,
   exp:'Cost to the government = subsidy per unit × quantity = $3 × 500 = $1,500.'},
  {id:'sub7', concept:'SUB', level:'HL', type:'mc', double:true, time:1.5,
   q:'A $3 per-unit subsidy lowers the price consumers pay from $10 to $8. How much more per unit do producers now receive?',
   options:['$1','$2','$3','$0'], answer:0,
   exp:'Producers receive the consumer price plus the subsidy: $8 + $3 = $11, which is $1 more than the original $10.'},
  {id:'sub8', concept:'SUB', level:'SL', type:'order', q:'The government subsidises solar panels. Put the effects in order.',
   items:['Producers’ costs of making solar panels fall','Supply shifts down (to the right)','The price of solar panels falls','Quantity demanded rises','More households use renewable energy'],
   exp:'Lower costs shift supply right; the lower price leads to a movement along demand to a higher quantity.'},
  {id:'sub9', concept:'SUB', level:'SL', type:'mc', q:'Why might subsidies lead to inefficiency?',
   options:['Firms may rely on them and have less incentive to cut costs','They raise prices for consumers','They reduce output','They increase government revenue'], answer:0,
   exp:'Protected by subsidies, firms face less competitive pressure to become efficient.'},
  {id:'sub10', concept:'SUB', level:'SL', type:'mc', q:'How can farm subsidies in rich countries harm farmers in developing countries?',
   options:['They increase supply and lower world prices, making it harder to compete','They raise world prices','They reduce world supply','They raise demand for imports from developing countries'], answer:0,
   exp:'Subsidised output adds to world supply, pushing down world prices and the incomes of unsubsidised farmers.'},

  // ---------- Maximum prices ----------
  {id:'max1', concept:'MAXP', level:'SL', type:'mc', q:'A maximum price only has an effect if it is set…',
   options:['Below the equilibrium price','Above the equilibrium price','At the equilibrium price','Anywhere on the demand curve'], answer:0,
   exp:'A price ceiling above equilibrium is not binding, because the market price is already lower.'},
  {id:'max2', concept:'MAXP', level:'SL', type:'diagram', diagram:'maxPrice',
   q:'A maximum price is set at Pₘₐₓ. What does the gap between Qs and Qd show?',
   options:['A shortage (excess demand)','A surplus (excess supply)','Government spending','Tax revenue'], answer:0,
   exp:'At the lower price, consumers want Qd but producers only supply Qs, so there is a shortage.'},
  {id:'max3', concept:'MAXP', level:'SL', type:'diagram-options', double:true, time:1.25,
   q:'Which diagram shows a maximum price that actually affects the market?',
   optionDiagrams:['maxPrice','maxAbove','minPrice','minBelow'], answer:0,
   exp:'A binding maximum price must be set below the equilibrium price (P₁).'},
  {id:'max4', concept:'MAXP', level:'SL', type:'mc', q:'Which is an example of a maximum price?',
   options:['Rent controls','A minimum wage','A guaranteed price for farmers','An excise tax'], answer:0,
   exp:'Rent controls cap the rent landlords can charge, keeping it below the market rate.'},
  {id:'max5', concept:'MAXP', level:'SL', type:'mc', q:'What is a likely consequence of rent controls?',
   options:['A housing shortage and parallel (black) markets','A surplus of rental housing','Higher earnings for landlords','More rental housing being built'], answer:0,
   exp:'At the capped rent, more people want housing than landlords supply, so shortages, queues and illegal markets appear.'},
  {id:'max6', concept:'MAXP', level:'SL', type:'order', q:'A maximum price is set on bread, below equilibrium. Put the effects in order.',
   items:['The price is forced down to the maximum','Quantity demanded rises and quantity supplied falls','A shortage appears','Queues, rationing or parallel markets develop'],
   exp:'The lower price causes movements along both curves, opening up a shortage that must be rationed somehow.'},
  {id:'max7', concept:'MAXP', level:'SL', type:'mc', q:'Who gains from a maximum price?',
   options:['Consumers who manage to buy the good at the lower price','Producers of the good','All consumers equally','Consumers who cannot find the good'], answer:0,
   exp:'Only those who obtain the good benefit from the lower price; others face the shortage.'},
  {id:'max8', concept:'MAXP', level:'HL', type:'mc', time:1.5,
   q:'A maximum price of $3 is set. At $3, quantity demanded is 700 units and quantity supplied is 300 units. What is the shortage?',
   options:['400 units','300 units','700 units','1,000 units'], answer:0,
   exp:'Shortage = quantity demanded − quantity supplied = 700 − 300 = 400 units.'},
  {id:'max9', concept:'MAXP', level:'SL', type:'mc', q:'How could a government reduce the shortage caused by a maximum price?',
   options:['Subsidise producers to increase supply','Tax producers','Lower the maximum price further','Encourage consumers to buy more'], answer:0,
   exp:'A subsidy shifts supply right, raising quantity supplied at the maximum price and narrowing the shortage.'},

  // ---------- Minimum prices ----------
  {id:'min1', concept:'MINP', level:'SL', type:'mc', q:'A minimum price only has an effect if it is set…',
   options:['Above the equilibrium price','Below the equilibrium price','At the equilibrium price','Anywhere on the supply curve'], answer:0,
   exp:'A price floor below equilibrium is not binding, because the market price is already higher.'},
  {id:'min2', concept:'MINP', level:'SL', type:'diagram', diagram:'minPrice',
   q:'A minimum price is set at Pₘᵢₙ. What does the gap between Qd and Qs show?',
   options:['A surplus (excess supply)','A shortage (excess demand)','Tax revenue','Consumer surplus'], answer:0,
   exp:'At the higher price, producers supply Qs but consumers only demand Qd, so there is a surplus.'},
  {id:'min3', concept:'MINP', level:'SL', type:'diagram', diagram:'minWage',
   q:'A minimum wage is set above the equilibrium wage. What does the gap between Ld and Ls show?',
   options:['Unemployment (excess supply of labour)','A shortage of workers','Higher productivity','Employers’ profits'], answer:0,
   exp:'At the higher wage, more people want to work (Ls) than firms want to hire (Ld): the gap is unemployment.'},
  {id:'min4', concept:'MINP', level:'SL', type:'mc', q:'Which is an example of a minimum price?',
   options:['A minimum wage','Rent controls','A subsidy on bus fares','A tax on sugary drinks'], answer:0,
   exp:'A minimum wage sets a legal floor on the price of labour.'},
  {id:'min5', concept:'MINP', level:'SL', type:'mc', q:'Why might a government set a minimum price for agricultural products?',
   options:['To raise and stabilise farmers’ incomes','To lower food prices','To reduce food production','To raise tax revenue'], answer:0,
   exp:'Farm prices can be low and volatile, so a price floor protects farmers’ incomes.'},
  {id:'min6', concept:'MINP', level:'HL', type:'mc', double:true, time:1.5,
   q:'A minimum price of $7 is set. At $7, quantity supplied is 700 units and quantity demanded is 300 units. The government buys the surplus. What does this cost?',
   options:['$2,800','$2,100','$4,900','$400'], answer:0,
   exp:'Surplus = 700 − 300 = 400 units. Cost = 400 × $7 = $2,800.'},
  {id:'min7', concept:'MINP', level:'SL', type:'order', q:'A minimum price for rice is set above equilibrium. Put the effects in order.',
   items:['The price rises to the minimum price','Quantity supplied rises and quantity demanded falls','A surplus of rice develops','The government buys and stores the surplus','Taxpayers bear the cost (an opportunity cost)'],
   exp:'The price floor creates a surplus; if the government buys it to hold the price up, that spending has an opportunity cost.'},
  {id:'min8', concept:'MINP', level:'SL', type:'mc', q:'What is a likely consequence of a minimum price scheme for farmers?',
   options:['Inefficient farmers stay in production, wasting resources','Lower prices for consumers','Shortages of food','Lower government spending'], answer:0,
   exp:'A guaranteed high price protects high-cost producers, so resources are not reallocated to better uses.'},
  {id:'min9', concept:'MINP', level:'SL', type:'diagram-options', time:1.25,
   q:'Which diagram shows a minimum price that actually affects the market?',
   optionDiagrams:['minPrice','minBelow','maxPrice','maxAbove'], answer:0,
   exp:'A binding minimum price must be set above the equilibrium price (P₁).'},

  // ---------- Other policies ----------
  {id:'oth1', concept:'OTHGOV', level:'SL', type:'mc', q:'Which of these is an example of a nudge?',
   options:['Making organ donation the default (opt-out) choice','Banning smoking in restaurants','A tax on sugary drinks','A subsidy for public transport'], answer:0,
   exp:'A nudge changes how a choice is presented without banning options or changing prices.'},
  {id:'oth2', concept:'OTHGOV', level:'SL', type:'mc', q:'Nudge theory comes from which area of economics?',
   options:['Behavioural economics','Classical economics','Monetarism','Marxist economics'], answer:0,
   exp:'Behavioural economics studies how real people make decisions, including biases that nudges work with.'},
  {id:'oth3', concept:'OTHGOV', level:'SL', type:'mc', q:'What does “direct provision” mean?',
   options:['The government supplies the good itself, e.g. state schools and hospitals','The government pays private firms to produce it','The government sets a maximum price','The government bans the good'], answer:0,
   exp:'With direct provision, the government provides the good or service, usually free at the point of use and funded by taxes.'},
  {id:'oth4', concept:'OTHGOV', level:'SL', type:'mc', q:'Which is an example of command and control regulation?',
   options:['A legal limit on the pollution a factory may emit','Tradable pollution permits','A carbon tax','An advertising campaign about pollution'], answer:0,
   exp:'Command and control sets rules that firms must obey; permits and taxes are market-based policies instead.'},
  {id:'oth5', concept:'OTHGOV', level:'SL', type:'mc', q:'Which is an example of legislation used to reduce consumption of a demerit good?',
   options:['A ban on cigarette advertising','A subsidy for nicotine patches','Free public parks','A maximum price on cigarettes'], answer:0,
   exp:'Legislation uses laws, such as advertising bans or age limits, to restrict a good.'},
  {id:'oth6', concept:'OTHGOV', level:'SL', type:'mc', q:'In a buffer stock scheme, what does the government do after a very good harvest?',
   options:['Buys stock to stop the price falling too low','Releases stock to stop the price rising','Taxes farmers','Sets a maximum price'], answer:0,
   exp:'A bumper harvest pushes prices down, so the government buys the extra output and stores it.'},
  {id:'oth7', concept:'OTHGOV', level:'SL', type:'mc', q:'In a buffer stock scheme, what does the government do after a poor harvest?',
   options:['Releases (sells) stock to stop the price rising too high','Buys more stock','Destroys stored stock','Sets a minimum price'], answer:0,
   exp:'A poor harvest pushes prices up, so the government sells stored stock to increase supply.'},
  {id:'oth8', concept:'OTHGOV', level:'SL', type:'order', double:true, q:'Put the steps of a buffer stock scheme in order.',
   items:['The government sets a target price range','A bumper harvest pushes the price towards the floor','The government buys and stores the surplus','A poor harvest pushes the price towards the ceiling','The government releases stock onto the market'],
   exp:'Buying in good years and selling in bad years keeps the price within the target range.'},
  {id:'oth9', concept:'OTHGOV', level:'SL', type:'mc', q:'What is a weakness of buffer stock schemes?',
   options:['They are costly to run, and stored goods can perish','They make prices less stable','Farmers lose income','They need no information about future harvests'], answer:0,
   exp:'Buying, storing and managing stock is expensive, and perishable goods may go to waste.'},
  {id:'oth10', concept:'OTHGOV', level:'SL', type:'mc', q:'Why might a government choose a nudge rather than a ban or a tax?',
   options:['It keeps freedom of choice and is cheap to use','It always changes behaviour','It raises tax revenue','It is required by law'], answer:0,
   exp:'Nudges preserve choice and cost little, although their effects can be small or uncertain.'},

  // ---------- Consumer & producer surplus (welfare) ----------
  {id:'tw1', concept:'TAX', level:'SL', type:'diagram', diagram:'wTax', time:1.25,
   q:'A specific tax is imposed. Which areas show the government’s tax revenue?',
   options:['B + D','C + E','A + B','D + F'], answer:0,
   exp:'Tax revenue = tax per unit (Pc − Pp) × quantity sold (Q₂): the rectangle B + D.'},
  {id:'tw2', concept:'TAX', level:'SL', type:'diagram', diagram:'wTax', double:true, time:1.25,
   q:'Which areas show the welfare (deadweight) loss caused by the tax?',
   options:['C + E','B + D','A','F'], answer:0,
   exp:'C (lost consumer surplus) and E (lost producer surplus) are not gained by anyone, because units between Q₂ and Q₁ are no longer traded.'},
  {id:'tw3', concept:'TAX', level:'SL', type:'diagram', diagram:'wTax', time:1.25,
   q:'What is consumer surplus after the tax?',
   options:['A','A + B + C','A + B','B + C'], answer:0,
   exp:'Consumers now pay Pc and buy Q₂, so consumer surplus is the triangle above Pc and below demand: area A. It was A + B + C before.'},
  {id:'tw4', concept:'TAX', level:'SL', type:'diagram', diagram:'wTax', time:1.25,
   q:'How much producer surplus is lost because of the tax?',
   options:['D + E','D','E + F','B + D'], answer:0,
   exp:'Producer surplus falls from D + E + F to F. D becomes tax revenue and E is part of the welfare loss.'},
  {id:'tw5', concept:'TAX', level:'HL', type:'mc', time:1.5,
   q:'Before a tax, P = $5 and Q = 50. A $4 tax raises Pc to $7, cuts Pp to $3 and reduces Q to 30. What is the welfare loss?',
   options:['$40','$80','$120','$20'], answer:0,
   exp:'Welfare loss = ½ × tax per unit × fall in quantity = ½ × $4 × 20 = $40.'},
  {id:'sw1', concept:'SUB', level:'SL', type:'diagram', diagram:'wSub', double:true, time:1.25,
   q:'A per-unit subsidy is granted. Which area shows the welfare loss?',
   options:['C','A','B','A + B'], answer:0,
   exp:'The government pays A + B + C, but consumers gain only B and producers gain only A. Area C is a welfare loss from over-allocation of resources.'},
  {id:'sw2', concept:'SUB', level:'SL', type:'diagram', diagram:'wSub', time:1.25,
   q:'Which areas show the total cost of the subsidy to the government?',
   options:['A + B + C','A + B','C','B + C'], answer:0,
   exp:'Cost = subsidy per unit (Pp − Pc) × quantity (Q₂): the whole rectangle A + B + C.'},
  {id:'sw3', concept:'SUB', level:'SL', type:'diagram', diagram:'wSub', time:1.25,
   q:'Which area shows the gain in consumer surplus from the subsidy?',
   options:['B','A','C','A + C'], answer:0,
   exp:'Consumers now pay Pc instead of P₁ and buy more, so consumer surplus grows by area B.'},
  {id:'sw4', concept:'SUB', level:'HL', type:'mc', time:1.5,
   q:'A $4 subsidy raises quantity from 50 to 70. Consumers now pay $3 instead of $5. What is the gain in consumer surplus?',
   options:['$120','$140','$280','$40'], answer:0,
   exp:'The gain is a trapezium: price fall × average quantity = $2 × (50 + 70) ÷ 2 = $120.'},
  {id:'sw5', concept:'SUB', level:'SL', type:'mc', q:'Why does a subsidy create a welfare loss?',
   options:['Its cost to the government is greater than the gains in consumer and producer surplus','It reduces consumer surplus','It reduces producer surplus','It creates a shortage'], answer:0,
   exp:'Output rises beyond the efficient level, so the extra units cost more to produce than they are worth to consumers.'},
  {id:'mw1', concept:'MAXP', level:'SL', type:'diagram', diagram:'wMax', time:1.25,
   q:'A maximum price is set. Which area is transferred from producers to consumers?',
   options:['D','B','C + E','F'], answer:0,
   exp:'Consumers who still buy (up to Qs) now pay Pₘₐₓ instead of P₁, so area D moves from producer to consumer surplus.'},
  {id:'mw2', concept:'MAXP', level:'SL', type:'diagram', diagram:'wMax', double:true, time:1.25,
   q:'Which areas show the welfare loss from the maximum price?',
   options:['C + E','D','B + D','A'], answer:0,
   exp:'Only Qs is now traded, so the surplus on units between Qs and Q₁ (areas C and E) is lost to society.'},
  {id:'mw3', concept:'MAXP', level:'SL', type:'diagram', diagram:'wMax', time:1.25,
   q:'What is producer surplus after the maximum price?',
   options:['F','D + E + F','D + F','E + F'], answer:0,
   exp:'Producers sell only Qs at Pₘₐₓ, so producer surplus shrinks from D + E + F to F.'},
  {id:'mw4', concept:'MAXP', level:'SL', type:'diagram', diagram:'wMax', time:1.25,
   q:'What is consumer surplus after the maximum price (assuming the good goes to the consumers who value it most)?',
   options:['A + B + D','A + B + C','A + B','A + D'], answer:0,
   exp:'Consumers lose C (fewer units traded) but gain D (a lower price), so consumer surplus becomes A + B + D.'},
  {id:'nw1', concept:'MINP', level:'SL', type:'diagram', diagram:'wMin', time:1.25,
   q:'A minimum price is set. Which area is transferred from consumers to producers?',
   options:['B','D','C + E','A'], answer:0,
   exp:'Consumers who still buy (up to Qd) pay Pₘᵢₙ instead of P₁, so area B moves from consumer to producer surplus.'},
  {id:'nw2', concept:'MINP', level:'SL', type:'diagram', diagram:'wMin', time:1.25,
   q:'What is consumer surplus after the minimum price?',
   options:['A','A + B','A + B + C','A + B + D'], answer:0,
   exp:'Consumers pay Pₘᵢₙ and buy only Qd, so consumer surplus shrinks from A + B + C to A.'},
  {id:'nw3', concept:'MINP', level:'SL', type:'diagram', diagram:'wMin', double:true, time:1.25,
   q:'Which areas show the welfare loss (assuming firms produce only what they can sell, Qd)?',
   options:['C + E','B','B + D','F'], answer:0,
   exp:'Units between Qd and Q₁ are no longer traded, so areas C and E are lost to society.'},
  {id:'nw4', concept:'MINP', level:'SL', type:'diagram', diagram:'wMin', time:1.25,
   q:'What is producer surplus after the minimum price (assuming firms produce only what they can sell, Qd)?',
   options:['B + D + F','D + E + F','F','B + F'], answer:0,
   exp:'Producers gain B from the higher price but lose E on units no longer sold: B + D + F.'},

  // ================= 2.11 THEORY OF THE FIRM (HL) =================
  {"id": "fp1", "concept": "FPROD", "level": "HL", "type": "mc", "q": "The law of diminishing marginal returns applies…", "options": ["In the short run, when at least one factor of production is fixed", "In the long run, when all factors are variable", "Only to agricultural firms", "Only when output is falling"], "answer": 0, "exp": "Adding more of a variable factor (labour) to a fixed factor (capital, land) eventually adds less and less extra output.", "rw": "A café with one espresso machine: a third barista adds less than the second, because staff end up waiting to use the machine."},
  {"id": "fp2", "concept": "FPROD", "level": "HL", "type": "mc", "q": "Total product rises from 40 to 52 units when a 5th worker is hired. What is the marginal product of the 5th worker?", "options": ["12 units", "10.4 units", "8 units", "52 units"], "answer": 0, "exp": "MP = change in total product ÷ change in labour = (52 − 40) ÷ 1 = 12 units.", "rw": "Farms show this pattern clearly: adding workers to a fixed plot raises the harvest by less and less.", "time": 1.5},
  {"id": "fp3", "concept": "FPROD", "level": "HL", "type": "mc", "q": "5 workers produce a total of 60 units. What is the average product of labour?", "options": ["12 units", "300 units", "55 units", "5 units"], "answer": 0, "exp": "AP = total product ÷ number of workers = 60 ÷ 5 = 12 units.", "rw": "Factories track output per worker (labour productivity) to compare plants, shifts and countries.", "time": 1.5},
  {"id": "fp4", "concept": "FPROD", "level": "HL", "type": "diagram", "diagram": "prodCurves", "q": "Where does the MP curve cross the AP curve?", "options": ["At the maximum point of AP", "At the maximum point of MP", "Where total product is zero", "Where MP is zero"], "answer": 0, "exp": "While MP is above AP it pulls the average up; once MP falls below AP it pulls the average down. So MP cuts AP at AP’s maximum.", "rw": "If a new salesperson sells more than the team average, the average rises; if they sell less, it falls.", "time": 1.25},
  {"id": "fp5", "concept": "FPROD", "level": "HL", "type": "diagram", "diagram": "prodCurves", "q": "When the MP curve is above the AP curve, AP is…", "options": ["Rising", "Falling", "Constant", "Zero"], "answer": 0, "exp": "Each extra worker adds more than the current average, so the average must be rising.", "rw": "Firms watch productivity data: a new hire who beats the average output lifts the whole team’s average.", "time": 1.25},
  {"id": "fp6", "concept": "FPROD", "level": "HL", "type": "mc", "q": "When marginal product is zero, total product is…", "options": ["At its maximum", "At its minimum", "Rising at its fastest rate", "Zero"], "answer": 0, "exp": "An extra worker adds nothing, so total product has stopped rising: it is at its peak. Any further worker would reduce it.", "rw": "In a crowded kitchen, an extra chef who adds nothing to meals served shows the kitchen has hit its maximum output."},
  {"id": "fp7", "concept": "FPROD", "level": "HL", "type": "order", "q": "A café keeps adding workers to the same small kitchen. Put the stages in order.", "items": ["Increasing marginal returns as workers specialise", "Marginal product reaches its peak", "Diminishing marginal returns set in", "Marginal product falls to zero as the kitchen overcrowds"], "exp": "Specialisation first raises MP; then the fixed kitchen limits each extra worker’s contribution until MP reaches zero.", "rw": "Restaurant kitchens during a dinner rush show all four stages as more staff are added."},
  {"id": "fp8", "concept": "FPROD", "level": "HL", "type": "mc", "q": "Diminishing marginal returns cause the short-run marginal cost curve to…", "options": ["Rise", "Fall", "Become horizontal", "Become vertical"], "answer": 0, "exp": "As MP falls, each extra unit of output needs more of the variable factor, so the cost of each extra unit rises.", "rw": "Delivery firms in peak season face rising costs per extra parcel as warehouses and vans become crowded."},
  {"id": "fc1", "concept": "FSRC", "level": "HL", "type": "mc", "q": "Which cost does NOT change with output in the short run?", "options": ["Rent on a factory", "Raw materials", "Hourly wages of production workers", "Electricity to run machines"], "answer": 0, "exp": "Rent is a fixed cost: it must be paid whatever the output. The others are variable costs.", "rw": "A café pays the same rent whether it serves 10 or 500 customers; coffee beans and milk rise with sales."},
  {"id": "fc2", "concept": "FSRC", "level": "HL", "type": "mc", "q": "Total fixed cost is $100. At 20 units of output, total variable cost is $300. What is ATC?", "options": ["$20", "$15", "$5", "$400"], "answer": 0, "exp": "ATC = TC ÷ Q = ($100 + $300) ÷ 20 = $20.", "rw": "Small businesses calculate unit costs like this before deciding what price to charge.", "time": 1.5},
  {"id": "fc3", "concept": "FSRC", "level": "HL", "type": "mc", "q": "Total cost rises from $500 to $530 when output rises from 10 to 11 units. What is the marginal cost?", "options": ["$30", "$48.18", "$50", "$530"], "answer": 0, "exp": "MC = change in TC ÷ change in output = $30 ÷ 1 = $30.", "rw": "Ride-hailing firms think about the marginal cost of one more trip: mostly fuel and the driver’s time.", "time": 1.5},
  {"id": "fc4", "concept": "FSRC", "level": "HL", "type": "diagram", "diagram": "srCosts", "q": "The MC curve cuts the AVC and ATC curves at…", "options": ["Their minimum points", "Their maximum points", "The point where AVC and ATC meet", "Zero output"], "answer": 0, "exp": "When MC is below an average it pulls it down; when above, it pulls it up. So MC crosses each average at its lowest point.", "rw": "Manufacturers use cost curves like these to find the output where each unit is cheapest to make.", "time": 1.25},
  {"id": "fc5", "concept": "FSRC", "level": "HL", "type": "diagram", "diagram": "srCosts", "q": "Why do the ATC and AVC curves get closer together as output rises?", "options": ["Average fixed cost falls as output rises", "Marginal cost falls as output rises", "Variable costs become fixed", "Total fixed cost falls"], "answer": 0, "exp": "ATC − AVC = AFC. Fixed cost is spread over more units, so AFC keeps falling and the gap narrows.", "rw": "Streaming services spread huge fixed content costs over more subscribers, so the fixed cost per subscriber falls.", "time": 1.25},
  {"id": "fc6", "concept": "FSRC", "level": "HL", "type": "mc", "q": "As output rises, average fixed cost (AFC)…", "options": ["Falls continuously", "Rises continuously", "Stays constant", "Falls, then rises"], "answer": 0, "exp": "AFC = TFC ÷ Q. The same fixed cost is divided by more and more units.", "rw": "A concert venue’s fixed costs per ticket fall as more tickets are sold."},
  {"id": "fc7", "concept": "FSRC", "level": "HL", "type": "order", "q": "Put the steps for calculating ATC from a cost table in order.", "items": ["Find total fixed cost and total variable cost", "Add them together to get total cost", "Divide total cost by the quantity of output"], "exp": "TC = TFC + TVC, and ATC = TC ÷ Q.", "rw": "Market stall owners do this when working out whether a price will cover their costs."},
  {"id": "fc8", "concept": "FSRC", "level": "HL", "type": "mc", "q": "The short-run MC curve is U-shaped mainly because of…", "options": ["Increasing, then diminishing, marginal returns", "Economies, then diseconomies, of scale", "Falling fixed costs", "Changes in the price of the product"], "answer": 0, "exp": "Rising MP first lowers the cost of extra units; once diminishing returns set in, MC rises. Scale effects belong to the long run.", "rw": "Factories running overtime see the cost of each extra unit rise as machines and workers are stretched."},
  {"id": "fl1", "concept": "FLRC", "level": "HL", "type": "mc", "q": "In the long run…", "options": ["All factors of production are variable", "At least one factor is fixed", "Firms cannot change their output", "Costs cannot change"], "answer": 0, "exp": "The long run is the period in which a firm can change all its inputs, including the size of its factory.", "rw": "Building a new factory or opening a new branch is a long-run decision."},
  {"id": "fl2", "concept": "FLRC", "level": "HL", "type": "diagram", "diagram": "lrac", "q": "Up to output Q*, the firm experiences…", "options": ["Economies of scale", "Diseconomies of scale", "Diminishing marginal returns", "Constant returns to scale"], "answer": 0, "exp": "LRAC falls as the firm grows, so cost per unit falls with scale: economies of scale.", "rw": "Large supermarket chains get lower costs per item than small shops, through bulk buying and efficient logistics.", "time": 1.25},
  {"id": "fl3", "concept": "FLRC", "level": "HL", "type": "mc", "q": "Which of these is an economy of scale?", "options": ["Buying inputs in bulk at a discount", "Poor communication between managers", "Rising rents as the firm expands", "Managers duplicating each other’s work"], "answer": 0, "exp": "Bulk-buying (purchasing economies) lowers cost per unit as the firm grows. The others raise costs.", "rw": "Retail giants such as Walmart buy in huge volumes and get lower prices from suppliers."},
  {"id": "fl4", "concept": "FLRC", "level": "HL", "type": "mc", "q": "Which is a cause of diseconomies of scale?", "options": ["Poor communication and coordination in a very large firm", "Bulk-buying discounts", "Specialisation of workers", "Cheaper finance for big firms"], "answer": 0, "exp": "Very large firms can become hard to manage, so cost per unit rises.", "rw": "Very large organisations often struggle with slow decisions across many layers of management."},
  {"id": "fl5", "concept": "FLRC", "level": "HL", "type": "mc", "q": "What is minimum efficient scale?", "options": ["The lowest output at which long-run average cost is minimised", "The smallest output a firm can produce", "The output where MC = MR", "The output where total cost is lowest"], "answer": 0, "exp": "Minimum efficient scale is where economies of scale run out and LRAC first reaches its minimum.", "rw": "Car makers need to produce very large volumes each year to reach minimum efficient scale."},
  {"id": "fl6", "concept": "FLRC", "level": "HL", "type": "diagram", "diagram": "lrac", "q": "Beyond Q*, long-run average cost rises. This is because of…", "options": ["Diseconomies of scale", "Economies of scale", "Diminishing marginal returns", "Rising demand"], "answer": 0, "exp": "Rising LRAC as the firm grows means cost per unit increases with scale: diseconomies of scale.", "rw": "Some firms split into smaller units to avoid the coordination problems that come with size.", "time": 1.25},
  {"id": "fl7", "concept": "FLRC", "level": "HL", "type": "mc", "q": "Constant returns to scale means…", "options": ["Increasing all inputs by a percentage raises output by the same percentage", "Output rises faster than inputs", "Output rises more slowly than inputs", "Output does not change"], "answer": 0, "exp": "With constant returns, cost per unit stays the same as the firm grows, so LRAC is flat.", "rw": "Many service businesses, like hair salons, show roughly constant returns: two salons cost about twice as much to run as one."},
  {"id": "fl8", "concept": "FLRC", "level": "HL", "type": "order", "q": "Put the stages of a U-shaped LRAC curve in order as a firm grows.", "items": ["Economies of scale: LRAC falls", "Minimum efficient scale is reached", "Constant returns to scale: LRAC is flat", "Diseconomies of scale: LRAC rises"], "exp": "Growth first lowers costs, then costs level off, and finally rise as the firm becomes too large to manage efficiently.", "rw": "Amazon grew from an online bookshop into a giant with huge economies of scale in logistics."},
  {"id": "fr1", "concept": "FREV", "level": "HL", "type": "mc", "q": "Average revenue (AR) is equal to…", "options": ["Price", "Marginal revenue", "Total revenue", "Profit per unit"], "answer": 0, "exp": "AR = TR ÷ Q = (P × Q) ÷ Q = P.", "rw": "At a street market, the price of each mango sold is the average revenue per mango."},
  {"id": "fr2", "concept": "FREV", "level": "HL", "type": "mc", "q": "A firm sells 10 units at $8 each. To sell 11 units it must lower its price to $7. What is the marginal revenue of the 11th unit?", "options": ["−$3", "$7", "$77", "$1"], "answer": 0, "exp": "TR falls from $80 to $77, so MR = −$3. The lower price applies to all 11 units, not just the extra one.", "rw": "Streaming services weighing a price cut must balance new subscribers against lower revenue from existing ones.", "time": 1.5, "double": true},
  {"id": "fr3", "concept": "FREV", "level": "HL", "type": "diagram", "diagram": "pcRev", "q": "Why is a perfectly competitive firm’s demand curve horizontal?", "options": ["It is a price taker that can sell any quantity at the market price", "It has a lot of market power", "Demand for its product is perfectly inelastic", "It sells a unique product"], "answer": 0, "exp": "Each firm is tiny relative to the market, so it can sell all it wants at the market price: P = AR = MR.", "rw": "A single rice farmer in Thailand sells at the market price: one farm is far too small to change it.", "time": 1.25},
  {"id": "fr4", "concept": "FREV", "level": "HL", "type": "diagram", "diagram": "monRev", "q": "At which output is total revenue maximised?", "options": ["Q₁, where MR = 0", "Where AR = 0", "Where MR = AR", "At the highest possible price"], "answer": 0, "exp": "TR rises while MR is positive and falls once MR is negative, so TR peaks where MR = 0.", "rw": "Theme parks and airlines use pricing software to find the price that brings in the most revenue.", "time": 1.25},
  {"id": "fr5", "concept": "FREV", "level": "HL", "type": "mc", "q": "For a straight-line downward-sloping demand curve, the MR curve…", "options": ["Has the same intercept and is twice as steep", "Is the same as the AR curve", "Is horizontal", "Slopes upwards"], "answer": 0, "exp": "To sell more, the firm must cut price on all units, so MR falls twice as fast as AR.", "rw": "Publishers know that cutting a book’s price to sell more copies also lowers the price for every other buyer."},
  {"id": "fr6", "concept": "FREV", "level": "HL", "type": "mc", "q": "Where MR is positive, demand is…", "options": ["Price elastic", "Price inelastic", "Unit elastic", "Perfectly inelastic"], "answer": 0, "exp": "If a price cut raises TR (MR > 0), quantity must rise proportionately more than price falls: demand is elastic.", "rw": "Firms with pricing power keep their price where demand is elastic, because that is where extra sales still add revenue."},
  {"id": "fr7", "concept": "FREV", "level": "HL", "type": "mc", "q": "A food stall earns total revenue of ฿5,000 from selling 50 meals. What is its average revenue?", "options": ["฿100", "฿250,000", "฿4,950", "฿50"], "answer": 0, "exp": "AR = TR ÷ Q = ฿5,000 ÷ 50 = ฿100, which is the price per meal.", "rw": "Street food sellers track takings per meal to judge whether price changes are working.", "time": 1.5},
  {"id": "ff1", "concept": "FPROF", "level": "HL", "type": "mc", "q": "Normal profit is…", "options": ["The minimum return needed to keep a firm in its industry, where TR = TC", "Any profit above zero", "The maximum possible profit", "Profit after tax"], "answer": 0, "exp": "Economists include opportunity cost in total cost, so normal profit (TR = TC) just covers what the owner could earn elsewhere.", "rw": "If a café owner could earn more working for someone else, normal profit is the least that keeps them running the café."},
  {"id": "ff2", "concept": "FPROF", "level": "HL", "type": "mc", "q": "A profit-maximising firm produces where…", "options": ["MC = MR", "AC = AR", "MR = 0", "TR = TC"], "answer": 0, "exp": "Below that output, an extra unit adds more to revenue than to cost; beyond it, it adds more to cost than to revenue.", "rw": "Firms test small price and output changes to find where one more unit stops adding to profit."},
  {"id": "ff3", "concept": "FPROF", "level": "HL", "type": "mc", "q": "At its profit-maximising output, a firm sells 100 units at $12 each. ATC at that output is $9. What is its abnormal profit?", "options": ["$300", "$1,200", "$900", "$3"], "answer": 0, "exp": "Profit = (AR − ATC) × Q = ($12 − $9) × 100 = $300.", "rw": "Abnormal profits reported in company results tend to attract new competitors into a market.", "time": 1.5, "double": true},
  {"id": "ff4", "concept": "FPROF", "level": "HL", "type": "mc", "q": "In the short run, a firm making a loss should shut down if…", "options": ["Price is below average variable cost", "Price is below average total cost", "Price equals marginal cost", "Total revenue is below total fixed cost"], "answer": 0, "exp": "If P < AVC, producing loses even more than shutting down (when only fixed costs are lost).", "rw": "During COVID-19 lockdowns, many restaurants closed temporarily because sales could not cover their variable costs."},
  {"id": "ff5", "concept": "FPROF", "level": "HL", "type": "mc", "q": "A revenue-maximising firm produces where…", "options": ["MR = 0", "MC = MR", "AR = AC", "MC = AC"], "answer": 0, "exp": "Total revenue peaks where marginal revenue is zero.", "rw": "Many tech start-ups have chased revenue and user growth before profit."},
  {"id": "ff6", "concept": "FPROF", "level": "HL", "type": "mc", "q": "Sales (output) maximisation, while still breaking even, means producing where…", "options": ["AR = AC", "MC = MR", "MR = 0", "MC = AR"], "answer": 0, "exp": "The firm expands output as far as possible while still covering all costs, i.e. making normal profit.", "rw": "Some firms maximise sales to grow market share, for example supermarkets selling some items close to cost."},
  {"id": "ff7", "concept": "FPROF", "level": "HL", "type": "mc", "q": "What does “satisficing” mean?", "options": ["Aiming for a satisfactory level of profit while meeting several goals", "Maximising customer satisfaction at any cost", "Maximising profit in the long run", "Making a loss deliberately"], "answer": 0, "exp": "Firms with many stakeholders may settle for “good enough” profit while balancing other aims.", "rw": "Family-owned businesses often balance profit with goals such as stability and keeping the business in the family."},
  {"id": "ff8", "concept": "FPROF", "level": "HL", "type": "mc", "q": "Which is an example of corporate social responsibility (CSR)?", "options": ["Paying farmers fair prices even when cheaper suppliers exist", "Cutting prices to drive out rivals", "Increasing advertising spending", "Maximising short-run profit"], "answer": 0, "exp": "CSR means a firm takes account of its social and environmental impact, not just profit.", "rw": "Fairtrade coffee: buyers pay farmers a minimum price plus a premium for community projects."},
  {"id": "ff9", "concept": "FPROF", "level": "HL", "type": "order", "q": "Order these price levels from the lowest (shut down) to the highest (abnormal profit).", "items": ["Price below AVC: shut down in the short run", "Price between AVC and ATC: loss, but keep producing for now", "Price equal to ATC: normal profit", "Price above ATC: abnormal profit"], "exp": "The shut-down price is minimum AVC; the break-even price is minimum ATC.", "rw": "Airlines keep some routes running at a loss in the short run as long as ticket sales cover fuel and crew costs.", "double": true},
  {"id": "pc1", "concept": "FPC", "level": "HL", "type": "mc", "q": "Which is NOT a feature of perfect competition?", "options": ["Firms sell differentiated products", "A very large number of firms", "No barriers to entry or exit", "Perfect information"], "answer": 0, "exp": "Firms in perfect competition sell identical (homogeneous) products.", "rw": "No real market fits perfectly, but markets for many farm products come close."},
  {"id": "pc2", "concept": "FPC", "level": "HL", "type": "diagram", "diagram": "pcProfit", "q": "What does area A show?", "options": ["Abnormal profit", "A loss", "Normal profit", "Total cost"], "answer": 0, "exp": "At Q*, price (AR) is above ATC, so the firm earns (P − C) × Q* above normal profit.", "rw": "When a crop’s price soars, growers earn high profits for a while, until more farmers start growing it.", "time": 1.25},
  {"id": "pc3", "concept": "FPC", "level": "HL", "type": "diagram", "diagram": "pcLoss", "q": "This firm is making a loss (area A). What should it do in the short run?", "options": ["Keep producing, because price covers average variable cost", "Shut down immediately", "Raise its price above the market price", "Leave the industry today"], "answer": 0, "exp": "P is below ATC but above AVC, so producing covers all variable costs and some fixed costs: a smaller loss than shutting down.", "rw": "Farmers often keep harvesting when prices are low, as long as they cover costs like labour and fuel.", "time": 1.25},
  {"id": "pc4", "concept": "FPC", "level": "HL", "type": "order", "q": "Firms in perfect competition are making abnormal profits. Put the long-run adjustment in order.", "items": ["New firms enter, because there are no barriers", "Market supply shifts to the right", "The market price falls", "Profits fall until firms make only normal profit"], "exp": "Free entry competes away abnormal profit, leaving P = minimum ATC in the long run.", "rw": "When durian exports to China boomed, many Thai farmers switched to durian, increasing supply.", "double": true},
  {"id": "pc5", "concept": "FPC", "level": "HL", "type": "mc", "q": "In long-run equilibrium, a perfectly competitive firm is…", "options": ["Both allocatively (P = MC) and productively (minimum ATC) efficient", "Allocatively efficient only", "Productively efficient only", "Neither"], "answer": 0, "exp": "In the long run P = MC = minimum ATC, so both forms of efficiency are achieved.", "rw": "Highly competitive markets push firms to cut costs and price close to marginal cost."},
  {"id": "pc6", "concept": "FPC", "level": "HL", "type": "mc", "q": "A perfectly competitive firm’s short-run supply curve is…", "options": ["Its MC curve above minimum AVC", "Its ATC curve", "Its AVC curve", "Horizontal at the market price"], "answer": 0, "exp": "At any price above minimum AVC the firm supplies where P = MC; below it, the firm shuts down.", "rw": "A farmer decides how much to supply at each price by comparing the price with the extra cost of producing more."},
  {"id": "pc7", "concept": "FPC", "level": "HL", "type": "mc", "q": "Which market comes closest to perfect competition?", "options": ["Rice farming by many small farmers", "Smartphones", "Airlines", "Electricity supply"], "answer": 0, "exp": "Many small sellers of a nearly identical product, with easy entry, is close to the model.", "rw": "Thailand has many small rice farmers who each sell at the market price."},
  {"id": "pc8", "concept": "FPC", "level": "HL", "type": "mc", "q": "The market price is $6. A perfectly competitive firm produces 200 units, where ATC is $5. What is its profit?", "options": ["$200 abnormal profit", "$1,200 abnormal profit", "$1,000 abnormal profit", "A loss of $200"], "answer": 0, "exp": "Profit = (P − ATC) × Q = ($6 − $5) × 200 = $200.", "rw": "Each small farm’s profit depends on the gap between the market price and its own average cost.", "time": 1.5},
  {"id": "mo1", "concept": "FMON", "level": "HL", "type": "mc", "q": "Which is a barrier to entry?", "options": ["Patents", "Perfect information", "Low start-up costs", "Identical products"], "answer": 0, "exp": "A patent gives one firm the legal right to be the only seller of a product for a period.", "rw": "Pharmaceutical patents give a firm the sole right to sell a new drug for many years."},
  {"id": "mo2", "concept": "FMON", "level": "HL", "type": "diagram", "diagram": "monProfit", "q": "What does area A show?", "options": ["Abnormal profit", "Normal profit", "A loss", "Consumer surplus"], "answer": 0, "exp": "At Q (where MC = MR), price P is above average cost C, so the monopoly earns (P − C) × Q above normal profit.", "rw": "De Beers once controlled most of the world’s rough diamond supply, letting it keep prices high.", "time": 1.25},
  {"id": "mo3", "concept": "FMON", "level": "HL", "type": "mc", "q": "A monopoly chooses output where MC = MR. How does it set its price?", "options": ["From the demand (AR) curve at that output", "Where MC = AR", "Equal to MR", "Equal to ATC"], "answer": 0, "exp": "Price is the highest consumers will pay for that output, read off the demand curve.", "rw": "Competition authorities use this reasoning to estimate how much a dominant firm overcharges."},
  {"id": "mo4", "concept": "FMON", "level": "HL", "type": "mc", "q": "Compared with perfect competition (with the same costs), monopoly typically leads to…", "options": ["A higher price and lower output", "A lower price and higher output", "The same price and output", "A higher price and higher output"], "answer": 0, "exp": "The monopolist restricts output to where MC = MR and charges a price above MC.", "rw": "When state telecom monopolies were opened to competition in many countries, call prices tended to fall sharply."},
  {"id": "mo5", "concept": "FMON", "level": "HL", "type": "mc", "q": "A natural monopoly exists when…", "options": ["Economies of scale are so large that one firm can supply the whole market at a lower cost than several firms", "A firm owns a natural resource", "The government owns the firm", "A firm makes abnormal profit"], "answer": 0, "exp": "LRAC is still falling at the level of market demand, so one supplier is cheapest.", "rw": "Water and electricity grids are classic natural monopolies: two sets of pipes or cables would waste resources."},
  {"id": "mo6", "concept": "FMON", "level": "HL", "type": "mc", "q": "Why is a monopoly allocatively inefficient?", "options": ["Price is above marginal cost at its output", "It produces at minimum ATC", "It makes normal profit", "Price equals marginal cost"], "answer": 0, "exp": "P > MC means consumers value extra units more than they cost to make, but they are not produced: a welfare loss.", "rw": "Prices of patented medicines can be many times their production cost."},
  {"id": "mo7", "concept": "FMON", "level": "HL", "type": "mc", "q": "Which is a possible advantage of monopoly?", "options": ["Abnormal profits can fund research and development", "Lower prices than in perfect competition", "More consumer choice", "Allocative efficiency"], "answer": 0, "exp": "Large, secure profits can pay for innovation, and big firms may enjoy economies of scale.", "rw": "Big tech firms such as Alphabet spend tens of billions of dollars a year on research and development."},
  {"id": "mo8", "concept": "FMON", "level": "HL", "type": "order", "q": "Put the steps for finding a monopoly’s price on a diagram in order.", "items": ["Draw the AR (demand) and MR curves", "Find the output where MC = MR", "Go up from that output to the AR curve", "Read the price off the vertical axis"], "exp": "Output comes from MC = MR; price comes from the demand curve above that output.", "rw": "Economists use this method when analysing pricing by dominant firms in competition cases."},
  {"id": "mo9", "concept": "FMON", "level": "HL", "type": "mc", "q": "Why will a profit-maximising monopoly never produce on the inelastic part of its demand curve?", "options": ["MR is negative there, so it cannot equal a positive MC", "Demand is zero there", "Costs are lowest there", "Price is too low there"], "answer": 0, "exp": "Where demand is inelastic, MR < 0. Since MC > 0, MC = MR can only happen where demand is elastic.", "rw": "Firms with pricing power keep raising prices until customers start leaving in large numbers.", "time": 1.5, "double": true},
  {"id": "mn1", "concept": "FMONC", "level": "HL", "type": "mc", "q": "Which is a key feature of monopolistic competition?", "options": ["Many firms selling differentiated products, with low barriers to entry", "A few large interdependent firms", "One firm with high barriers to entry", "Identical products and perfect information"], "answer": 0, "exp": "Each firm has a little market power from its unique product, but entry is easy.", "rw": "Bangkok’s coffee shops: many sellers, each with its own style, location and menu."},
