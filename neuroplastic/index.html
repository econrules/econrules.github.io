<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Neuroplastic</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a single-theme "neural night" world. The brain map is the hub; every game is a region of it. */
:root {
  color-scheme: dark;
  --ink: #0c0d1f;        /* deep indigo night */
  --ink-2: #14163a;      /* surface */
  --ink-3: #1e2152;      /* raised surface */
  --line: #2d316c;       /* hairlines */
  --text: #ecebff;
  --muted: #9ea0cf;
  --axon: #6ff2dc;       /* ready / learned: bioluminescent teal */
  --myelin: #ffc46b;     /* next up / gold mastery */
  --dendrite: #b69cff;   /* violet accent */
  --miss: #ff8794;       /* wrong answer */
  --dormant: #4b4f86;    /* not yet */
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 14px;
}
* { box-sizing: border-box; }
html, body { background: var(--ink); color: var(--text); }
body {
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
  background:
    radial-gradient(1200px 600px at 75% -10%, rgba(182,156,255,.13), transparent 60%),
    radial-gradient(900px 500px at 0% 30%, rgba(111,242,220,.07), transparent 60%),
    var(--ink);
  background-attachment: fixed;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
.wrap { max-width: 1120px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.1; text-wrap: balance; margin: 0; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--axon); outline-offset: 3px; }
.mono { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.muted { color: var(--muted); }

/* ---------- top bar ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(12,13,31,.86); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 10px max(16px, env(safe-area-inset-left, 0px)); }
.topbar .wrap { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; text-align: left; }
.brand svg { flex: none; }
.brand b { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -.01em; }
.brand small { display: block; font-size: 12px; color: var(--muted); line-height: 1.2; }
.spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--ink-2); border-radius: 999px; padding: 6px 12px; font-size: 14px; }
.iconbtn { border: 1px solid var(--line); background: var(--ink-2); border-radius: 999px; width: 36px; height: 36px; display: grid; place-items: center; }
.iconbtn:hover, .chip:hover { border-color: var(--dendrite); }

.preview-bar { margin: 14px auto 0; max-width: 1120px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; border: 1px dashed var(--myelin); color: var(--myelin); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
.preview-bar select { background: var(--ink-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font: inherit; }

/* ---------- hub hero ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 28px; align-items: center; padding-block: 32px 8px; }
.hero h1 { font-size: clamp(36px, 6vw, 64px); font-weight: 800; letter-spacing: -.025em; }
.hero h1 em { font-style: normal; color: var(--axon); text-shadow: 0 0 24px rgba(111,242,220,.45); }
.hero .lede { margin-top: 14px; font-size: 18px; color: var(--muted); max-width: 42ch; }
.stats { display: flex; gap: 22px; margin-top: 22px; flex-wrap: wrap; }
.stat b { display: block; font-family: var(--font-display); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 22px; font-size: 14px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.dot-ready { background: var(--axon); box-shadow: 0 0 10px var(--axon); }
.dot-next { background: var(--myelin); box-shadow: 0 0 10px var(--myelin); }
.dot-not { background: transparent; border: 1.5px dashed var(--dormant); }

.map-frame { position: relative; min-width: 0; }
#brainmap { width: 100%; height: auto; display: block; overflow: visible; }
.node { cursor: pointer; }
.node .core { transition: r .2s; }
.node:hover .core, .node.sel .core { r: 16; }
.node.sel .selring { opacity: 1; }
.selring { opacity: 0; transition: opacity .2s; }
.node text { pointer-events: none; }
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.2s ease-out infinite; }
@keyframes pulse { 0% { transform: scale(.7); opacity: .9; } 100% { transform: scale(2.2); opacity: 0; } }

/* ---------- topic panel ---------- */
.topic-panel { margin-top: 18px; border: 1px solid var(--line); background: linear-gradient(180deg, var(--ink-2), rgba(20,22,58,.4)); border-radius: var(--r); padding: 18px 20px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px 24px; align-items: start; }
.topic-panel h3 { font-size: 24px; font-weight: 700; margin-top: 4px; }
.topic-panel ul { margin: 10px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
.topic-panel li { font-size: 14px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; color: var(--muted); }
.status { display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; white-space: nowrap; line-height: 1.3; }
.status.ready { color: var(--ink); background: var(--axon); }
.status.next { color: var(--ink); background: var(--myelin); }
.status.not { color: var(--muted); border: 1px dashed var(--dormant); }
.status.soon { color: var(--dendrite); border: 1px solid rgba(182,156,255,.5); }
.status.fading { color: var(--myelin); border: 1px solid rgba(255,196,107,.5); }

/* ---------- section headers ---------- */
.sec { margin-top: 48px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.sec-head h2 { font-size: 28px; font-weight: 700; letter-spacing: -.01em; }

/* ---------- game cards ---------- */
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 14px; }
.game { position: relative; border: 1px solid var(--line); border-radius: var(--r); padding: 18px; background: var(--ink-2); display: flex; flex-direction: column; gap: 10px; overflow: hidden; min-width: 0; }
.game::after { content: ""; position: absolute; inset: auto -40px -60px auto; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, var(--glow, rgba(111,242,220,.18)), transparent 70%); pointer-events: none; }
.game.is-ready { border-color: rgba(111,242,220,.45); }
.game.is-dim { opacity: .62; }
.game .region { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dendrite); }
.game h3 { font-size: 22px; font-weight: 700; }
.game p { color: var(--muted); font-size: 15px; }
.game .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; flex-wrap: wrap; padding-top: 6px; }
.btn { border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 700; background: var(--axon); color: var(--ink); box-shadow: 0 0 0 0 rgba(111,242,220,.5); transition: transform .15s, box-shadow .2s; }
.btn:hover { transform: translateY(-1px); box-shadow: 0 6px 24px -6px rgba(111,242,220,.6); }
.btn[disabled] { background: var(--ink-3); color: var(--muted); cursor: not-allowed; box-shadow: none; transform: none; }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
.btn.ghost:hover { border-color: var(--axon); box-shadow: none; }
.btn.gold { background: var(--myelin); }

/* ---------- study cards ---------- */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 16px; }
.scard { position: relative; border-radius: 16px; padding: 2px; background: var(--line); min-width: 0; }
.scard.got { background: linear-gradient(140deg, var(--axon), var(--dendrite)); }
.scard.holo { background: linear-gradient(120deg, var(--myelin), var(--axon), var(--dendrite), var(--myelin)); background-size: 300% 300%; animation: holo 6s linear infinite; }
@keyframes holo { to { background-position: 300% 0; } }
.scard-in { border-radius: 14px; background: var(--ink-2); padding: 16px; height: 100%; display: flex; flex-direction: column; gap: 10px; }
.scard .yr { font-family: var(--font-mono); font-size: 34px; font-weight: 600; line-height: 1; color: var(--axon); letter-spacing: -.02em; }
.scard.locked .yr { color: var(--dormant); }
.scard h3 { font-size: 19px; font-weight: 700; }
.scard dl { margin: 0; display: grid; gap: 7px; font-size: 13.5px; }
.scard dt { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.scard dd { margin: 0; }
.scard.locked dl { filter: blur(4px); opacity: .5; user-select: none; }
.scard .lockmsg { font-size: 13.5px; color: var(--muted); }
.stars { display: inline-flex; gap: 3px; }
.stars svg { width: 15px; height: 15px; }
.scard-top { display: flex; justify-content: space-between; align-items: start; gap: 8px; }

/* ---------- Study Lab ---------- */
.lab { max-width: 760px; margin: 0 auto; padding-top: 22px; }
.lab-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.lab-head h1 { font-size: clamp(30px, 5vw, 44px); font-weight: 800; letter-spacing: -.02em; }
.back { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; color: var(--muted); font-size: 14px; }
.back:hover { color: var(--text); border-color: var(--axon); }
.panel { margin-top: 18px; border: 1px solid var(--line); background: var(--ink-2); border-radius: 18px; padding: 22px; }
.topic-picks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.pick { border: 1px solid var(--line); background: var(--ink); border-radius: 999px; padding: 7px 13px; font-size: 14px; }
.pick[aria-pressed="true"] { border-color: var(--axon); color: var(--axon); background: rgba(111,242,220,.08); }
.pick[disabled] { opacity: .45; cursor: not-allowed; }
.toggle { display: flex; gap: 12px; align-items: start; margin-top: 18px; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--ink); }
.toggle input { accent-color: var(--myelin); width: 20px; height: 20px; margin-top: 2px; flex: none; }

.hud { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; margin-top: 18px; }
.progress { height: 8px; background: var(--ink-3); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--dendrite), var(--axon)); border-radius: 99px; transition: width .35s; }
.score { font-family: var(--font-display); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; }
.streak { display: flex; align-items: center; gap: 8px; }
.streak .segs { display: flex; gap: 3px; }
.streak .segs i { width: 9px; height: 18px; border-radius: 3px; background: var(--ink-3); transition: background .2s, box-shadow .2s; }
.streak .segs i.on { background: var(--myelin); box-shadow: 0 0 10px rgba(255,196,107,.7); }
.mult { font-family: var(--font-mono); font-weight: 600; font-size: 14px; color: var(--myelin); min-width: 2.4em; }
.mult.bump { animation: bump .4s; }
@keyframes bump { 50% { transform: scale(1.5); } }

.qcard { margin-top: 16px; border-radius: 18px; padding: 24px; background: linear-gradient(180deg, var(--ink-3), var(--ink-2)); border: 1px solid var(--line); animation: rise .35s ease-out; }
@keyframes rise { from { transform: translateY(8px); opacity: .4; } }
.qtype { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.qtype .tag { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); background: var(--dendrite); padding: 3px 9px; border-radius: 6px; }
.qprompt { font-family: var(--font-display); font-size: clamp(21px, 3.2vw, 27px); font-weight: 700; line-height: 1.25; margin-top: 14px; }
.casefile { margin-top: 14px; padding: 14px 16px; border-left: 3px solid var(--axon); background: rgba(111,242,220,.06); border-radius: 0 10px 10px 0; font-size: 17px; }
.opts { display: grid; gap: 10px; margin-top: 18px; }
.opts.two { grid-template-columns: 1fr 1fr; }
.opts.three { grid-template-columns: repeat(3, 1fr); }
.opt { text-align: left; border: 1px solid var(--line); background: var(--ink); border-radius: 12px; padding: 13px 15px; display: flex; gap: 12px; align-items: center; transition: border-color .15s, background .15s, transform .1s; min-width: 0; }
.opt:hover:not([disabled]) { border-color: var(--axon); transform: translateY(-1px); }
.opt kbd { font-family: var(--font-mono); font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; flex: none; }
.opts.two .opt, .opts.three .opt { justify-content: center; font-weight: 700; font-size: 17px; }
.opt.right { border-color: var(--axon); background: rgba(111,242,220,.12); }
.opt.wrong { border-color: var(--miss); background: rgba(255,135,148,.1); animation: shake .35s; }
.opt[disabled] { cursor: default; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.feedback { margin-top: 16px; padding: 16px; border-radius: 12px; display: grid; gap: 8px; }
.feedback.ok { background: rgba(111,242,220,.08); border: 1px solid rgba(111,242,220,.35); }
.feedback.no { background: rgba(255,135,148,.07); border: 1px solid rgba(255,135,148,.35); }
.feedback b { font-family: var(--font-display); font-size: 19px; }
.feedback.ok b { color: var(--axon); }
.feedback.no b { color: var(--miss); }
.feedback .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.pop { position: fixed; left: 50%; top: 40%; transform: translate(-50%,-50%); font-family: var(--font-display); font-weight: 800; font-size: 44px; color: var(--myelin); text-shadow: 0 0 30px rgba(255,196,107,.7); pointer-events: none; animation: popup 1s ease-out forwards; z-index: 30; }
@keyframes popup { 0% { opacity: 0; transform: translate(-50%,-30%) scale(.6); } 25% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); } 100% { opacity: 0; transform: translate(-50%,-90%) scale(1); } }

.result-big { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 12px; }
.result-big div b { display: block; font-family: var(--font-display); font-size: 44px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.result-big div span { color: var(--muted); font-size: 14px; }
.studyrow { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
.studyrow .bar { width: 90px; height: 6px; background: var(--ink-3); border-radius: 99px; overflow: hidden; }
.studyrow .bar i { display: block; height: 100%; background: var(--axon); }
.newcard { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: rgba(255,196,107,.08); border: 1px solid rgba(255,196,107,.45); margin-top: 10px; animation: rise .5s; }
.sendnote { font-size: 14px; color: var(--muted); margin-top: 14px; }

/* ---------- modal ---------- */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(6,7,18,.8); backdrop-filter: blur(6px); display: grid; place-items: center; padding: 16px; }
.modal { width: min(440px, 100%); border-radius: 20px; border: 1px solid var(--line); background: var(--ink-2); padding: 26px; display: grid; gap: 14px; }
.modal h2 { font-size: 28px; font-weight: 800; }
.field { display: grid; gap: 6px; }
.field label { font-size: 14px; color: var(--muted); }
.field input { background: var(--ink); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; font: inherit; }
.err { color: var(--miss); font-size: 14px; min-height: 1.2em; }
.modal .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
.linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 0; font-size: 14px; }

/* ---------- Spot the Level ---------- */
.lvl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.lvl-grid.three { grid-template-columns: repeat(3, 1fr); }
.lvl { text-align: left; border: 1px solid var(--line); background: var(--ink); border-radius: 14px; padding: 14px; display: grid; grid-template-columns: auto minmax(0,1fr); gap: 4px 12px; align-items: center; transition: border-color .15s, transform .1s, background .15s; min-width: 0; }
.lvl:hover:not([disabled]) { border-color: var(--axon); transform: translateY(-1px); }
.lvl svg { grid-row: span 2; }
.lvl b { font-family: var(--font-display); font-size: 18px; }
.lvl small { color: var(--muted); font-size: 13.5px; line-height: 1.35; }
.lvl.right { border-color: var(--axon); background: rgba(111,242,220,.12); }
.lvl.wrong { border-color: var(--miss); background: rgba(255,135,148,.1); animation: shake .35s; }
.lvl[disabled] { cursor: default; }
.speed { font-family: var(--font-mono); font-size: 12px; color: var(--myelin); }

/* ---------- Term Arcade ---------- */
.modes { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; margin-bottom: 20px; }
.mode { text-align: left; border: 1px solid var(--line); background: var(--ink); border-radius: 14px; padding: 14px; display: grid; gap: 4px; }
.mode b { font-family: var(--font-display); font-size: 18px; }
.mode small { color: var(--muted); font-size: 13.5px; line-height: 1.35; }
.mode[aria-pressed="true"] { border-color: var(--myelin); background: rgba(255,196,107,.07); }
.mode[aria-pressed="true"] b { color: var(--myelin); }
.timebar { height: 8px; background: var(--ink-3); border-radius: 99px; overflow: hidden; }
.timebar i { display: block; height: 100%; background: linear-gradient(90deg, var(--miss), var(--myelin), var(--axon)); border-radius: 99px; transition: width .1s linear; }
.clock { font-family: var(--font-mono); font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.defn { font-size: clamp(19px, 2.8vw, 23px); line-height: 1.4; font-family: var(--font-display); font-weight: 500; margin-top: 12px; }
.match { display: grid; grid-template-columns: minmax(0,2fr) minmax(0,3fr); gap: 14px; margin-top: 16px; }
.mcol { display: grid; gap: 8px; align-content: start; }
.mi { text-align: left; border: 1px solid var(--line); background: var(--ink); border-radius: 12px; padding: 11px 13px; font-size: 15px; transition: border-color .15s, background .15s, opacity .3s; min-width: 0; }
.mi.term { font-family: var(--font-display); font-weight: 700; font-size: 16px; }
.mi:hover:not([disabled]) { border-color: var(--dendrite); }
.mi.sel { border-color: var(--myelin); background: rgba(255,196,107,.1); }
.mi.ok { border-color: var(--axon); background: rgba(111,242,220,.1); opacity: .55; cursor: default; }
.mi.bad { border-color: var(--miss); animation: shake .35s; }
.flash { perspective: 1200px; margin-top: 18px; cursor: pointer; }
.flash-in { position: relative; min-height: 230px; transition: transform .5s; transform-style: preserve-3d; }
.flash.flipped .flash-in { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 18px; border: 1px solid var(--line); padding: 24px; display: grid; place-content: center; text-align: center; gap: 10px; background: linear-gradient(180deg, var(--ink-3), var(--ink-2)); }
.face.back { transform: rotateY(180deg); border-color: rgba(111,242,220,.45); }
.face h2 { font-size: clamp(28px, 5vw, 40px); font-weight: 800; }
.face p { font-size: 19px; max-width: 46ch; }
/* ---------- Brain Under Stress ---------- */
.bs-diagram { width: 100%; max-width: 560px; margin: 14px auto 0; display: block; }
.bs-diagram .hot { cursor: pointer; }
.bs-diagram .hot:hover .reg, .bs-diagram .hot:focus .reg { stroke: var(--myelin); stroke-width: 3; }
.bs-diagram .hl { animation: hlpulse 1.4s ease-in-out infinite; }
@keyframes hlpulse { 50% { opacity: .55; } }
.bs-diagram .spark { animation: twinkle 1.6s ease-in-out infinite; }

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const DAY = 864e5;

/* ---------------- unlock logic ---------------- */
function nextTopic() { return TOPIC_NS.find(n => n > cfg.currentTopic) ?? null; }
function topicState(n) {
  if (n <= cfg.currentTopic) return "ready";
  if (n === nextTopic()) return "next";
  return "not";
}
function stateFor(needs) { return topicState(needs); }

/* ---------------- mastery ---------------- */
function sp(id) { return progress.studies[id] || { c: 0, s: 0, last: 0 }; }
function stars(id) {
  const p = sp(id); const acc = p.s ? p.c / p.s : 0;
  if (p.c >= 10 && acc >= .75) return 3;
  if (p.c >= 6 && acc >= .6) return 2;
  if (p.c >= 3) return 1;
  return 0;
}
function fading(id) { const p = sp(id); return stars(id) > 0 && Date.now() - p.last > CONFIG.FADE_DAYS * DAY; }
function topicStudies(n) { return STUDY_IDS.filter(id => STUDIES[id].topic === n); }
function topicPractice(n) { const p = progress.topics[n]; return p ? Math.min(1, p.c / 25) : 0; }
function topicMastery(n) {
  const ids = topicStudies(n); const prac = topicPractice(n);
  if (!ids.length) return prac;
  const sm = ids.reduce((a, id) => a + stars(id), 0) / (ids.length * 3);
  return Math.min(1, sm * .75 + prac * .25);
}
function topicFading(n) {
  if (topicStudies(n).length) return topicStudies(n).some(fading);
  const p = progress.topics[n]; return !!(p && p.c > 0 && Date.now() - p.last > CONFIG.FADE_DAYS * DAY);
}
let revivedFlag = false;
function recordTopic(n, ok) {
  if (ok && topicState(n) === "ready" && topicFading(n)) revivedFlag = true;
  const p = progress.topics[n] || { c: 0, s: 0, last: 0 }; p.s++; if (ok) p.c++; p.last = Date.now(); progress.topics[n] = p;
}
function collected() { return STUDY_IDS.filter(id => stars(id) > 0).length; }

let actx = null;
function tone(freqs, dur = .12, type = "sine", gap = .07, vol = .08) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * gap;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .02);
    });
  } catch (e) {}
}
const sfx = {
  right: () => tone([660, 990]),
  wrong: () => tone([220, 175], .18, "triangle", .09, .07),
  combo: () => tone([523, 659, 784, 1047], .14, "sine", .06),

let queue = store.get("queue", []);
async function flushQueue() {
  if (PREVIEW || !queue.length) return;
  const pending = queue.slice();
  for (const item of pending) {
    try {
      await fetch(CONFIG.SCRIPT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(item) });
      queue = queue.filter(q => q.id !== item.id); store.set("queue", queue);
    } catch (e) { break; }
  }
}
async function fetchJSON(url, ms = 7000) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try { const r = await fetch(url, { signal: ctl.signal }); return await r.json(); } finally { clearTimeout(t); }
}
async function loadConfig() {
  if (PREVIEW) return;
  try {
    const d = await fetchJSON(CONFIG.SCRIPT_URL + "?action=config");
    if (d && TOPIC_NS.includes(Number(d.currentTopic))) {
      cfg = { currentTopic: Number(d.currentTopic), codeRequired: !!d.codeRequired };
      store.set("cfg", cfg);
      renderAll();
      if (!profile || (cfg.codeRequired && !profile.code)) openProfile();

}

/* Levels need XP AND mastered topics, so nobody outruns the unit.

const MASTERY_BAR = 0.5;
const DAILY_FULL_XP = 400;
function levelOf(xp) { let i = 0; LEVELS_XP.forEach((l, k) => { if (xp >= l.at) i = k; }); return i; }
function topicsNeeded(k) { return k >= LEVELS_XP.length - 1 ? TOPIC_NS.length : k; }
function masteredTopics() { return TOPIC_NS.filter(n => topicState(n) === "ready" && topicMastery(n) >= MASTERY_BAR); }
function levelCap() { const m = masteredTopics().length; let cap = 0; LEVELS_XP.forEach((_, k) => { if (m >= topicsNeeded(k)) cap = k; }); return cap; }
function levelNow() { return Math.min(levelOf(progress.xp), levelCap()); }
function levelProgress() {
  const i = levelNow(), cur = LEVELS_XP[i], nx = LEVELS_XP[i + 1];
  const xpPct = nx ? Math.max(0, Math.min(100, (progress.xp - cur.at) / (nx.at - cur.at) * 100)) : 100;
  const needT = nx ? topicsNeeded(i + 1) : 0, haveT = masteredTopics().length;
  return { i, cur, nx, pct: xpPct, xpReady: nx ? progress.xp >= nx.at : true, needT, haveT };
}
function checkLevel() {
  const now = levelNow();

}
function answerXP() {
  const today = new Date().toLocaleDateString("en-CA");
  if (!progress.dayXP || progress.dayXP.d !== today) progress.dayXP = { d: today, xp: 0 };
  const full = progress.dayXP.xp < DAILY_FULL_XP; const v = full ? 10 : 3;
  progress.dayXP.xp += v; return v;
}
function closestTopic() {
  return TOPIC_NS.filter(n => topicState(n) === "ready" && topicMastery(n) < MASTERY_BAR).map(n => ({ n, m: topicMastery(n) })).sort((a, b) => b.m - a.m)[0];

function hashStr(s) { let h = 7; for (const ch of s) h = Math.imul(h ^ ch.charCodeAt(0), 2654435761); return h >>> 0; }
function pathGlyph(id, on, size = 44) {

    nodes = [{ x: cx, y: cy, d: 0, p: -1 }];
    const count = Math.round(Math.min(140, Math.max(60, W * H / 9000)));
    for (let k = 0; k < count; k++) { const a = rnd() * Math.PI * 2, rr = Math.sqrt(rnd()); nodes.push({ x: cx + Math.cos(a) * rr * W * .52, y: cy + Math.sin(a) * rr * H * .52, d: rr }); }
    nodes.sort((a, b) => a.d - b.d);
    for (let k = 1; k < nodes.length; k++) {
      let best = 0, bd = 1e9;
      for (let j = 0; j < k; j++) { const dx = nodes[k].x - nodes[j].x, dy = nodes[k].y - nodes[j].y, dd = dx * dx + dy * dy; if (dd < bd) { bd = dd; best = j; } }
      nodes[k].p = best; nodes[k].hue = rnd();
    }
  }
  function frame(now) {
    const t = reduce ? 9 : (now - t0) / 1000; const maxD = nodes[nodes.length - 1].d || 1;
    ctx.clearRect(0, 0, W, H);
    for (let k = 1; k < nodes.length; k++) {
      const n = nodes[k], p = nodes[n.p]; const start = (n.d / maxD) * 1.4, g = Math.max(0, Math.min(1, (t - start) / .35));
      if (!g) continue;
      const col = n.hue < .55 ? "111,242,220" : n.hue < .85 ? "182,156,255" : "255,196,107";
      ctx.strokeStyle = `rgba(${col},${.55 * g})`; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + (n.x - p.x) * g, p.y + (n.y - p.y) * g); ctx.stroke();
      if (g >= 1) {
        ctx.fillStyle = `rgba(${col},.95)`; ctx.beginPath(); ctx.arc(n.x, n.y, 2.4, 0, 7); ctx.fill();
        // signal pulse travelling outward
        const ph = ((t * .9 - n.d / maxD) % 1 + 1) % 1;
        if (!reduce && ph < .25) { const q = ph / .25; ctx.fillStyle = "rgba(255,255,255,.9)"; ctx.beginPath(); ctx.arc(p.x + (n.x - p.x) * q, p.y + (n.y - p.y) * q, 1.8, 0, 7); ctx.fill(); }
      }
    }
    const c = nodes[0], pulse = 18 + Math.sin(t * 4) * 4;
    const grd = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, pulse * 4); grd.addColorStop(0, "rgba(255,196,107,.5)"); grd.addColorStop(1, "rgba(255,196,107,0)");
    ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(c.x, c.y, pulse * 4, 0, 7); ctx.fill();
    if (!reduce) raf = requestAnimationFrame(frame);
  }
  build(); raf = requestAnimationFrame(frame);
  const onResize = () => build(); window.addEventListener("resize", onResize);
  const close = () => { cancelAnimationFrame(raf); window.removeEventListener("resize", onResize); root.remove(); if (view === "hub") renderHub(); };
  root.querySelector("#luClose").addEventListener("click", close);
  setTimeout(() => root.querySelector("#luClose")?.focus({ preventScroll: true }), 1000);
}

function sendScore(game, score, correct, total, best, perTopic, item) {
  progress.rounds++; progress.bestStreak = Math.max(progress.bestStreak, best || 0); progress.best = Math.max(progress.best, score);
  store.set("progress", progress);
  const answers = [];
  Object.entries(perTopic).forEach(([n, v]) => {
    Object.entries(v).forEach(([it, c]) => answers.push({ topic: Number(n), item: it || item, correct: c.c, total: c.n, challenge: topicState(Number(n)) !== "ready" }));
  });
  const challenge = answers.some(a => a.challenge);
  const payload = {
    id: Date.now() + "-" + Math.random().toString(36).slice(2, 8),
    code: profile?.code || "", name: profile?.name || "Guest", cls: profile?.cls || "",
    game, score, correct, total, bestStreak: best || 0, challenge, classTopic: cfg.currentTopic, answers,

  };

/* ----- Quick-fire ----- */
const QF_SECS = 60;
function qfStart(pool, topics) {
  clearTimers();

}
function qfTick() {
  if (!ta || ta.mode !== "quick") return;
  const left = Math.max(0, ta.end - Date.now());
  const bar = $("#qfBar"), clk = $("#qfClock");
  if (bar) bar.style.width = (left / (QF_SECS * 1000) * 100) + "%";
  if (clk) clk.textContent = Math.ceil(left / 1000) + "s";
  if (left <= 0) qfFinish();
}
function qfNext() {
  if (!ta) return;

  let cands = ta.pool.filter(t => !ta.recent.includes(t.t)); if (!cands.length) cands = ta.pool;
  const cur = cands[Math.floor(Math.random() * cands.length)];
  ta.recent.push(cur.t); if (ta.recent.length > Math.min(8, ta.pool.length - 1)) ta.recent.shift();
  const same = shuffle(TERMS.filter(t => t.n === cur.n && t.t !== cur.t)), other = shuffle(TERMS.filter(t => t.n !== cur.n && ta.pool.includes(t)));
  const distract = [...same, ...other].slice(0, 3);
  ta.cur = cur; ta.opts = shuffle([cur, ...distract]); ta.locked = false;
  const left = Math.max(0, ta.end - Date.now());
  $("#view-terms").innerHTML = `<div class="lab">
    <div class="lab-head"><button class="back" id="quitT">← Quit</button><span class="mono muted">Quick-fire</span><span class="spacer"></span><span class="clock" id="qfClock">${Math.ceil(left / 1000)}s</span></div>
    <div class="hud">
      <div class="streak"><div class="segs">${[1, 2, 3, 4, 5, 6].map(i => `<i class="${ta.streak >= i ? "on" : ""}"></i>`).join("")}</div><span class="mult">×${multOf(ta.streak)}</span></div>
      <div class="timebar"><i id="qfBar" style="width:${left / (QF_SECS * 1000) * 100}%"></i></div>
      <div class="score">${ta.score}</div></div>
    <article class="qcard" style="animation-duration:.2s">
      <div class="qtype"><span class="tag">Name the term</span><span class="mono muted">T${cur.n} · ${esc(topicByN(cur.n).short)}</span>${topicState(cur.n) !== "ready" ? '<span class="status next">Challenge</span>' : ""}</div>
      <p class="defn">${esc(cur.d)}</p>
      <div class="opts two" style="margin-top:18px">${ta.opts.map((o, i) => `<button class="opt" data-i="${i}" style="justify-content:flex-start;font-size:16px"><kbd>${i + 1}</kbd><span>${esc(o.t)}</span></button>`).join("")}</div>
    </article></div>`;
  $("#view-terms").querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => qfAnswer(Number(b.dataset.i))));
  $("#quitT").addEventListener("click", () => show("terms"));
}
function qfAnswer(i) {

  ta.locked = true; ta.n++;
  const ok = ta.opts[i] === ta.cur;

  tally(ta.per, ta.cur.n, "Key terms", ok); recordTopic(ta.cur.n, ok); store.set("progress", progress);
  noteAnswer(ok, ok ? ta.streak + 1 : 0);
  if (ok) {

    if (multOf(ta.streak) > before) { sfx.combo(); popText("×" + multOf(ta.streak)); } else sfx.right();

function qfFinish() {

  const r = ta; const acc = r.n ? Math.round(r.correct / r.n * 100) : 0;

/* ----- Match grid ----- */
function mgStart(pool, topics) {
  clearTimers();
  // key terms (e.g. hippocampus) always make the board when their topic is in play
  const keys = pool.filter(t => t.key);
  const pairs = shuffle([...keys, ...shuffle(pool.filter(t => !t.key))].slice(0, Math.min(6, pool.length)));
  ta = { mode: "match", pool, topics, pairs, defs: shuffle(pairs.map((_, i) => i)), selT: null, selD: null, done: new Set(), missedOnce: new Set(), mistakes: 0, score: 0, streak: 0, best: 0, start: Date.now(), per: {} };
  mgRender();
  tickId = setInterval(() => { const c = $("#mgClock"); if (c && ta) c.textContent = Math.floor((Date.now() - ta.start) / 1000) + "s"; }, 500);
}
function mgRender() {
  const v = $("#view-terms");
  v.innerHTML = `<div class="lab">
    <div class="lab-head"><button class="back" id="quitT">← Quit</button><span class="mono muted">Match grid</span><span class="spacer"></span><span class="clock" id="mgClock">0s</span></div>
    ${hud(ta.streak, multOf(ta.streak), ta.done.size / ta.pairs.length * 100, ta.score)}
    <p class="muted" style="margin-top:14px">Tap a term, then its definition. Mistakes: <span id="mgMiss">${ta.mistakes}</span></p>
    <div class="match">
      <div class="mcol terms">${ta.pairs.map((p, i) => `<button class="mi term" data-t="${i}">${esc(p.t)}</button>`).join("")}</div>
      <div class="mcol">${ta.defs.map(i => `<button class="mi" data-d="${i}">${esc(ta.pairs[i].d)}</button>`).join("")}</div>
    </div></div>`;
  v.querySelectorAll(".mi").forEach(b => b.addEventListener("click", () => mgPick(b)));
  $("#quitT").addEventListener("click", () => show("terms"));
}
function mgPick(b) {
  if (!ta || ta.mode !== "match") return;
  const v = $("#view-terms");
  if (b.dataset.t != null) { const i = Number(b.dataset.t); if (ta.done.has(i)) return; ta.selT = i; }
  else { const i = Number(b.dataset.d); if (ta.done.has(i)) return; ta.selD = i; }
  v.querySelectorAll(".mi").forEach(x => x.classList.toggle("sel", (x.dataset.t != null && Number(x.dataset.t) === ta.selT) || (x.dataset.d != null && Number(x.dataset.d) === ta.selD)));
  if (ta.selT == null || ta.selD == null) return;
  const tBtn = v.querySelector(`[data-t="${ta.selT}"]`), dBtn = v.querySelector(`[data-d="${ta.selD}"]`);
  const term = ta.pairs[ta.selT];
  if (ta.selT === ta.selD) {
    ta.done.add(ta.selT); const before = multOf(ta.streak); ta.streak++; ta.best = Math.max(ta.best, ta.streak); ta.score += 100 * multOf(ta.streak);
    const first = !ta.missedOnce.has(ta.selT);
    tally(ta.per, term.n, "Key terms", first); recordTopic(term.n, first);
    noteAnswer(true, ta.streak);
    [tBtn, dBtn].forEach(x => { x.classList.remove("sel"); x.classList.add("ok"); x.disabled = true; });
    if (multOf(ta.streak) > before) { sfx.combo(); popText("×" + multOf(ta.streak)); } else sfx.right();
  } else {

  v.querySelector(".hud").outerHTML = hud(ta.streak, multOf(ta.streak), ta.done.size / ta.pairs.length * 100, ta.score);

}
function mgFinish() {

  const r = ta; const secs = Math.round((Date.now() - r.start) / 1000);

  const firstTry = r.pairs.length - r.missedOnce.size; const acc = Math.round(firstTry / r.pairs.length * 100);

  const note = sendScore("Term Arcade · Match", r.score, firstTry, r.pairs.length, r.best, r.per);
  const topics = r.topics, pool = r.pool; ta = null;
  resultsPanel($("#view-terms"), {
    game: "Match grid", headline: headlineFor(acc), note,
    big: [[r.score, "points"], [secs + "s", "time"], [r.mistakes, r.mistakes === 1 ? "mistake" : "mistakes"]],
    body: `<p class="muted" style="margin-top:14px">${firstTry} of ${r.pairs.length} matched first time. Time bonus: +${bonus}.</p>`,

function gameForTopic(n) {
  if (topicStudies(n).length) return "lab";

function nextSteps() {
  const out = []; const add = o => { if (!out.some(x => x.t === o.t)) out.push(o); };
  const ready = TOPIC_NS.filter(n => topicState(n) === "ready");
  const playable = GAMES.filter(g => g.built && stateFor(g.needs) === "ready");
  const nt = nextTopic();
  // 1. fading topics first
  ready.filter(topicFading).forEach(n => add({ t: `Revise Topic ${n}: ${topicByN(n).short}`, d: "It hasn't been practised for a while and is starting to fade. One round brings it back.", go: gameForTopic(n), btn: "Revise now" }));
  // 2. brand new player
  if (progress.rounds === 0) {
    const g = playable.find(x => x.id === "level") || playable[0];
    if (g) add({ t: `Start with ${g.name}`, d: g.id === "level" ? "Sort real scenarios into the four levels of discrimination. It's the core idea of Topic 1." : g.blurb, go: g.id, btn: "Play" });

}

function bsCompute(stress, nurture, t) {
  const e = (stress / 10) * (nurture ? 0.35 : 1) * t;
  return { h: 100 - e * 32, a: 100 + e * 60, p: 100 - e * 30, n: 100 - e * 60, f: 15 + e * 85 };
}

function bsBrain(o = {}) {
  const v = o.sim || { h: 100, a: 100, p: 100, n: 100, f: 15 };

  // extra folds (gyri) so the cortex reads as a real brain

    "M196,46 C186,70 182,92 172,116 C166,130 160,142 152,154",           // precentral
    "M232,44 C228,68 222,90 214,110 C208,124 204,136 200,146",           // postcentral
    "M104,82 C124,90 146,92 168,86", "M92,112 C114,118 138,120 160,116 C168,114 172,112 176,108",
    "M90,142 C108,146 126,146 144,140", "M252,62 C272,78 284,92 296,110", "M262,108 C282,112 300,118 318,132",
    "M300,80 C312,96 320,112 326,130", "M330,150 C318,160 304,170 290,178",
    "M140,190 C172,186 204,184 236,176 C252,172 266,168 280,160", "M150,206 C180,206 208,202 236,196"

      <ellipse class="reg ${hl === "amyg" ? "hl" : ""}" cx="177" cy="190" rx="${(9.5 * as).toFixed(1)}" ry="${(7 * as).toFixed(1)}" fill="#ff8794" stroke="${st}" stroke-width="3"/>
      ${tap ? `<circle cx="177" cy="190" r="18" fill="transparent"/>` : ""}`, [168, 216])}
    ${reg("nacc", (st) => `<circle class="reg ${hl === "nacc" ? "hl" : ""}" cx="150" cy="160" r="7.5" fill="#b69cff" stroke="${st}" stroke-width="3"/>
      ${tap ? `<circle cx="150" cy="160" r="17" fill="transparent"/>` : ""}`, [146, 146])}
    ${labels}
  </svg>`;
}

let bs = null;
function stressStart() {
  bs = null;
  startPanel("stress", {
    title: "Brain Under Stress", region: "Amygdala · threat", topics: [3, 9],
    intro: "See what chronic stress does to the developing brain, and what protects it.",
    how: ["<b>Map the brain:</b> name the highlighted structures, then find them on the diagram.", "<b>The Stress Lab:</b> set the stress level, switch nurturing on or off, and run ten years of a child's life. Run at least two experiments, then answer the lab questions.", "<b>Case files:</b> read about fictional young people and decide which part of the brain is affected."],
    extra: `<div class="toggle" style="margin:0 0 18px;border-color:rgba(255,196,107,.45)"><span><b>Before you start</b><br><span class="muted" style="font-size:14px">This game talks about stress and difficult childhood experiences (ACEs). Every character is fictional. If anything feels personal or upsetting, take a break and talk to someone you trust, like a teacher or the school counsellor.</span></span></div>`,
    onStart: topics => bsRound(topics)
  });
}
function bsRound(topics) {
  clearTimers();
  const regs = shuffle(BS_REGIONS);
  const p1 = [
    ...regs.slice(0, 3).map(r => ({ part: 1, kind: "name", r: r.id, n: 3 })),
    ...shuffle(BS_REGIONS).filter(r => r.id !== regs[2].id).slice(0, 2).map(r => ({ part: 1, kind: "tap", r: r.id, n: 3 }))
  ];
  const p2 = [{ part: 2, kind: "sim", n: 3 }, ...shuffle(BS_LAB).slice(0, 3).map(q => ({ part: 2, kind: "mcq", q, n: 3 }))];
  const cases = BS_CASES.filter(c => topics.includes(c.n));
  const t9 = shuffle(cases.filter(c => c.n === 9)).slice(0, 2), t3 = shuffle(cases.filter(c => c.n === 3));
  const p3 = shuffle([...t9, ...t3].slice(0, topics.includes(3) ? 4 : t9.length)).map(c => ({ part: 3, kind: "case", c, n: c.n }));
  const steps = topics.includes(3) ? [...p1, ...p2, ...p3] : p3;
  bs = { topics, steps, idx: 0, score: 0, streak: 0, best: 0, correct: 0, per: {}, byPart: {}, answered: false,
    sim: { stress: 8, nurture: false, t: 0, running: false }, runs: 0, tried: new Set() };
  bsRender();
}
function bsTotal() { return bs.steps.filter(x => x.kind !== "sim").length; }
function bsDone() { return bs.steps.slice(0, bs.idx).filter(x => x.kind !== "sim").length; }

function bsRender() {
  const v = $("#view-stress"); const st = bs.steps[bs.idx]; bs.answered = false;
  const head = `<div class="lab-head"><button class="back" id="quitS">← Quit</button><span class="part">Part ${st.part} of 3 · ${BS_PARTS[st.part]}</span></div>
    ${hud(bs.streak, multOf(bs.streak), bsDone() / bsTotal() * 100, bs.score)}`;
  let body = "";
  if (st.kind === "name") {
    body = `<p class="qprompt">Which structure is glowing gold?</p><div class="bs3d" id="bs3d" data-fallback="name">${bsBrain({ hl: st.r })}</div>
      <div class="opts two" style="margin-top:12px">${shuffle(BS_REGIONS).map((r, i) => `<button class="opt" data-v="${r.id}" style="justify-content:flex-start;font-size:16px"><kbd>${i + 1}</kbd><span>${esc(r.name)}</span></button>`).join("")}</div>`;
  } else if (st.kind === "tap") {
    const r = BS_REGIONS.find(x => x.id === st.r);
    body = `<p class="qprompt">Tap the part of the brain responsible for ${esc(r.fn)}.</p><div class="bs3d" id="bs3d" data-fallback="tap"><div id="tapWrap">${bsBrain({ tap: true })}</div></div>`;
  } else if (st.kind === "sim") {
    body = bsSimHTML();
  } else {
    const q = st.kind === "case" ? st.c : st.q;
    const prompt = st.kind === "case"
      ? `<div class="casecard"><span class="avatar" aria-hidden="true">${esc(q.who[0])}</span><div><p style="font-size:16.5px">${esc(q.q)}</p><p class="qprompt" style="font-size:20px;margin-top:10px">${esc(q.ask)}</p></div></div>`
      : `<p class="qprompt">${esc(q.q)}</p>`;
    body = `${prompt}<div class="opts" style="margin-top:16px">${shuffle(q.o).map((o, i) => `<button class="opt" data-v="${esc(o)}"><kbd>${i + 1}</kbd><span>${esc(o)}</span></button>`).join("")}</div>`;
  }
  v.innerHTML = `<div class="lab">${head}<article class="qcard">
    <div class="qtype"><span class="tag">${st.kind === "sim" ? "Experiment" : st.kind === "tap" ? "Find it" : st.kind === "name" ? "Name it" : st.kind === "case" ? "Case file" : "Lab question"}</span><span class="mono muted">T${st.n} · ${esc(topicByN(st.n).short)}</span>${topicState(st.n) !== "ready" ? '<span class="status next">Challenge</span>' : ""}</div>
    ${body}<div id="fbS"></div></article></div>`;
  $("#quitS").addEventListener("click", () => show("stress"));
  bs.use3d = false;
  const box = $("#bs3d");
  if (box) {
    const keep = box.innerHTML;
    const toFlat = () => { bs && (bs.use3d = false); const b2 = $("#bs3d"); if (b2) { b2.className = ""; b2.innerHTML = keep; if (st.kind === "tap") bindTap2D(); } };
    box.innerHTML = "";
    if (brain3d.mount(box, { mode: "stress", onFail: toFlat })) {
      bs.use3d = true;
      if (st.kind === "name") { brain3d.stressMarkers(false); brain3d.stressFocus(st.r); }
      else if (st.kind === "tap") { brain3d.stressFocus(null); brain3d.stressMarkers(true, {}, id => bsTap(id)); }
      else { brain3d.stressMarkers(false); brain3d.stressFocus(null); brain3d.stressSim(bsCompute(bs.sim.stress, bs.sim.nurture, bs.sim.t)); }
    } else { box.className = ""; box.innerHTML = keep; }
  }
  if (st.kind === "sim") return bsBindSim();
  if (st.kind === "tap") { if (!bs.use3d) bindTap2D(); return; }
  v.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => bsPick(b)));
}
function bindTap2D() {
  {
    document.querySelectorAll("#view-stress .hot").forEach(g => {
      const go = () => bsTap(g.dataset.r);
      g.addEventListener("click", go);
      g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
    });
  }
}

function bsPick(b) {
  if (!bs || bs.answered) return;
  const st = bs.steps[bs.idx];
  const correct = st.kind === "name" ? st.r : (st.kind === "case" ? st.c : st.q).a;
  const ok = b.dataset.v === correct;
  document.querySelectorAll("#view-stress .opt").forEach(x => { x.disabled = true; if (x.dataset.v === correct) x.classList.add("right"); });
  if (!ok) b.classList.add("wrong");
  let ex, label;
  if (st.kind === "name") { const r = BS_REGIONS.find(x => x.id === st.r); label = r.name; ex = `The ${r.name.toLowerCase()} is responsible for ${r.fn}.`; }
  else { const q = st.kind === "case" ? st.c : st.q; label = q.a; ex = q.ex; }
  bsAfter(ok, label, ex);
}
function bsTap(id) {
  if (!bs || bs.answered) return;
  const st = bs.steps[bs.idx]; const ok = id === st.r; const r = BS_REGIONS.find(x => x.id === st.r);
  const mark = { [st.r]: "right" }; if (!ok) mark[id] = "wrong";
  if (bs.use3d) brain3d.stressMarkers(true, mark); else $("#tapWrap").innerHTML = bsBrain({ mark });
  bsAfter(ok, r.name, `The ${r.name.toLowerCase()} is responsible for ${r.fn}.`);
}
function bsAfter(ok, label, ex) {
  bs.answered = true; const st = bs.steps[bs.idx];
  let gained = 0;
  if (ok) {
    const before = multOf(bs.streak); bs.streak++; bs.correct++; bs.best = Math.max(bs.best, bs.streak);
    gained = 100 * multOf(bs.streak); bs.score += gained;
    if (multOf(bs.streak) > before) { sfx.combo(); popText("×" + multOf(bs.streak) + " combo!"); } else sfx.right();
  } else { bs.streak = 0; sfx.wrong(); }
  tally(bs.per, st.n, BS_ITEM[st.part], ok);
  bs.byPart[st.part] = bs.byPart[st.part] || { c: 0, n: 0 }; bs.byPart[st.part].n++; if (ok) bs.byPart[st.part].c++;
  recordTopic(st.n, ok); store.set("progress", progress);
  noteAnswer(ok, bs.streak);
  const last = bs.idx === bs.steps.length - 1;
  $("#fbS").innerHTML = `<div class="feedback ${ok ? "ok" : "no"}" role="status">
    <b>${ok ? `Correct · +${gained}` : "Not quite"}</b>${ok ? "" : `<span>Answer: <strong>${esc(label)}</strong></span>`}
    <span>${esc(ex)}</span>
    <div class="row"><span class="mono muted">${esc(BS_ITEM[st.part])}</span><button class="btn" id="nextS">${last ? "See results" : "Next"}</button></div></div>`;
  $("#view-stress").querySelector(".hud").outerHTML = hud(bs.streak, multOf(bs.streak), (bsDone() + 1) / bsTotal() * 100, bs.score);
  $("#nextS").addEventListener("click", bsNext);
  $("#nextS").focus({ preventScroll: true });
  $("#fbS").scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function bsNext() { if (!bs) return; if (bs.idx < bs.steps.length - 1) { bs.idx++; bsRender(); window.scrollTo({ top: 0 }); } else bsFinish(); }

/* ----- Stress Lab ----- */
function bsNarr() {
  const { stress, nurture, t } = bs.sim;
  if (t < 1) return "Set the conditions, then press <b>Run 10 years</b> to follow a child from age 3 to 13.";
  if (stress <= 3) return "<b>Low stress.</b> The brain develops normally. Dendritic branching builds rich pathways for learning, play and problem-solving.";
  if (stress >= 7 && !nurture) return "<b>Toxic stress, no nurturing caregiver.</b> The brain wires itself for survival: pathways to the fear centre strengthen, neurogenesis slows and the hippocampus is smaller. This matches the children in Luby (2013) who lacked nurturing support.";
  if (stress >= 7 && nurture) return "<b>The same stress, with a nurturing caregiver.</b> Nurturing acts as a biological shield. The hippocampus stays close to normal size, just as Luby (2013) found.";
  return `<b>Moderate stress${nurture ? " with nurturing" : ""}.</b> Some changes appear. The more intense and long-lasting the stress, the stronger the effect${nurture ? ", but nurturing softens it" : ""}.`;
}
function bsMeters(v) {
  const row = (name, val, txt, col) => `<div class="meter"><span>${name}</span><b>${txt}</b><span class="bar"><i style="width:${Math.max(3, Math.min(100, val))}%;background:${col}"></i></span></div>`;
  return row("Hippocampus volume", v.h, Math.round(v.h) + "%", "#6ff2dc")
    + row("Amygdala reactivity", (v.a - 100) / 60 * 100, "+" + Math.round(v.a - 100) + "%", "#ff8794")
    + row("Prefrontal cortex development", v.p, Math.round(v.p) + "%", "#6ff2dc")
    + row("Neurogenesis", v.n, Math.round(v.n) + "%", "#ecebff")
    + row("Fear-pathway strength", v.f, Math.round(v.f) + "%", "#ffc46b");
}
function bsSimHTML() {
  const s = bs.sim, v = bsCompute(s.stress, s.nurture, s.t);
  return `<p class="qprompt">Run the experiment</p>
    <p class="muted" style="margin-top:6px">Change one thing at a time, like a real experiment. Try high stress with and without a nurturing caregiver.</p>
    <div class="simgrid">

    words.forEach(w => { if ((cur + " " + w).trim().length > 16) { lines.push(cur.trim()); cur = w; } else cur += " " + w; }); lines.push(cur.trim());
    svg += `<rect x="${p.x - 72}" y="${p.y - 26}" width="144" height="52" rx="14" fill="#1e2152" stroke="#b69cff" stroke-width="1.3"/>
      ${lines.map((l, k) => `<text x="${p.x}" y="${p.y + (k - (lines.length - 1) / 2) * 15 + 4}" text-anchor="middle" font-family="Atkinson Hyperlegible, sans-serif" font-size="13" font-weight="700" fill="#ecebff">${esc(l)}</text>`).join("")}`;
  });
  cy.breaks.forEach((b, k) => {
    const ang = -Math.PI / 2 + (k + .5) * (Math.PI * 2 / Math.max(cy.breaks.length, 1));
    const x = 210 + Math.cos(ang) * 112, y = 196 + Math.sin(ang) * 112;
    svg += `<g><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="9" fill="#6ff2dc"/><path d="M${(x - 4).toFixed(1)},${y.toFixed(1)} l3,3 l6,-6" stroke="#0c0d1f" stroke-width="2" fill="none"/></g>`;
  });
  return svg + `</svg>`;
}
function cyFinish() {
  const v = $("#view-cycle"); const r = cy;
  const score = r.v.opp + r.v.money - r.v.stress / 2 + r.v.support / 2 + r.v.outlook / 2;
  const verdict = score >= 11 ? ["The cycle is breaking", "Mia is heading into adulthood with real options. Notice what made the difference: support, resources and institutions that reached out, not just her own effort."]
    : score >= 7 ? ["The cycle has weakened", "Mia has some footing, but the pressures that shaped her teenage years haven't gone away. One more shock could pull the family back."]
    : ["The cycle continues", "Mia made the choices her situation allowed. Many of the better options were locked by money, stress or a lack of support, and that is how poverty passes from one generation to the next."];
  const lit = CY_EDGES.filter(e => (r.links[e] || []).length);
  const edgeList = CY_EDGES.map(e => { const tags = r.links[e] || []; return `<div class="studyrow" style="grid-template-columns:minmax(0,1fr)"><span><b>${esc(CY_NODES[e[0]].name)} → ${esc(CY_NODES[e[1]].name)}</b><br><span class="muted" style="font-size:14px">${tags.length ? tags.map(esc).join(" · ") : "Not strengthened in this story"}</span></span></div>`; }).join("");
  let saved = {}; try { saved = JSON.parse(localStorage.getItem("np1:cycleReflect") || "{}"); } catch (e) {}
  const QS = [
    { id: "q1", q: "Where did Mia's cycle get stronger, and which study or concept explains it?" },
    { id: "q2", q: `You met ${r.locked} locked ${r.locked === 1 ? "choice" : "choices"}. Why were they locked, and what does that suggest about individual versus structural explanations of poverty?` },
    { id: "q3", q: "Where could schools, communities or governments break this cycle for real families?" }
  ];
  roundEnd({ family: "cycle", game: "cycle", correct: 0, total: 0 }); gainXP(75);
  v.innerHTML = `<div class="lab" style="max-width:1000px">
    <div class="lab-head"><button class="back" data-go="hub">← Brain map</button><span class="part">Mia's story · age 19</span></div>
    <div class="panel">
      <span class="mono muted">${lit.length} of 4 links strengthened · ${r.breaks.length} ${r.breaks.length === 1 ? "point" : "points"} where the cycle was broken</span>
      <h1 style="font-size:clamp(28px,5vw,42px);font-weight:800;margin-top:6px">${esc(verdict[0])}</h1>
      <p style="margin-top:8px;font-size:17px;max-width:65ch">${esc(verdict[1])}</p>
      <div class="cy-final">
        <div>${cyDiagram()}<p class="muted" style="font-size:13px;text-align:center">Thicker gold arrows were strengthened more often. Teal ticks mark where the cycle was broken.</p></div>
        <div><span class="mono muted">What fed each link</span>${edgeList}
          ${r.breaks.length ? `<div style="margin-top:12px"><span class="mono muted">Where it was broken</span><div class="chips" style="margin-top:6px">${r.breaks.map(b => `<span class="tchip good">${esc(b.tag)}</span>`).join("")}</div></div>` : ""}
        </div>
      </div>
      <h2 style="font-size:24px;margin-top:26px">Reflect</h2>
      <div class="reflect">${QS.map(q => `<label for="cy-${q.id}">${esc(q.q)}<textarea id="cy-${q.id}" data-q="${esc(q.q)}">${esc(saved[q.id] || "")}</textarea></label>`).join("")}</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center">
        <button class="btn gold" id="cyCopy">Copy my reflection</button><span class="muted" id="cyCopyMsg" style="font-size:14px">Paste it into your class document to hand it in.</span>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px">
        <button class="btn" id="cyAgain">Play again with different choices</button>
        <button class="btn ghost" data-go="hub">Back to brain map</button>
      </div>
    </div></div>`;
  cy = null;
  bindGo(v);
  v.querySelectorAll(".reflect textarea").forEach(t => t.addEventListener("input", () => {
    try { const o = JSON.parse(localStorage.getItem("np1:cycleReflect") || "{}"); o[t.id.replace("cy-", "")] = t.value; localStorage.setItem("np1:cycleReflect", JSON.stringify(o)); } catch (e) {}
  }));
  $("#cyCopy").addEventListener("click", () => {
    const txt = `The Cycle: reflection (${profile?.name || "student"})\nOutcome: ${verdict[0]}\nChoices: ${r.story.map(s => `${s.title}: ${s.choice}`).join("; ")}\n\n` +
      [...v.querySelectorAll(".reflect textarea")].map(t => `${t.dataset.q}\n${t.value.trim() || "(not answered)"}`).join("\n\n");
    const msg = $("#cyCopyMsg");
    const manual = () => {
      let ta2 = $("#cyManual");
      if (!ta2) { ta2 = document.createElement("textarea"); ta2.id = "cyManual"; ta2.style.cssText = "width:100%;min-height:160px;margin-top:10px;background:var(--ink);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit"; msg.parentNode.after(ta2); }
      ta2.value = txt; msg.textContent = "Copy the text in the box below (it's already selected)."; ta2.focus(); ta2.select();
    };
    try { navigator.clipboard.writeText(txt).then(() => { msg.textContent = "Copied. Paste it into your class document."; }).catch(manual); } catch (e) { manual(); }
  });
  $("#cyAgain").addEventListener("click", cycleBegin);
}

/* ---------------- profile modal ---------------- */
function openProfile() {
  const root = $("#modalRoot");
  const needCode = !PREVIEW && cfg.codeRequired;
  root.innerHTML = `<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="pTitle"><div class="modal" id="pForm">
    <h2 id="pTitle">${profile ? "Your details" : "Welcome to Neuroplastic"}</h2>
    <p class="muted">${PREVIEW ? "Add a name to see how students will appear." : "Your teacher sees your first name, class and scores. Nothing else is collected."}</p>
    <div class="field"><label for="pName">First name</label><input id="pName" maxlength="24" autocomplete="given-name" value="${esc(profile?.name || "")}"></div>
    <div class="field"><label for="pClass">Class</label><input id="pClass" maxlength="12" placeholder="e.g. 11B" value="${esc(profile?.cls || "")}"></div>
    ${needCode ? `<div class="field"><label for="pCode">Class code from your teacher</label><input id="pCode" maxlength="20" autocomplete="off" value="${esc(profile?.code || "")}"></div>` : ""}
    <p class="err" id="pErr"></p>
    <div class="row"><button type="button" class="linkbtn" id="pSkip">${profile ? "Cancel" : "Just looking"}</button><button class="btn" type="button" id="pSave">Save</button></div>
  </div></div>`;
  $("#pName").focus();
  $("#pSkip").addEventListener("click", () => { root.innerHTML = ""; maybeGuide(); });
  $("#pForm").querySelectorAll("input").forEach(inp => inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); saveProfile(); } }));
  $("#pSave").addEventListener("click", saveProfile);
  async function saveProfile() {
    const name = $("#pName").value.trim(), cls = $("#pClass").value.trim(), code = needCode ? $("#pCode").value.trim() : "";
    if (!name) { $("#pErr").textContent = "Add your first name."; return; }
    if (!cls) { $("#pErr").textContent = "Add your class, for example 11B."; return; }
    if (needCode) {
      $("#pErr").textContent = "Checking code…";
      try {
        const r = await fetchJSON(CONFIG.SCRIPT_URL + "?action=check&code=" + encodeURIComponent(code));
        if (!r.ok) { $("#pErr").textContent = "That class code doesn't match. Check it with your teacher."; return; }
      } catch (err) { $("#pErr").textContent = "Couldn't check the code. Check your connection and try again."; return; }
    }
    profile = { name, cls, code }; store.set("profile", profile);
    root.innerHTML = ""; renderHeader(); maybeGuide();
  }
}
